name: D08 Clean Unused Import Once

on:
  push:
    branches:
      - d08-application-platform-expansion
    paths:
      - .github/workflows/d08-clean-unused-import-once.yml

permissions:
  contents: write

jobs:
  clean-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d08-application-platform-expansion
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Remove exact unused WindowLifecycle import
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ptah-application-runtime/tests/d08_acceptance.rs')
          text = path.read_text()
          old = '    NodeLocalCompatibility, PlatformClass, RequirementOutcome, SessionLocality, WindowLifecycle,\n'
          new = '    NodeLocalCompatibility, PlatformClass, RequirementOutcome, SessionLocality,\n'
          if text.count(old) != 1:
              raise SystemExit('expected unused import shape not found exactly once')
          path.write_text(text.replace(old, new))
          PY
          cargo fmt --all
          git diff --check
      - name: Commit test-hygiene correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ptah-application-runtime/tests/d08_acceptance.rs
          git commit -m "test(d08): remove unused window lifecycle import"
          git push origin HEAD:d08-application-platform-expansion
