name: E02 Lock Sync

on:
  push:
    branches: [e02-placement-reservation-lease-fence]
    paths:
      - .github/workflows/e02-lock-sync.yml

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out E02 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e02-placement-reservation-lease-fence
          fetch-depth: 0
      - name: Pin Rust and Cargo 1.97.1
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          cargo -V | grep -q '^cargo 1.97.1 '
      - name: Regenerate and commit Cargo.lock only
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          git diff --check -- Cargo.lock
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock already current'
            exit 0
          fi
          test "$(git status --short | cut -c4-)" = "Cargo.lock"
          git config user.name 'THE TECH GUY'
          git config user.email '65334711+jaydumisuni@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'chore(e02): refresh workspace dependency lock'
          git push origin HEAD:e02-placement-reservation-lease-fence
