name: TEMP KRATOS ChatGPT Browser Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-kratos-chatgpt-browser-inspect.yml'

jobs:
  inspect:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 5
    steps:
      - name: Pair existing Oracle extension using X11 without new packages
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          export XDG_RUNTIME_DIR="/run/user/$uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          user_env="$(systemctl --user show-environment 2>/dev/null || true)"
          eval "$(printf '%s\n' "$user_env" | grep -E '^(DISPLAY|WAYLAND_DISPLAY|XAUTHORITY)=' | sed 's/^/export /' || true)"
          : "${DISPLAY:=:0}"; export DISPLAY
          token_path="$HOME/.local/state/OracleBrowserBridge/agent-token.txt"
          test -s "$token_path"
          token="$(tr -d '\r\n' < "$token_path")"
          if [[ ! "$token" =~ ^[0-9A-Fa-f]{64}$ ]]; then echo 'TOKEN_FORMAT_UNEXPECTED'; exit 42; fi
          echo 'TOKEN_FORMAT=hex64'
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          ext_id='hoahdcllchhncnenbeplgfgmpjihakab'
          "$chrome" --profile-directory=Default --new-tab "chrome-extension://$ext_id/options/index.html" >/dev/null 2>&1 || true
          sleep 3

          ORACLE_LOCAL_PAIRING_TOKEN="$token" python3 - <<'PY'
          import ctypes,ctypes.util,os,time
          x11=ctypes.CDLL(ctypes.util.find_library('X11') or 'libX11.so.6')
          xtst=ctypes.CDLL(ctypes.util.find_library('Xtst') or 'libXtst.so.6')
          x11.XOpenDisplay.argtypes=[ctypes.c_char_p]; x11.XOpenDisplay.restype=ctypes.c_void_p
          x11.XStringToKeysym.argtypes=[ctypes.c_char_p]; x11.XStringToKeysym.restype=ctypes.c_ulong
          x11.XKeysymToKeycode.argtypes=[ctypes.c_void_p,ctypes.c_ulong]; x11.XKeysymToKeycode.restype=ctypes.c_ubyte
          x11.XFlush.argtypes=[ctypes.c_void_p]
          xtst.XTestFakeKeyEvent.argtypes=[ctypes.c_void_p,ctypes.c_uint,ctypes.c_int,ctypes.c_ulong]
          d=x11.XOpenDisplay(None)
          if not d: raise SystemExit('X11_DISPLAY_OPEN_FAILED')
          def code(name):
              ks=x11.XStringToKeysym(name.encode())
              kc=x11.XKeysymToKeycode(d,ks)
              if not kc: raise RuntimeError('NO_KEYCODE:'+name)
              return kc
          def ev(name,down):
              xtst.XTestFakeKeyEvent(d,code(name),1 if down else 0,0); x11.XFlush(d); time.sleep(.025)
          def tap(name): ev(name,True); ev(name,False)
          def combo(mod,key): ev(mod,True); tap(key); ev(mod,False)
          # Force a deterministic focus transition: omnibox -> web content.
          combo('Control_L','l'); time.sleep(.2); tap('F6'); time.sleep(.4)
          for _ in range(5): tap('Tab'); time.sleep(.08)
          combo('Control_L','a')
          for ch in os.environ['ORACLE_LOCAL_PAIRING_TOKEN'].lower(): tap(ch)
          tap('Tab'); tap('Return')
          x11.XFlush(d); time.sleep(1)
          print('X11_OPTIONS_RECONNECT_SENT=true')
          PY
          unset token ORACLE_LOCAL_PAIRING_TOKEN || true

          connected=0
          for i in $(seq 1 20); do
            sleep 1
            curl -fsS --max-time 2 http://127.0.0.1:8765/health >"$RUNNER_TEMP/bridge-health.json" 2>/dev/null || true
            if [ -s "$RUNNER_TEMP/bridge-health.json" ] && python3 -c "import json; d=json.load(open('$RUNNER_TEMP/bridge-health.json')); raise SystemExit(0 if d.get('browserConnected') else 1)"; then connected=1; break; fi
          done
          cat "$RUNNER_TEMP/bridge-health.json" 2>/dev/null || true
          echo
          echo "BROWSER_BRIDGE_CONNECTED=$connected"
          test "$connected" = 1
