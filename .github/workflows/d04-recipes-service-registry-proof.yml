name: D04 Recipes Service Registry exact-head proof

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "D04_RECIPES_SERVICE_REGISTRY.md"
      - "crates/ptah-recipe-registry/**"
      - "docs/superpowers/plans/2026-09-02-d04-recipes-service-registry.md"
      - "docs/superpowers/specs/2026-09-02-d04-recipes-service-registry-design.md"
      - ".github/workflows/d04-recipes-service-registry-proof.yml"

permissions:
  contents: read

env:
  PTAH_EXACT_SHA: ${{ github.event.pull_request.head.sha }}
  PTAH_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  PTAH_D03_SHA: ee07fdbe62167ed1fe4a81b47797c744a9393337
  CARGO_TERM_COLOR: always

jobs:
  d04-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact D04 candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PTAH_EXACT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Lock exact D03 predecessor and D04 scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PTAH_EXACT_SHA"
          test "$PTAH_BASE_SHA" = "$PTAH_D03_SHA"
          git merge-base --is-ancestor "$PTAH_D03_SHA" "$PTAH_EXACT_SHA"
          test -z "$(git rev-list --merges "$PTAH_D03_SHA..$PTAH_EXACT_SHA")"
          python - <<'PY'
          import os, subprocess
          base=os.environ["PTAH_D03_SHA"]; head=os.environ["PTAH_EXACT_SHA"]
          files=set(subprocess.check_output(["git","diff","--name-only",base,head], text=True).splitlines())
          allowed=lambda p: p in {
              "Cargo.toml","Cargo.lock","D04_RECIPES_SERVICE_REGISTRY.md",
              ".github/workflows/d04-recipes-service-registry-proof.yml",
              "docs/superpowers/plans/2026-09-02-d04-recipes-service-registry.md",
              "docs/superpowers/specs/2026-09-02-d04-recipes-service-registry-design.md",
          } or p.startswith("crates/ptah-recipe-registry/")
          bad=sorted(p for p in files if not allowed(p)); assert not bad, bad
          required={
              "Cargo.toml","Cargo.lock","D04_RECIPES_SERVICE_REGISTRY.md",
              ".github/workflows/d04-recipes-service-registry-proof.yml",
              "docs/superpowers/plans/2026-09-02-d04-recipes-service-registry.md",
              "docs/superpowers/specs/2026-09-02-d04-recipes-service-registry-design.md",
              "crates/ptah-recipe-registry/Cargo.toml","crates/ptah-recipe-registry/src/lib.rs",
              "crates/ptah-recipe-registry/src/recipe_store.rs","crates/ptah-recipe-registry/src/operation.rs",
              "crates/ptah-recipe-registry/src/plan.rs","crates/ptah-recipe-registry/src/precondition.rs",
              "crates/ptah-recipe-registry/src/schedule.rs","crates/ptah-recipe-registry/src/service_registry.rs",
              "crates/ptah-recipe-registry/src/dispatcher.rs","crates/ptah-recipe-registry/tests/d04_acceptance.rs",
          }
          assert not sorted(required-files), sorted(required-files)
          frozen=[p for p in files if p.startswith(("contracts/","schemas/","migrations/")) or p=="crates/ptah-contracts/src/generated.rs"]
          assert not frozen, frozen
          PY
          git diff --check "$PTAH_D03_SHA" "$PTAH_EXACT_SHA"

      - name: Prove D04-only Cargo lock delta
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess, tomllib
          base=os.environ["PTAH_D03_SHA"]
          old=tomllib.loads(subprocess.check_output(["git","show",f"{base}:Cargo.lock"],text=True))
          new=tomllib.load(open("Cargo.lock","rb"))
          key=lambda p:(p["name"],p["version"],p.get("source"))
          before={key(p):p for p in old["package"]}; after={key(p):p for p in new["package"]}
          assert not (set(before)-set(after))
          assert sorted(set(after)-set(before)) == [("ptah-recipe-registry","0.0.0-phase0c",None)]
          assert not [k for k in before.keys() & after.keys() if before[k] != after[k]]
          expected={"container-oci","ptah-activity-runtime","ptah-ai-workspace","ptah-archive-decomposition","ptah-contracts","ptah-identifiers","ptah-knowledge-search","ptah-ledger","ptah-provider-api","serde","serde_json","sha2","thiserror 2.0.17"}
          assert set(after[("ptah-recipe-registry","0.0.0-phase0c",None)].get("dependencies",[])) == expected
          PY

      - name: Install pinned Rust 1.97.1
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
          mkdir -p /tmp/d04-proof
          rustc -V | tee /tmp/d04-proof/rustc-version.txt
          cargo -V | tee /tmp/d04-proof/cargo-version.txt
          rustc -V | grep -q '^rustc 1.97.1 '
          cargo -V | grep -q '^cargo 1.97.1 '

      - name: Prove dependency and static authority policy
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/d04-proof/Cargo.lock.repository
          cargo metadata --locked --format-version 1 > /tmp/d04-proof/cargo-metadata.json
          cmp -s Cargo.lock /tmp/d04-proof/Cargo.lock.repository
          python tools/check_rust_dependency_lock.py --output /tmp/d04-proof/dependency-lock-report.json
          python -c 'import json; p=json.load(open("/tmp/d04-proof/dependency-lock-report.json")); assert p["git_dependency_count"] == 0, p'
          cargo fmt --all -- --check
          cargo clippy -p ptah-recipe-registry --all-targets --locked -- -D warnings -W clippy::pedantic
          grep -q '^#!\[forbid(unsafe_code)\]' crates/ptah-recipe-registry/src/lib.rs
          ! grep -R -n -E 'TODO|FIXME|todo!\(|unimplemented!\(|unsafe[[:space:]]*\{' crates/ptah-recipe-registry/src crates/ptah-recipe-registry/tests
          ! grep -R -nEi 'pub[[:space:]]+(password|api[_-]?key|raw[_-]?secret|secret[_-]?value|credential[_-]?value)' crates/ptah-recipe-registry/src
          ! grep -R -nE '^pub fn (grant|authorize_exposure|open_port|publish_port|choose_provider|choose_operation|approve|promote|run_scheduler|start_scheduler)' crates/ptah-recipe-registry/src
          python - <<'PY'
          from pathlib import Path
          public='\n'.join(line.strip() for p in Path('crates/ptah-recipe-registry/src').rglob('*.rs') for line in p.read_text().splitlines() if line.strip().startswith('pub '))
          for leak in ['ptah_archive_decomposition::','ptah_knowledge_search::','container_oci::']:
              assert leak not in public, leak
          PY

      - name: Prove exactly 30 D04 cases and predecessor regressions
        run: |
          set -euo pipefail
          count=$(cargo test -p ptah-recipe-registry --test d04_acceptance --locked -- --list | grep -c ': test$')
          test "$count" -eq 30
          printf '%s\n' "$count" > /tmp/d04-proof/d04-test-count.txt
          cargo test -p ptah-recipe-registry --locked
          cargo test -p ptah-activity-runtime --test a04_acceptance --locked
          cargo test -p container-oci --locked
          cargo test -p ptah-ai-workspace -p ptah-knowledge-search -p ptah-control -p ptah-transfer -p ptah-object-store -p ptah-workspace -p ptah-archive-decomposition --locked

      - name: Prove complete locked workspace
        run: |
          set -euo pipefail
          workspace_count=$(cargo test --workspace --locked -- --list | grep -c ': test$')
          printf '%s\n' "$workspace_count" > /tmp/d04-proof/workspace-test-count.txt
          cargo test --workspace --locked

      - name: Build exact-head proof record
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path('/tmp/d04-proof'); base=os.environ['PTAH_D03_SHA']; head=os.environ['PTAH_EXACT_SHA']
          files=subprocess.check_output(['git','diff','--name-only',base,head],text=True).splitlines()
          hashes={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files}
          payload={
            'record_type':'ptah.programme_d.d04.recipes_service_registry_exact_head_proof',
            'schema_version':'0.1.0','created_at':datetime.now(timezone.utc).isoformat(timespec='seconds'),
            'implementation_commit':head,'implementation_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
            'base_commit':base,'exact_head_match':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==head,
            'linear_from_d03':not bool(subprocess.check_output(['git','rev-list','--merges',f'{base}..{head}'],text=True).strip()),
            'commit_count':int(subprocess.check_output(['git','rev-list','--count',f'{base}..{head}'],text=True).strip()),
            'cargo_lock_sha256':hashlib.sha256(Path('Cargo.lock').read_bytes()).hexdigest(),
            'd04_acceptance_count':int((root/'d04-test-count.txt').read_text()),
            'workspace_test_count':int((root/'workspace-test-count.txt').read_text()),
            'changed_file_sha256':hashes,'status':'exact_head_d04_proof_passed',
          }
          assert payload['exact_head_match'] and payload['linear_from_d03'] and payload['d04_acceptance_count']==30
          (root/'d04-proof.json').write_text(json.dumps(payload,indent=2)+'\n')
          (root/'repository-hashes.sha256').write_text(''.join(f'{digest}  {path}\n' for path,digest in sorted(hashes.items())))
          PY
          sha256sum /tmp/d04-proof/d04-proof.json | tee /tmp/d04-proof/d04-proof.sha256
          git status --porcelain=v1 > /tmp/d04-proof/git-status.txt
          test ! -s /tmp/d04-proof/git-status.txt

      - name: Upload retained D04 proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d04-recipes-service-registry-${{ env.PTAH_EXACT_SHA }}
          path: /tmp/d04-proof/
          if-no-files-found: error
          retention-days: 30
