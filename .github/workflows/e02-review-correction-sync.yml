name: E02 Review Correction Sync

on:
  push:
    branches: [e02-placement-reservation-lease-fence]
    paths:
      - .github/workflows/e02-review-correction-sync.yml

permissions:
  contents: write

jobs:
  correct-reviewed-durable-metadata:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out E02 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e02-placement-reservation-lease-fence
          fetch-depth: 0

      - name: Pin Rust 1.97.1
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
          rustc -V | grep -q '^rustc 1.97.1 '

      - name: Apply correction and prove focused boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/e02_apply_review_correction_tmp.py
          cargo fmt --all
          cargo test -p ptah-placement-runtime --test e02_recovery
          cargo clippy -p ptah-placement-runtime --all-targets -- -D warnings
          cargo fmt --all -- --check
          git diff --check
          git config user.name 'THE TECH GUY'
          git config user.email '65334711+jaydumisuni@users.noreply.github.com'
          git add crates/ptah-placement-runtime/src/durable.rs crates/ptah-placement-runtime/tests/e02_recovery.rs
          git commit -m 'fix(e02): bind durable journal timestamps to authority events'
          git push origin HEAD:e02-placement-reservation-lease-fence
