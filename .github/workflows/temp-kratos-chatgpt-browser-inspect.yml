name: TEMP KRATOS ChatGPT Browser Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-kratos-chatgpt-browser-inspect.yml'

jobs:
  inspect:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 5
    steps:
      - name: Locate Oracle bridge pairing token source without reading secrets
        shell: bash
        run: |
          set -euo pipefail
          echo '=== BRIDGE PROCESS ==='
          pgrep -af 'persistent-cli.mjs|browser/bridge/cli.mjs|oracle-browser-bridge' || true
          echo '=== USER UNITS ==='
          systemctl --user list-unit-files --no-pager | grep -Ei 'oracle|browser|bridge' || true
          for u in $(systemctl --user list-unit-files --no-legend 2>/dev/null | awk '{print $1}' | grep -Ei 'oracle.*(browser|bridge)|browser.*oracle' || true); do
            echo "UNIT=$u"
            systemctl --user cat "$u" 2>/dev/null | sed -E 's/(ORACLE_PAIRING_TOKEN=)[^ ]+/\1[REDACTED]/g; s/(pairing[^= ]*[=:])[^"]+/\1[REDACTED]/Ig' || true
          done
          echo '=== TOKEN-LIKE FILES ==='
          python3 - <<'PY'
          import pathlib,os,json
          roots=[pathlib.Path.home()/'.oracle-app',pathlib.Path.home()/'.config',pathlib.Path.home()/'.local/state',pathlib.Path.home()/'.local/share']
          found=[]
          for root in roots:
              if not root.exists(): continue
              try: items=root.rglob('*')
              except Exception: continue
              for p in items:
                  try:
                      if not p.is_file(): continue
                  except Exception: continue
                  n=p.name.lower(); s=str(p).lower()
                  if 'oracle' not in s: continue
                  if not any(k in n for k in ['token','pair','secret','credential']): continue
                  try: st=p.stat()
                  except Exception: continue
                  found.append({'path':str(p),'bytes':st.st_size,'mode':oct(st.st_mode & 0o777)})
                  if len(found)>=80: break
              if len(found)>=80: break
          print(json.dumps(found,separators=(',',':')))
          PY
          echo '=== BRIDGE HEALTH ==='
          curl -fsS --max-time 5 http://127.0.0.1:8765/health || true
          echo
