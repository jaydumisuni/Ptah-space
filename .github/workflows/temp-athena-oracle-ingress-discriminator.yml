name: TEMP ATHENA Oracle packaged runtime mode proof
on:
  push:
    branches: [diagnostics/athena-node-owners-20261014b]
    paths: ['.github/workflows/temp-athena-oracle-ingress-discriminator.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, athena, windows, x64, physical, ptah]
    timeout-minutes: 5
    steps:
      - name: Inspect packaged runtime mode support without changes
        shell: powershell
        run: |
          if ($env:COMPUTERNAME -ne 'ATHENA') { throw 'WRONG_HOST' }
          $file='C:\Program Files (x86)\THETECHGUY Digital Solutions\Oracle\resources\app.asar'
          if(-not (Test-Path -LiteralPath $file)) { throw 'INSTALLED_ASAR_MISSING' }
          $src=[Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($file))
          [pscustomobject]@{
            supportsDaemonClientFlag=$src.Contains('ORACLE_DESKTOP_NODE_RUNTIME_MODE')
            supportsDaemonClientMode=$src.Contains('daemon-client')
            hasPr256SelfhostGuard=$src.Contains('oracle-live-node-selfhost-status.json')
            hasExternalLiveStatusFiles=$src.Contains('externalLiveStatusFiles')
            desktopOwnerProcess=@(Get-Process Oracle -ErrorAction SilentlyContinue).Count
            currentUserFlag=[string]([Environment]::GetEnvironmentVariable('ORACLE_DESKTOP_NODE_RUNTIME_MODE','User'))
          } | ConvertTo-Json -Compress
