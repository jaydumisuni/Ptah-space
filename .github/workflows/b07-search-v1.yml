name: B07 construction formatter

on:
  pull_request:
    paths:
      - "B07_SEARCH_V1.md"
      - "crates/ptah-archive-decomposition/Cargo.toml"
      - "crates/ptah-archive-decomposition/src/lib.rs"
      - "crates/ptah-archive-decomposition/src/b07.rs"
      - "crates/ptah-archive-decomposition/tests/b07.rs"
      - ".github/workflows/b07-search-v1.yml"

permissions:
  contents: write

env:
  PTAH_EXACT_SHA: ${{ github.event.pull_request.head.sha }}
  CARGO_TERM_COLOR: always

jobs:
  format-b07:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact B07 construction head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PTAH_EXACT_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          rustc -V | grep -q '^rustc 1.97.1 '

      - name: Apply canonical formatting once
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          if git diff --quiet -- crates/ptah-archive-decomposition/src/b07.rs crates/ptah-archive-decomposition/tests/b07.rs; then
            echo "B07 sources already canonical"
            exit 0
          fi
          test -z "$(git diff --name-only -- . ':!crates/ptah-archive-decomposition/src/b07.rs' ':!crates/ptah-archive-decomposition/tests/b07.rs')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ptah-archive-decomposition/src/b07.rs crates/ptah-archive-decomposition/tests/b07.rs
          git commit -m "B07 review: apply canonical rustfmt"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
