name: D08 TDD

on:
  push:
    branches:
      - d08-application-platform-expansion
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/ptah-application-runtime/**
      - services/ptah-control/**
      - .github/workflows/d08-tdd.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d08-tdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Preserve repository lock
        run: cp Cargo.lock /tmp/Cargo.lock.before
      - name: Check D08 formatting
        run: cargo fmt --all -- --check
      - name: Prove exact D08 runtime count and Task 3 behavior
        shell: bash
        run: |
          set -euo pipefail
          count=$(cargo test -p ptah-application-runtime --test d08_acceptance --locked -- --list | grep -c ': test$')
          test "$count" -eq 24
          cargo test -p ptah-application-runtime --test d08_acceptance --locked
      - name: Prove C10 regression
        run: cargo test -p ptah-android-runtime --test c10 --locked
      - name: Prove strict D08 lint and no suppressions
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p ptah-application-runtime --all-targets --locked -- -D warnings -W clippy::pedantic
          if grep -R -n -E '#\[(allow|expect)\(' crates/ptah-application-runtime/src crates/ptah-application-runtime/tests; then
            echo 'D08 lint suppression found' >&2
            exit 1
          fi
      - name: Prove promoted lock is stable
        shell: bash
        run: |
          set -euo pipefail
          cmp Cargo.lock /tmp/Cargo.lock.before
          git diff --exit-code -- Cargo.lock
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          lock = tomllib.loads(Path('Cargo.lock').read_text())
          package = next(p for p in lock['package'] if p['name'] == 'ptah-application-runtime')
          deps = set(package.get('dependencies', []))
          assert {'ptah-archive-decomposition', 'ptah-device-runtime'} <= deps, deps
          PY
