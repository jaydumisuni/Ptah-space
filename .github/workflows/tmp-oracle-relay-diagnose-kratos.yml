name: Temporary Redmi sky Global ROM offline preflight on KRATOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-oracle-relay-diagnose-kratos.yml'

permissions:
  contents: write

jobs:
  preflight:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Inspect Global fastboot archive without extracting it
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, json, pathlib, shlex, shutil, socket, subprocess

          desktop = pathlib.Path.home() / 'Desktop'
          expected_name = 'sky_global_images_OS2.0.9.0.VMWMIXM_20250530.0000.00_15.0_global_3334591f85.tgz'
          expected_md5 = '3334591f858477053b68f4c0e47debf0'
          candidates = []
          if desktop.exists():
              candidates.extend(desktop.rglob(expected_name))
              if not candidates:
                  candidates.extend(desktop.rglob('sky_global_images_*.tgz'))
          archive = candidates[0] if candidates else None

          def digest(path, algo):
              h = hashlib.new(algo)
              with path.open('rb') as f:
                  while True:
                      chunk = f.read(8 * 1024 * 1024)
                      if not chunk:
                          break
                      h.update(chunk)
              return h.hexdigest()

          def run(args, timeout=60):
              try:
                  p = subprocess.run(args, text=True, capture_output=True, timeout=timeout, check=False)
                  return {'rc': p.returncode, 'stdout': p.stdout[-30000:], 'stderr': p.stderr[-10000:]}
              except Exception as e:
                  return {'rc': -1, 'stdout': '', 'stderr': f'{type(e).__name__}: {e}'}

          tools = {name: shutil.which(name) for name in [
              'tar','7z','python3','simg2img','img2simg','lpunpack','debugfs','e2fsck',
              'unsquashfs','brotli','avbtool','payload-dumper-go','file','md5sum','sha256sum'
          ]}
          out = {
              'schema': 'ttg.redmi.sky.global-preflight.v1',
              'host': socket.gethostname(),
              'desktop': str(desktop),
              'expected_name': expected_name,
              'expected_md5': expected_md5,
              'archive_found': archive is not None,
              'archive': None,
              'tools': tools,
              'completed_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          if archive is not None:
              size = archive.stat().st_size
              md5 = digest(archive, 'md5')
              sha256 = digest(archive, 'sha256')
              quoted = shlex.quote(str(archive))
              listing = run(['bash','-lc', f'set +o pipefail; tar -tzf {quoted} 2>&1 | head -n 260'], timeout=120)
              out['archive'] = {
                  'path': str(archive),
                  'size_bytes': size,
                  'md5': md5,
                  'md5_matches_expected': md5.lower() == expected_md5.lower(),
                  'sha256': sha256,
                  'listing': listing,
                  'file_type': run(['file','-b',str(archive)], timeout=20),
              }
          pathlib.Path('redmi-sky-global-preflight.json').write_text(json.dumps(out, indent=2) + '\n')
          PY

      - name: Publish preflight evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add redmi-sky-global-preflight.json
          git commit -m 'proof: publish KRATOS Redmi sky Global ROM preflight'
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main
          done
          exit 1
