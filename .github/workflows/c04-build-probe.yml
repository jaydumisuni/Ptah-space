name: C04 build probe

on:
  push:
    branches:
      - c04-apple-ipsw-ota-img4-pack
    paths:
      - "C04_APPLE_IPSW_OTA_IMG4_PACK.md"
      - "crates/ptah-archive-decomposition/Cargo.toml"
      - "crates/ptah-archive-decomposition/src/lib.rs"
      - "crates/ptah-archive-decomposition/src/c04.rs"
      - "crates/ptah-archive-decomposition/tests/c04.rs"
      - ".github/workflows/c04-build-probe.yml"

permissions:
  contents: write

jobs:
  prove-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: c04-apple-ipsw-ota-img4-pack
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed C04 Build corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          tests_path = Path('crates/ptah-archive-decomposition/tests/c04.rs')
          text = tests_path.read_text(encoding='utf-8')

          start = text.index('fn standalone_im4p_exposes_exact_payload_range() {')
          end = text.index('\n#[test]', start)
          segment = text[start:end]
          segment = segment.replace(
              '    let source = im4p(b"exact-payload");\n',
              '    let source = im4p(b"exact-payload");\n    let ctx = context();\n',
              1,
          ).replace('&context()', '&ctx')
          text = text[:start] + segment + text[end:]

          start = text.index('fn exact_child_and_archive_materialization_are_source_bound() {')
          end = text.index('\n#[test]', start)
          segment = text[start:end]
          segment = segment.replace(
              '    let source = zip_source();\n',
              '    let source = zip_source();\n    let ctx = context();\n',
              1,
          )
          old = (
              '    let report = inspect_archive(AppleArchiveRole::Ipsw, Some(&archive), None)\n'
              '        .expect("archive report");'
          )
          new = (
              '    let report = inspect_apple_firmware(\n'
              '        &source,\n'
              '        &ctx,\n'
              '        archive_request(AppleArchiveRole::Ipsw),\n'
              '        AppleFirmwareLimits::default(),\n'
              '        Some(&archive),\n'
              '        None,\n'
              '    )\n'
              '    .expect("archive report");'
          )
          assert old in segment
          segment = segment.replace(old, new, 1).replace('&context()', '&ctx')
          text = text[:start] + segment + text[end:]

          old_provider = 'fn provider_id(&self) -> &str {'
          assert text.count(old_provider) == 2, text.count(old_provider)
          text = text.replace(old_provider, "fn provider_id(&self) -> &'static str {")

          replacements = [
              (
                  '    let mut limits = AppleFirmwareLimits::default();\n    limits.max_archive_entries = 1;\n',
                  '    let limits = AppleFirmwareLimits {\n        max_archive_entries: 1,\n        ..AppleFirmwareLimits::default()\n    };\n',
              ),
              (
                  '    let mut limits = AppleFirmwareLimits::default();\n    limits.max_recovered_bytes = 5;\n',
                  '    let limits = AppleFirmwareLimits {\n        max_recovered_bytes: 5,\n        ..AppleFirmwareLimits::default()\n    };\n',
              ),
              (
                  '    let mut limits = AppleFirmwareLimits::default();\n    limits.max_string_bytes = 4;\n',
                  '    let limits = AppleFirmwareLimits {\n        max_string_bytes: 4,\n        ..AppleFirmwareLimits::default()\n    };\n',
              ),
          ]
          for old_limit, new_limit in replacements:
              assert text.count(old_limit) == 1, text.count(old_limit)
              text = text.replace(old_limit, new_limit, 1)
          tests_path.write_text(text, encoding='utf-8')

          source_path = Path('crates/ptah-archive-decomposition/src/c04.rs')
          source = source_path.read_text(encoding='utf-8')
          old_call = ''.join([
              '    build_archive_report(\n',
              '        context,\n',
              '        kind,\n',
              '        source,\n',
              '        source_sha256,\n',
              '        limits,\n',
              '        provider.provider_id(),\n',
              '        observation,\n',
              '        manifest_provider,\n',
              '        role,\n',
              '    )\n',
          ])
          new_call = ''.join([
              '    build_archive_report_inner(ArchiveReportInput {\n',
              '        context,\n',
              '        kind,\n',
              '        source,\n',
              '        source_sha256,\n',
              '        limits,\n',
              '        provider_id: provider.provider_id(),\n',
              '        observation,\n',
              '        manifest_provider,\n',
              '        role,\n',
              '    })\n',
          ])
          assert source.count(old_call) == 1, source.count(old_call)
          source = source.replace(old_call, new_call, 1)
          wrapper_start = source.index('fn build_archive_report(\n')
          inner_start = source.index('fn build_archive_report_inner(', wrapper_start)
          source = source[:wrapper_start] + source[inner_start:]
          assert source.count('let (_, wrapped) = parse_constructed(') == 1
          source = source.replace(
              'let (_, wrapped) = parse_constructed(',
              'let (_, wrapped_children) = parse_constructed(',
              1,
          )
          source = source.replace(
              'if wrapped.len() != 1 || wrapped[0].tag != DER_SEQUENCE {',
              'if wrapped_children.len() != 1 || wrapped_children[0].tag != DER_SEQUENCE {',
              1,
          )
          source = source.replace(
              'let child = wrapped[0];',
              'let child = wrapped_children[0];',
              1,
          )
          source_path.write_text(source, encoding='utf-8')
          PY

      - name: Prove C04 build surface
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
          cargo fmt --all
          cargo test -p ptah-archive-decomposition --test c04 --locked -- --nocapture \
            2>&1 | tee /tmp/c04-tests.txt
          grep -Eq 'test result: ok\. 20 passed; 0 failed;' /tmp/c04-tests.txt
          cargo clippy -p ptah-archive-decomposition --lib --test c04 --locked -- -D warnings \
            2>&1 | tee /tmp/c04-clippy.txt
          git diff --check

      - name: Commit proven formatting and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/c04-build-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add C04_APPLE_IPSW_OTA_IMG4_PACK.md \
            crates/ptah-archive-decomposition/Cargo.toml \
            crates/ptah-archive-decomposition/src/lib.rs \
            crates/ptah-archive-decomposition/src/c04.rs \
            crates/ptah-archive-decomposition/tests/c04.rs \
            .github/workflows/c04-build-probe.yml
          git commit -m 'C04 build: prove Apple firmware core and corpus'
          git push origin HEAD:c04-apple-ipsw-ota-img4-pack
