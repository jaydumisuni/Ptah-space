name: TEMP ATHENA Oracle owner read-only proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, athena, windows, x64, physical, ptah]
    timeout-minutes: 5
    steps:
      - name: Inspect existing Oracle process owners
        shell: powershell
        run: |
          if ($env:COMPUTERNAME -ne 'ATHENA') { throw 'WRONG_HOST' }
          Get-CimInstance Win32_Process | Where-Object {
            $_.Name -eq 'Oracle.exe' -or
            ($_.Name -eq 'node.exe' -and $_.CommandLine -match 'oracle-live-node') -or
            $_.Name -eq 'Runner.Listener.exe'
          } | Select-Object Name,ProcessId,ParentProcessId,CreationDate,ExecutablePath | Format-Table -AutoSize
          $root=Join-Path $env:LOCALAPPDATA 'OracleNode'
          foreach($name in @('oracle-live-node-selfhost-status.json','oracle-live-node-status.json')){
            $file=Join-Path $root $name
            if(Test-Path $file){
              $s=Get-Content -Raw -LiteralPath $file | ConvertFrom-Json
              [pscustomobject]@{File=$name;AgeSeconds=[int]((Get-Date)-(Get-Item $file).LastWriteTime).TotalSeconds;Pid=$s.pid;NodeId=$s.nodeId;Connected=$s.connected;TransportConnected=$s.transportConnected;ConnectionId=$s.connectionId} | ConvertTo-Json -Compress
            }
          }
          $installed='C:\Program Files (x86)\THETECHGUY Digital Solutions\Oracle\Oracle.exe'
          if(Test-Path $installed){
            (Get-Item $installed).VersionInfo | Select-Object ProductVersion,FileVersion | Format-List
          }
