name: TEMP KRATOS ChatGPT Browser Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-kratos-chatgpt-browser-inspect.yml'

jobs:
  inspect:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 5
    steps:
      - name: Inspect saved Oracle extension bridge settings without secrets
        shell: bash
        run: |
          set -euo pipefail
          ext_id='hoahdcllchhncnenbeplgfgmpjihakab'
          root="$HOME/.config/google-chrome/Default/Local Extension Settings/$ext_id"
          echo "EXTENSION_STORAGE_EXISTS=$([ -d "$root" ] && echo true || echo false)"
          python3 - "$root" <<'PY'
          import pathlib,re,sys,json
          root=pathlib.Path(sys.argv[1])
          out={'files':0,'bytes':0,'oracle_settings_marker':False,'bridge_url_marker':False,'oracleEnabled':None,'bridgeEnabled':None,'pairingTokenPresent':None,'pairingTokenLength':None}
          if root.exists():
              blobs=[]
              for p in root.iterdir():
                  if not p.is_file(): continue
                  try: b=p.read_bytes()
                  except Exception: continue
                  out['files']+=1; out['bytes']+=len(b); blobs.append(b)
              b=b'\n'.join(blobs)
              out['oracle_settings_marker']=b'oracle.settings' in b
              out['bridge_url_marker']=b'ws://127.0.0.1:8765/browser' in b
              for key in [b'oracleEnabled',b'bridgeEnabled']:
                  m=re.search(key+rb'[^\r\n\x00]{0,80}?(true|false)',b,re.I)
                  if m: out[key.decode()]=m.group(1).lower()==b'true'
              m=re.search(rb'pairingToken[^\r\n\x00]{0,40}?"([^"\r\n\x00]*)"',b,re.I)
              if m:
                  out['pairingTokenPresent']=len(m.group(1))>0
                  out['pairingTokenLength']=len(m.group(1))
          print(json.dumps(out,separators=(',',':')))
          PY
          echo '=== BRIDGE HEALTH ==='
          curl -fsS --max-time 5 http://127.0.0.1:8765/health || true
          echo
          echo '=== CHROME PROCESS ==='
          pgrep -a -u "$USER" -f '/opt/google/chrome/chrome|google-chrome|chromium' | head -n 8 || true
