name: A02 apply restart-seed invariant patch

on:
  pull_request:
    paths:
      - ".github/workflows/a02-seed-hardening-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'a02-node-identity-generation-host-truth'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply exact fail-closed seed patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('crates/ptah-node-agent/src/lib.rs')
          text=path.read_text()
          old='''    pub fn restart(seed: NodeRestartSeed) -> Result<Self, NodeAgentError> {\n        ensure_frozen_contracts()?;\n        let record_revision = seed\n'''
          new='''    pub fn restart(seed: NodeRestartSeed) -> Result<Self, NodeAgentError> {\n        ensure_frozen_contracts()?;\n        if seed.record_revision == 0 {\n            return Err(NodeAgentError::Identifier(\n                IdentifierError::InvalidRecordRevision,\n            ));\n        }\n        let record_revision = seed\n'''
          assert text.count(old)==1
          text=text.replace(old,new,1)
          marker='''    #[test]\n    fn restart_fails_closed_on_revision_overflow() {\n'''
          test='''    #[test]\n    fn restart_rejects_zero_record_revision() {\n        let first = NodeAgent::bootstrap().expect("bootstrap");\n        let mut seed = first.restart_seed();\n        seed.record_revision = 0;\n        assert_eq!(\n            NodeAgent::restart(seed),\n            Err(NodeAgentError::Identifier(\n                IdentifierError::InvalidRecordRevision\n            ))\n        );\n    }\n\n'''
          assert text.count(marker)==1
          text=text.replace(marker,test+marker,1)
          path.write_text(text)
          PY
          cargo fmt --all
          git diff --check
      - name: Prove patched A02 crates
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1
          cargo clippy -p ptah-identifiers -p ptah-node-agent --all-features --locked -- -D warnings
          cargo test -p ptah-identifiers -p ptah-node-agent --locked
      - name: Commit patch and retire patch workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ptah-node-agent/src/lib.rs
          git rm .github/workflows/a02-seed-hardening-patch.yml
          git commit -m "fix: reject invalid A02 restart seed revisions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
