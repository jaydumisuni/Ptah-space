name: Temporary Oracle PR197 Reconcile

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-athena-ptah-runner-final.yml"

permissions:
  contents: read

jobs:
  reconcile-pr197:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 20
    steps:
      - name: Reconcile six-file PR197 candidate onto current Oracle main
        shell: bash
        run: |
          set -euo pipefail
          payload="$(mktemp --suffix=.mjs)"
          trap 'rm -f "$payload"' EXIT
          gh api 'repos/jaydumisuni/Oracle-/contents/oracle_control/pr197-reconcile-current-main-20260824.mjs?ref=main' --jq .content | tr -d '\n' | base64 -d > "$payload"
          node "$payload"

# user-trigger 20260824-0723z
