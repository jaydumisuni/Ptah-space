name: Temporary Redmi sky Global ROM locator v2 on KRATOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-oracle-relay-recovery-kratos.yml'

permissions:
  contents: read

jobs:
  locate:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 10
    steps:
      - name: Locate transferred Global archive by size and mountpoint
        shell: bash
        run: |
          set -euo pipefail
          echo '=== DESKTOP TOP LEVEL ==='
          find /home/kratos/Desktop -maxdepth 2 -type f -printf '%s\t%TY-%Tm-%TdT%TH:%TM:%TS\t%p\n' 2>/dev/null | sort -nr | head -n 100 || true
          echo '=== MOUNTS ==='
          findmnt -rn -o TARGET,SOURCE,FSTYPE,OPTIONS | head -n 120 || true
          echo '=== LARGE FILES COMMON LOCAL PATHS (>5G) ==='
          find /home /tmp /var/tmp /opt /srv -xdev -type f -size +5G \
            -printf '%s\t%TY-%Tm-%TdT%TH:%TM:%TS\t%p\n' 2>/dev/null | sort -nr | head -n 80 || true
          echo '=== GVFS / REMOVABLE LARGE FILES (>5G) ==='
          for base in /run/user/1000/gvfs /media /mnt /run/media; do
            if test -e "$base"; then
              find "$base" -maxdepth 8 -type f -size +5G \
                -printf '%s\t%TY-%Tm-%TdT%TH:%TM:%TS\t%p\n' 2>/dev/null | sort -nr | head -n 80 || true
            fi
          done
          echo '=== RECENT LARGE FILES (>1G, HOME) ==='
          find /home/kratos -xdev -type f -size +1G -mmin -1440 \
            -printf '%s\t%TY-%Tm-%TdT%TH:%TM:%TS\t%p\n' 2>/dev/null | sort -nr | head -n 100 || true
