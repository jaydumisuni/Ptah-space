name: C03 checked fixture conversion proof

on:
  push:
    branches:
      - c03-generic-android-image-ota-pack
    paths:
      - ".github/workflows/c03-build-probe-v4.yml"

permissions:
  contents: write

jobs:
  prove-final-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: c03-generic-android-image-ota-pack
          fetch-depth: 0
          persist-credentials: true

      - name: Execute proven refactor and checked fixture conversions
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import re

          carrier = Path('.github/workflows/c03-build-probe-v3.yml').read_text(encoding='utf-8')
          begin_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          cargo fmt --all"
          start = carrier.index(begin_marker) + len(begin_marker)
          end = carrier.index(end_marker, start)
          script = dedent(carrier[start:end])
          exec(compile(script, '<c03-final-refactor>', 'exec'), {})

          tests_path = Path('crates/ptah-archive-decomposition/tests/c03.rs')
          tests = tests_path.read_text(encoding='utf-8')
          tests, converted = re.subn(
              r'\b([A-Za-z_][A-Za-z0-9_]*) as u32\b',
              r'u32::try_from(\1).expect("fixture value fits u32")',
              tests,
          )
          assert converted == 23, converted
          tests_path.write_text(tests, encoding='utf-8')
          PY

          cargo fmt --all
          cargo test -p ptah-archive-decomposition --test c03 --locked -- --nocapture \
            2>&1 | tee /tmp/c03-tests.txt
          grep -Eq 'test result: ok\. 20 passed; 0 failed;' /tmp/c03-tests.txt
          cargo clippy -p ptah-archive-decomposition --lib --test c03 --locked -- -D warnings \
            2>&1 | tee /tmp/c03-clippy.txt
          git diff --check

      - name: Commit proven build and remove temporary carriers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/c03-build-probe.yml \
                 .github/workflows/c03-probe-anchor-fix.yml \
                 .github/workflows/c03-build-probe-v2.yml \
                 .github/workflows/c03-build-probe-v3.yml \
                 .github/workflows/c03-build-probe-v4.yml
          git add crates/ptah-archive-decomposition/src/c03.rs \
                  crates/ptah-archive-decomposition/tests/c03.rs
          changed="$(git diff --cached --name-only | sort)"
          allowed="$(printf '%s\n' \
            .github/workflows/c03-build-probe-v2.yml \
            .github/workflows/c03-build-probe-v3.yml \
            .github/workflows/c03-build-probe-v4.yml \
            .github/workflows/c03-build-probe.yml \
            .github/workflows/c03-probe-anchor-fix.yml \
            crates/ptah-archive-decomposition/src/c03.rs \
            crates/ptah-archive-decomposition/tests/c03.rs | sort)"
          test "$changed" = "$allowed"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "C03 build: harden parser boundaries and OTA completeness"
          git push origin HEAD:c03-generic-android-image-ota-pack
