name: TEMP ATHENA Oracle Live recovery

on:
  push:
    branches: [ops/oracle-athena-live-recover-20260904]
    paths:
      - ".github/workflows/temp-athena-oracle-live-recover.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: [self-hosted, athena, windows, x64, physical, ptah]
    timeout-minutes: 10
    steps:
      - name: Restart Oracle user scheduled tasks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output ('HOST=' + $env:COMPUTERNAME)
          Write-Output ('USER=' + [Security.Principal.WindowsIdentity]::GetCurrent().Name)
          Write-Output ('SESSION=' + [Diagnostics.Process]::GetCurrentProcess().SessionId)

          $taskNames = @(
            'Oracle Recovery Relay',
            'Oracle Always-On Node',
            'Oracle Node Watchdog',
            'Oracle Desktop Input'
          )

          $protectedNames = @('Oracle Always-On Node', 'Oracle Node Watchdog', 'Oracle Desktop Input')
          $needsProtectedRepair = $false
          foreach ($protectedName in $protectedNames) {
            $protectedTask = Get-ScheduledTask -TaskName $protectedName -ErrorAction SilentlyContinue
            if (-not $protectedTask -or $protectedTask.State -eq 'Disabled') {
              $needsProtectedRepair = $true
            }
          }
          if ($needsProtectedRepair) {
            $submitterCandidates = @(
              (Join-Path $env:USERPROFILE 'oracle-release-work\0f2a3b0e1\scripts\Submit-OracleElevatedInteractiveJob.ps1'),
              (Join-Path $env:LOCALAPPDATA 'OracleNode\pointer-bootstrap-v4\source-full\scripts\Submit-OracleElevatedInteractiveJob.ps1')
            )
            $submitter = $submitterCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
            if (-not $submitter) {
              $recoverySource = Join-Path $env:RUNNER_TEMP 'oracle-recovery-source-0f2a3b0e1'
              if (Test-Path -LiteralPath $recoverySource) { Remove-Item -LiteralPath $recoverySource -Recurse -Force }
              git -c core.autocrlf=false clone --quiet --no-checkout https://github.com/jaydumisuni/Oracle-.git $recoverySource
              if ($LASTEXITCODE -ne 0) { throw 'ORACLE_RECOVERY_SOURCE_CLONE_FAILED' }
              git -C $recoverySource -c core.autocrlf=false checkout --quiet --detach 0f2a3b0e1884c749286b61348b482f7ebb263c19
              if ($LASTEXITCODE -ne 0) { throw 'ORACLE_RECOVERY_SOURCE_CHECKOUT_FAILED' }
              $recoveryHead = (git -C $recoverySource rev-parse HEAD).Trim()
              if ($recoveryHead -ne '0f2a3b0e1884c749286b61348b482f7ebb263c19') { throw ('ORACLE_RECOVERY_SOURCE_HEAD_MISMATCH:' + $recoveryHead) }
              $submitter = Join-Path $recoverySource 'scripts\Submit-OracleElevatedInteractiveJob.ps1'
            }
            if (-not (Test-Path -LiteralPath $submitter -PathType Leaf)) { throw 'ORACLE_ELEVATED_SUBMITTER_MISSING' }
            Write-Output ('ELEVATED_SUBMITTER=' + $submitter)
            $elevatedOutput = @(& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $submitter -Operation oracle_desktop_pointer_install -TimeoutSeconds 180 2>&1)
            $elevatedOutput | ForEach-Object { Write-Output ('ELEVATED=' + $_) }
            if ($LASTEXITCODE -ne 0) { throw ('ORACLE_ELEVATED_REPAIR_FAILED:' + $LASTEXITCODE) }
            Write-Output 'ORACLE_ELEVATED_REPAIR=PASS'
          }

          foreach ($name in $taskNames) {
            $task = Get-ScheduledTask -TaskName $name -ErrorAction SilentlyContinue
            if (-not $task) {
              Write-Output ($name + '=MISSING')
              continue
            }
            if ($task.State -eq 'Disabled') {
              try {
                Enable-ScheduledTask -TaskName $name -ErrorAction Stop | Out-Null
                Write-Output ($name + '=ENABLED')
              } catch {
                Write-Output ($name + '=ENABLE_FAILED:' + $_.Exception.Message)
                continue
              }
            }
            try {
              Start-ScheduledTask -TaskName $name -ErrorAction Stop
              Write-Output ($name + '=START_REQUESTED')
            } catch {
              Write-Output ($name + '=START_FAILED:' + $_.Exception.Message)
            }
          }

          Start-Sleep -Seconds 10

          foreach ($name in $taskNames) {
            $task = Get-ScheduledTask -TaskName $name -ErrorAction SilentlyContinue
            if (-not $task) { continue }
            $info = $task | Get-ScheduledTaskInfo
            Write-Output ($name + '_STATE=' + $task.State)
            Write-Output ($name + '_LAST_RESULT=' + $info.LastTaskResult)
            Write-Output ($name + '_LAST_RUN=' + $info.LastRunTime.ToString('o'))
          }

          $oracleProcesses = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
            $_.CommandLine -match 'oracle-live-node\.mjs|oracle-node-watchdog-windows\.mjs|Oracle-RecoveryRelaySupervisor\.ps1|oracle-desktop-input'
          })
          foreach ($proc in $oracleProcesses) {
            Write-Output ('PROC=' + $proc.ProcessId + ':' + $proc.Name + ':' + $proc.CommandLine)
          }

          $recoveryStatus = Join-Path $env:LOCALAPPDATA 'OracleRelay\recovery-supervisor-status.json'
          if (Test-Path -LiteralPath $recoveryStatus -PathType Leaf) {
            Write-Output 'RECOVERY_STATUS_BEGIN'
            Get-Content -LiteralPath $recoveryStatus -Raw
            Write-Output 'RECOVERY_STATUS_END'
          }

          $ready = Invoke-RestMethod -Uri 'http://127.0.0.1:5059/ready' -TimeoutSec 5 -ErrorAction Stop
          if ([string]$ready.schemaVersion -ne 'oracle.node-health.v1') { throw 'ORACLE_READY_SCHEMA_MISMATCH' }
          if (-not [bool]$ready.ok -or -not [bool]$ready.connected) { throw 'ORACLE_READY_NOT_CONNECTED' }
          if ([string]$ready.nodeId -ne 'ATHENA') { throw ('ORACLE_READY_NODE_MISMATCH:' + [string]$ready.nodeId) }
          Write-Output ('ORACLE_READY_CONNECTION=' + [string]$ready.connectionId)
          Write-Output 'ATHENA_ORACLE_RECOVERY=PASS'
