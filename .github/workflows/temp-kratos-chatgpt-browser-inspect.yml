name: TEMP KRATOS ChatGPT Browser Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-kratos-chatgpt-browser-inspect.yml'

jobs:
  inspect:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 5
    steps:
      - name: Launch existing signed-in Chrome profile in user session
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          export XDG_RUNTIME_DIR="/run/user/$uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          user_env="$(systemctl --user show-environment 2>/dev/null || true)"
          eval "$(printf '%s\n' "$user_env" | grep -E '^(DISPLAY|WAYLAND_DISPLAY|XAUTHORITY)=' | sed 's/^/export /' || true)"
          if [ -z "${DISPLAY:-}" ]; then export DISPLAY=:0; fi
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"

          echo "DISPLAY=$DISPLAY XAUTHORITY=${XAUTHORITY:-} CHROME=$chrome"
          systemctl --user stop oracle-chatgpt-browser.service >/dev/null 2>&1 || true
          systemctl --user reset-failed oracle-chatgpt-browser.service >/dev/null 2>&1 || true

          if ! pgrep -u "$USER" -f '/opt/google/chrome/chrome|google-chrome|chromium' >/dev/null; then
            args=(systemd-run --user --unit=oracle-chatgpt-browser --collect --property=TimeoutStopSec=5)
            args+=(--setenv="DISPLAY=$DISPLAY")
            args+=(--setenv="DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS")
            if [ -n "${XAUTHORITY:-}" ]; then args+=(--setenv="XAUTHORITY=$XAUTHORITY"); fi
            "${args[@]}" "$chrome" --profile-directory=Default --new-window 'https://chatgpt.com/'
          else
            "$chrome" --profile-directory=Default --new-tab 'https://chatgpt.com/' >/dev/null 2>&1 || true
          fi

          connected=0
          for i in $(seq 1 40); do
            sleep 1
            curl -fsS --max-time 2 http://127.0.0.1:8765/health >"$RUNNER_TEMP/bridge-health.json" 2>/dev/null || true
            if [ -s "$RUNNER_TEMP/bridge-health.json" ]; then
              if python3 -c "import json; d=json.load(open('$RUNNER_TEMP/bridge-health.json')); raise SystemExit(0 if d.get('browserConnected') else 1)"; then connected=1; break; fi
            fi
            if ! pgrep -u "$USER" -f '/opt/google/chrome/chrome|google-chrome|chromium' >/dev/null; then break; fi
          done

          echo '=== USER SERVICE ==='
          systemctl --user --no-pager --full status oracle-chatgpt-browser.service || true
          echo '=== BROWSER PROCESSES ==='
          pgrep -a -u "$USER" -f '/opt/google/chrome/chrome|google-chrome|chromium' || true
          echo '=== BRIDGE HEALTH ==='
          cat "$RUNNER_TEMP/bridge-health.json" 2>/dev/null || curl -fsS --max-time 5 http://127.0.0.1:8765/health || true
          echo
          echo "BROWSER_BRIDGE_CONNECTED=$connected"
