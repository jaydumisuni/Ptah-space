name: ATHENA Donor-to-IMEI read-only handler inventory

on:
  push:
    branches: [diagnostics/donor-imei-recovery-20261016]
    paths: [.github/workflows/temp-athena-donor-imei-inventory.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: [self-hosted, athena, windows, x64, physical, ptah]
    timeout-minutes: 8
    steps:
      - name: Inspect existing backend mappings and recovery architecture
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'ATHENA'){throw 'WRONG_HOST'}
          $donor='D:\projects\Donor Fetcher'
          $imei='D:\projects\TechGuy-IMEI'
          $recovery='D:\projects\app-recover'
          $map=Join-Path $donor 'remakes\AndroidUtility.v200\button-map.json'
          $data=if(Test-Path $map){Get-Content -LiteralPath $map -Raw | ConvertFrom-Json}else{$null}
          $buttons=@($data.buttons)
          $report=[ordered]@{
            schema='ttg.donor-imei-handler-inventory.v1'
            observed_utc=(Get-Date).ToUniversalTime().ToString('o')
            device_operations_executed=0
            imei_git_head=((& git -C $imei rev-parse HEAD) -join '')
            imei_git_branch=((& git -C $imei branch --show-current) -join '')
            imei_changed_count=@(& git -C $imei status --porcelain=v1 -uno).Count
            imei_root_entries=@(Get-ChildItem -LiteralPath $imei -Force -ErrorAction SilentlyContinue | Select-Object -First 90 Name,@{N='Type';E={if($_.PSIsContainer){'directory'}else{'file'}}})
            imei_source_files=@(Get-ChildItem -LiteralPath $imei -File -Recurse -Include '*.py','*.cs','*.rs','*.json' -ErrorAction SilentlyContinue |
              Where-Object {$_.FullName -notmatch '\\.git\\|\\node_modules\\|\\venv\\|\\.venv\\|\\target\\|\\dist\\'} |
              Select-Object -First 110 @{N='relative';E={$_.FullName.Substring($imei.Length+1)}},Length)
            recovery_root_entries=@(Get-ChildItem -LiteralPath $recovery -Force -ErrorAction SilentlyContinue | Select-Object -First 65 Name,@{N='Type';E={if($_.PSIsContainer){'directory'}else{'file'}}})
            recovery_worker_defs=@(Select-String -LiteralPath (Join-Path $recovery 'app_recover_qt.py') -Pattern '^class RecoverWorker','^    def ','^def ' -ErrorAction SilentlyContinue |
              Select-Object -First 85 LineNumber,@{N='Definition';E={$_.Line.Trim()}})
            donor_button_map=[ordered]@{
              exists=Test-Path $map
              sha256=if(Test-Path $map){(Get-FileHash -LiteralPath $map).Hash.ToLowerInvariant()}else{$null}
              count=$buttons.Count
              statuses=@($buttons | Group-Object status | Select-Object Name,Count)
              capabilities=@($buttons | Group-Object capability_id | Sort-Object Count -Descending | Select-Object -First 35 Name,Count)
              sample=@($buttons | Select-Object -First 35 button_text,capability_id,provider_action,status,ui_path)
            }
            recovered_workspaces=@(Get-ChildItem -LiteralPath (Join-Path $recovery 'output') -Directory -ErrorAction SilentlyContinue |
              Select-Object -First 30 Name,LastWriteTime)
            donor_processes=@(Get-CimInstance Win32_Process | Where-Object {$_.Name -match '(?i)androidutility'} | Select-Object Name,ProcessId)
          }
          $dest=Join-Path $env:RUNNER_TEMP 'ttg-donor-imei-handlers.json'
          $report | ConvertTo-Json -Depth 7 | Set-Content -LiteralPath $dest -Encoding UTF8
          Get-Content -LiteralPath $dest
      - name: Retain read-only handler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttg-donor-imei-handler-inventory
          path: ${{ runner.temp }}/ttg-donor-imei-handlers.json
          if-no-files-found: warn
          retention-days: 7
