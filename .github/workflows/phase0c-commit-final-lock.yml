name: Phase 0C commit final contract lock

on:
  push:
    branches:
      - phase-0c-generated-contract-bindings

permissions:
  contents: write

jobs:
  commit-final-lock:
    if: ${{ !contains(github.event.head_commit.message, '[generated-lock]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out binding branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: phase-0c-generated-contract-bindings
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Check out frozen roadmap checkpoint
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: jaydumisuni/ptah-roadmap-
          ref: dc2db457f1705d0cba80f17ab76e5e93f808aee0
          path: .ptah-roadmap
          persist-credentials: false

      - name: Generate final lock
        run: >-
          python tools/lock_frozen_contracts.py
          --roadmap-root .ptah-roadmap
          --output contracts/upstream-lock.json

      - name: Commit generated lock
        run: |
          git add contracts/upstream-lock.json
          if git diff --cached --quiet; then
            echo "Final contract lock already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Phase 0C: commit final catalog and binding lock [generated-lock]"
          git push origin HEAD:phase-0c-generated-contract-bindings
