name: TEMP Athena Oracle Recovery
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  inspect:
    runs-on: [self-hosted, Windows, athena]
    timeout-minutes: 5
    steps:
      - shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          $state=Join-Path $env:LOCALAPPDATA 'OracleNode'
          Write-Output '--- USER RECOVERY TASK ---'
          $t=Get-ScheduledTask -TaskName 'Oracle User Recovery Node' -ErrorAction SilentlyContinue
          $i=Get-ScheduledTaskInfo -TaskName 'Oracle User Recovery Node' -ErrorAction SilentlyContinue
          if($t){[pscustomobject]@{state=[string]$t.State;enabled=[bool]$t.Settings.Enabled;lastTaskResult=if($i){[int64]$i.LastTaskResult}else{$null};restartCount=$t.Settings.RestartCount;restartInterval=[string]$t.Settings.RestartInterval}|ConvertTo-Json -Compress}
          Write-Output '--- PROCESS ---'
          Get-CimInstance Win32_Process | Where-Object {$_.Name -eq 'node.exe' -and $_.CommandLine -like '*OracleNode*oracle-live-node.mjs*'} | Select-Object ProcessId,ParentProcessId,CreationDate,CommandLine | ConvertTo-Json -Compress
          Write-Output '--- HEALTH ---'
          try{Invoke-RestMethod -Uri 'http://127.0.0.1:5059/health' -TimeoutSec 3 | ConvertTo-Json -Depth 8 -Compress}catch{Write-Output ('HEALTH_ERROR='+$_.Exception.Message)}
          Write-Output '--- STATUS ---'
          $status=Join-Path $state 'oracle-live-node-status.json';if(Test-Path $status){Get-Content $status -Raw}
          Write-Output '--- RECOVERY STDERR ---'
          $err=Join-Path $state 'manual-recovery.stderr.log';if(Test-Path $err){Get-Content $err -Tail 100}
