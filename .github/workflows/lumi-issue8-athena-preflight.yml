name: Lumi Issue 8 ATHENA Preflight

on:
  push:
    branches:
      - proof/lumi-issue8-athena-preflight

permissions:
  contents: read

jobs:
  athena-preflight:
    runs-on: [self-hosted, Windows, X64, athena, physical, ptah]
    timeout-minutes: 10
    steps:
      - name: Prove medium runner is on active ATHENA desktop
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $proc = Get-Process -Id $PID
          $explorers = @(Get-Process explorer -ErrorAction SilentlyContinue)
          $sameDesktop = @($explorers | Where-Object { $_.SessionId -eq $proc.SessionId }).Count -gt 0
          $groups = (whoami /groups | Out-String)
          $adminMember = $groups -match 'S-1-5-32-544'
          $policy = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -ErrorAction Stop
          Write-Host "COMPUTER=$env:COMPUTERNAME USER=$env:USERNAME SESSION=$($proc.SessionId) SAME_AS_EXPLORER=$sameDesktop"
          Write-Host "ADMIN_GROUP_MEMBER=$adminMember CONSENT_POLICY=$($policy.ConsentPromptBehaviorAdmin) SECURE_DESKTOP=$($policy.PromptOnSecureDesktop)"
          if (-not $sameDesktop) { throw 'Runner is not on the active Explorer desktop.' }
          if (-not $adminMember) { throw 'Interactive user is not a member of Administrators; standard RunAs cannot be used.' }
          if ([int]$policy.ConsentPromptBehaviorAdmin -ne 0) { throw 'Windows policy would require interactive UAC consent; refusing automation.' }

      - name: Prove standard RunAs yields High integrity in same session
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = Join-Path $env:RUNNER_TEMP 'lumi-high-integrity-probe.ps1'
          $result = Join-Path $env:RUNNER_TEMP 'lumi-high-integrity-result.json'
          @'
          param([Parameter(Mandatory=$true)][string]$ResultPath)
          $ErrorActionPreference='Stop'
          $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
          $principal=[Security.Principal.WindowsPrincipal]$identity
          $admin=$principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $groups=(whoami /groups | Out-String)
          $high=$groups -match 'High Mandatory Level|S-1-16-12288|System Mandatory Level|S-1-16-16384'
          $session=(Get-Process -Id $PID).SessionId
          $same=@(Get-Process explorer -ErrorAction SilentlyContinue | Where-Object { $_.SessionId -eq $session }).Count -gt 0
          [ordered]@{identity=$identity.Name;admin=$admin;high_integrity=$high;session_id=$session;same_as_explorer=$same;user_interactive=[Environment]::UserInteractive} | ConvertTo-Json | Set-Content -LiteralPath $ResultPath -Encoding UTF8
          '@ | Set-Content -LiteralPath $probe -Encoding UTF8
          Remove-Item -LiteralPath $result -Force -ErrorAction SilentlyContinue
          $p = Start-Process powershell.exe -Verb RunAs -Wait -PassThru -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',"`"$probe`"",'-ResultPath',"`"$result`"")
          if ($p.ExitCode -ne 0) { throw "High-integrity probe exited $($p.ExitCode)." }
          if (-not (Test-Path -LiteralPath $result -PathType Leaf)) { throw 'High-integrity probe produced no result.' }
          $r = Get-Content -LiteralPath $result -Raw | ConvertFrom-Json
          $r | ConvertTo-Json -Compress | Write-Host
          if (-not [bool]$r.admin -or -not [bool]$r.high_integrity -or -not [bool]$r.same_as_explorer -or -not [bool]$r.user_interactive) {
            throw 'Standard RunAs did not produce the required elevated active-desktop execution context.'
          }

      - name: Verify exact Freeze 5 checkout and proof prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $builder='D:\projects\Lumi-Builder-Freeze5-20260904'
          $expected='cf7331a59851cec7ea07152bfae6f6f508ba3788'
          if (-not (Test-Path -LiteralPath $builder -PathType Container)) { throw "Missing Builder Freeze 5 checkout: $builder" }
          $safe=$builder.Replace('\','/')
          $head=(& git -c "safe.directory=$safe" -C $builder rev-parse HEAD).Trim()
          Write-Host "BUILDER_HEAD=$head"
          if ($head -ne $expected) { throw "Builder Freeze 5 head mismatch: $head" }
          foreach ($rel in @(
            'scripts\run_lumi_issue8_autonomous_acceptance.ps1',
            'scripts\run_lumi_issue8_physical_acceptance.ps1',
            'scripts\verify_lumi_issue8_native_automation.py',
            'scripts\verify_lumi_issue8_trace_semantics.py',
            'scripts\verify_lumi_issue8_physical_summary.py'
          )) {
            $p=Join-Path $builder $rel
            if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { throw "Missing Freeze 5 proof owner: $rel" }
            Write-Host "PROOF_OWNER=$p SHA256=$((Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash)"
          }
          $playwright=Join-Path $builder 'builder_cache\lumi-source-ui\node\node_modules\playwright\package.json'
          Write-Host "PLAYWRIGHT_CACHE_PRESENT=$(Test-Path -LiteralPath $playwright -PathType Leaf)"
