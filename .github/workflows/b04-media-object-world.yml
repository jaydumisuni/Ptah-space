name: B04 one-use review correction

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/b04-media-object-world.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  correct:
    if: github.event.pull_request.head.ref == 'b04-media-object-world' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out writable B04 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: b04-media-object-world
          fetch-depth: 0
      - name: Apply exact Review corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('crates/ptah-archive-decomposition/src/b04.rs')
          text = source.read_text(encoding='utf-8')

          text = text.replace(
              '    /// Image media such as PNG, JPEG, WebP or other image Provider formats.\n',
              '    /// Image media such as PNG, JPEG, `WebP` or other image Provider formats.\n',
              1,
          )

          old_impl = '''\nimpl MediaClass {\n    const fn as_str(self) -> &'static str {\n        match self {\n            Self::Image => "image",\n            Self::Audio => "audio",\n            Self::Video => "video",\n        }\n    }\n}\n'''
          if text.count(old_impl) != 1:
              raise SystemExit('expected unused MediaClass::as_str block once')
          text = text.replace(old_impl, '\n', 1)

          start = text.index('pub fn inspect_media(\n')
          end = text.index('\nfn validate_context(', start)
          replacement = r'''pub fn inspect_media(
    source_bytes: &[u8],
    type_assessment: &TypeAssessment,
    context: &MediaContext,
    request: &MediaRequest,
    limits: MediaLimits,
    adapters: &[&dyn MediaAdapter],
) -> Result<MediaReport, B04Error> {
    validate_context(context)?;
    validate_limits(limits)?;
    validate_adapter_ids(adapters)?;

    let source_sha256 = sha256_bytes(source_bytes);
    let agreed_media_type = match &type_assessment.agreement {
        TypeAgreement::Agreed(value) => Some(normalize_media_type(value)),
        TypeAgreement::Unknown | TypeAgreement::Disputed(_) => None,
    };
    let mut report = empty_report(
        source_sha256.clone(),
        context.source_revision_ref.clone(),
        agreed_media_type.clone(),
    );

    let Some(media_type) = agreed_media_type else {
        record_unresolved_type_gap(&mut report, type_assessment);
        return Ok(report);
    };
    let Some(media_class) = media_class_for_type(&media_type) else {
        report.coverage.unknown_gaps.push(format!(
            "B02 agreed type {media_type} is outside the B04 image/audio/video domain"
        ));
        return Ok(report);
    };
    report.media_class = Some(media_class);
    validate_request(request, media_class, limits)?;

    let matching: Vec<&dyn MediaAdapter> = adapters
        .iter()
        .copied()
        .filter(|adapter| adapter.supports_media_type(&media_type))
        .collect();
    if matching.len() > 1 {
        return Err(B04Error::AmbiguousAdapter(media_type));
    }
    let Some(adapter) = matching.first().copied() else {
        report.coverage.unknown_gaps.push(format!(
            "no B04 media adapter is registered for agreed type {media_type}"
        ));
        return Ok(report);
    };
    let adapter_id = adapter.adapter_id().trim().to_owned();
    if !adapter.isolation().is_safe() {
        return Err(B04Error::UnsafeAdapterIsolation(adapter_id));
    }

    let output = adapter
        .inspect(source_bytes, &media_type, request, limits)
        .map_err(B04Error::Adapter)?;
    validate_adapter_output(&output, source_bytes.len(), media_class, request)?;
    apply_adapter_output(
        &mut report,
        output,
        source_bytes.len(),
        context,
        request,
        limits,
        &source_sha256,
        &adapter_id,
    )?;

    if !report.coverage.unknown_gaps.is_empty() {
        report.coverage.complete_claim = false;
    }
    dedup_strings(&mut report.coverage.unknown_gaps);
    dedup_strings(&mut report.warnings);
    dedup_strings(&mut report.limitations);
    debug_assert_eq!(source_sha256, sha256_bytes(source_bytes));
    Ok(report)
}

fn record_unresolved_type_gap(report: &mut MediaReport, type_assessment: &TypeAssessment) {
    report
        .coverage
        .unknown_gaps
        .push(match &type_assessment.agreement {
            TypeAgreement::Unknown => "B02 did not establish an agreed media type".to_owned(),
            TypeAgreement::Disputed(values) => format!(
                "B02 detector disagreement prevents media adapter selection: {}",
                values.join(", ")
            ),
            TypeAgreement::Agreed(_) => unreachable!("agreed media type was extracted above"),
        });
}

#[allow(clippy::too_many_arguments)]
fn apply_adapter_output(
    report: &mut MediaReport,
    output: AdapterMedia,
    source_len: usize,
    context: &MediaContext,
    request: &MediaRequest,
    limits: MediaLimits,
    source_sha256: &str,
    adapter_id: &str,
) -> Result<(), B04Error> {
    let AdapterMedia {
        metadata,
        dimensions,
        duration,
        observed_source_bytes,
        thumbnail,
        preview,
        frames,
        waveform,
        derivatives,
        complete_claim,
        unknown_gaps,
        warnings,
        limitations,
    } = output;

    report.adapter_id = Some(adapter_id.to_owned());
    report.coverage.complete_claim = complete_claim;
    report.coverage.observed_source_bytes = observed_source_bytes;
    report.coverage.unknown_gaps.extend(unknown_gaps);
    report.warnings = warnings;
    report.limitations = limitations;
    report.metadata = retain_metadata(metadata, limits.max_metadata_fields, &mut report.coverage);
    report.dimensions = dimensions;
    report.duration = duration;

    apply_source_coverage(report, source_len, complete_claim)?;
    retain_requested_views(
        report,
        thumbnail,
        preview,
        frames,
        waveform,
        context,
        request,
        limits,
    )?;
    retain_requested_derivatives(
        report,
        derivatives,
        context,
        request,
        limits.max_derived_bytes,
        source_sha256,
        adapter_id,
    );
    Ok(())
}

fn apply_source_coverage(
    report: &mut MediaReport,
    source_len: usize,
    provider_complete_claim: bool,
) -> Result<(), B04Error> {
    let source_len = u64::try_from(source_len).map_err(|_| B04Error::AccountingOverflow)?;
    if report.coverage.observed_source_bytes < source_len {
        mark_gap(
            report,
            "media Provider inspected only part of the immutable source bytes".to_owned(),
        );
        if let Some(duration) = &mut report.duration {
            duration.complete = false;
        }
    }
    if !provider_complete_claim && report.coverage.unknown_gaps.is_empty() {
        mark_gap(
            report,
            "media Provider reported partial supported coverage".to_owned(),
        );
    }
    if report.duration.is_some_and(|duration| !duration.complete) {
        mark_gap(
            report,
            "full media duration was not mechanically established".to_owned(),
        );
    }
    Ok(())
}

#[allow(clippy::too_many_arguments)]
fn retain_requested_views(
    report: &mut MediaReport,
    thumbnail: Option<AdapterMediaView>,
    preview: Option<AdapterMediaView>,
    frames: Vec<AdapterMediaFrame>,
    waveform: Option<AdapterMediaView>,
    context: &MediaContext,
    request: &MediaRequest,
    limits: MediaLimits,
) -> Result<(), B04Error> {
    report.thumbnail = retain_view(
        thumbnail,
        context,
        "thumbnail",
        limits.max_thumbnail_bytes,
        limits.max_cached_view_bytes,
        &mut report.coverage,
        &mut report.limitations,
    )?;
    if request.thumbnail && report.thumbnail.is_none() {
        mark_gap(
            report,
            "requested media thumbnail was not retained".to_owned(),
        );
    }

    report.preview = retain_view(
        preview,
        context,
        "preview",
        limits.max_preview_bytes,
        limits.max_cached_view_bytes,
        &mut report.coverage,
        &mut report.limitations,
    )?;
    if request.preview && report.preview.is_none() {
        mark_gap(report, "requested media preview was not retained".to_owned());
    }

    retain_frames(
        report,
        frames,
        context,
        limits.max_frames,
        limits.max_frame_bytes,
        limits.max_cached_view_bytes,
    )?;
    for timestamp in &request.frame_timestamps_ms {
        if !report
            .frames
            .iter()
            .any(|frame| frame.timestamp_ms == *timestamp)
        {
            mark_gap(
                report,
                format!("requested frame at {timestamp} ms was not retained"),
            );
        }
    }

    report.waveform = retain_view(
        waveform,
        context,
        "waveform",
        limits.max_waveform_bytes,
        limits.max_cached_view_bytes,
        &mut report.coverage,
        &mut report.limitations,
    )?;
    if request.waveform && report.waveform.is_none() {
        mark_gap(
            report,
            "requested media waveform was not retained".to_owned(),
        );
    }
    Ok(())
}

fn retain_requested_derivatives(
    report: &mut MediaReport,
    derivatives: Vec<AdapterDerivedMedia>,
    context: &MediaContext,
    request: &MediaRequest,
    max_derived_bytes: usize,
    source_sha256: &str,
    adapter_id: &str,
) {
    retain_derivatives(
        report,
        derivatives,
        context,
        max_derived_bytes,
        source_sha256,
        adapter_id,
    );
    if request.image_transform.is_some()
        && !report
            .derivatives
            .iter()
            .any(|derived| derived.kind == DerivedMediaKind::ImageTransform)
    {
        mark_gap(
            report,
            "requested image transformation was not retained".to_owned(),
        );
    }
    if request.transcode.is_some()
        && !report
            .derivatives
            .iter()
            .any(|derived| derived.kind == DerivedMediaKind::Transcode)
    {
        mark_gap(
            report,
            "requested media transcode was not retained".to_owned(),
        );
    }
}
'''
          text = text[:start] + replacement + text[end:]

          text = text.replace(
              '    validate_optional_view(&output.thumbnail)?;\n    validate_optional_view(&output.preview)?;\n    validate_optional_view(&output.waveform)?;\n',
              '    validate_optional_view(output.thumbnail.as_ref())?;\n    validate_optional_view(output.preview.as_ref())?;\n    validate_optional_view(output.waveform.as_ref())?;\n',
              1,
          )
          text = text.replace(
              'fn validate_optional_view(view: &Option<AdapterMediaView>) -> Result<(), B04Error> {\n    if let Some(view) = view {\n',
              'fn validate_optional_view(view: Option<&AdapterMediaView>) -> Result<(), B04Error> {\n    if let Some(view) = view {\n',
              1,
          )

          old_signature = '''fn retain_derivatives(\n    report: &mut MediaReport,\n    derivatives: Vec<AdapterDerivedMedia>,\n    context: &MediaContext,\n    _request: &MediaRequest,\n    max_derived_bytes: usize,\n'''
          new_signature = '''fn retain_derivatives(\n    report: &mut MediaReport,\n    derivatives: Vec<AdapterDerivedMedia>,\n    context: &MediaContext,\n    max_derived_bytes: usize,\n'''
          if text.count(old_signature) != 1:
              raise SystemExit('expected retain_derivatives signature once')
          text = text.replace(old_signature, new_signature, 1)
          source.write_text(text, encoding='utf-8')

          tests = Path('crates/ptah-archive-decomposition/tests/b04.rs')
          test_text = tests.read_text(encoding='utf-8')
          if not test_text.startswith('//! B04'):
              test_text = '//! B04 media object-world acceptance and adversarial proofs.\n\n' + test_text
          tests.write_text(test_text, encoding='utf-8')
          PY
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          cargo fmt --all
          git diff --check
      - name: Commit reviewed B04 corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ptah-archive-decomposition/src/b04.rs crates/ptah-archive-decomposition/tests/b04.rs
          git diff --cached --check
          git commit -m "B04 review: satisfy strict Clippy and tighten coverage orchestration"
          git push origin HEAD:b04-media-object-world
