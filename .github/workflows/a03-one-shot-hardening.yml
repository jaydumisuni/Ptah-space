              #[test]
              fn revisions_are_canonical_and_ordered() {
                  let db = TempDb::new();
                  let entity_id = EntityId::new_v7();
                  let mut ledger = Ledger::open(db.path()).expect("open ledger");
                  for revision in [1, 2, 3] {
                      let write = ledger.begin_write().expect("begin revision write");
                      write.insert(&node_record(entity_id, revision, 0, "revision")).expect("insert");
                      write.commit().expect("commit");
                  }
                  assert_eq!(
                      ledger.revisions(entity_id).expect("list revisions").iter()
                          .map(|revision| revision.value()).collect::<Vec<_>>(),
                      vec![1, 2, 3]
                  );
