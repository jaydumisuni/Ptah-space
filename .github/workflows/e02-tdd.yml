name: E02 TDD

on:
  push:
    branches:
      - e02-placement-reservation-lease-fence
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/ptah-placement-runtime/**
      - crates/ptah-node-link/**
      - services/ptah-control/**
      - services/ptah-node/**
      - .github/workflows/e02-tdd.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  placement-authority-targeted:
    runs-on: ubuntu-latest
    steps:
      - name: Check out E02 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Pin Rust 1.97.1
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          rustup default 1.97.1
      - name: Run E02 placement-runtime tests
        shell: bash
        run: cargo test -p ptah-placement-runtime --test e02_authority --test e02_placement --test e02_offers --test e02_reservations --test e02_leases
      - name: Run E02 control authority test
        shell: bash
        run: cargo test -p ptah-control --test e02_placement
      - name: Run E02 dispatch wire test
        shell: bash
        run: cargo test -p ptah-node-link --test e02_offer_wire --test e02_dispatch_wire
      - name: Run E02 Node dispatch guard test
        shell: bash
        run: cargo test -p ptah-node --test e02_dispatch_guard
      - name: Run E02 strict Clippy
        shell: bash
        run: cargo clippy -p ptah-placement-runtime -p ptah-node-link -p ptah-control -p ptah-node --all-targets -- -D warnings
