name: B06 Session Vault v1 exact-head proof

on:
  pull_request:
    paths:
      - "B06_SESSION_VAULT_V1.md"
      - "crates/ptah-checkpoint/Cargo.toml"
      - "crates/ptah-checkpoint/src/b06_lib.rs"
      - "crates/ptah-checkpoint/src/b06.rs"
      - "crates/ptah-checkpoint/tests/b06.rs"
      - ".github/workflows/b06-session-vault-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PTAH_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PTAH_PR_BASE: ${{ github.event.pull_request.base.sha }}
  PTAH_B06_BASE_SHA: 0325b67884cc60971e005dee90ea82ed944906c4
  CARGO_TERM_COLOR: always

jobs:
  b06-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact B06 candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PTAH_EXACT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Lock accepted B05 base and B06 scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PTAH_EXACT_SHA"
          test -z "$(git status --porcelain)"
          if [ -n "${PTAH_PR_BASE:-}" ]; then
            test "$PTAH_PR_BASE" = "$PTAH_B06_BASE_SHA"
          fi
          test "$(git merge-base "$PTAH_B06_BASE_SHA" "$PTAH_EXACT_SHA")" = "$PTAH_B06_BASE_SHA"
          python3 - <<'PY'
          import os
          import subprocess

          base = os.environ["PTAH_B06_BASE_SHA"]
          head = os.environ["PTAH_EXACT_SHA"]
          files = subprocess.check_output(
              ["git", "diff", "--name-only", base, head], text=True
          ).splitlines()
          allowed = {
              "B06_SESSION_VAULT_V1.md",
              "crates/ptah-checkpoint/Cargo.toml",
              "crates/ptah-checkpoint/src/b06_lib.rs",
              "crates/ptah-checkpoint/src/b06.rs",
              "crates/ptah-checkpoint/tests/b06.rs",
              ".github/workflows/b06-session-vault-v1.yml",
          }
          unexpected = sorted(set(files).difference(allowed))
          missing = sorted(allowed.difference(files))
          assert not unexpected, f"B06 scope drift: {unexpected}"
          assert not missing, f"B06 required surface missing: {missing}"
          PY
          git diff --check "$PTAH_B06_BASE_SHA" "$PTAH_EXACT_SHA"

      - name: Install pinned Rust 1.97.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b06
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
          rustc -Vv | tee /tmp/b06/rustc-version.txt
          cargo -V | tee /tmp/b06/cargo-version.txt
          rustc -V | grep -q '^rustc 1.97.1 '
          cargo -V | grep -q '^cargo 1.97.1 '
          printf '%s\n' "$PTAH_EXACT_SHA" > /tmp/b06/exact-head.txt
          cat /etc/os-release > /tmp/b06/host-os-release.txt

      - name: Prove formatting and B06 acceptance
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p ptah-checkpoint --test b06 --locked -- --nocapture \
            2>&1 | tee /tmp/b06/b06-tests.txt
          grep -Eq 'test result: ok\. 12 passed; 0 failed;' /tmp/b06/b06-tests.txt

      - name: Prove B06 surface with strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p ptah-checkpoint --lib --test b06 --locked -- -D warnings \
            2>&1 | tee /tmp/b06/b06-clippy.txt

      - name: Re-prove inherited A13 recovery semantics
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ptah-checkpoint --test a13 --locked -- --nocapture \
            2>&1 | tee /tmp/b06/a13-tests.txt

      - name: Re-prove inherited B01 transfer and storage semantics
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ptah-transfer --test b01 --locked -- --nocapture \
            2>&1 | tee /tmp/b06/b01-tests.txt
          grep -Eq 'test result: ok\. 18 passed; 0 failed;' /tmp/b06/b01-tests.txt
          cargo test -p ptah-transfer --test b01_source_mutation --locked -- --nocapture \
            2>&1 | tee /tmp/b06/b01-source-mutation-tests.txt
          grep -Eq 'test result: ok\. 1 passed; 0 failed;' /tmp/b06/b01-source-mutation-tests.txt

      - name: Re-prove inherited B05 executable and package semantics
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ptah-archive-decomposition --test b05 --locked -- --nocapture \
            2>&1 | tee /tmp/b06/b05-tests.txt
          grep -Eq 'test result: ok\. 15 passed; 0 failed;' /tmp/b06/b05-tests.txt

      - name: Re-prove inherited workspace at exact B06 head
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --locked -- --nocapture \
            2>&1 | tee /tmp/b06/workspace-tests.txt

      - name: Write exact-head proof manifest
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cp B06_SESSION_VAULT_V1.md /tmp/b06/acceptance-contract.md
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('/tmp/b06')
          required = [
              'exact-head.txt',
              'host-os-release.txt',
              'rustc-version.txt',
              'cargo-version.txt',
              'b06-tests.txt',
              'b06-clippy.txt',
              'a13-tests.txt',
              'b01-tests.txt',
              'b01-source-mutation-tests.txt',
              'b05-tests.txt',
              'workspace-tests.txt',
              'acceptance-contract.md',
          ]
          files = {}
          for name in required:
              path = root / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'missing B06 proof report: {name}')
              files[name] = {
                  'size_bytes': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          head = (root / 'exact-head.txt').read_text(encoding='utf-8').strip()
          if head != os.environ['PTAH_EXACT_SHA']:
              raise SystemExit('B06 proof head mismatch')
          manifest = {
              'schema_version': '0.1.0',
              'record_type': 'ptah.b06.session_vault_v1_exact_head_proof',
              'status': 'pass',
              'implementation_commit': head,
              'accepted_base_commit': os.environ['PTAH_B06_BASE_SHA'],
              'workflow_run_id': int(os.environ['RUN_ID']),
              'workflow_run_attempt': int(os.environ['RUN_ATTEMPT']),
              'b06_acceptance_test_count': 12,
              'workspace_versions_portable': True,
              'session_metadata_not_live_authority': True,
              'object_artifact_manifest_proven': True,
              'readable_recovery_export_proven': True,
              'archive_digest_binding_proven': True,
              'import_reverification_required': True,
              'compatible_cross_node_resume_proven': True,
              'missing_capability_fail_closed_proven': True,
              'conflicts_remain_explicit': True,
              'attempt_fence_survives_portability': True,
              'independent_recovery_verification_proven': True,
              'inherited_a13_reproven': True,
              'inherited_b01_reproven': True,
              'inherited_b05_reproven': True,
              'files': files,
          }
          rendered = json.dumps(manifest, indent=2, sort_keys=True) + '\n'
          (root / 'proof-manifest.json').write_text(rendered, encoding='utf-8')
          digest = hashlib.sha256(rendered.encode()).hexdigest()
          (root / 'proof-manifest.sha256').write_text(
              f'{digest}  proof-manifest.json\n', encoding='utf-8'
          )
          print(rendered, end='')
          PY
          cd /tmp/b06
          sha256sum -c proof-manifest.sha256

      - name: Confirm exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PTAH_EXACT_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Retain B06 proof bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: b06-session-vault-v1-${{ env.PTAH_EXACT_SHA }}
          path: /tmp/b06/
          if-no-files-found: error
          retention-days: 90
