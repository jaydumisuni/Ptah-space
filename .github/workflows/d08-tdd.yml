name: D08 TDD

on:
  push:
    branches:
      - d08-application-platform-expansion
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/ptah-application-runtime/**
      - services/ptah-control/**
      - .github/workflows/d08-tdd.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d08-task4-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Preserve pre-Task4 lock
        run: cp Cargo.lock /tmp/Cargo.lock.before
      - name: Check RED assets formatting
        run: cargo fmt --all -- --check
      - name: Prove runtime case 25 is RED for missing remote-display gate
        shell: bash
        run: |
          set -uo pipefail
          cargo test -p ptah-application-runtime --test d08_acceptance > /tmp/runtime-red.log 2>&1
          status=$?
          cat /tmp/runtime-red.log
          test "$status" -ne 0
          grep -q 'require_remote_display' /tmp/runtime-red.log
      - name: Prove D01 cases 26-28 are RED for missing projection API
        shell: bash
        run: |
          set -uo pipefail
          cargo test -p ptah-control --test d08_application_projection > /tmp/shell-red.log 2>&1
          status=$?
          cat /tmp/shell-red.log
          test "$status" -ne 0
          grep -Eq 'ApplicationPlatformSnapshot|project_application_platform_views|applications' /tmp/shell-red.log
      - name: Prove generated Task4 lock delta is exact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          old = tomllib.loads(Path('/tmp/Cargo.lock.before').read_text())
          new = tomllib.loads(Path('Cargo.lock').read_text())
          key = lambda p: (p['name'], p['version'], p.get('source'))
          before = {key(p): p for p in old['package']}
          after = {key(p): p for p in new['package']}
          assert set(before) == set(after), (set(after)-set(before), set(before)-set(after))
          changed = sorted(k for k in before if before[k] != after[k])
          expected = [('ptah-control', '0.0.0-phase0c', None)]
          assert changed == expected, changed
          old_deps = set(before[expected[0]].get('dependencies', []))
          new_deps = set(after[expected[0]].get('dependencies', []))
          assert new_deps - old_deps == {'ptah-application-runtime'}, new_deps-old_deps
          assert not (old_deps-new_deps), old_deps-new_deps
          PY
