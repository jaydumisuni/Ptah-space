name: TEMP Donor Qt recovered analysis review ATHENA
on:
  push:
    branches: [diagnostics/donor-apprecover-athena-20261015]
    paths: ['.github/workflows/temp-donor-apprecover-athena.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, athena, windows, x64, physical, ptah]
    timeout-minutes: 5
    steps:
      - name: Read completed AndroidUtility extraction analysis
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='D:\projects\Donor Fetcher\.workspace\athena-harvest\run-20261014-040129\app-recover-qt-full-20261014'
          Write-Output '=== RECOVERY REVIEW ==='
          Get-Content -LiteralPath (Join-Path $root 'analysis\RECOVERY_REVIEW.md') -TotalCount 100
          foreach($file in @('analysis\native-qt-recovery-review.json','analysis\qt-control-backend-join.json','08_rebuild_workspace\app_blueprint.json')){
            Write-Output ('=== FILE '+$file+' ===')
            $j=Get-Content -LiteralPath (Join-Path $root $file) -Raw|ConvertFrom-Json
            $j.PSObject.Properties | ForEach-Object{
              $val=$_.Value
              $type=if($val -is [array]){'array('+@($val).Count+')'}elseif($val -is [pscustomobject]){'object('+@($val.PSObject.Properties).Count+')'}else{$val.GetType().Name}
              Write-Output ($_.Name+'='+$type)
            }
            if($file -match 'recovery-review'){ $j|Select-Object * -ExcludeProperty raw_strings,ui_labels,urls | ConvertTo-Json -Depth 4 | Select-Object -First 140 }
          }
          Write-Output '=== EXPORTED ACTIONS ==='
          Get-Content -LiteralPath (Join-Path $root '14_native_exports\action_candidates.txt') -TotalCount 38
          Write-Output '=== RESOURCE AND QT SOURCE CLAIMS ==='
          Get-Content -LiteralPath (Join-Path $root '12_rebuild_artifacts\qt_project_files\QT_RECOVERY_NOTES.txt')
          Get-Content -LiteralPath (Join-Path $root '01_extracted_payload\DIRECT_EXE_NO_PAYLOAD.txt')
