name: Temporary Redmi sky ROM source throughput probe on KRATOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-oracle-relay-recovery-kratos.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 8
    steps:
      - name: Probe downloader availability and official Xiaomi source throughput
        shell: bash
        run: |
          set -euo pipefail
          name='sky_global_images_OS2.0.9.0.VMWMIXM_20250530.0000.00_15.0_global_3334591f85.tgz'
          rel="OS2.0.9.0.VMWMIXM/$name"
          start=142606336
          end=$((start + 4*1024*1024 - 1))

          echo '=== DOWNLOADERS ==='
          for x in curl wget aria2c axel; do
            printf '%s=' "$x"
            command -v "$x" || true
          done

          echo '=== SOURCE URL DISCOVERY ==='
          for page in \
            'https://xmfirmwareupdater.com/hyperos/sky/stable/OS2.0.9.0.VMWMIXM/' \
            'https://mifirm.net/download/17503'; do
            echo "page=$page"
            curl -fLsS --connect-timeout 15 --max-time 45 "$page" 2>/dev/null \
              | grep -Eo 'https?[^"<> ]+' \
              | sed 's/&amp;/\&/g' \
              | grep -F "$name" \
              | head -n 20 || true
          done

          echo '=== 4 MiB RANGE BENCHMARK ==='
          candidates=(
            "https://bigota.d.miui.com/$rel"
            "https://cdnorg.d.miui.com/$rel"
            "https://hugeota.d.miui.com/$rel"
          )
          for url in "${candidates[@]}"; do
            echo "candidate=$url"
            curl -LsS --fail --connect-timeout 15 --max-time 75 \
              -r "$start-$end" -o /dev/null \
              -w 'http_code=%{http_code} size_download=%{size_download} speed_download=%{speed_download} time_total=%{time_total}\n' \
              "$url" || echo 'probe=FAIL'
          done
