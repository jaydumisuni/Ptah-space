name: TEMP ATHENA Redmi Global ROM IDM stall diagnosis

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-oracle-mcp-production-deploy-v2.yml"

permissions:
  contents: read

jobs:
  diagnose-idm:
    runs-on: [self-hosted, athena, windows, x64, physical, ptah]
    timeout-minutes: 6
    steps:
      - name: Inspect IDM process, download log, and source reachability read-only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $fileName = 'sky_global_images_OS2.0.9.0.VMWMIXM_20250530.0000.00_15.0_global_3334591f85.tgz'
          $url = "https://cdnorg.d.miui.com/OS2.0.9.0.VMWMIXM/$fileName"
          $root = Join-Path $env:APPDATA 'IDM\DwnlData'

          Write-Output '=== RUNNER IDENTITY ==='
          [ordered]@{user=[Environment]::UserName;session=[System.Diagnostics.Process]::GetCurrentProcess().SessionId;appData=$env:APPDATA} | ConvertTo-Json -Compress

          Write-Output '=== IDM PROCESS ==='
          $procs = @(Get-CimInstance Win32_Process -Filter "Name='IDMan.exe'" -ErrorAction SilentlyContinue)
          foreach ($p in $procs) {
            $owner = Invoke-CimMethod -InputObject $p -MethodName GetOwner -ErrorAction SilentlyContinue
            [ordered]@{pid=[int]$p.ProcessId;parentPid=[int]$p.ParentProcessId;sessionId=[int]$p.SessionId;owner=if($owner){"$($owner.Domain)\$($owner.User)"}else{$null};commandLine=$p.CommandLine;executable=$p.ExecutablePath} | ConvertTo-Json -Compress
          }

          Write-Output '=== SKY DOWNLOAD FOLDERS ==='
          $folders = @()
          if (Test-Path -LiteralPath $root) {
            $folders = @(Get-ChildItem -LiteralPath $root -Directory -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'sky_global_images_OS*' } | Sort-Object LastWriteTimeUtc -Descending)
          }
          foreach ($folder in ($folders | Select-Object -First 5)) {
            $files = @(Get-ChildItem -LiteralPath $folder.FullName -File -ErrorAction SilentlyContinue | Sort-Object Name)
            $bytes = [int64](($files | Measure-Object Length -Sum).Sum)
            [ordered]@{folder=$folder.FullName;lastWrite=$folder.LastWriteTimeUtc.ToString('o');bytes=$bytes;fileCount=$files.Count} | ConvertTo-Json -Compress
            $files | Select-Object Name,Length,LastWriteTimeUtc | ConvertTo-Json -Compress
            $log = $files | Where-Object { $_.Extension -eq '.log' } | Select-Object -First 1
            if ($log) {
              Write-Output "--- LOG $($log.FullName) ---"
              try {
                Get-Content -LiteralPath $log.FullName -Raw -ErrorAction Stop | Write-Output
              } catch {
                Write-Output "LOG_READ_ERROR=$($_.Exception.Message)"
              }
            }
          }

          Write-Output '=== IDM TCP CONNECTIONS ==='
          $pids = @($procs | ForEach-Object { [int]$_.ProcessId })
          if ($pids.Count -gt 0) {
            Get-NetTCPConnection -State Established -ErrorAction SilentlyContinue |
              Where-Object { $pids -contains [int]$_.OwningProcess } |
              Select-Object LocalAddress,LocalPort,RemoteAddress,RemotePort,OwningProcess |
              ConvertTo-Json -Compress
          }

          Write-Output '=== CDN RANGE PROBE ==='
          $tmp = Join-Path $env:TEMP ([guid]::NewGuid().ToString() + '.bin')
          try {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            & curl.exe -L --fail --silent --show-error --connect-timeout 15 --max-time 45 --range '0-1048575' --output $tmp $url
            $code = $LASTEXITCODE
            $sw.Stop()
            [ordered]@{exitCode=$code;bytes=if(Test-Path $tmp){[int64](Get-Item $tmp).Length}else{0};seconds=[math]::Round($sw.Elapsed.TotalSeconds,3)} | ConvertTo-Json -Compress
          } finally {
            Remove-Item -LiteralPath $tmp -Force -ErrorAction SilentlyContinue
          }
