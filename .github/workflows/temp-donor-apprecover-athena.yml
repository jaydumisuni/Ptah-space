name: TEMP Donor App Recover exact join evidence ATHENA
on:
  push:
    branches: [diagnostics/donor-apprecover-athena-20261015]
    paths: ['.github/workflows/temp-donor-apprecover-athena.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, athena, windows, x64, physical, ptah]
    timeout-minutes: 5
    steps:
      - name: Inspect exact control and backend corroboration
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'ATHENA'){throw 'WRONG_HOST'}
          $root='D:\projects\Donor Fetcher\.workspace\athena-harvest\run-20261014-040129\app-recover-qt-full-20261014\analysis'
          $join=Get-Content (Join-Path $root 'qt-control-backend-join.json') -Raw | ConvertFrom-Json
          $review=Get-Content (Join-Path $root 'native-qt-recovery-review.json') -Raw | ConvertFrom-Json
          [pscustomobject]@{
            schema=$join.schema; sourceControlRecords=$join.source_control_records
            controlsWithStaticUIXref=$join.controls_with_static_ui_xref
            controlsWithBackendRouteRecord=$join.controls_with_backend_route_record
            controlsWithBoth=$join.controls_with_both; statusCounts=$join.status_counts
            totalRecords=@($join.records).Count; unmatchedBackendKeys=@($join.unmatched_backend_action_keys).Count
            sourcePeSha=$review.recovery_input.sha256
            inputMatch=$review.recovery_input.matches_existing_donor_manifest
          } | ConvertTo-Json -Depth 4 -Compress
          Write-Output '=== JOIN RECORD KEYS AND FIRST 3 EXAMPLES ==='
          @($join.records | Select-Object -First 3) | ConvertTo-Json -Depth 5
          Write-Output '=== ACTION CANDIDATE FAMILIES ==='
          Get-Content -LiteralPath 'D:\projects\Donor Fetcher\.workspace\athena-harvest\run-20261014-040129\app-recover-qt-full-20261014\14_native_exports\action_candidates.txt' -TotalCount 20
