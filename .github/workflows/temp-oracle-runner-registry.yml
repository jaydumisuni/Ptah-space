name: Temporary Oracle Runner Registry Probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-oracle-runner-registry.yml"

permissions:
  contents: read

jobs:
  probe-kratos:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 2
    steps:
      - name: Read Oracle and Ptah runner registries
        shell: bash
        run: |
          set -euo pipefail
          echo '--- Oracle runners ---'
          gh api repos/jaydumisuni/Oracle-/actions/runners --jq '{total_count, runners: [.runners[] | {id,name,os,status,busy,version,labels:[.labels[].name]}]}'
          echo '--- Ptah runners ---'
          gh api repos/jaydumisuni/Ptah-space/actions/runners --jq '{total_count, runners: [.runners[] | {id,name,os,status,busy,version,labels:[.labels[].name]}]}'

  probe-athena:
    runs-on: [self-hosted, athena, ptah]
    timeout-minutes: 2
    steps:
      - name: Prove execution is physically on ATHENA
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $health=$null
          try { $health=Invoke-RestMethod -Uri 'http://127.0.0.1:5059/health' -TimeoutSec 2 } catch { $health=[pscustomobject]@{error=$_.Exception.Message} }
          [ordered]@{
            Host=$env:COMPUTERNAME
            User=[Environment]::UserName
            Now=(Get-Date).ToUniversalTime().ToString('o')
            IPv4=@(Get-NetIPAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue | Where-Object {$_.IPAddress -notlike '127.*'} | Select-Object InterfaceAlias,IPAddress,PrefixLength)
            OracleHealth=$health
          } | ConvertTo-Json -Depth 6
