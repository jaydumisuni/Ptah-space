name: A03 one-shot Cargo lock refresh

on:
  pull_request:
    paths:
      - "crates/ptah-ledger/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/a03-lock-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out A03 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Regenerate lock from frozen manifests
        run: cargo generate-lockfile

      - name: Commit lock only when changed
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "A03: refresh Cargo lock for ptah-ledger"
          git push origin "HEAD:${HEAD_REF}"
