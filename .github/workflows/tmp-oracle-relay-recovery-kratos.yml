# activate: diagnose Global cust.raw read-only loop/mount 2026-08-27
name: Temporary diagnose Redmi Global cust image on KRATOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-oracle-relay-recovery-kratos.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 15
    steps:
      - name: Diagnose raw cust filesystem and read-only loop mount
        shell: bash
        run: |
          set -u
          work='/home/kratos/Desktop/redmi-global-analysis/OS2.0.9.0.VMWMIXM'
          raw="$work/cust.raw.img"
          sparse="$work/cust.img"
          loop=''

          cleanup() {
            set +e
            if [[ -n "${loop:-}" && -b "$loop" ]]; then
              echo '=== CLEANUP ==='
              udisksctl unmount -b "$loop" 2>&1 || true
              udisksctl loop-delete -b "$loop" 2>&1 || true
            fi
          }
          trap cleanup EXIT

          echo '=== INPUTS ==='
          ls -lh "$sparse" "$raw" 2>&1 || true
          stat --printf='raw_size=%s raw_blocks512=%b mode=%A owner=%U:%G\n' "$raw" 2>&1 || true
          file "$sparse" "$raw" 2>&1 || true
          printf 'raw_magic64='
          od -An -tx1 -N64 "$raw" 2>/dev/null | tr -d ' \n' || true
          echo

          echo '=== FILESYSTEM SIGNATURE PROBES ==='
          command -v blkid || true
          command -v losetup || true
          command -v udisksctl || true
          blkid -p "$raw" 2>&1 || true
          file -s "$raw" 2>&1 || true

          echo '=== EXISTING LOOP REFERENCES ==='
          if command -v losetup >/dev/null 2>&1; then
            losetup -j "$raw" 2>&1 || true
          fi
          for p in /sys/block/loop*/loop/backing_file; do
            [[ -r "$p" ]] || continue
            printf '%s=' "$p"
            cat "$p" 2>/dev/null || true
          done

          echo '=== UDISKS LOOP SETUP READ ONLY ==='
          set +e
          setup_out="$(udisksctl loop-setup -r -f "$raw" 2>&1)"
          setup_rc=$?
          set -e
          printf 'loop_setup_rc=%s\n%s\n' "$setup_rc" "$setup_out"

          echo '=== LOOP INVENTORY AFTER SETUP ==='
          lsblk -o NAME,PATH,TYPE,FSTYPE,FSVER,SIZE,RO,LABEL,MOUNTPOINTS 2>&1 || true
          if command -v losetup >/dev/null 2>&1; then
            losetup -a 2>&1 | tail -n 100 || true
            loop="$(losetup -j "$raw" 2>/dev/null | sed -n '1s/:.*//p')"
          fi
          if [[ -z "$loop" ]]; then
            loop="$(find /sys/block -maxdepth 3 -path '/sys/block/loop*/loop/backing_file' -type f -readable -print0 2>/dev/null | while IFS= read -r -d '' p; do b="$(cat "$p" 2>/dev/null || true)"; [[ "$b" == "$raw" ]] && { basename "$(dirname "$(dirname "$p")")"; break; }; done)"
            [[ -n "$loop" && "$loop" != /dev/* ]] && loop="/dev/$loop"
          fi
          printf 'resolved_loop=%s\n' "$loop"

          if [[ -z "$loop" || ! -b "$loop" ]]; then
            echo 'DIAG_RESULT=LOOP_SETUP_FAILED_OR_UNRESOLVED'
            exit 0
          fi

          echo '=== LOOP FILESYSTEM PROBES ==='
          file -s "$loop" 2>&1 || true
          blkid -p "$loop" 2>&1 || true
          cat "/sys/class/block/$(basename "$loop")/ro" 2>/dev/null | sed 's/^/kernel_ro=/' || true

          echo '=== UDISKS MOUNT READ ONLY ==='
          set +e
          mount_out="$(udisksctl mount -b "$loop" -o ro 2>&1)"
          mount_rc=$?
          set -e
          printf 'mount_rc=%s\n%s\n' "$mount_rc" "$mount_out"
          sleep 1
          mnt="$(lsblk -rno MOUNTPOINTS "$loop" 2>/dev/null | awk 'NF {print; exit}')"
          printf 'resolved_mountpoint=%s\n' "$mnt"
          if [[ -n "$mnt" && -d "$mnt" ]]; then
            findmnt -T "$mnt" 2>&1 || true
            echo '=== READ-ONLY TOP LEVEL ==='
            find "$mnt" -maxdepth 2 -printf '%y\t%p\n' 2>/dev/null | sort | head -n 300 || true
            echo 'DIAG_RESULT=MOUNTED_READ_ONLY'
          else
            echo '=== KERNEL FILESYSTEM SUPPORT ==='
            cat /proc/filesystems 2>/dev/null || true
            echo 'DIAG_RESULT=MOUNT_FAILED'
          fi
