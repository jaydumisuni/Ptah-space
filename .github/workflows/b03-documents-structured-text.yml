name: B03 one-use final rustfmt correction

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/b03-documents-structured-text.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  format:
    if: github.event.pull_request.head.ref == 'b03-documents-structured-text' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out writable B03 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: b03-documents-structured-text
          fetch-depth: 0
      - name: Canonicalize final B03 Review fixes
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          cargo fmt --all
          git diff --check
      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'B03 Review fixes already canonical'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ptah-archive-decomposition/src/b03.rs crates/ptah-archive-decomposition/tests/b03.rs crates/ptah-archive-decomposition/tests/b03_review.rs
          git diff --cached --check
          git commit -m "B03 review: canonicalize final Review fixes"
          git push origin HEAD:b03-documents-structured-text
