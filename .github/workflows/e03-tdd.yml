name: E03 TDD

on:
  push:
    branches: [e03-node-to-node-object-artifact-transfer]
    paths:
      - ".github/workflows/e03-tdd.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/ptah-transfer/Cargo.toml"
      - "crates/ptah-transfer/src/lib.rs"
      - "crates/ptah-transfer/src/e03/**"
      - "crates/ptah-transfer/tests/e03_*.rs"
      - "crates/ptah-node-transfer/**"
      - "services/ptah-control/Cargo.toml"
      - "services/ptah-control/src/e01_lib.rs"
      - "services/ptah-control/src/transfer.rs"
      - "services/ptah-control/tests/e03_*.rs"
      - "services/ptah-node/src/transfer.rs"
      - "services/ptah-node/tests/e03_*.rs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e03-tdd:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Pin Rust 1.97.1
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.97.1
          rustc -V | grep -q '^rustc 1.97.1 '
          cargo -V | grep -q '^cargo 1.97.1 '

      - name: Recover remaining committed E03 plan
        shell: bash
        run: sed -n '250,760p' docs/superpowers/plans/2026-09-06-e03-node-to-node-object-artifact-transfer.md

      - name: Generate and persist Task 3 workspace lock
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "chore(e03): refresh workspace lock for transfer authority"
            git push origin HEAD:e03-node-to-node-object-artifact-transfer
          fi

      - name: Task 1 authority contract
        shell: bash
        run: cargo test -p ptah-transfer --test e03_authority --locked

      - name: Task 1 cache and resume contract
        shell: bash
        run: cargo test -p ptah-transfer --test e03_cache_resume --locked

      - name: Task 1 inherited B01 regressions
        shell: bash
        run: cargo test -p ptah-transfer --test b01 --test b01_source_mutation --locked

      - name: Task 2 protocol contract
        shell: bash
        run: cargo test -p ptah-node-transfer --test protocol --locked

      - name: Task 2 framing contract
        shell: bash
        run: cargo test -p ptah-node-transfer --test framing --locked

      - name: Task 2 inherited E01 node-link regression
        shell: bash
        run: cargo test -p ptah-node-link --locked

      - name: Task 3 control transfer authority
        shell: bash
        run: cargo test -p ptah-control --test e03_transfer_authority --locked
