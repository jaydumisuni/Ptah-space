name: Temporary Redmi sky Global ROM exact-path preflight on KRATOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-oracle-relay-recovery-kratos.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 20
    steps:
      - name: Verify and inspect exact ROM path without extraction
        shell: bash
        run: |
          set -euo pipefail
          target='/home/kratos/Desktop/redmi r12'
          expected_md5='3334591f858477053b68f4c0e47debf0'

          echo '=== TARGET ==='
          test -d "$target"
          printf 'path=%s\n' "$target"

          echo '=== FILE INVENTORY ==='
          find "$target" -maxdepth 2 -type f -printf '%s\t%TY-%Tm-%TdT%TH:%TM:%TS\t%p\n' | sort -nr | head -n 120

          mapfile -t archives < <(find "$target" -maxdepth 2 -type f \( -iname '*.tgz' -o -iname '*.tar.gz' \) -print | sort)
          if ((${#archives[@]} == 0)); then
            echo 'NO_TGZ_FOUND'
            exit 2
          fi

          archive="${archives[0]}"
          if ((${#archives[@]} > 1)); then
            while IFS= read -r candidate; do
              if [[ "$(basename "$candidate")" == sky_global_images_* ]]; then archive="$candidate"; break; fi
            done < <(printf '%s\n' "${archives[@]}")
          fi

          echo '=== SELECTED ARCHIVE ==='
          printf 'archive=%s\n' "$archive"
          file -b "$archive"
          stat --printf='size_bytes=%s\nmtime=%y\n' "$archive"

          actual_md5="$(md5sum "$archive" | awk '{print $1}')"
          actual_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          printf 'md5=%s\n' "$actual_md5"
          printf 'expected_md5=%s\n' "$expected_md5"
          printf 'md5_matches_expected=%s\n' "$([[ "${actual_md5,,}" == "${expected_md5,,}" ]] && echo true || echo false)"
          printf 'sha256=%s\n' "$actual_sha256"

          echo '=== ARCHIVE MEMBER TABLE (HEAD) ==='
          set +o pipefail
          tar -tzf "$archive" | head -n 320
          rc=${PIPESTATUS[0]}
          set -o pipefail
          if [[ $rc -ne 0 && $rc -ne 141 ]]; then
            echo "tar_list_rc=$rc"
            exit "$rc"
          fi

          if [[ "${actual_md5,,}" != "${expected_md5,,}" ]]; then
            echo 'ROM_MD5_MISMATCH'
            exit 3
          fi
