name: A03 physical-proof executables

on:
  pull_request:
    paths:
      - "crates/ptah-ledger/**"
      - "crates/ptah-identifiers/**"
      - "crates/ptah-contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "dependencies/**"
      - ".github/workflows/a03-kratos-executable-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PTAH_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CARGO_TERM_COLOR: always

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact A03 head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PTAH_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact clean committed head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PTAH_EXACT_SHA"
          test -z "$(git status --porcelain)"

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustc -Vv

      - name: Build exact locked A03 test executables
        run: |
          set -euo pipefail
          mkdir -p evidence/a03-physical-build/kratos-bin
          cargo test -p ptah-ledger --locked --no-run --message-format=json \
            > evidence/a03-physical-build/cargo-test-artifacts.jsonl
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path

          root = Path('evidence/a03-physical-build')
          output = root / 'kratos-bin'
          selected = {}
          for line in (root / 'cargo-test-artifacts.jsonl').read_text().splitlines():
              try:
                  item = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if item.get('reason') != 'compiler-artifact':
                  continue
              executable = item.get('executable')
              target = item.get('target') or {}
              name = target.get('name')
              profile = item.get('profile') or {}
              if not executable or not profile.get('test') or name not in {'ptah_ledger', 'crash_recovery'}:
                  continue
              if name in selected:
                  raise SystemExit(f'duplicate test executable for {name}: {selected[name]} and {executable}')
              source = Path(executable)
              if not source.is_file():
                  raise SystemExit(f'missing built executable: {source}')
              destination = output / name
              shutil.copy2(source, destination)
              destination.chmod(0o755)
              selected[name] = str(destination)

          expected = {'ptah_ledger', 'crash_recovery'}
          if set(selected) != expected:
              raise SystemExit(f'expected {sorted(expected)} executables, found {sorted(selected)}')

          binaries = {}
          for name in sorted(selected):
              path = Path(selected[name])
              binaries[name] = {
                  'file': path.name,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'size_bytes': path.stat().st_size,
              }

          manifest = {
              'record_type': 'ptah.a03.physical_test_executables',
              'tested_head': os.environ['PTAH_EXACT_SHA'],
              'target_triple': 'x86_64-unknown-linux-gnu',
              'runner_os': 'ubuntu-24.04',
              'rust_toolchain': '1.97.1',
              'cargo_locked': True,
              'binaries': binaries,
              'prime_native_integration_qualified': False,
              'production_authorized': False,
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Execute packaged bytes before retention
        run: |
          set -euo pipefail
          evidence/a03-physical-build/kratos-bin/ptah_ledger --nocapture
          evidence/a03-physical-build/kratos-bin/crash_recovery --nocapture

      - name: Confirm packaging did not mutate tracked repository bytes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PTAH_EXACT_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Retain checksum-bound physical-proof executables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: a03-physical-executables-${{ env.PTAH_EXACT_SHA }}-${{ github.run_attempt }}
          path: evidence/a03-physical-build/
          if-no-files-found: error
          retention-days: 30
