name: Temporary Oracle Release Identity Exact-Head Proof

on:
  push:
    branches:
      - proof/oracle-pr196-exact-head-20260825
    paths:
      - .github/workflows/temp-oracle-pr196-exact-head.yml

permissions:
  contents: read

jobs:
  exact-head-proof:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 15
    steps:
      - name: Prove exact Oracle candidate
        shell: bash
        env:
          TARGET_REPO: jaydumisuni/Oracle-
          TARGET_SHA: 7df1c72f62c202cc8420fbba61db86da659c17d5
          BASE_SHA: ba386b7d99e7619425787958bddf2d05fda5ecc5
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          gh auth status --hostname github.com >/dev/null
          gh repo clone "$TARGET_REPO" "$tmp/oracle"
          cd "$tmp/oracle"
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

          changed="$(git diff --name-only "$BASE_SHA" "$TARGET_SHA" | sort)"
          expected=$'src/index.ts\ntests/oracle-account-release-contract.test.ts'
          test "$changed" = "$expected"
          git diff --check "$BASE_SHA" "$TARGET_SHA"

          grep -Fq 'const VERSION = "1.0.0-rc.16";' src/index.ts
          grep -Fq 'const DEPLOYMENT_REVISION = "oracle-account-portal-20260819";' src/index.ts

          npm ci --no-audit --no-fund
          npx vitest run tests/oracle-account-release-contract.test.ts tests/mcp-oauth.test.ts tests/mcp.test.ts
          npm run check

          echo "ORACLE_RELEASE_IDENTITY_EXACT_HEAD_PROOF=PASS SHA=$TARGET_SHA"
