name: A02 exact-head runtime proof

on:
  pull_request:
    paths:
      - "crates/ptah-identifiers/**"
      - "crates/ptah-node-agent/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "dependencies/**"
      - ".github/workflows/a02-lock-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PTAH_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CARGO_TERM_COLOR: always

jobs:
  prove-a02:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact A02 head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PTAH_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact clean committed head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PTAH_EXACT_SHA"
          test -z "$(git status --porcelain)"
          test ! -e .github/workflows/a02-promote-candidate.yml

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Verify committed dependency universe
        run: |
          mkdir -p evidence/a02-exact-head
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          text=Path('Cargo.lock').read_text()
          packages=[]
          for block in text.split('[[package]]')[1:]:
              block='\n'+block
              name=re.search(r'\nname = "([^"]+)"', block)
              version=re.search(r'\nversion = "([^"]+)"', block)
              source=re.search(r'\nsource = "([^"]+)"', block)
              checksum=re.search(r'\nchecksum = "([^"]+)"', block)
              if name and version and source:
                  packages.append({'name':name.group(1),'version':version.group(1),'source':source.group(1),'checksum':checksum.group(1) if checksum else None})
          packages=sorted(packages,key=lambda x:(x['name'],x['version'],x['source']))
          assert len(packages)==81, len(packages)
          assert not any(p['source'].startswith('git+') for p in packages)
          selected=json.loads(Path('dependencies/rust-direct-lock.json').read_text())['direct_dependencies']
          resolved={(p['name'],p['version']):p for p in packages}
          for item in selected:
              key=(item['name'],item['version'])
              assert key in resolved, key
              assert resolved[key]['source']==item['source'], key
              assert resolved[key]['checksum']==item['checksum'], key
          report={
              'record_type':'ptah.a02.dependency_universe',
              'external_dependency_count':len(packages),
              'git_dependency_count':0,
              'selected_direct_dependency_count':len(selected),
              'cargo_lock_sha256':hashlib.sha256(Path('Cargo.lock').read_bytes()).hexdigest(),
              'historical_selection_record_preserved':True,
          }
          Path('evidence/a02-exact-head/dependencies.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY

      - name: Verify A02 ownership boundary
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          identifiers=tomllib.loads(Path('crates/ptah-identifiers/Cargo.toml').read_text())
          node=tomllib.loads(Path('crates/ptah-node-agent/Cargo.toml').read_text())
          assert set(identifiers.get('dependencies',{})) == {'serde','thiserror','uuid'}
          assert set(identifiers.get('dev-dependencies',{})) == {'serde_json'}
          assert set(node.get('dependencies',{})) == {'ptah-contracts','ptah-identifiers','serde','serde_json','thiserror'}
          source=Path('crates/ptah-node-agent/src/lib.rs').read_text()
          for forbidden in ['rusqlite', 'ptah_ledger', 'std::fs::', 'tokio::process']:
              assert forbidden not in source, forbidden
          for required in ['PTAH_STALE_NODE_GENERATION', 'automatic_upgrade_authorized: false', 'self_approved: false']:
              assert required in source, required
          PY

      - name: Prove format lint and runtime semantics
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy -p ptah-identifiers -p ptah-node-agent --all-features --locked -- -D warnings 2>&1 | tee evidence/a02-exact-head/clippy.txt
          cargo test -p ptah-identifiers -p ptah-node-agent --locked 2>&1 | tee evidence/a02-exact-head/tests.txt

      - name: Bind exact-head evidence
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root=Path('evidence/a02-exact-head')
          deps=json.loads((root/'dependencies.json').read_text())
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          report={
              'record_type':'ptah.a02.exact_head_proof',
              'status':'pass',
              'tested_head':os.environ['PTAH_EXACT_SHA'],
              'checked_out_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'workflow_run_id':os.environ['RUN_ID'],
              'workflow_run_attempt':os.environ['RUN_ATTEMPT'],
              'cargo_lock_sha256':deps['cargo_lock_sha256'],
              'identifiers_sha256':sha('crates/ptah-identifiers/src/lib.rs'),
              'node_agent_sha256':sha('crates/ptah-node-agent/src/lib.rs'),
              'external_dependency_count':deps['external_dependency_count'],
              'git_dependency_count':deps['git_dependency_count'],
              'a03_persistence_implemented':False,
              'a04_activity_execution_implemented':False,
              'prime_native_integration_qualified':False,
              'production_authorized':False,
          }
          assert report['tested_head']==report['checked_out_head']
          (root/'exact-head-evidence.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY

      - name: Confirm proof did not mutate repository
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PTAH_EXACT_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Retain A02 exact-head evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: a02-exact-head-${{ env.PTAH_EXACT_SHA }}-${{ github.run_attempt }}
          path: evidence/a02-exact-head/
          if-no-files-found: error
          retention-days: 30
