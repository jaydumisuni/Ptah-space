name: Formula Ptah WorkCell adapter
on:
  pull_request:
    paths:
      - 'adapters/formula-workcells/**'
      - 'services/ptah-control/**'
      - 'services/ptah-node/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/formula-workcell-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install pinned Ptah Rust components
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup component add --toolchain 1.97.1 rustfmt clippy
      - name: Check formatting
        run: cargo fmt --package ptah-formula-work-cells --package ptah-control --package ptah-node -- --check
      - name: Validate real Formula fixture
        run: cargo test --locked -p ptah-formula-work-cells
      - name: Execute Formula work through actual E01 E02 A05 TLS
        run: cargo test --locked -p ptah-node --test formula_p13_e07
      - name: Control validates Formula before physical dispatch
        run: cargo test --locked -p ptah-control --bin ptah-e07-control-dispatch
      - name: Validate signed candidate readback
        run: cargo test --locked -p ptah-control --lib
      - name: Verify existing E03 TLS and resumed range transfers
        run: cargo test --locked -p ptah-node-transfer --test direct_tls
      - name: Strict readback lint
        run: cargo clippy --locked -p ptah-control --lib -- -D warnings
      - name: Test durable exact Formula candidate source for E03
        run: cargo test --locked -p ptah-node --bin ptah-e07-node-worker
      - name: Strict native candidate source lint
        run: cargo clippy --locked -p ptah-node --bin ptah-e07-node-worker -- -D warnings
      - name: Strict Ptah adapter lint
        run: cargo clippy --locked -p ptah-formula-work-cells --tests -- -D warnings
      - name: Strict Ptah Node and Control integration lint
        run: |
          cargo clippy --locked -p ptah-node --test formula_p13_e07 -- -D warnings
          cargo clippy --locked -p ptah-control --bin ptah-e07-control-dispatch -- -D warnings


  windows-candidate-source:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install pinned Ptah Rust components
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup component add --toolchain 1.97.1 rustfmt clippy
      - name: Qualify Windows candidate crash-safe persistence
        shell: pwsh
        run: |
          cargo test --locked -p ptah-node --bin ptah-e07-node-worker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Strict Windows native candidate source lint
        shell: pwsh
        run: |
          cargo clippy --locked -p ptah-node --bin ptah-e07-node-worker -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
