name: A03 exact-head ledger proof

on:
  pull_request:
    paths:
      - "crates/ptah-ledger/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "dependencies/**"
      - ".github/workflows/a03-exact-head-ledger-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PTAH_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CARGO_TERM_COLOR: always

jobs:
  prove-a03:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact A03 head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PTAH_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact clean committed head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PTAH_EXACT_SHA"
          test -z "$(git status --porcelain)"
          test ! -e .github/workflows/a03-lock-refresh.yml
          test ! -e .github/workflows/a03-one-shot-hardening.yml
          test ! -e .github/workflows/a03-hardening-retry.yml
          test ! -e .github/workflows/a03-restore-frozen-cargo-lock.yml

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Verify A03 ownership and immutable migration boundary
        run: |
          mkdir -p evidence/a03-exact-head
          python - <<'PY'
          import hashlib, json, tomllib
          from pathlib import Path

          root = Path('crates/ptah-ledger')
          manifest = tomllib.loads((root / 'Cargo.toml').read_text())
          dependencies = manifest['dependencies']
          assert set(dependencies) == {
              'ptah-contracts', 'ptah-identifiers', 'rusqlite', 'serde_json', 'sha2', 'thiserror'
          }
          for internal in ('ptah-contracts', 'ptah-identifiers'):
              spec = dependencies[internal]
              assert spec['version'] == '=0.0.0-phase0c', (internal, spec)
              assert spec['path'].startswith('../'), (internal, spec)

          migration_dir = root / 'migrations'
          expected = [
              '0001_ledger_core.down.sql',
              '0001_ledger_core.up.sql',
              '0002_entity_records.down.sql',
              '0002_entity_records.up.sql',
          ]
          actual = sorted(path.name for path in migration_dir.glob('*.sql'))
          assert actual == expected, actual

          source = (root / 'src/lib.rs').read_text()
          for name in expected:
              assert f'include_str!("../migrations/{name}")' in source, name
          for required in [
              'LATEST_LEDGER_SCHEMA_VERSION: u32 = 2',
              'PTAH_STALE_NODE_GENERATION',
              'authority_ref_json',
              'node_generation',
              'TransactionBehavior::Immediate',
              'synchronous = FULL',
              'journal_mode = WAL',
          ]:
              assert required in source, required
          for forbidden in ['ptah_activity_runtime', 'tokio::process', 'std::process::Command']:
              assert forbidden not in source, forbidden

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          report = {
              'record_type': 'ptah.a03.migration_boundary',
              'ledger_source_sha256': sha(root / 'src/lib.rs'),
              'migration_files': {name: sha(migration_dir / name) for name in expected},
              'migration_file_count': len(expected),
              'latest_schema_version': 2,
              'directional_migrations_committed': True,
              'authority_provenance_indexed': True,
              'stale_generation_fail_closed': True,
              'a04_activity_execution_implemented': False,
              'prime_native_integration_qualified': False,
              'production_authorized': False,
          }
          Path('evidence/a03-exact-head/migration-boundary.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Verify frozen dependency universe
        run: |
          set -euo pipefail
          python tools/check_rust_dependency_lock.py | tee evidence/a03-exact-head/dependency-lock.txt
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path

          frozen_universe_sha256 = '06f6b4c9f8f2ad70de76d6d3f79241503414744fdc5b567eb5e5512960dce459'
          text = Path('Cargo.lock').read_text()
          packages = []
          for block in text.split('[[package]]')[1:]:
              block = '\n' + block
              name = re.search(r'\nname = "([^"]+)"', block)
              version = re.search(r'\nversion = "([^"]+)"', block)
              source = re.search(r'\nsource = "([^"]+)"', block)
              checksum = re.search(r'\nchecksum = "([^"]+)"', block)
              if name and version and source:
                  packages.append({
                      'name': name.group(1),
                      'version': version.group(1),
                      'source': source.group(1),
                      'checksum': checksum.group(1) if checksum else None,
                  })
          packages.sort(key=lambda item: (item['name'], item['version'], item['source']))
          assert len(packages) == 81, len(packages)
          assert not any(item['source'].startswith('git+') for item in packages)
          canonical = (json.dumps(packages, sort_keys=True, separators=(',', ':')) + '\n').encode()
          universe_sha256 = hashlib.sha256(canonical).hexdigest()
          assert universe_sha256 == frozen_universe_sha256, universe_sha256

          selected = json.loads(Path('dependencies/rust-direct-lock.json').read_text())['direct_dependencies']
          resolved = {(item['name'], item['version']): item for item in packages}
          for item in selected:
              key = (item['name'], item['version'])
              assert key in resolved, key
              assert resolved[key]['source'] == item['source'], key
              assert resolved[key]['checksum'] == item['checksum'], key
          report = {
              'record_type': 'ptah.a03.dependency_universe',
              'external_dependency_count': len(packages),
              'git_dependency_count': 0,
              'selected_direct_dependency_count': len(selected),
              'external_universe_sha256': universe_sha256,
              'cargo_lock_sha256': hashlib.sha256(Path('Cargo.lock').read_bytes()).hexdigest(),
          }
          Path('evidence/a03-exact-head/dependencies.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Prove formatting lint and ledger semantics
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy -p ptah-ledger --all-targets --locked -- -D warnings 2>&1 | tee evidence/a03-exact-head/clippy.txt
          cargo test -p ptah-ledger --locked 2>&1 | tee evidence/a03-exact-head/ledger-tests.txt
          cargo test -p ptah-identifiers -p ptah-node-agent -p ptah-ledger --locked 2>&1 | tee evidence/a03-exact-head/a02-a03-tests.txt

      - name: Bind exact-head A03 evidence
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path

          evidence = Path('evidence/a03-exact-head')
          migration = json.loads((evidence / 'migration-boundary.json').read_text())
          deps = json.loads((evidence / 'dependencies.json').read_text())
          checked_out = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tested = os.environ['PTAH_EXACT_SHA']
          assert tested == checked_out

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          report = {
              'record_type': 'ptah.a03.exact_head_proof',
              'status': 'pass',
              'tested_head': tested,
              'checked_out_head': checked_out,
              'workflow_run_id': os.environ['RUN_ID'],
              'workflow_run_attempt': os.environ['RUN_ATTEMPT'],
              'ledger_source_sha256': migration['ledger_source_sha256'],
              'migration_files': migration['migration_files'],
              'cargo_lock_sha256': deps['cargo_lock_sha256'],
              'external_dependency_count': deps['external_dependency_count'],
              'git_dependency_count': deps['git_dependency_count'],
              'external_universe_sha256': deps['external_universe_sha256'],
              'ledger_test_log_sha256': sha(evidence / 'ledger-tests.txt'),
              'a02_a03_test_log_sha256': sha(evidence / 'a02-a03-tests.txt'),
              'restart_durability_proved': True,
              'transaction_rollback_proved': True,
              'directional_migration_replay_proved': True,
              'incompatible_version_fail_closed_proved': True,
              'migration_tamper_fail_closed_proved': True,
              'canonical_id_isolation_proved': True,
              'authority_provenance_proved': True,
              'stale_generation_fail_closed_proved': True,
              'a04_activity_execution_implemented': False,
              'prime_native_integration_qualified': False,
              'production_authorized': False,
          }
          (evidence / 'exact-head-evidence.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Confirm proof did not mutate repository
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PTAH_EXACT_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Retain A03 exact-head evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: a03-exact-head-${{ env.PTAH_EXACT_SHA }}-${{ github.run_attempt }}
          path: evidence/a03-exact-head/
          if-no-files-found: error
          retention-days: 30
