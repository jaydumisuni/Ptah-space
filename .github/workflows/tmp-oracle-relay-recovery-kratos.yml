name: Temporary Oracle relay recovery on KRATOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-oracle-relay-recovery-kratos.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Inspect Oracle recovery supervisor and child relay
        shell: bash
        run: |
          set -euo pipefail
          unit=oracle-recovery-relay.service
          systemctl --user daemon-reload
          systemctl --user restart "$unit"
          sleep 8
          active="$(systemctl --user is-active "$unit")"
          test "$active" = active
          state="$(systemctl --user show "$unit" -p ActiveState -p SubState -p Result -p MainPID --no-pager | tr '\n' ';')"
          state_root="${XDG_STATE_HOME:-$HOME/.local/state}/OracleRelay"
          supervisor_status='{}'
          relay_status='{}'
          if test -f "$state_root/recovery-supervisor-status.json"; then supervisor_status="$(cat "$state_root/recovery-supervisor-status.json")"; fi
          if test -f "$state_root/repo/.oracle/relay-status.json"; then relay_status="$(cat "$state_root/repo/.oracle/relay-status.json")"; fi
          journal="$(journalctl --user -u "$unit" -n 40 --no-pager 2>&1 | tail -c 12000)"
          bridge="$(curl -fsS --max-time 10 http://127.0.0.1:8765/health || printf '{}')"
          SUPERVISOR_STATUS="$supervisor_status" RELAY_STATUS="$relay_status" JOURNAL="$journal" BRIDGE="$bridge" STATE="$state" python3 - <<'PY'
          import json,os,socket,datetime
          def j(name):
              try:return json.loads(os.environ.get(name,'{}'))
              except:return {'raw':os.environ.get(name,'')[:12000]}
          out={'schemaVersion':'oracle.recovery.kratos.child.v1','ok':True,'host':socket.gethostname(),'service':os.environ['STATE'],'supervisor':j('SUPERVISOR_STATUS'),'relay':j('RELAY_STATUS'),'browserBridge':j('BRIDGE'),'journal':os.environ.get('JOURNAL','')[-12000:],'completedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          open('oracle-relay-recovery-result.json','w').write(json.dumps(out,indent=2)+'\n')
          PY

      - name: Publish recovery proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add oracle-relay-recovery-result.json
          git commit -m 'recovery: publish KRATOS Oracle relay child state'
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main
          done
          exit 1
