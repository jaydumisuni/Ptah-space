name: D08 TDD

on:
  push:
    branches:
      - d08-application-platform-expansion
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/ptah-application-runtime/**
      - services/ptah-control/**
      - .github/workflows/d08-tdd.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d08-tdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Check D08 formatting
        run: cargo fmt --all -- --check
      - name: Run D08 acceptance target
        run: cargo test -p ptah-application-runtime --test d08_acceptance --locked
      - name: Prove D08 acceptance count
        shell: bash
        run: |
          set -euo pipefail
          count="$(cargo test -p ptah-application-runtime --test d08_acceptance --locked -- --list 2>/dev/null | grep -c ': test$')"
          test "$count" -eq 20
          echo "D08_RUNTIME_CASES=$count"
      - name: Strict D08 Clippy without suppressions
        run: cargo clippy -p ptah-application-runtime --all-targets --locked -- -D warnings -W clippy::pedantic
