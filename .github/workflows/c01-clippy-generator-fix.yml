name: C01 one-shot hardened correction

on:
  push:
    branches:
      - c01-disk-image-partition-foundations
    paths:
      - ".github/workflows/c01-clippy-generator-fix.yml"

permissions:
  contents: write

jobs:
  harden-c01:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: c01-disk-image-partition-foundations
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust review toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
          rustc -V | grep -q '^rustc 1.97.1 '
          cargo -V | grep -q '^cargo 1.97.1 '

      - name: Reuse reviewed correction transform and prove it
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/c01-disk-image-partition-foundations.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n\n          cargo fmt --all\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/c01-reviewed-transform.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/c01-reviewed-transform.py
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('crates/ptah-archive-decomposition/src/c01.rs')
          source = source_path.read_text(encoding='utf-8')
          old = 'if chunk.chunk_bytes % 4 != 0 {'
          new = 'if !chunk.chunk_bytes.is_multiple_of(4) {'
          assert source.count(old) == 1, source.count(old)
          source = source.replace(old, new, 1)

          old = '''    if left.normalized_size != right.normalized_size {
              differences.push(format!(
                  "normalized_size:{}->{}",
                  left.normalized_size, right.normalized_size
              ));
          }
          if left.source_coverage != right.source_coverage {
          '''
          new = '''    if left.normalized_size != right.normalized_size {
              differences.push(format!(
                  "normalized_size:{}->{}",
                  left.normalized_size, right.normalized_size
              ));
          }
          if left.assessment != right.assessment {
              differences.push(format!(
                  "assessment:{:?}->{:?}",
                  left.assessment, right.assessment
              ));
          }
          if left.layout_coverage != right.layout_coverage {
              differences.push("layout_coverage_changed".to_owned());
          }
          if left.source_coverage != right.source_coverage {
          '''
          assert source.count(old) == 1, source.count(old)
          source = source.replace(old, new, 1)
          source_path.write_text(source, encoding='utf-8')

          tests_path = Path('crates/ptah-archive-decomposition/tests/c01.rs')
          tests = tests_path.read_text(encoding='utf-8')
          anchor = '''    assert!(comparison
              .differences
              .iter()
              .any(|difference| difference.contains("partition_slot_changed:1")));
          }
          '''
          replacement = '''    assert!(comparison
              .differences
              .iter()
              .any(|difference| difference.contains("partition_slot_changed:1")));

              let complete_source = gpt_image(40, 49, false);
              let partial_source = gpt_image(40, 49, true);
              let complete_image = normalize_disk_image(&complete_source, DiskImageLimits::default())
                  .expect("complete normalize");
              let partial_image = normalize_disk_image(&partial_source, DiskImageLimits::default())
                  .expect("partial normalize");
              let complete = inspect_partition_map(
                  &complete_image,
                  &context(reference("object.revision")),
                  DiskImageLimits::default(),
              )
              .expect("complete inspect");
              let partial = inspect_partition_map(
                  &partial_image,
                  &context(reference("object.revision")),
                  DiskImageLimits::default(),
              )
              .expect("partial inspect");
              assert_eq!(complete.partitions, partial.partitions);
              let uncertainty = compare_disk_images(&complete, &partial);
              assert!(!uncertainty.identical_layout);
              assert!(uncertainty
                  .differences
                  .iter()
                  .any(|difference| difference.starts_with("assessment:")));
              assert!(uncertainty
                  .differences
                  .iter()
                  .any(|difference| difference == "layout_coverage_changed"));
          }
          '''
          assert tests.count(anchor) == 1, tests.count(anchor)
          tests_path.write_text(tests.replace(anchor, replacement, 1), encoding='utf-8')
          PY
          cargo fmt --all
          cargo test -p ptah-archive-decomposition --test c01 --locked -- --nocapture \
            2>&1 | tee /tmp/c01-hardened-tests.txt
          grep -Eq 'test result: ok\. 20 passed; 0 failed;' /tmp/c01-hardened-tests.txt
          cargo clippy -p ptah-archive-decomposition --lib --test c01 --locked -- -D warnings \
            2>&1 | tee /tmp/c01-hardened-clippy.txt
          git diff --check

      - name: Commit corrected C01 surface and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/c01-clippy-generator-fix.yml
          git add crates/ptah-archive-decomposition/src/lib.rs \
                  crates/ptah-archive-decomposition/src/c01.rs \
                  crates/ptah-archive-decomposition/tests/c01.rs
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/c01-clippy-generator-fix.yml \
            crates/ptah-archive-decomposition/src/c01.rs \
            crates/ptah-archive-decomposition/src/lib.rs \
            crates/ptah-archive-decomposition/tests/c01.rs | sort)"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "C01 review: harden disk partition truth boundaries"
          git push origin HEAD:c01-disk-image-partition-foundations
