name: TEMP Donor App Recover resume inspection ATHENA
on:
  push:
    branches: [diagnostics/donor-apprecover-athena-20261015]
    paths: ['.github/workflows/temp-donor-apprecover-athena.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, athena, windows, x64, physical, ptah]
    timeout-minutes: 6
    steps:
      - name: Inspect prior extraction result receipts without changes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'ATHENA'){throw 'WRONG_HOST'}
          $r='D:\projects\Donor Fetcher\.workspace\athena-harvest\run-20261014-040129'
          foreach($file in @('run_app_recover_full_readonly.py','run_app_recover_native_qt_readonly.py','app-recover-full-20261014.stdout.log','app-recover-qt-full-20261014.stdout.log')){
            $p=Join-Path $r $file
            Write-Output ('===== '+$file+' =====')
            if(Test-Path $p){Get-Content -LiteralPath $p -TotalCount 140 | ForEach-Object {$_ -replace '(?i)(token|password|secret|api.?key)[=: ]+[^ ,;]+','$1=[REDACTED]'}}else{Write-Output 'MISSING'}
          }
          $f=Join-Path $r 'athena-harvest-evidence-freeze.json'
          if(Test-Path $f){
            $j=Get-Content $f -Raw|ConvertFrom-Json
            $d=$j.androidutility_current
            [pscustomobject]@{FrozenDonorPath=$d.path;Size=$d.size;SHA256=$d.sha256;StillExists=(Test-Path -LiteralPath $d.path)}|ConvertTo-Json -Compress
          }
          foreach($base in @("$env:USERPROFILE\Desktop\recovered_apps",'D:\projects\app-recover\.workspace')){
            if(Test-Path $base){
              Get-ChildItem -LiteralPath $base -Directory | Where-Object {$_.Name -match 'android|utility|v200'}|Select-Object FullName,LastWriteTime|Format-Table -AutoSize
            }
          }
