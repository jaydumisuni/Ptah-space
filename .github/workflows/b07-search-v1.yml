name: B07 review correction helper

on:
  pull_request:
    paths:
      - "B07_SEARCH_V1.md"
      - "crates/ptah-archive-decomposition/Cargo.toml"
      - "crates/ptah-archive-decomposition/src/lib.rs"
      - "crates/ptah-archive-decomposition/src/b07.rs"
      - "crates/ptah-archive-decomposition/tests/b07.rs"
      - ".github/workflows/b07-search-v1.yml"

permissions:
  contents: write

env:
  PTAH_EXACT_SHA: ${{ github.event.pull_request.head.sha }}
  CARGO_TERM_COLOR: always

jobs:
  correct-b07-review:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact B07 review head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PTAH_EXACT_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust review toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
          rustc -V | grep -q '^rustc 1.97.1 '

      - name: Apply exact Review corrections and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('crates/ptah-archive-decomposition/src/b07.rs')
          source = source_path.read_text(encoding='utf-8')

          old = '''pub struct SearchField {
              /// Search domain of this field.
              pub domain: SearchDomain,
              /// Optional stable key such as a metadata key, page or symbol class.
              pub key: Option<String>,
              /// Exact searchable value.
              pub value: String,
              /// Evidence/projection source that supplied this field.
              pub evidence_source: String,
          }
          '''
          new = '''pub struct SearchField {
              /// Search domain of this field.
              domain: SearchDomain,
              /// Optional stable key such as a metadata key, page or symbol class.
              key: Option<String>,
              /// Exact searchable value.
              value: String,
              /// Evidence/projection source that supplied this field.
              evidence_source: String,
          }

          impl SearchField {
              /// Return the immutable search domain.
              #[must_use]
              pub fn domain(&self) -> SearchDomain {
                  self.domain
              }

              /// Return the optional immutable field key.
              #[must_use]
              pub fn key(&self) -> Option<&str> {
                  self.key.as_deref()
              }

              /// Return the immutable searchable value.
              #[must_use]
              pub fn value(&self) -> &str {
                  &self.value
              }

              /// Return the immutable evidence/projection source.
              #[must_use]
              pub fn evidence_source(&self) -> &str {
                  &self.evidence_source
              }
          }
          '''
          assert source.count(old) == 1
          source = source.replace(old, new, 1)

          old = '''pub struct SearchDocument {
              /// Exact source binding.
              pub source: SearchSourceBinding,
              /// Logical projection class.
              pub kind: SearchDocumentKind,
              /// Searchable copied fields.
              pub fields: Vec<SearchField>,
          }
          '''
          new = '''pub struct SearchDocument {
              /// Exact source binding.
              source: SearchSourceBinding,
              /// Logical projection class.
              kind: SearchDocumentKind,
              /// Searchable copied fields.
              fields: Vec<SearchField>,
          }

          impl SearchDocument {
              /// Return the immutable exact source binding.
              #[must_use]
              pub fn source(&self) -> &SearchSourceBinding {
                  &self.source
              }

              /// Return the immutable projection class.
              #[must_use]
              pub fn kind(&self) -> SearchDocumentKind {
                  self.kind
              }

              /// Return the immutable validated searchable fields.
              #[must_use]
              pub fn fields(&self) -> &[SearchField] {
                  &self.fields
              }
          }
          '''
          assert source.count(old) == 1
          source = source.replace(old, new, 1)

          old = '    /// Maximum UTF-8 bytes retained in one field value.\n'
          new = '    /// Maximum UTF-8 bytes retained in any field key, value or evidence source.\n'
          assert source.count(old) == 1
          source = source.replace(old, new, 1)

          old = '''    /// A copied field exceeds the configured bound.
              #[error("B07 copied field exceeds max_field_bytes")]
              FieldTooLarge,
          '''
          new = '''    /// A copied field string exceeds the configured bound.
              #[error("B07 copied field string exceeds max_field_bytes")]
              FieldTooLarge,
              /// Search document kind and field domain disagree.
              #[error("B07 search document kind/domain invariant violated")]
              InvalidDocumentDomain,
              /// Anchored document text is missing its exact Object Revision binding.
              #[error("B07 document text requires an exact object.revision binding")]
              MissingObjectRevisionBinding,
          '''
          assert source.count(old) == 1
          source = source.replace(old, new, 1)

          old = '            content_sha256: sha256_bytes(&[]),\n'
          new = '            content_sha256: empty_index_digest(),\n'
          assert source.count(old) == 1
          source = source.replace(old, new, 1)

          old = '''        let mut canonical = documents.to_vec();
                  for document in &mut canonical {
                      validate_document(document, self.limits)?;
                      canonicalize_fields(&mut document.fields);
                  }
          '''
          new = '''        for document in documents {
                      validate_document(document, self.limits)?;
                  }
                  let mut canonical = documents.to_vec();
                  for document in &mut canonical {
                      canonicalize_fields(&mut document.fields);
                  }
          '''
          assert source.count(old) == 1
          source = source.replace(old, new, 1)

          old = '        self.content_sha256 = sha256_bytes(&[]);\n'
          new = '        self.content_sha256 = empty_index_digest();\n'
          assert source.count(old) == 1
          source = source.replace(old, new, 1)

          old = '''            let mut matches = Vec::new();
                      for field in &document.fields {
                          if !domains.is_empty() && !domains.contains(&field.domain) {
                              continue;
                          }
                          let haystack = match &field.key {
                              Some(key) => format!("{key} {}", field.value).to_lowercase(),
                              None => field.value.to_lowercase(),
                          };
                          if terms.iter().all(|term| haystack.contains(term)) {
                              matches.push(SearchMatch {
                                  domain: field.domain,
                                  key: field.key.clone(),
                                  value: field.value.clone(),
                                  evidence_source: field.evidence_source.clone(),
                              });
                          }
                      }
                      if !matches.is_empty() {
          '''
          new = '''            let mut matches = Vec::new();
                      let mut covered_terms = BTreeSet::new();
                      for field in &document.fields {
                          if !domains.is_empty() && !domains.contains(&field.domain) {
                              continue;
                          }
                          let haystack = match &field.key {
                              Some(key) => format!("{key} {}", field.value).to_lowercase(),
                              None => field.value.to_lowercase(),
                          };
                          let mut contributed = false;
                          for term in &terms {
                              if haystack.contains(term.as_str()) {
                                  covered_terms.insert(term.as_str());
                                  contributed = true;
                              }
                          }
                          if contributed {
                              matches.push(SearchMatch {
                                  domain: field.domain,
                                  key: field.key.clone(),
                                  value: field.value.clone(),
                                  evidence_source: field.evidence_source.clone(),
                              });
                          }
                      }
                      if covered_terms.len() == terms.len() && !matches.is_empty() {
          '''
          assert source.count(old) == 1
          source = source.replace(old, new, 1)

          start = source.index('fn validate_document(document: &SearchDocument, limits: SearchLimits)')
          end = source.index('fn validate_binding(source: &SearchSourceBinding)', start)
          replacement = '''fn validate_document(document: &SearchDocument, limits: SearchLimits) -> Result<(), SearchError> {
              validate_binding(&document.source)?;
              validate_document_invariants(document)?;
              if document.fields.is_empty() {
                  return Err(SearchError::InvalidText("document fields"));
              }
              if document.fields.len() > limits.max_fields_per_document {
                  return Err(SearchError::TooManyFields);
              }
              for field in &document.fields {
                  require_bounded_text(&field.value, "field value", limits.max_field_bytes)?;
                  require_bounded_text(
                      &field.evidence_source,
                      "field evidence_source",
                      limits.max_field_bytes,
                  )?;
                  if let Some(key) = &field.key {
                      require_bounded_text(key, "field key", limits.max_field_bytes)?;
                  }
              }
              Ok(())
          }

          fn validate_document_invariants(document: &SearchDocument) -> Result<(), SearchError> {
              let valid_domains = document.fields.iter().all(|field| match document.kind {
                  SearchDocumentKind::ObjectMetadata => {
                      matches!(field.domain, SearchDomain::Filename | SearchDomain::Metadata)
                  }
                  SearchDocumentKind::DocumentText => field.domain == SearchDomain::DocumentText,
                  SearchDocumentKind::SourceSymbols => field.domain == SearchDomain::SourceSymbol,
                  SearchDocumentKind::Log => field.domain == SearchDomain::Log,
                  SearchDocumentKind::Activity => field.domain == SearchDomain::Activity,
                  SearchDocumentKind::Artifact => field.domain == SearchDomain::Artifact,
              });
              if !valid_domains {
                  return Err(SearchError::InvalidDocumentDomain);
              }
              if document.kind == SearchDocumentKind::DocumentText
                  && document.source.object_revision_ref.is_none()
              {
                  return Err(SearchError::MissingObjectRevisionBinding);
              }
              Ok(())
          }

          fn require_bounded_text(
              value: &str,
              field: &'static str,
              max_bytes: usize,
          ) -> Result<(), SearchError> {
              if value.len() > max_bytes {
                  return Err(SearchError::FieldTooLarge);
              }
              require_text(value, field)
          }

          '''
          source = source[:start] + replacement + source[end:]

          old = '''fn sha256_bytes(bytes: &[u8]) -> String {
              let mut hasher = Sha256::new();
              hasher.update(bytes);
              format!("{:x}", hasher.finalize())
          }
          '''
          new = '''fn empty_index_digest() -> String {
              let mut hasher = Sha256::new();
              hash_usize(&mut hasher, 0);
              format!("{:x}", hasher.finalize())
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              fn reference(kind: &str) -> EntityRef {
                  EntityRef::new(kind).expect("valid unit-test reference")
              }

              fn source_binding(object_revision_ref: Option<EntityRef>) -> SearchSourceBinding {
                  SearchSourceBinding {
                      workspace_ref: reference("core.workspace"),
                      source_ref: reference("object.view"),
                      source_record_revision: 1,
                      object_revision_ref,
                  }
              }

              #[test]
              fn forged_kind_domain_combination_fails_generic_boundary() {
                  let document = SearchDocument {
                      source: source_binding(Some(reference("object.revision"))),
                      kind: SearchDocumentKind::DocumentText,
                      fields: vec![SearchField {
                          domain: SearchDomain::Metadata,
                          key: Some("key".to_owned()),
                          value: "value".to_owned(),
                          evidence_source: "forged".to_owned(),
                      }],
                  };
                  assert!(matches!(
                      validate_document(&document, SearchLimits::default()),
                      Err(SearchError::InvalidDocumentDomain)
                  ));
              }

              #[test]
              fn forged_unanchored_document_text_fails_generic_boundary() {
                  let document = SearchDocument {
                      source: source_binding(None),
                      kind: SearchDocumentKind::DocumentText,
                      fields: vec![SearchField {
                          domain: SearchDomain::DocumentText,
                          key: Some("page:1".to_owned()),
                          value: "forged text".to_owned(),
                          evidence_source: "b03.anchored_text".to_owned(),
                      }],
                  };
                  assert!(matches!(
                      validate_document(&document, SearchLimits::default()),
                      Err(SearchError::MissingObjectRevisionBinding)
                  ));
              }
          }
          '''
          assert source.count(old) == 1
          source = source.replace(old, new, 1)
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('crates/ptah-archive-decomposition/tests/b07.rs')
          tests = test_path.read_text(encoding='utf-8')
          old = '''    AnchoredText, SearchDocument, SearchDocumentKind, SearchDomain, SearchError, SearchField,
              SearchIndex, SearchLimits, SearchMetadata, SearchQuery, SearchSourceBinding, SourceAnchor,
          '''
          new = '''    AnchoredText, SearchDomain, SearchError, SearchIndex, SearchLimits, SearchMetadata,
              SearchQuery, SearchSourceBinding, SourceAnchor,
          '''
          assert tests.count(old) == 1
          tests = tests.replace(old, new, 1)

          start = tests.index('#[test]\nfn clear_and_rebuild_do_not_mutate_canonical_inputs_and_digest_is_reproducible()')
          end = tests.index('#[test]\nfn duplicate_exact_document_identity_is_rejected()', start)
          tests = tests[:start] + '''#[test]
          fn clear_and_rebuild_do_not_mutate_canonical_inputs_and_digest_is_reproducible() {
              let workspace = reference("core.workspace");
              let document = log_search_document(
                  binding(&workspace, "core.attempt", 1, None),
                  &["stable canonical source".to_owned()],
              )
              .expect("document");
              let canonical_input = vec![document];
              let before = canonical_input.clone();
              let empty_initial = SearchIndex::new(SearchLimits::default())
                  .expect("empty initial")
                  .snapshot();
              let mut empty_rebuild_index = SearchIndex::new(SearchLimits::default()).expect("empty");
              let empty_rebuild = empty_rebuild_index.rebuild(&[]).expect("empty rebuild");
              let mut index = SearchIndex::new(SearchLimits::default()).expect("index");
              let first = index.rebuild(&canonical_input).expect("first rebuild");
              let cleared = index.clear().expect("clear");
              assert_eq!(cleared.document_count, 0);
              assert_eq!(empty_initial.content_sha256, empty_rebuild.content_sha256);
              assert_eq!(cleared.content_sha256, empty_rebuild.content_sha256);
              let second = index.rebuild(&canonical_input).expect("second rebuild");
              assert_eq!(canonical_input, before);
              assert_eq!(first.content_sha256, second.content_sha256);
              assert!(first.revision < cleared.revision && cleared.revision < second.revision);
          }

          ''' + tests[end:]

          start = tests.index('#[test]\nfn field_document_and_query_resource_bounds_fail_closed()')
          end = tests.index('#[test]\nfn domain_filter_prevents_cross_domain_false_positive()', start)
          tests = tests[:start] + '''#[test]
          fn field_document_and_query_resource_bounds_fail_closed() {
              let workspace = reference("core.workspace");
              let limits = SearchLimits {
                  max_documents: 1,
                  max_fields_per_document: 1,
                  max_field_bytes: 16,
                  max_query_bytes: 4,
                  max_results: 1,
              };
              let mut index = SearchIndex::new(limits).expect("index");
              let source = binding(&workspace, "core.activity", 1, None);
              let too_large = activity_search_document(
                  source.clone(),
                  &["12345678901234567".to_owned()],
              )
              .expect("large document");
              assert!(matches!(
                  index.rebuild(&[too_large]),
                  Err(SearchError::FieldTooLarge)
              ));

              let too_many_fields = activity_search_document(
                  source.clone(),
                  &["one".to_owned(), "two".to_owned()],
              )
              .expect("multi-field document");
              assert!(matches!(
                  index.rebuild(&[too_many_fields]),
                  Err(SearchError::TooManyFields)
              ));

              let oversized_evidence = filename_metadata_document(
                  binding(
                      &workspace,
                      "object.object",
                      2,
                      Some(reference("object.revision")),
                  ),
                  None,
                  &[SearchMetadata {
                      path: None,
                      key: "key".to_owned(),
                      value: "value".to_owned(),
                      source: "12345678901234567".to_owned(),
                  }],
              )
              .expect("oversized evidence document");
              assert!(matches!(
                  index.rebuild(&[oversized_evidence]),
                  Err(SearchError::FieldTooLarge)
              ));

              let oversized_key = filename_metadata_document(
                  binding(
                      &workspace,
                      "object.object",
                      3,
                      Some(reference("object.revision")),
                  ),
                  None,
                  &[SearchMetadata {
                      path: None,
                      key: "12345678901234567".to_owned(),
                      value: "value".to_owned(),
                      source: "fixture".to_owned(),
                  }],
              )
              .expect("oversized key document");
              assert!(matches!(
                  index.rebuild(&[oversized_key]),
                  Err(SearchError::FieldTooLarge)
              ));

              let okay = activity_search_document(source, &["okay".to_owned()]).expect("okay");
              index.rebuild(&[okay]).expect("bounded rebuild");
              let mut overlong_query = query(&workspace, "12345", Vec::new());
              overlong_query.limit = 1;
              assert!(matches!(
                  index.query(&overlong_query),
                  Err(SearchError::InvalidQuery)
              ));
              let mut too_many_results = query(&workspace, "okay", Vec::new());
              too_many_results.limit = 2;
              assert!(matches!(
                  index.query(&too_many_results),
                  Err(SearchError::InvalidResultLimit)
              ));
          }

          ''' + tests[end:]

          start = tests.index('#[test]\nfn query_is_case_insensitive_and_requires_all_terms()')
          tests = tests[:start] + '''#[test]
          fn query_is_case_insensitive_and_requires_all_terms_across_document_fields() {
              let workspace = reference("core.workspace");
              let document = filename_metadata_document(
                  binding(
                      &workspace,
                      "object.object",
                      1,
                      Some(reference("object.revision")),
                  ),
                  Some("Recovery-Report.txt".to_owned()),
                  &[SearchMetadata {
                      path: None,
                      key: "architecture".to_owned(),
                      value: "x86_64".to_owned(),
                      source: "fixture".to_owned(),
                  }],
              )
              .expect("metadata document");
              let mut index = SearchIndex::new(SearchLimits::default()).expect("index");
              index.rebuild(&[document]).expect("rebuild");
              let response = index
                  .query(&query(&workspace, "REPORT X86_64", Vec::new()))
                  .expect("cross-field AND query");
              assert_eq!(response.hits.len(), 1);
              assert_eq!(response.hits[0].matches.len(), 2);
              assert!(
                  index
                      .query(&query(&workspace, "report missing", Vec::new()))
                      .expect("AND query")
                      .hits
                      .is_empty()
              );
          }
          '''
          assert 'SearchDocument {' not in tests
          assert 'SearchField {' not in tests
          test_path.write_text(tests, encoding='utf-8')

          doc_path = Path('B07_SEARCH_V1.md')
          doc = doc_path.read_text(encoding='utf-8')
          doc = doc.replace(
              '- bounded document, field, query and result resources;\n',
              '- bounded document, field key/value/evidence-source, query and result resources;\n',
              1,
          )
          old = '- Clearing or rebuilding the index mutates only private derived copies and cannot mutate caller/canonical documents.\n'
          new = '- Public callers cannot construct raw `SearchDocument`/`SearchField` payloads; adapter constructors establish provenance invariants and rebuild revalidates every borrowed document before any clone.\n- Clearing or rebuilding the index mutates only private derived copies and cannot mutate caller/canonical documents.\n'
          assert old in doc
          doc = doc.replace(old, new, 1)
          old = '- Same canonicalized source input rebuilt later produces the same content digest even though the local index revision advances.\n'
          new = '- Same canonicalized source input rebuilt later produces the same content digest even though the local index revision advances; initialization, `clear()` and `rebuild(&[])` use the same canonical empty digest.\n'
          assert old in doc
          doc = doc.replace(old, new, 1)
          old = '- Search hits expose canonical source bindings, never index-local surrogate identity.\n'
          new = '- Search hits expose canonical source bindings, never index-local surrogate identity.\n- Multi-term AND queries are satisfied across the union of eligible fields in one document, while returned matches identify the contributing fields.\n'
          assert old in doc
          doc = doc.replace(old, new, 1)
          doc = doc.replace('The exact candidate must pass all 14 B07 cases covering:', 'The exact candidate must pass all 16 B07 cases covering:', 1)
          doc = doc.replace('10. field, document, query and result resource bounds;', '10. field key/value/evidence-source, document, query and result resource bounds;', 1)
          doc = doc.replace('14. case-insensitive all-term query semantics.', '14. case-insensitive document-level all-term query semantics across eligible fields;\n15. forged kind/domain payload rejection at the generic rebuild boundary;\n16. forged unanchored DocumentText rejection at the generic rebuild boundary.', 1)
          doc = doc.replace('- B07 acceptance: 14/14;', '- B07 acceptance: 16/16;', 1)
          doc_path.write_text(doc, encoding='utf-8')
          PY

          cargo fmt --all
          cargo test -p ptah-archive-decomposition --test b07 --locked -- --nocapture
          cargo test -p ptah-archive-decomposition --lib b07::tests --locked -- --nocapture
          cargo clippy -p ptah-archive-decomposition --lib --test b07 --locked -- -D warnings
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {
              'B07_SEARCH_V1.md',
              'crates/ptah-archive-decomposition/src/b07.rs',
              'crates/ptah-archive-decomposition/tests/b07.rs',
          }
          assert changed == expected, (changed, expected)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add B07_SEARCH_V1.md crates/ptah-archive-decomposition/src/b07.rs crates/ptah-archive-decomposition/tests/b07.rs
          git commit -m "B07 review: harden provenance bounds and document-level AND search"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
