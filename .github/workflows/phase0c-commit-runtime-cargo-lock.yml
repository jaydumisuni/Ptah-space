name: Phase 0C commit runtime Cargo lock

on:
  push:
    branches:
      - phase-0c-host-dependency-evidence

permissions:
  contents: write

jobs:
  commit-cargo-lock:
    if: ${{ !contains(github.event.head_commit.message, '[generated-cargo-lock]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out dependency branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: phase-0c-host-dependency-evidence
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Resolve exact selected graph
        run: |
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 > /tmp/ptah-cargo-metadata.json

      - name: Commit generated Cargo lock
        run: |
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already matches selected graph"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Phase 0C: commit exact candidate runtime Cargo lock [generated-cargo-lock]"
          git push origin HEAD:phase-0c-host-dependency-evidence
