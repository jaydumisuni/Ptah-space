name: B01 transfer and storage exact-head proof

on:
  pull_request:
    paths:
      - "B01_TRANSFER_STORAGE_EXPANSION.md"
      - "crates/ptah-transfer/Cargo.toml"
      - "crates/ptah-transfer/src/lib.rs"
      - "crates/ptah-transfer/src/b01.rs"
      - "crates/ptah-transfer/tests/b01.rs"
      - ".github/workflows/b01-transfer-storage-expansion.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PTAH_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PTAH_PR_BASE: ${{ github.event.pull_request.base.sha }}
  PTAH_B01_BASE_SHA: 6f096697fb65fe023e7cdf31abf9a7996486326f
  CARGO_TERM_COLOR: always

jobs:
  b01-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact B01 candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PTAH_EXACT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Lock accepted A15 base and B01 scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PTAH_EXACT_SHA"
          test -z "$(git status --porcelain)"
          if [ -n "${PTAH_PR_BASE:-}" ]; then
            test "$PTAH_PR_BASE" = "$PTAH_B01_BASE_SHA"
          fi
          test "$(git merge-base "$PTAH_B01_BASE_SHA" "$PTAH_EXACT_SHA")" = "$PTAH_B01_BASE_SHA"
          python3 - <<'PY'
          import os
          import subprocess

          base = os.environ["PTAH_B01_BASE_SHA"]
          head = os.environ["PTAH_EXACT_SHA"]
          files = subprocess.check_output(
              ["git", "diff", "--name-only", base, head], text=True
          ).splitlines()
          allowed = {
              "B01_TRANSFER_STORAGE_EXPANSION.md",
              "crates/ptah-transfer/Cargo.toml",
              "crates/ptah-transfer/src/lib.rs",
              "crates/ptah-transfer/src/b01.rs",
              "crates/ptah-transfer/tests/b01.rs",
              ".github/workflows/b01-transfer-storage-expansion.yml",
          }
          unexpected = sorted(set(files).difference(allowed))
          missing = sorted(allowed.difference(files))
          assert not unexpected, f"B01 scope drift: {unexpected}"
          assert not missing, f"B01 required surface missing: {missing}"
          PY
          git diff --check "$PTAH_B01_BASE_SHA" "$PTAH_EXACT_SHA"

      - name: Install pinned Rust 1.97.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b01
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
          rustc -Vv | tee /tmp/b01/rustc-version.txt
          cargo -V | tee /tmp/b01/cargo-version.txt
          rustc -V | grep -q '^rustc 1.97.1 '
          cargo -V | grep -q '^cargo 1.97.1 '
          printf '%s\n' "$PTAH_EXACT_SHA" > /tmp/b01/exact-head.txt
          cat /etc/os-release > /tmp/b01/host-os-release.txt

      - name: Prove formatting and B01 acceptance suite
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p ptah-transfer --test b01 --locked -- --nocapture \
            2>&1 | tee /tmp/b01/b01-tests.txt
          grep -Eq 'test result: ok\. 13 passed; 0 failed;' /tmp/b01/b01-tests.txt

      - name: Prove B01 transfer surface with strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p ptah-transfer --lib --test b01 --locked -- -D warnings \
            2>&1 | tee /tmp/b01/b01-clippy.txt

      - name: Re-prove inherited A08 transfer semantics
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ptah-transfer --test a08 --locked -- --nocapture \
            2>&1 | tee /tmp/b01/a08-tests.txt

      - name: Re-prove inherited workspace at exact B01 head
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --locked -- --nocapture \
            2>&1 | tee /tmp/b01/workspace-tests.txt

      - name: Write exact-head proof manifest
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cp B01_TRANSFER_STORAGE_EXPANSION.md /tmp/b01/acceptance-contract.md
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('/tmp/b01')
          required = [
              'exact-head.txt',
              'host-os-release.txt',
              'rustc-version.txt',
              'cargo-version.txt',
              'b01-tests.txt',
              'b01-clippy.txt',
              'a08-tests.txt',
              'workspace-tests.txt',
              'acceptance-contract.md',
          ]
          files = {}
          for name in required:
              path = root / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'missing B01 proof report: {name}')
              files[name] = {
                  'size_bytes': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          head = (root / 'exact-head.txt').read_text(encoding='utf-8').strip()
          if head != os.environ['PTAH_EXACT_SHA']:
              raise SystemExit('B01 proof head mismatch')
          manifest = {
              'schema_version': '0.1.0',
              'record_type': 'ptah.b01.transfer_storage_exact_head_proof',
              'status': 'pass',
              'implementation_commit': head,
              'accepted_base_commit': os.environ['PTAH_B01_BASE_SHA'],
              'workflow_run_id': int(os.environ['RUN_ID']),
              'workflow_run_attempt': int(os.environ['RUN_ATTEMPT']),
              'b01_acceptance_test_count': 13,
              'resumable_upload_proven': True,
              'segmented_multi_source_download_proven': True,
              'queue_priority_proven': True,
              'node_object_store_drive_adapter_contract_proven': True,
              'dedup_retention_proven': True,
              'explicit_sync_conflict_proven': True,
              'backup_verification_prune_restore_proven': True,
              'restored_bytes_claim_workspace_recovery': False,
              'optional_remote_failure_blocks_local_work': False,
              'files': files,
          }
          rendered = json.dumps(manifest, indent=2, sort_keys=True) + '\n'
          (root / 'proof-manifest.json').write_text(rendered, encoding='utf-8')
          digest = hashlib.sha256(rendered.encode()).hexdigest()
          (root / 'proof-manifest.sha256').write_text(
              f'{digest}  proof-manifest.json\n', encoding='utf-8'
          )
          print(rendered, end='')
          PY
          cd /tmp/b01
          sha256sum -c proof-manifest.sha256

      - name: Confirm exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PTAH_EXACT_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Retain B01 proof bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: b01-transfer-storage-${{ env.PTAH_EXACT_SHA }}
          path: /tmp/b01/
          if-no-files-found: error
          retention-days: 90
