name: TEMP ATHENA Redmi ROM progress and external-volume inspection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-oracle-mcp-production-deploy-v2.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, athena, windows, x64, physical, ptah]
    timeout-minutes: 5
    steps:
      - name: Report BITS progress and attached storage read-only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bitsName = 'TTG Redmi sky Global OS2.0.9.0'
          $dir = 'C:\Users\ATHENA 2.0\Desktop\redmi r12'

          Write-Output '=== BITS ==='
          $job = Get-BitsTransfer -Name $bitsName -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($job) {
            $pct = if ([int64]$job.BytesTotal -gt 0) { [math]::Round(([double]$job.BytesTransferred / [double]$job.BytesTotal) * 100, 3) } else { 0 }
            [ordered]@{
              state=[string]$job.JobState
              bytesTransferred=[int64]$job.BytesTransferred
              bytesTotal=[int64]$job.BytesTotal
              percent=$pct
              source=($job.FileList | Select-Object -First 1 -ExpandProperty RemoteName)
              destination=($job.FileList | Select-Object -First 1 -ExpandProperty LocalName)
            } | ConvertTo-Json -Compress
          } else {
            Write-Output '{"state":"NO_BITS_JOB"}'
          }

          Write-Output '=== DESTINATION DIRECTORY ==='
          if (Test-Path -LiteralPath $dir) {
            Get-ChildItem -LiteralPath $dir -Force | Select-Object Name,Length,LastWriteTime,Attributes | ConvertTo-Json -Compress
          } else {
            Write-Output 'DESTINATION_DIRECTORY_MISSING'
          }

          Write-Output '=== LOGICAL VOLUMES ==='
          Get-CimInstance Win32_LogicalDisk | Sort-Object DeviceID | ForEach-Object {
            [ordered]@{
              drive=$_.DeviceID
              label=$_.VolumeName
              driveType=[int]$_.DriveType
              fileSystem=$_.FileSystem
              sizeBytes=[int64]$_.Size
              freeBytes=[int64]$_.FreeSpace
            }
          } | ConvertTo-Json -Compress

          Write-Output '=== DISK/PARTITION MAPPING ==='
          $rows = @()
          Get-Partition -ErrorAction SilentlyContinue | Where-Object DriveLetter | ForEach-Object {
            $p = $_
            $d = $p | Get-Disk -ErrorAction SilentlyContinue
            $v = Get-Volume -DriveLetter $p.DriveLetter -ErrorAction SilentlyContinue
            $rows += [ordered]@{
              drive=([string]$p.DriveLetter + ':')
              label=[string]$v.FileSystemLabel
              fileSystem=[string]$v.FileSystem
              diskNumber=[int]$p.DiskNumber
              diskFriendlyName=[string]$d.FriendlyName
              busType=[string]$d.BusType
              partitionSize=[int64]$p.Size
              diskSize=[int64]$d.Size
              isBoot=[bool]$d.IsBoot
              isSystem=[bool]$d.IsSystem
            }
          }
          $rows | Sort-Object drive | ConvertTo-Json -Compress
