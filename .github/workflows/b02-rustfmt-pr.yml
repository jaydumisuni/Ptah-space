name: B02 one-use canonical rustfmt

on:
  pull_request:
    paths:
      - ".github/workflows/b02-rustfmt-pr.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out writable PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply canonical Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          cargo fmt --all
      - name: Commit formatted B02 sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ptah-archive-decomposition/src/b02.rs crates/ptah-archive-decomposition/src/lib.rs crates/ptah-archive-decomposition/tests/b02.rs
          git diff --cached --check
          git commit -m "B02 review: apply canonical rustfmt"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
