name: TEMP KRATOS ChatGPT Browser Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-kratos-chatgpt-browser-inspect.yml'

jobs:
  inspect:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 5
    steps:
      - name: Pair existing Oracle extension to local bridge through Chrome UI
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          export XDG_RUNTIME_DIR="/run/user/$uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          user_env="$(systemctl --user show-environment 2>/dev/null || true)"
          eval "$(printf '%s\n' "$user_env" | grep -E '^(DISPLAY|WAYLAND_DISPLAY|XAUTHORITY)=' | sed 's/^/export /' || true)"
          : "${DISPLAY:=:0}"; export DISPLAY
          token_path="$HOME/.local/state/OracleBrowserBridge/agent-token.txt"
          test -s "$token_path"
          token="$(tr -d '\r\n' < "$token_path")"
          test "${#token}" -ge 32
          test -n "$(command -v xdotool || true)" || { echo 'XDOTOOL_MISSING'; exit 40; }
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          ext_id='hoahdcllchhncnenbeplgfgmpjihakab'
          options_url="chrome-extension://$ext_id/options/index.html"

          "$chrome" --profile-directory=Default --new-tab "$options_url" >/dev/null 2>&1 || true
          sleep 3
          win="$(xdotool search --onlyvisible --name 'Oracle Browser settings' 2>/dev/null | tail -n1 || true)"
          if [ -z "$win" ]; then win="$(xdotool search --onlyvisible --class 'google-chrome' 2>/dev/null | tail -n1 || true)"; fi
          test -n "$win" || { echo 'CHROME_WINDOW_NOT_FOUND'; exit 41; }
          xdotool windowactivate --sync "$win"
          sleep 1

          # Click the page background to place sequential focus in document content, then
          # walk the deterministic options-page tab order to Bridge WebSocket + Pairing token.
          xdotool mousemove --window "$win" 20 420 click 1
          sleep 1
          xdotool key --window "$win" --clearmodifiers Tab
          xdotool key --window "$win" --clearmodifiers Tab
          xdotool key --window "$win" --clearmodifiers Tab
          xdotool key --window "$win" --clearmodifiers Tab
          xdotool key --window "$win" --clearmodifiers ctrl+a
          xdotool type --window "$win" --clearmodifiers --delay 1 'ws://127.0.0.1:8765/browser'
          xdotool key --window "$win" --clearmodifiers Tab
          xdotool key --window "$win" --clearmodifiers ctrl+a
          xdotool type --window "$win" --clearmodifiers --delay 1 -- "$token"
          unset token
          xdotool key --window "$win" --clearmodifiers Tab
          xdotool key --window "$win" --clearmodifiers Return

          connected=0
          for i in $(seq 1 20); do
            sleep 1
            curl -fsS --max-time 2 http://127.0.0.1:8765/health >"$RUNNER_TEMP/bridge-health.json" 2>/dev/null || true
            if [ -s "$RUNNER_TEMP/bridge-health.json" ] && python3 -c "import json; d=json.load(open('$RUNNER_TEMP/bridge-health.json')); raise SystemExit(0 if d.get('browserConnected') else 1)"; then connected=1; break; fi
          done
          echo '=== BRIDGE HEALTH ==='
          cat "$RUNNER_TEMP/bridge-health.json" 2>/dev/null || true
          echo
          echo "BROWSER_BRIDGE_CONNECTED=$connected"
          test "$connected" = 1
