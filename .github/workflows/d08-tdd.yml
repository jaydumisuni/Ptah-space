name: D08 TDD

on:
  push:
    branches:
      - d08-application-platform-expansion
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/ptah-application-runtime/**
      - services/ptah-control/**
      - .github/workflows/d08-tdd.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  d08-task4-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Preserve promoted Task4 lock
        run: cp Cargo.lock /tmp/Cargo.lock.before
      - name: Apply minimal Task4 implementation
        shell: bash
        env:
          D08_PATCH_B64: 
        run: |
          printf '%s' "$D08_PATCH_B64" | base64 -d > /tmp/d08_task4_patch.py
          python3 /tmp/d08_task4_patch.py
          cargo fmt --all
          git diff --check
      - name: Prove exact 28-case D08 milestone GREEN
        shell: bash
        run: |
          set -euo pipefail
          runtime_count=$(cargo test -p ptah-application-runtime --test d08_acceptance --locked -- --list | grep -c ': test$')
          shell_count=$(cargo test -p ptah-control --test d08_application_projection --locked -- --list | grep -c ': test$')
          test "$runtime_count" -eq 25
          test "$shell_count" -eq 3
          test "$((runtime_count + shell_count))" -eq 28
          cargo test -p ptah-application-runtime --test d08_acceptance --locked
          cargo test -p ptah-control --test d08_application_projection --locked
      - name: Prove D01 and C10 regressions
        run: |
          cargo test -p ptah-control --test d01_acceptance --locked
          cargo test -p ptah-android-runtime --test c10 --locked
      - name: Prove strict Task4 lint and zero suppressions
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p ptah-application-runtime -p ptah-control --all-targets --locked -- -D warnings -W clippy::pedantic
          if grep -R -n -E '#\[(allow|expect)\(' crates/ptah-application-runtime/src crates/ptah-application-runtime/tests services/ptah-control/src services/ptah-control/tests/d08_application_projection.rs; then
            echo 'D08 lint suppression found' >&2
            exit 1
          fi
      - name: Prove promoted Task4 lock is byte-stable
        run: |
          cmp Cargo.lock /tmp/Cargo.lock.before
          git diff --exit-code -- Cargo.lock
      - name: Commit proven Task4 implementation if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- crates/ptah-application-runtime/src/remote_display.rs crates/ptah-application-runtime/tests/d08_acceptance/remote.rs services/ptah-control/src/lib.rs services/ptah-control/tests/d08_application_projection.rs; then
            exit 0
          fi
          git config user.name 'THE TECH GUY'
          git config user.email '65334711+jaydumisuni@users.noreply.github.com'
          git add crates/ptah-application-runtime/src/remote_display.rs crates/ptah-application-runtime/tests/d08_acceptance/remote.rs services/ptah-control/src/lib.rs services/ptah-control/tests/d08_application_projection.rs
          git commit -m 'feat(d08): project application platform into human shell'
          git push origin HEAD:d08-application-platform-expansion
