name: Temporary PR197 Source Correction

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-athena-ptah-runner-final.yml"

permissions:
  contents: read

jobs:
  correct-pr197:
    runs-on: [self-hosted, athena, ptah]
    timeout-minutes: 18
    steps:
      - name: Fetch audited correction payload and execute it
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $raw=& gh api 'repos/jaydumisuni/Oracle-/contents/oracle_control/pr197-source-correction-20260824.mjs?ref=main' 2>&1
          if($LASTEXITCODE -ne 0){throw ('PAYLOAD_FETCH_FAILED '+($raw -join "`n"))}
          $meta=(($raw -join "`n")|ConvertFrom-Json)
          $bytes=[Convert]::FromBase64String(([string]$meta.content -replace '\s',''))
          $payload=Join-Path $env:TEMP ('pr197-correction-'+[guid]::NewGuid().ToString('N')+'.mjs')
          try {
            [IO.File]::WriteAllBytes($payload,$bytes)
            & node.exe $payload
            if($LASTEXITCODE -ne 0){throw 'PR197_CORRECTION_PAYLOAD_FAILED'}
          } finally {
            Remove-Item $payload -Force -ErrorAction SilentlyContinue
          }

