name: E02 Review Correction Sync

on:
  push:
    branches:
      - e02-placement-reservation-lease-fence
    paths:
      - .github/workflows/e02-review-correction-sync.yml

permissions:
  contents: write

jobs:
  correct-reviewed-durable-metadata:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out E02 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e02-placement-reservation-lease-fence
          fetch-depth: 0

      - name: Pin Rust 1.97.1
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
          rustc -V | grep -q '^rustc 1.97.1 '

      - name: Apply reviewed timestamp truth correction and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          durable = Path('crates/ptah-placement-runtime/src/durable.rs')
          text = durable.read_text()

          old = '''    fn append(
              &mut self,
              entry: JournalEntry,
              authority_ref: &EntityRef,
          ) -> Result<(), RecoveryError> {
              let journal_ref = EntityRef::new(JOURNAL_KIND)
                  .map_err(|error| RecoveryError::Corrupt(error.to_string()))?;
              let document = json!({
                  "entity_id": journal_ref.entity_id.to_string(),
                  "entity_kind": JOURNAL_KIND,
                  "schema_id": ENVELOPE_SCHEMA,
                  "schema_version": VERSION,
                  "record_revision": 1,
                  "created_at": "2026-09-06T00:00:00Z",
                  "updated_at": "2026-09-06T00:00:00Z",
          '''
          new = '''    fn append(
              &mut self,
              entry: JournalEntry,
              authority_ref: &EntityRef,
          ) -> Result<(), RecoveryError> {
              let journal_ref = EntityRef::new(JOURNAL_KIND)
                  .map_err(|error| RecoveryError::Corrupt(error.to_string()))?;
              let timestamp = rfc3339_utc(entry.event_unix_seconds())?;
              let document = json!({
                  "entity_id": journal_ref.entity_id.to_string(),
                  "entity_kind": JOURNAL_KIND,
                  "schema_id": ENVELOPE_SCHEMA,
                  "schema_version": VERSION,
                  "record_revision": 1,
                  "created_at": timestamp.clone(),
                  "updated_at": timestamp,
          '''
          if old not in text:
              raise SystemExit('expected append timestamp block not found')
          text = text.replace(old, new, 1)

          old = '''    const fn attempt_ref(&self) -> &EntityRef {
              match self {
                  Self::Reservation { value, .. } => &value.attempt_ref,
                  Self::Lease { value, .. } => &value.attempt_ref,
              }
          }
          }
          '''
          new = '''    const fn attempt_ref(&self) -> &EntityRef {
              match self {
                  Self::Reservation { value, .. } => &value.attempt_ref,
                  Self::Lease { value, .. } => &value.attempt_ref,
              }
          }

          const fn event_unix_seconds(&self) -> u64 {
              match self {
                  Self::Reservation { value, .. } => value.created_at,
                  Self::Lease { value, .. } => value.issued_at,
              }
          }
          }

          fn rfc3339_utc(unix_seconds: u64) -> Result<String, RecoveryError> {
              const SECONDS_PER_DAY: u64 = 86_400;
              let days = unix_seconds / SECONDS_PER_DAY;
              let seconds_of_day = unix_seconds % SECONDS_PER_DAY;
              let days = i64::try_from(days)
                  .map_err(|_| RecoveryError::Corrupt("journal timestamp exceeds RFC3339 range".to_owned()))?;

              // Gregorian civil-date conversion for days since 1970-01-01.
              let shifted = days
                  .checked_add(719_468)
                  .ok_or_else(|| RecoveryError::Corrupt("journal timestamp overflow".to_owned()))?;
              let era = if shifted >= 0 {
                  shifted / 146_097
              } else {
                  (shifted - 146_096) / 146_097
              };
              let day_of_era = shifted - era * 146_097;
              let year_of_era = (day_of_era - day_of_era / 1_460 + day_of_era / 36_524
                  - day_of_era / 146_096)
                  / 365;
              let mut year = year_of_era + era * 400;
              let day_of_year = day_of_era - (365 * year_of_era + year_of_era / 4 - year_of_era / 100);
              let month_prime = (5 * day_of_year + 2) / 153;
              let day = day_of_year - (153 * month_prime + 2) / 5 + 1;
              let month = month_prime + if month_prime < 10 { 3 } else { -9 };
              year += i64::from(month <= 2);
              if !(0..=9_999).contains(&year) {
                  return Err(RecoveryError::Corrupt(
                      "journal timestamp exceeds four-digit RFC3339 year".to_owned(),
                  ));
              }

              let hour = seconds_of_day / 3_600;
              let minute = (seconds_of_day % 3_600) / 60;
              let second = seconds_of_day % 60;
              Ok(format!(
                  "{year:04}-{month:02}-{day:02}T{hour:02}:{minute:02}:{second:02}Z"
              ))
          }
          '''
          if old not in text:
              raise SystemExit('expected JournalEntry impl tail not found')
          text = text.replace(old, new, 1)
          durable.write_text(text)

          test = Path('crates/ptah-placement-runtime/tests/e02_recovery.rs')
          text = test.read_text()
          old = '''use ptah_placement_runtime::{
              AuthorityBinding, DurableAuthorityStore, LeaseError, LeaseRegistry, ReservationError,
              ReservationRegistry, ReservedResource,
          };
          use std::{fs, path::PathBuf, process};
          '''
          new = '''use ptah_placement_runtime::{
              AuthorityBinding, DurableAuthorityStore, LeaseError, LeaseRegistry, ReservationError,
              ReservationRegistry, ReservedResource,
          };
          use rusqlite::Connection;
          use serde_json::Value;
          use std::{fs, path::PathBuf, process};
          '''
          if old not in text:
              raise SystemExit('expected recovery imports not found')
          text = text.replace(old, new, 1)

          marker = '''#[test]
          fn restart_preserves_higher_fence_and_next_issue_is_strictly_newer() {
          '''
          inserted = '''#[test]
          fn canonical_journal_timestamp_matches_reservation_creation_time() {
              let path = temp_db("canonical-time");
              let session = session(NodeId::new(), 7, 11);
              let snapshot = resource_snapshot(&session);
              let mut reservations = ReservationRegistry::new(&session, &snapshot).expect("registry");
              let reservation_ref = reserve(
                  &mut reservations,
                  &snapshot,
                  &session,
                  entity("activity.attempt"),
                  1.0,
              );
              let record = reservations
                  .reservation(&reservation_ref)
                  .expect("record")
                  .clone();
              let mut store = DurableAuthorityStore::open(&path).expect("store");
              store.persist_reservation(&record).expect("persist reservation");
              drop(store);

              let connection = Connection::open(&path).expect("ledger connection");
              let document_json: String = connection
                  .query_row(
                      "SELECT document_json FROM ptah_entity_records WHERE entity_kind = ?1",
                      ["runtime.e02-authority-journal"],
                      |row| row.get(0),
                  )
                  .expect("journal row");
              let document: Value = serde_json::from_str(&document_json).expect("canonical JSON");
              assert_eq!(document["created_at"], "2027-01-15T08:00:00Z");
              assert_eq!(document["updated_at"], "2027-01-15T08:00:00Z");
              cleanup(&path);
          }

          #[test]
          fn restart_preserves_higher_fence_and_next_issue_is_strictly_newer() {
          '''
          if marker not in text:
              raise SystemExit('recovery insertion point not found')
          text = text.replace(marker, inserted, 1)
          test.write_text(text)
          PY

          cargo fmt --all
          cargo test -p ptah-placement-runtime --test e02_recovery
          cargo clippy -p ptah-placement-runtime --all-targets -- -D warnings
          cargo fmt --all -- --check
          git diff --check
          git config user.name 'THE TECH GUY'
          git config user.email '65334711+jaydumisuni@users.noreply.github.com'
          git add crates/ptah-placement-runtime/src/durable.rs crates/ptah-placement-runtime/tests/e02_recovery.rs
          git commit -m 'fix(e02): bind durable journal timestamps to authority events'
          git push origin HEAD:e02-placement-reservation-lease-fence
