name: Temporary Redmi sky Global ROM resume preflight on KRATOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-oracle-relay-recovery-kratos.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 10
    steps:
      - name: Prove official CDN range semantics and local prefix
        shell: bash
        run: |
          set -euo pipefail
          payload='/home/kratos/Desktop/redmi r12/BIT85A4.tmp'
          url='https://bigota.d.miui.com/OS2.0.9.0.VMWMIXM/sky_global_images_OS2.0.9.0.VMWMIXM_20250530.0000.00_15.0_global_3334591f85.tgz'
          test -f "$payload"

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          echo '=== LOCAL ==='
          local_size="$(stat -c %s "$payload")"
          printf 'local_size=%s\n' "$local_size"

          echo '=== CDN RANGE 0-0 ==='
          curl -fLsS --connect-timeout 20 --max-time 90 -r 0-0 -D "$work/headers.txt" -o "$work/byte0.bin" "$url"
          cat "$work/headers.txt"
          printf 'received_bytes=%s\n' "$(stat -c %s "$work/byte0.bin")"

          total="$(awk 'BEGIN{IGNORECASE=1} /^content-range:/ {gsub("\r",""); n=split($0,a,"/"); print a[n]}' "$work/headers.txt" | tail -n1)"
          printf 'remote_total_size=%s\n' "$total"
          if [[ "$total" =~ ^[0-9]+$ ]]; then
            printf 'missing_bytes=%s\n' "$(( total - local_size ))"
          else
            echo 'remote_total_size=UNKNOWN'
          fi

          echo '=== PREFIX SAMPLE COMPARISON (1 MiB) ==='
          dd if="$payload" of="$work/local-prefix.bin" bs=1M count=1 status=none
          curl -fLsS --connect-timeout 20 --max-time 90 -r 0-1048575 -o "$work/remote-prefix.bin" "$url"
          local_prefix_sha="$(sha256sum "$work/local-prefix.bin" | awk '{print $1}')"
          remote_prefix_sha="$(sha256sum "$work/remote-prefix.bin" | awk '{print $1}')"
          printf 'local_prefix_sha256=%s\n' "$local_prefix_sha"
          printf 'remote_prefix_sha256=%s\n' "$remote_prefix_sha"
          printf 'prefix_match=%s\n' "$([[ "$local_prefix_sha" == "$remote_prefix_sha" ]] && echo true || echo false)"

          test "$local_prefix_sha" = "$remote_prefix_sha"
          test "$total" -gt "$local_size"
