name: TEMP ATHENA Redmi sky Global ROM local verification carrier

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-oracle-mcp-production-deploy-v2.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, athena, windows, x64, physical, ptah]
    timeout-minutes: 20
    steps:
      - name: Verify existing ATHENA ROM locally without network
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'C:\Users\ATHENA 2.0\Desktop\redmi r12'
          $expected = '3334591f858477053b68f4c0e47debf0'
          $expectedSize = 7949886711
          $bitsName = 'TTG Redmi sky Global OS2.0.9.0'

          $job = Get-BitsTransfer -Name $bitsName -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($job) {
            [ordered]@{
              phase='bits-status'
              state=[string]$job.JobState
              bytesTransferred=[int64]$job.BytesTransferred
              bytesTotal=[int64]$job.BytesTotal
            } | ConvertTo-Json -Compress
            if ($job.JobState -eq 'Transferred') {
              Complete-BitsTransfer -BitsJob $job
            }
          }

          $files = Get-ChildItem -LiteralPath $dir -File | Sort-Object Length -Descending
          if (-not $files) { throw 'NO_FILES_IN_REDMI_R12' }
          $f = $files | Where-Object { $_.Name -like 'sky_global_images_*' } | Select-Object -First 1
          if (-not $f) { $f = $files | Select-Object -First 1 }

          [ordered]@{phase='selected';host=$env:COMPUTERNAME;path=$f.FullName;name=$f.Name;sizeBytes=[int64]$f.Length;expectedSize=[int64]$expectedSize;sizeMatches=([int64]$f.Length -eq [int64]$expectedSize)} | ConvertTo-Json -Compress

          $md5 = (Get-FileHash -LiteralPath $f.FullName -Algorithm MD5).Hash.ToLowerInvariant()
          [ordered]@{phase='md5-complete';md5=$md5;expectedMd5=$expected;md5Matches=($md5 -eq $expected)} | ConvertTo-Json -Compress

          if ($f.Length -ne $expectedSize) { throw 'ATHENA_ROM_SIZE_MISMATCH' }
          if ($md5 -ne $expected) { throw 'ATHENA_ROM_MD5_MISMATCH' }
