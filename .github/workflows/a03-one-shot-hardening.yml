              #[test]
              fn unknown_schema_pair_is_rejected_before_storage() {
                  let entity_id = EntityId::new_v7();
                  let result = CanonicalRecord::from_document(json!({
                      "envelope": {
                          "entity_id": entity_id.to_string(),
                          "entity_kind": "core.node",
