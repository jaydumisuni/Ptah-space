name: A07 rustfmt bootstrap

on:
  pull_request:
    paths:
      - "crates/ptah-object-store/**"
      - ".github/workflows/a07-rustfmt-bootstrap.yml"

permissions:
  contents: write

env:
  PTAH_EXACT_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  rustfmt-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact A07 branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact starting head
        run: test "$(git rev-parse HEAD)" = "$PTAH_EXACT_SHA"

      - name: Install pinned rustfmt
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1

      - name: Apply and constrain rustfmt
        run: |
          set -euo pipefail
          cargo fmt --all
          python - <<'PY'
          import subprocess
          files=subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          bad=[p for p in files if not p.startswith('crates/ptah-object-store/')]
          assert not bad, f'rustfmt scope drift: {bad}'
          PY
          git diff --check

      - name: Commit formatter output only
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "A07 already rustfmt-clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ptah-object-store
          git commit -m "A07 apply pinned rustfmt"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
