# activate: inspect Global super metadata 2026-08-30
name: Temporary inspect Redmi Global super metadata on KRATOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-oracle-relay-recovery-kratos.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 12
    steps:
      - name: Inspect dynamic partition tooling and Global super metadata read-only
        shell: bash
        run: |
          set -euo pipefail
          work='/home/kratos/Desktop/redmi-global-analysis/OS2.0.9.0.VMWMIXM'
          super="$work/super.unsparse.img"
          test -f "$super"
          echo '=== TOOLS ==='
          for t in lpdump lpunpack simg2img img2simg; do
            printf '%s=' "$t"
            command -v "$t" || true
          done
          echo '=== LPUNPACK HELP ==='
          if command -v lpunpack >/dev/null 2>&1; then lpunpack --help 2>&1 | head -n 120 || true; fi
          echo '=== SUPER METADATA ==='
          if command -v lpdump >/dev/null 2>&1; then
            lpdump "$super" 2>&1 | head -n 1200
          else
            echo 'LPDUMP_UNAVAILABLE'
          fi
          echo 'GLOBAL_SUPER_METADATA=PASS'
