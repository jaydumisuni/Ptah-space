name: TEMP C06 build carrier

on:
  push:
    branches:
      - c06-unisoc-qualcomm-packs
    paths:
      - ".github/workflows/c06-build-carrier.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PTAH_C06_BASE_SHA: 170b91195fa5e68ae15a8a9c26b9cf677fd78224
  CARGO_TERM_COLOR: always

jobs:
  build-c06:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out carrier branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Recover reviewed C06 candidate payload
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/c06-candidate.tar.gz.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/c06-candidate.tar.gz.b64 > /tmp/c06-candidate.tar.gz
          printf '%s  %s\n' '2119c94940fe9c424b3963fce6f3a5153413f9aa3d751ffa745f567882c890f2' /tmp/c06-candidate.tar.gz | sha256sum -c -
          tar -xzf /tmp/c06-candidate.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Build and review C06 candidate
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p ptah-archive-decomposition --test c06 --locked -- --nocapture
          cargo clippy -p ptah-archive-decomposition --lib --test c06 --locked -- -D warnings
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path('crates/ptah-archive-decomposition/src/c06.rs').read_text()
          assert len(re.findall(r'^#\[test\]$', Path('crates/ptah-archive-decomposition/tests/c06.rs').read_text(), re.M)) == 20
          names = re.findall(r'\bpub\s+fn\s+([A-Za-z0-9_]+)', source)
          forbidden = re.compile(r'(?:^|_)(?:write|erase|flash|reset|reboot|unlock|relock|repartition|execute|upload_fdl|load_fdl|load_programmer|sahara|firehose_command|raw_xml|raw_command|memory_write|rpmb|efuse|nv)(?:_|$)')
          assert not [name for name in names if forbidden.search(name)]
          assert 'C06TrustAssessment::NotEstablished' in source
          assert 'contains.unisoc_pac_component' in source
          assert 'references.qualcomm_firmware_component' in source
          PY

      - name: Publish one clean C06 candidate commit over accepted C05
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$PTAH_C06_BASE_SHA" HEAD)" = "$PTAH_C06_BASE_SHA"
          rm -f .github/workflows/c06-build-carrier.yml
          git add C06_UNISOC_QUALCOMM_PACKS.md \
            crates/ptah-archive-decomposition/Cargo.toml \
            crates/ptah-archive-decomposition/src/lib.rs \
            crates/ptah-archive-decomposition/src/c06.rs \
            crates/ptah-archive-decomposition/tests/c06.rs \
            .github/workflows/c06-unisoc-qualcomm-packs.yml
          git rm --cached --ignore-unmatch .github/workflows/c06-build-carrier.yml
          tree="$(git write-tree)"
          git config user.name 'THE TECH GUY'
          git config user.email '65334711+jaydumisuni@users.noreply.github.com'
          candidate="$(printf '%s\n\n%s\n' 'Build C06 Unisoc and Qualcomm static packs' 'Exact PAC/FDL and MBN/ELF/Firehose/XML static evidence boundaries over accepted C05.' | git commit-tree "$tree" -p "$PTAH_C06_BASE_SHA")"
          files="$(git diff --name-only "$PTAH_C06_BASE_SHA" "$candidate")"
          printf '%s\n' "$files"
          test "$(printf '%s\n' "$files" | sed '/^$/d' | wc -l)" -eq 6
          test "$(git rev-list --count "$PTAH_C06_BASE_SHA..$candidate")" -eq 1
          git push --force-with-lease origin "$candidate:$GITHUB_REF_NAME"
          echo "C06_CANDIDATE=$candidate"
