name: A11 operational browser runtime compatibility

on:
  pull_request:
    paths:
      - "browser-provider/src/playwright_backend.mjs"
      - "browser-provider/src/runtime_compat.mjs"
      - "browser-provider/test/runtime-compatibility.test.mjs"
      - "browser-provider/README.md"
      - ".github/workflows/a11-operational-runtime-compat.yml"
  push:
    branches:
      - "fix/a11-browser-provider-runtime-compat-20261019"
    paths:
      - "browser-provider/src/playwright_backend.mjs"
      - "browser-provider/src/runtime_compat.mjs"
      - "browser-provider/test/runtime-compatibility.test.mjs"
      - ".github/workflows/a11-operational-runtime-compat.yml"

permissions:
  contents: read

jobs:
  node-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - name: Checkout exact head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select compatible Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned Playwright packages without downloading browsers
        working-directory: browser-provider
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate syntax
        working-directory: browser-provider
        run: npm run check
      - name: Browser Provider contract tests (physical browser is separately tested)
        working-directory: browser-provider
        run: npm test
