name: D09 Full Workspace Release Exact Head Acceptance

on:
  push:
    branches:
      - d09-full-workspace-release-acceptance
    paths:
      - D09_FULL_WORKSPACE_RELEASE_ACCEPTANCE.md
      - conformance/d09/**
      - tools/check_d09_full_workspace_release.py
      - tools/test_check_d09_full_workspace_release.py
      - docs/superpowers/specs/2026-09-04-d09-full-workspace-release-acceptance-design.md
      - docs/superpowers/plans/2026-09-04-d09-full-workspace-release-acceptance.md
      - .github/workflows/d09-full-workspace-release-acceptance.yml
      - .github/workflows/d07-security-evidence-reproduction-proof.yml
      - .github/workflows/d08-application-platform-expansion-proof.yml
      - .github/workflows/d08-tdd.yml
  pull_request:
    branches:
      - main
    paths:
      - D09_FULL_WORKSPACE_RELEASE_ACCEPTANCE.md
      - conformance/d09/**
      - tools/check_d09_full_workspace_release.py
      - tools/test_check_d09_full_workspace_release.py
      - docs/superpowers/specs/2026-09-04-d09-full-workspace-release-acceptance-design.md
      - docs/superpowers/plans/2026-09-04-d09-full-workspace-release-acceptance.md
      - .github/workflows/d09-full-workspace-release-acceptance.yml
      - .github/workflows/d07-security-evidence-reproduction-proof.yml
      - .github/workflows/d08-application-platform-expansion-proof.yml
      - .github/workflows/d08-tdd.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  D08_BASE: ca6b3526ce9b58ffce11f8582be8fbf860dfa53d
  ROADMAP_AUTHORITY: 98dc8c4e8639cda80510bee0625db34b4fdf9384
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  CARGO_TERM_COLOR: always

jobs:
  exact-head-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact D09 candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Pin toolchains and exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          PROOF="$RUNNER_TEMP/d09-proof"
          mkdir -p "$PROOF"
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          rustc -Vv | tee "$PROOF/rustc-version.txt"
          cargo -V | tee "$PROOF/cargo-version.txt"
          rustc -V | grep -q '^rustc 1.97.1 '
          cargo -V | grep -q '^cargo 1.97.1 '
          printf '%s\n' "$TARGET_SHA" > "$PROOF/exact-head.txt"
          printf '%s\n' "$D08_BASE" > "$PROOF/d08-predecessor.txt"
          printf '%s\n' "$ROADMAP_AUTHORITY" > "$PROOF/roadmap-authority.txt"
          cat /etc/os-release > "$PROOF/host-os-release.txt"
          uname -a > "$PROOF/host-uname.txt"

      - name: Prove exact predecessor linear history and release-only delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch origin main d09-full-workspace-release-acceptance
          test "$(git rev-parse origin/main)" = "$D08_BASE"
          test "$(git merge-base "$D08_BASE" HEAD)" = "$D08_BASE"
          test -z "$(git rev-list --min-parents=2 "$D08_BASE"..HEAD)"
          test "$(git rev-parse origin/d09-full-workspace-release-acceptance)" = "$TARGET_SHA"
          python3 - <<'PY'
          import subprocess

          base = 'ca6b3526ce9b58ffce11f8582be8fbf860dfa53d'
          expected = {
              '.github/workflows/d07-security-evidence-reproduction-proof.yml',
              '.github/workflows/d08-application-platform-expansion-proof.yml',
              '.github/workflows/d08-tdd.yml',
              '.github/workflows/d09-full-workspace-release-acceptance.yml',
              'D09_FULL_WORKSPACE_RELEASE_ACCEPTANCE.md',
              'conformance/d09/full-workspace-release-cases.v0.1.0.json',
              'docs/superpowers/plans/2026-09-04-d09-full-workspace-release-acceptance.md',
              'docs/superpowers/specs/2026-09-04-d09-full-workspace-release-acceptance-design.md',
              'tools/check_d09_full_workspace_release.py',
              'tools/test_check_d09_full_workspace_release.py',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', f'{base}...HEAD'], text=True
          ).splitlines())
          if changed != expected:
              raise SystemExit(
                  f'D09 release delta drift: missing={sorted(expected-changed)} '
                  f'unexpected={sorted(changed-expected)}'
              )
          forbidden_prefixes = ('crates/', 'services/', 'adapters/', 'schemas/', 'migrations/')
          forbidden_exact = {'Cargo.toml', 'Cargo.lock'}
          bad = sorted(
              path for path in changed
              if path in forbidden_exact or path.startswith(forbidden_prefixes)
          )
          if bad:
              raise SystemExit(f'D09 modified product/Cargo/schema surface: {bad}')
          PY
          git diff --check "$D08_BASE" HEAD

      - name: Prove immutable workflow action references
        shell: bash
        run: |
          set -euo pipefail
          PROOF="$RUNNER_TEMP/d09-proof"
          python3 - <<'PY' | tee "$PROOF/action-pin-audit.txt"
          import re
          from pathlib import Path

          pin = re.compile(r'^[0-9a-f]{40}$')
          failures = []
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              for number, raw in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  stripped = raw.strip()
                  if not stripped.startswith('- uses:') and not stripped.startswith('uses:'):
                      continue
                  value = stripped.split('uses:', 1)[1].strip().split(' #', 1)[0].strip("'\"")
                  if value.startswith('./'):
                      continue
                  if '@' not in value or pin.fullmatch(value.rsplit('@', 1)[1]) is None:
                      failures.append((str(path), number, value))
          if failures:
              for path, number, value in failures:
                  print(f'{path}:{number}: {value}')
              raise SystemExit(f'{len(failures)} non-immutable Action references remain')
          print('ALL_EXTERNAL_ACTION_REFERENCES_IMMUTABLY_PINNED')
          PY

      - name: Prove current source dependency and backend identity boundaries
        shell: bash
        run: |
          set -euo pipefail
          PROOF="$RUNNER_TEMP/d09-proof"
          python3 tools/check_phase0c_scaffold.py \
            2>&1 | tee "$PROOF/phase0c-scaffold-validation.txt"
          cp Cargo.lock "$PROOF/Cargo.lock.repository"
          cargo metadata --locked --format-version 1 > "$PROOF/cargo-metadata.json"
          python3 tools/check_rust_dependency_lock.py --output "$PROOF/rust-dependency-lock.json"
          cmp Cargo.lock "$PROOF/Cargo.lock.repository"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          proof = Path(os.environ['RUNNER_TEMP']) / 'd09-proof'
          lock_path = Path('dependencies/backend-artifact-lock.json')
          retained_path = Path(
              'evidence/phase0c/bc12885ce41844b05481628543219c3a8d3574ba/'
              'durable-evidence-records.json'
          )
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          retained = json.loads(retained_path.read_text(encoding='utf-8'))

          if lock.get('runtime_implementation_authorized') is not False:
              raise SystemExit('backend lock widened runtime authority')
          if retained.get('runtime_implementation_authorized') is not False:
              raise SystemExit('retained backend evidence widened runtime authority')
          if retained.get('implementation_commit') != 'bc12885ce41844b05481628543219c3a8d3574ba':
              raise SystemExit('retained backend implementation identity drifted')

          artifacts = lock.get('artifacts')
          browser = lock.get('browser_binary')
          if not isinstance(artifacts, list) or len(artifacts) != 9:
              raise SystemExit('backend artifact lock count drifted')
          if not isinstance(browser, dict):
              raise SystemExit('browser binary lock is missing')

          records = retained.get('records')
          if not isinstance(records, list):
              raise SystemExit('retained backend evidence records missing')
          values = [item.get('record', {}) for item in records if isinstance(item, dict)]
          static = next(
              item for item in values
              if item.get('record_type') == 'ptah.phase0c.static_backend_artifact_evidence'
              and item.get('exact_head_match') is True
              and item.get('report_present') is True
          )
          browser_record = next(
              item for item in values
              if item.get('record_type') == 'ptah.phase0c.playwright_browser_evidence'
              and item.get('exact_head_match') is True
          )
          signatures = next(
              item for item in values
              if item.get('record_type') == 'ptah.phase0c.backend_signature_evidence'
              and item.get('exact_head_match') is True
              and item.get('report_present') is True
          )
          if static.get('verified_artifact_count') != 9:
              raise SystemExit('retained backend artifact count changed')
          if browser_record.get('installed_file_count') != 599:
              raise SystemExit('retained browser file count changed')
          if signatures.get('verified_signature_count') != 4:
              raise SystemExit('retained signature count changed')

          report = {
              'schema_version': '0.1.0',
              'record_type': 'ptah.d09.retained_backend_identity',
              'backend_lock_sha256': hashlib.sha256(lock_path.read_bytes()).hexdigest(),
              'retained_phase0c_sha256': hashlib.sha256(retained_path.read_bytes()).hexdigest(),
              'artifact_count': len(artifacts),
              'browser_revision': str(browser.get('revision')),
              'retained_static_verified_artifact_count': 9,
              'retained_browser_file_count': 599,
              'retained_verified_signature_count': 4,
              'runtime_implementation_authorized': False,
          }
          (proof/'backend-lock-identity.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Prove D09 corpus and deep Workspace authority separation
        shell: bash
        run: |
          set -euo pipefail
          PROOF="$RUNNER_TEMP/d09-proof"
          PYTHONPATH=tools python3 -m unittest -v tools/test_check_d09_full_workspace_release.py \
            2>&1 | tee "$PROOF/d09-regressions.txt"
          grep -q 'Ran 15 tests' "$PROOF/d09-regressions.txt"
          python3 tools/check_d09_full_workspace_release.py \
            --repo-root . --output "$PROOF/d09-validation.json"

          PYTHONPATH=tools python3 tools/test_check_workspace_operations_donor_v2.py -v \
            2>&1 | tee "$PROOF/deep-workspace-regressions.txt"
          grep -q 'Ran 26 tests' "$PROOF/deep-workspace-regressions.txt"
          python3 tools/check_workspace_operations_donor_v2.py \
            --repo-root . --output "$PROOF/deep-workspace-validation.json"

          PYTHONPATH=tools python3 tools/test_check_ai_project_workspace_candidate.py -v \
            2>&1 | tee "$PROOF/ai-workspace-regressions.txt"
          python3 tools/check_ai_project_workspace_candidate.py \
            --repo-root . --output "$PROOF/ai-workspace-validation.json"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          proof = Path(os.environ['RUNNER_TEMP'])/'d09-proof'
          d09 = json.loads((proof/'d09-validation.json').read_text())
          deep = json.loads((proof/'deep-workspace-validation.json').read_text())
          ai = json.loads((proof/'ai-workspace-validation.json').read_text())
          assert d09['status'] == 'pass' and d09['case_count'] == 10, d09
          assert d09['participants'] == ['human', 'hunter', 'sergeant'], d09
          assert d09['ptah_semantic_authority'] is False, d09
          assert deep['status'] == 'pass', deep
          assert deep['mechanical_capability_count'] == 22, deep
          assert deep['fixture_count'] == 20, deep
          assert deep['gap_mapping_count'] == 28, deep
          assert deep['new_core_entity_required'] is False, deep
          assert deep['frozen_contract_change_required'] is False, deep
          assert deep['runtime_implementation_authorized'] is False, deep
          assert ai['status'] == 'candidate_valid_non_operative', ai
          assert ai['ptah_decision_authority'] is False, ai
          assert ai['ptah_context_selection_authority'] is False, ai
          assert ai['ptah_review_authority'] is False, ai
          assert ai['runtime_implementation_authorized'] is False, ai
          PY

      - name: Prove human agent concurrency recovery rollback provenance and security
        shell: bash
        run: |
          set -euo pipefail
          PROOF="$RUNNER_TEMP/d09-proof"
          cargo test -p ptah-control --test d01_acceptance --locked -- --nocapture \
            2>&1 | tee "$PROOF/d01-acceptance.txt"
          cargo test -p ptah-ai-workspace --test d02_acceptance --locked -- --nocapture \
            2>&1 | tee "$PROOF/d02-acceptance.txt"
          cargo test -p ptah-activity-runtime --locked -- --nocapture \
            2>&1 | tee "$PROOF/a04-activity-runtime.txt"
          cargo test -p ptah-checkpoint --test a13 --locked -- --nocapture \
            2>&1 | tee "$PROOF/a13-recovery.txt"
          cargo test -p ptah-checkpoint --test b06 --locked -- --nocapture \
            2>&1 | tee "$PROOF/b06-session-vault.txt"

          d05_count="$(cargo test -p ptah-package-plugin --test d05_acceptance --locked -- --list 2>/dev/null | grep -c ': test$')"
          d06_count="$(cargo test -p ptah-provenance --test d06_acceptance --locked -- --list 2>/dev/null | grep -c ': test$')"
          d07_count="$(cargo test -p ptah-security-evidence --test d07_acceptance --locked -- --list 2>/dev/null | grep -c ': test$')"
          test "$d05_count" -eq 30
          test "$d06_count" -eq 30
          test "$d07_count" -eq 30
          printf 'd05=%s\nd06=%s\nd07=%s\n' "$d05_count" "$d06_count" "$d07_count" \
            > "$PROOF/d05-d07-counts.txt"

          cargo test -p ptah-package-plugin --test d05_acceptance --locked -- --nocapture \
            2>&1 | tee "$PROOF/d05-acceptance.txt"
          cargo test -p ptah-provenance --test d06_acceptance --locked -- --nocapture \
            2>&1 | tee "$PROOF/d06-acceptance.txt"
          cargo test -p ptah-provenance --test store_roundtrip --locked -- --nocapture \
            2>&1 | tee "$PROOF/d06-store-roundtrip.txt"
          cargo test -p ptah-security-evidence --test d07_acceptance --locked -- --nocapture \
            2>&1 | tee "$PROOF/d07-acceptance.txt"
          cargo test -p ptah-security-evidence --test store_roundtrip --locked -- --nocapture \
            2>&1 | tee "$PROOF/d07-store-roundtrip.txt"

      - name: Prove exact D08 Application truth remains 25 plus 3
        shell: bash
        run: |
          set -euo pipefail
          PROOF="$RUNNER_TEMP/d09-proof"
          cargo test -p ptah-application-runtime --test d08_acceptance --locked -- --list \
            2>&1 | tee "$PROOF/d08-runtime-list.txt"
          cargo test -p ptah-control --test d08_application_projection --locked -- --list \
            2>&1 | tee "$PROOF/d08-shell-list.txt"
          runtime_count="$(grep -c ': test$' "$PROOF/d08-runtime-list.txt")"
          shell_count="$(grep -c ': test$' "$PROOF/d08-shell-list.txt")"
          test "$runtime_count" -eq 25
          test "$shell_count" -eq 3
          test "$((runtime_count + shell_count))" -eq 28
          cargo test -p ptah-application-runtime --test d08_acceptance --locked -- --nocapture \
            2>&1 | tee "$PROOF/d08-runtime-acceptance.txt"
          cargo test -p ptah-control --test d08_application_projection --locked -- --nocapture \
            2>&1 | tee "$PROOF/d08-shell-acceptance.txt"

      - name: Prove operative public private Apache and full locked Workspace boundaries
        shell: bash
        run: |
          set -euo pipefail
          PROOF="$RUNNER_TEMP/d09-proof"
          PYTHONPATH=tools python3 -m unittest -v tools/test_check_apache2_boundary_acceptance.py \
            2>&1 | tee "$PROOF/apache-boundary-regressions.txt"
          python3 tools/check_apache2_boundary_acceptance.py \
            --repo-root . --output "$PROOF/apache-boundary-validation.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(
              (Path(os.environ['RUNNER_TEMP'])/'d09-proof/apache-boundary-validation.json').read_text()
          )
          assert report['status'] == 'owner_accepted_operative_verified', report
          assert report['apache_2_0_accepted'] is True, report
          assert report['runtime_implementation_authorized'] is False, report
          PY
          cargo fmt --all -- --check
          printf 'FORMAT_CHECK_OK\n' > "$PROOF/format-check.txt"
          cargo test --workspace --locked -- --nocapture 2>&1 | tee "$PROOF/workspace-tests.txt"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Bind immutable D09 release evidence bundle
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          PROOF="$RUNNER_TEMP/d09-proof"
          cp D09_FULL_WORKSPACE_RELEASE_ACCEPTANCE.md "$PROOF/release-instructions.txt"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          proof = Path(os.environ['RUNNER_TEMP'])/'d09-proof'
          limitations = {
              'schema_version': '0.1.0',
              'record_type': 'ptah.d09.full_workspace_release_limitations',
              'limitations': [
                  'GitHub-hosted Ubuntu proof is CI-host evidence, not proof of a separately pinned production machine.',
                  'D09 does not complete Programme E distributed Ptah.',
                  'D09 does not complete Programme F OS-ready packaging.',
                  'D09 does not make deferred D08 remote platforms available.',
                  'D09 does not grant Ptah semantic context, review, approval, result-acceptance or next-action authority.',
                  'D09 does not erase negative, partial, failed, inconclusive, contradictory or regressed evidence.',
                  'D09 does not widen public access to private records or restricted adapters.',
              ],
          }
          (proof/'limitations.json').write_text(
              json.dumps(limitations, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

          PYTHONPATH=tools python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from check_d09_full_workspace_release import require_report_files

          proof = Path(os.environ['RUNNER_TEMP'])/'d09-proof'
          required = [
              'exact-head.txt', 'd08-predecessor.txt', 'roadmap-authority.txt',
              'host-os-release.txt', 'host-uname.txt', 'rustc-version.txt', 'cargo-version.txt',
              'action-pin-audit.txt', 'phase0c-scaffold-validation.txt',
              'Cargo.lock.repository', 'cargo-metadata.json',
              'rust-dependency-lock.json', 'backend-lock-identity.json',
              'd09-regressions.txt', 'd09-validation.json',
              'deep-workspace-regressions.txt', 'deep-workspace-validation.json',
              'ai-workspace-regressions.txt', 'ai-workspace-validation.json',
              'd01-acceptance.txt', 'd02-acceptance.txt', 'a04-activity-runtime.txt',
              'a13-recovery.txt', 'b06-session-vault.txt', 'd05-d07-counts.txt',
              'd05-acceptance.txt', 'd06-acceptance.txt', 'd06-store-roundtrip.txt',
              'd07-acceptance.txt', 'd07-store-roundtrip.txt',
              'd08-runtime-list.txt', 'd08-shell-list.txt',
              'd08-runtime-acceptance.txt', 'd08-shell-acceptance.txt',
              'apache-boundary-regressions.txt', 'apache-boundary-validation.json',
              'format-check.txt', 'workspace-tests.txt',
              'limitations.json', 'release-instructions.txt',
          ]
          files = require_report_files(proof, required)
          head = (proof/'exact-head.txt').read_text(encoding='utf-8').strip()
          if head != os.environ['TARGET_SHA']:
              raise SystemExit('D09 bundle exact head mismatch')

          d09 = json.loads((proof/'d09-validation.json').read_text())
          deep = json.loads((proof/'deep-workspace-validation.json').read_text())
          ai = json.loads((proof/'ai-workspace-validation.json').read_text())
          apache = json.loads((proof/'apache-boundary-validation.json').read_text())

          bundle = {
              'schema_version': '0.1.0',
              'record_type': 'ptah.d09.full_workspace_release_exact_head_bundle',
              'status': 'pass',
              'implementation_commit': head,
              'd08_predecessor': os.environ['D08_BASE'],
              'roadmap_authority': os.environ['ROADMAP_AUTHORITY'],
              'workflow_run_id': os.environ['RUN_ID'],
              'workflow_run_attempt': os.environ['RUN_ATTEMPT'],
              'd09_case_count': d09['case_count'],
              'deep_workspace_case_count': 26,
              'deep_workspace_capability_count': deep['mechanical_capability_count'],
              'deep_workspace_fixture_count': deep['fixture_count'],
              'd08_runtime_cases': 25,
              'd08_shell_cases': 3,
              'participants': d09['participants'],
              'ptah_semantic_authority': False,
              'ptah_decision_authority': ai['ptah_decision_authority'],
              'ptah_context_selection_authority': ai['ptah_context_selection_authority'],
              'ptah_review_authority': ai['ptah_review_authority'],
              'apache_boundary_status': apache['status'],
              'files': files,
          }

          if bundle['d09_case_count'] != 10:
              raise SystemExit('D09 case count drifted')
          if bundle['deep_workspace_capability_count'] != 22:
              raise SystemExit('deep Workspace capability count drifted')
          if bundle['deep_workspace_fixture_count'] != 20:
              raise SystemExit('deep Workspace fixture count drifted')
          if bundle['participants'] != ['human', 'hunter', 'sergeant']:
              raise SystemExit('D09 participant set drifted')
          if any(bundle[key] is not False for key in (
              'ptah_semantic_authority',
              'ptah_decision_authority',
              'ptah_context_selection_authority',
              'ptah_review_authority',
          )):
              raise SystemExit('D09 authority drift detected')

          rendered = json.dumps(bundle, indent=2, sort_keys=True) + '\n'
          (proof/'report-bundle.json').write_text(rendered, encoding='utf-8')
          digest = hashlib.sha256(rendered.encode()).hexdigest()
          (proof/'report-bundle.sha256').write_text(
              f'{digest}  report-bundle.json\n', encoding='utf-8'
          )
          print(rendered, end='')
          PY

          cd "$PROOF"
          sha256sum -c report-bundle.sha256

      - name: Confirm exact clean candidate after proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Retain exact-head D09 Full Workspace release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d09-full-workspace-release-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/d09-proof/
          if-no-files-found: error
          retention-days: 90
