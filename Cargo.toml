[workspace]
resolver = "3"
members = [
  "crates/ptah-contracts",
  "crates/ptah-identifiers",
  "crates/ptah-ledger",
  "crates/ptah-events",
  "crates/ptah-receipts",
  "crates/ptah-node-agent",
  "crates/ptah-activity-runtime",
  "crates/ptah-workspace",
  "crates/ptah-ai-workspace",
  "crates/ptah-knowledge-search",
  "crates/ptah-recipe-registry",
  "crates/ptah-package-plugin",
  "crates/ptah-provenance",
  "crates/ptah-security-evidence",
  "crates/ptah-object-store",
  "crates/ptah-transfer",
  "crates/ptah-provider-api",
  "crates/ptah-device-runtime",
  "crates/ptah-android-runtime",
  "crates/ptah-browser-runtime",
  "crates/ptah-checkpoint",
  "crates/ptah-archive-decomposition",
  "services/ptah-node",
  "services/ptah-control",
  "adapters/container-oci",
  "adapters/git-cli",
  "adapters/decomposition-libarchive",
  "adapters/database-sqlite",
  "adapters/native-process",
  "adapters/ttg-device-xray",
  "adapters/ttg-device-workloads",
  "evidence/rust-dependency-lock",
]

[workspace.package]
version = "0.0.0-phase0c"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
nix = { version = "=0.30.1", default-features = false, features = ["fs", "process", "signal", "socket", "term", "user"] }
portable-pty = { version = "=0.9.0", default-features = false }
rusqlite = { version = "=0.37.0", default-features = false, features = ["backup", "blob", "hooks", "limits", "trace"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145" }
sha2 = { version = "=0.10.9" }
thiserror = { version = "=2.0.17" }
tokio = { version = "=1.48.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { version = "=0.1.41", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "fmt", "json", "registry"] }
uuid = { version = "=1.18.1", features = ["serde", "v4", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
