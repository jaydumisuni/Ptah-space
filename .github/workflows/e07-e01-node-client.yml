name: E07 Deployment-Owned E01 Node Client Qualification

on:
  push:
    branches:
      - qualification/e07-enrollment-client-20261014
    paths:
      - services/ptah-node/src/bin/ptah-e01-node-client.rs
      - services/ptah-node/Cargo.toml
      - Cargo.lock
      - docs/plans/2026-10-14-e07-e01-node-client.md
      - tools/e07/windows-node-custody-selftest.ps1
      - tools/e07/windows-e01-fixture-seed.ps1
      - services/ptah-node/src/bin/e07-windows-custody.ps1
      - .github/workflows/e07-e01-node-client.yml
  pull_request:
    branches:
      - qualification/e07-creative-recipe-20261014
    paths:
      - services/ptah-node/src/bin/ptah-e01-node-client.rs
      - services/ptah-node/Cargo.toml
      - Cargo.lock
      - docs/plans/2026-10-14-e07-e01-node-client.md
      - tools/e07/windows-node-custody-selftest.ps1
      - tools/e07/windows-e01-fixture-seed.ps1
      - services/ptah-node/src/bin/e07-windows-custody.ps1
      - .github/workflows/e07-e01-node-client.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e01-node-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy
      - name: Verify formatting
        run: rustfmt --edition 2024 --check services/ptah-node/src/bin/ptah-e01-node-client.rs services/ptah-node/tests/e07_node_client_contract.rs
      - name: Validate no-credential fail-closed Linux Node client tests
        run: cargo test --locked -p ptah-node --bin ptah-e01-node-client
      - name: Prove real binary fails before identity consumption
        run: cargo test --locked -p ptah-node --test e07_node_client_contract
      - name: Validate existing E01 authenticated Control test authority
        run: cargo test --locked -p ptah-control --test gateway_mtls_enrollment
      - name: Strict production-facing binary lint
        run: cargo clippy --locked -p ptah-node --bin ptah-e01-node-client -- -D warnings
      - name: Strict external binary regression lint
        run: cargo clippy --locked -p ptah-node --test e07_node_client_contract -- -D warnings
      - name: Build bounded non-dispatching executable
        run: cargo build --locked -p ptah-node --bin ptah-e01-node-client
      - name: No deployment identities are manufactured in CI
        run: echo "CI evidence is NOT live production E01 admission or a valid E02 lease."

  windows-unprovisioned-node-client:
    name: "Windows E01 client native startup — non-authorizing"
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact-head source check
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:EXPECTED_HEAD) { throw "wrong E01 client head" }
      - name: Compile native E01 Node client for Windows
        shell: pwsh
        run: cargo build --locked -p ptah-node --bin ptah-e01-node-client
      - name: Native Rust Windows protected-state and restart tests
        shell: pwsh
        run: cargo test --locked -p ptah-node --bin ptah-e01-node-client -- --nocapture
      - name: Unprovisioned Windows E01 client must refuse
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $client = ".\\target\\debug\\ptah-e01-node-client.exe"
          if (-not (Test-Path $client)) { throw "native E01 client missing" }
          & $client
          if ($LASTEXITCODE -ne 2) { throw "unprovisioned E01 client returned $LASTEXITCODE (expected 2)" }
          $global:LASTEXITCODE = 0
      - name: Compile-only E01 client for physical host qualification
        uses: actions/upload-artifact@v4
        with:
          name: e07-windows-e01-node-client-non-deployable
          path: target/debug/ptah-e01-node-client.exe
          retention-days: 2
      - name: Windows DPAPI, atomic replacement, ACL and restart-lock custody test
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP ('ptah-e07-disposable-custody-' + [guid]::NewGuid().ToString('N'))
          & .\tools\e07\windows-node-custody-selftest.ps1 -Root $root -SelfTest
          if (-not $?) { throw 'Windows disposable Node custody self-test failed' }
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Unexpected Windows custody status' }
      - name: Preserve no-go boundary
        shell: pwsh
        run: Write-Output "Compilation and refusal only; no Windows Node state ACL admission, TLS enrollment, installed service or E07 acceptance."
