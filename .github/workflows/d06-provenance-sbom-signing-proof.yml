name: D06 Provenance SBOM Signing exact-head proof

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "D06_PROVENANCE_SBOM_SIGNING.md"
      - "crates/ptah-provenance/**"
      - "docs/superpowers/plans/2026-09-02-d06-provenance-sbom-signing.md"
      - "docs/superpowers/specs/2026-09-02-d06-provenance-sbom-signing-design.md"
      - ".github/workflows/d06-provenance-sbom-signing-proof.yml"

permissions:
  contents: read

env:
  PTAH_EXACT_SHA: ${{ github.event.pull_request.head.sha }}
  PTAH_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  PTAH_D05_SHA: d8202855a234b9bb4b45d34d96bd45d4d68e80fa
  CARGO_TERM_COLOR: always

jobs:
  d06-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact D06 candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PTAH_EXACT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Lock exact D05 predecessor and D06 scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PTAH_EXACT_SHA"
          test "$PTAH_BASE_SHA" = "$PTAH_D05_SHA"
          git merge-base --is-ancestor "$PTAH_D05_SHA" "$PTAH_EXACT_SHA"
          test -z "$(git rev-list --merges "$PTAH_D05_SHA..$PTAH_EXACT_SHA")"
          python - <<'PY'
          import os, subprocess
          base=os.environ["PTAH_D05_SHA"]; head=os.environ["PTAH_EXACT_SHA"]
          files=set(subprocess.check_output(["git","diff","--name-only",base,head], text=True).splitlines())
          allowed=lambda p: p in {
              "Cargo.toml","Cargo.lock","D06_PROVENANCE_SBOM_SIGNING.md",
              ".github/workflows/d06-provenance-sbom-signing-proof.yml",
              "docs/superpowers/plans/2026-09-02-d06-provenance-sbom-signing.md",
              "docs/superpowers/specs/2026-09-02-d06-provenance-sbom-signing-design.md",
          } or p.startswith("crates/ptah-provenance/")
          bad=sorted(p for p in files if not allowed(p)); assert not bad, bad
          required={
              "Cargo.toml","Cargo.lock","D06_PROVENANCE_SBOM_SIGNING.md",
              ".github/workflows/d06-provenance-sbom-signing-proof.yml",
              "docs/superpowers/plans/2026-09-02-d06-provenance-sbom-signing.md",
              "docs/superpowers/specs/2026-09-02-d06-provenance-sbom-signing-design.md",
              "crates/ptah-provenance/Cargo.toml","crates/ptah-provenance/src/lib.rs",
              "crates/ptah-provenance/src/error.rs","crates/ptah-provenance/src/subject.rs",
              "crates/ptah-provenance/src/store.rs","crates/ptah-provenance/src/sbom.rs",
              "crates/ptah-provenance/src/attestation.rs","crates/ptah-provenance/src/trust.rs",
              "crates/ptah-provenance/src/signature.rs","crates/ptah-provenance/src/oci.rs",
              "crates/ptah-provenance/src/proof_bundle.rs","crates/ptah-provenance/src/reproduction.rs",
              "crates/ptah-provenance/tests/d06_acceptance.rs","crates/ptah-provenance/tests/store_roundtrip.rs",
          }
          assert not sorted(required-files), sorted(required-files)
          frozen=[p for p in files if p.startswith(("contracts/","schemas/","migrations/")) or p=="crates/ptah-contracts/src/generated.rs"]
          assert not frozen, frozen
          PY
          git diff --check "$PTAH_D05_SHA" "$PTAH_EXACT_SHA"

      - name: Prove D06-only Cargo lock delta
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess, tomllib
          base=os.environ["PTAH_D05_SHA"]
          old=tomllib.loads(subprocess.check_output(["git","show",f"{base}:Cargo.lock"],text=True))
          new=tomllib.load(open("Cargo.lock","rb"))
          key=lambda p:(p["name"],p["version"],p.get("source"))
          before={key(p):p for p in old["package"]}; after={key(p):p for p in new["package"]}
          assert not (set(before)-set(after))
          assert sorted(set(after)-set(before)) == [("ptah-provenance","0.0.0-phase0c",None)]
          assert not [k for k in before.keys() & after.keys() if before[k] != after[k]]
          expected={"ptah-identifiers","ptah-ledger","serde","serde_json","sha2","thiserror 2.0.17"}
          assert set(after[("ptah-provenance","0.0.0-phase0c",None)].get("dependencies",[])) == expected
          PY

      - name: Install pinned Rust 1.97.1
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
          mkdir -p /tmp/d06-proof
          rustc -V | tee /tmp/d06-proof/rustc-version.txt
          cargo -V | tee /tmp/d06-proof/cargo-version.txt
          rustc -V | grep -q '^rustc 1.97.1 '
          cargo -V | grep -q '^cargo 1.97.1 '

      - name: Prove dependency, schema-map and static authority policy
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/d06-proof/Cargo.lock.repository
          cargo metadata --locked --format-version 1 > /tmp/d06-proof/cargo-metadata.json
          cmp -s Cargo.lock /tmp/d06-proof/Cargo.lock.repository
          python tools/check_rust_dependency_lock.py --output /tmp/d06-proof/dependency-lock-report.json
          python -c 'import json; p=json.load(open("/tmp/d06-proof/dependency-lock-report.json")); assert p["git_dependency_count"] == 0, p'
          cargo fmt --all -- --check
          cargo clippy -p ptah-provenance --all-targets --locked -- -D warnings -W clippy::pedantic
          grep -q '^#!\[forbid(unsafe_code)\]' crates/ptah-provenance/src/lib.rs
          ! grep -R -n '#\[allow' crates/ptah-provenance
          ! grep -R -n -E 'TODO|FIXME|todo!\(|unimplemented!\(|unsafe[[:space:]]*\{' crates/ptah-provenance/src crates/ptah-provenance/tests
          ! grep -R -nEi 'pub[[:space:]]+(password|api[_-]?key|raw[_-]?secret|secret[_-]?value|credential[_-]?value)' crates/ptah-provenance/src
          ! grep -R -nE '^pub fn (choose_provider|approve_release|grant_trust|auto_sign|publish_transparency|promote|accept_release)' crates/ptah-provenance/src
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('crates/ptah-provenance/src/store.rs').read_text()
          pairs=set(re.findall(r'\(\s*"([^"]+)"\s*,\s*"([^"]+)"\s*,?\s*\)', text, re.S))
          expected={
            ('urn:ptah:schema:build:package-observation:0.1.0','provenance.package_observation'),
            ('urn:ptah:schema:build:sbom-coverage:0.1.0','provenance.sbom_coverage'),
            ('urn:ptah:schema:build:sbom:0.1.0','provenance.sbom'),
            ('urn:ptah:schema:build:trust-policy:0.1.0','provenance.trust_policy'),
            ('urn:ptah:schema:build:transparency-evidence:0.1.0','provenance.transparency_evidence'),
            ('urn:ptah:schema:build:attestation:0.1.0','provenance.attestation'),
            ('urn:ptah:schema:build:attestation-verification:0.1.0','provenance.attestation_verification'),
            ('urn:ptah:schema:build:signature:0.1.0','provenance.signature'),
            ('urn:ptah:schema:build:signature-verification:0.1.0','provenance.signature_verification'),
            ('urn:ptah:schema:build:proof-bundle:0.1.0','provenance.proof_bundle'),
            ('urn:ptah:schema:build:verification-run:0.1.0','provenance.verification_run'),
            ('urn:ptah:schema:build:reproduction-request:0.1.0','provenance.reproduction_request'),
            ('urn:ptah:schema:build:reproduction-run:0.1.0','proof.reproduction_run'),
            ('urn:ptah:schema:build:reproduction-comparison:0.1.0','proof.comparison'),
            ('urn:ptah:schema:build:provenance-graph-revision:0.1.0','provenance.graph_revision'),
          }
          assert pairs == expected, (pairs ^ expected)
          PY

      - name: Prove exactly 30 D06 cases, A03 store and predecessor regressions
        run: |
          set -euo pipefail
          count=$(cargo test -p ptah-provenance --test d06_acceptance --locked -- --list | grep -c ': test$')
          test "$count" -eq 30
          printf '%s\n' "$count" > /tmp/d06-proof/d06-test-count.txt
          cargo test -p ptah-provenance --locked
          cargo test -p ptah-ledger -p ptah-activity-runtime -p ptah-object-store --locked
          cargo test -p git-cli -p container-oci -p ptah-recipe-registry -p ptah-package-plugin --locked

      - name: Prove complete locked workspace
        run: |
          set -euo pipefail
          workspace_count=$(cargo test --workspace --locked -- --list | grep -c ': test$')
          printf '%s\n' "$workspace_count" > /tmp/d06-proof/workspace-test-count.txt
          cargo test --workspace --locked

      - name: Build exact-head proof record
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path('/tmp/d06-proof'); base=os.environ['PTAH_D05_SHA']; head=os.environ['PTAH_EXACT_SHA']
          files=subprocess.check_output(['git','diff','--name-only',base,head],text=True).splitlines()
          hashes={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files}
          payload={
            'record_type':'ptah.programme_d.d06.provenance_sbom_signing_exact_head_proof',
            'schema_version':'0.1.0','created_at':datetime.now(timezone.utc).isoformat(timespec='seconds'),
            'implementation_commit':head,'implementation_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
            'base_commit':base,'exact_head_match':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==head,
            'linear_from_d05':not bool(subprocess.check_output(['git','rev-list','--merges',f'{base}..{head}'],text=True).strip()),
            'commit_count':int(subprocess.check_output(['git','rev-list','--count',f'{base}..{head}'],text=True).strip()),
            'cargo_lock_sha256':hashlib.sha256(Path('Cargo.lock').read_bytes()).hexdigest(),
            'd06_acceptance_count':int((root/'d06-test-count.txt').read_text()),
            'workspace_test_count':int((root/'workspace-test-count.txt').read_text()),
            'changed_file_sha256':hashes,'status':'exact_head_d06_proof_passed',
          }
          assert payload['exact_head_match'] and payload['linear_from_d05'] and payload['d06_acceptance_count']==30
          (root/'d06-proof.json').write_text(json.dumps(payload,indent=2)+'\n')
          (root/'repository-hashes.sha256').write_text(''.join(f'{digest}  {path}\n' for path,digest in sorted(hashes.items())))
          PY
          sha256sum /tmp/d06-proof/d06-proof.json | tee /tmp/d06-proof/d06-proof.sha256
          git status --porcelain=v1 > /tmp/d06-proof/git-status.txt
          test ! -s /tmp/d06-proof/git-status.txt

      - name: Upload retained D06 proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d06-provenance-sbom-signing-${{ env.PTAH_EXACT_SHA }}
          path: /tmp/d06-proof/
          if-no-files-found: error
          retention-days: 30
