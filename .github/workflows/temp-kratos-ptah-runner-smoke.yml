name: TEMP KRATOS Ptah Runner Control

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-kratos-ptah-runner-smoke.yml"

permissions:
  contents: read

jobs:
  control:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 3
    steps:
      - name: Cancel duplicate Prime bootstrap and inspect runners
        shell: bash
        run: |
          set -euo pipefail
          gh api -X POST repos/jaydumisuni/Prime-OS/actions/runs/32635464906/cancel >/dev/null 2>&1 || true
          echo '--- PTAH RUNNERS ---'
          gh api repos/jaydumisuni/Ptah-space/actions/runners --jq '.runners[] | {name,status,busy,os,labels:[.labels[].name]}'
          echo '--- ORACLE RUNNERS ---'
          gh api repos/jaydumisuni/Oracle-/actions/runners --jq '.runners[] | {name,status,busy,os,labels:[.labels[].name]}'
          echo '--- KRATOS IDENTITY ---'
          printf 'host=%s\nuser=%s\narch=%s\n' "$(hostname)" "$(id -un)" "$(uname -m)"
