name: Temporary Oracle Runner Registry Probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-oracle-runner-registry.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 4
    steps:
      - name: Read Oracle repository self-hosted runners
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/jaydumisuni/Oracle-/actions/runners --jq '{total_count, runners: [.runners[] | {id,name,os,status,busy,version,labels:[.labels[].name]}]}'

      - name: Discover reachable hosts on KRATOS owner LAN
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import concurrent.futures, subprocess, ipaddress, socket, json, time
          network=ipaddress.ip_network('192.168.37.0/24')
          local='192.168.37.149'
          gateway='192.168.37.229'
          def alive(ip):
              if str(ip)==local: return None
              r=subprocess.run(['ping','-c','1','-W','1',str(ip)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              return str(ip) if r.returncode==0 else None
          with concurrent.futures.ThreadPoolExecutor(max_workers=64) as ex:
              hosts=[x for x in ex.map(alive, network.hosts()) if x]
          print('LIVE_HOSTS='+json.dumps(hosts))
          ports=[22,135,139,445,3389,5985,5986,5056,5059]
          results=[]
          for ip in hosts:
              if ip==gateway:
                  kind='gateway'
              else:
                  kind='candidate'
              item={'ip':ip,'kind':kind,'ports':{},'reverse_dns':None}
              try: item['reverse_dns']=socket.gethostbyaddr(ip)[0]
              except Exception: pass
              for port in ports:
                  s=socket.socket(socket.AF_INET,socket.SOCK_STREAM); s.settimeout(0.6)
                  try:
                      s.connect((ip,port)); item['ports'][str(port)]='open'
                  except ConnectionRefusedError: item['ports'][str(port)]='refused'
                  except Exception: item['ports'][str(port)]='filtered'
                  finally: s.close()
              results.append(item)
          print(json.dumps(results,indent=2,sort_keys=True))
          PY
          echo '--- neighbor table after sweep ---'
          ip neigh show || true
