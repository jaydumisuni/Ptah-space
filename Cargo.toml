[workspace]
resolver = "3"
members = [
  "crates/ptah-contracts",
  "crates/ptah-identifiers",
  "crates/ptah-ledger",
  "crates/ptah-events",
  "crates/ptah-receipts",
  "crates/ptah-node-agent",
  "crates/ptah-activity-runtime",
  "crates/ptah-workspace",
  "crates/ptah-object-store",
  "crates/ptah-transfer",
  "crates/ptah-provider-api",
  "crates/ptah-checkpoint",
  "services/ptah-node",
  "services/ptah-control",
  "adapters/container-oci",
  "adapters/git-cli",
  "adapters/decomposition-libarchive",
]

[workspace.package]
version = "0.0.0-phase0c"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
