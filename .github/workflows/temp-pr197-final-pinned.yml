name: Temporary PR197 Elevated Boot and Pre-login Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-pr197-final-pinned.yml"

permissions:
  contents: read

env:
  ORACLE_SHA: 299165caa11d936ceb05ef4d055f043faed12eed
  CONTROL_SHA: 8574c0abbf3c7bca2e2129441817e5359bffe7a3

jobs:
  boot-elevate-reboot:
    runs-on: [self-hosted, athena, ptah]
    timeout-minutes: 10
    steps:
      - name: Launch fixed elevated Boot proof and validate before reboot
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $work=Join-Path $env:TEMP ('oracle-pr197-uac-'+[guid]::NewGuid().ToString('N'))
          $resultPath=Join-Path $env:LOCALAPPDATA 'OracleRelay\pr197-boot-elevated-result.json'
          try {
            & gh repo clone jaydumisuni/Oracle- $work -- --no-checkout
            if($LASTEXITCODE -ne 0){throw 'ORACLE_CLONE_FAILED'}
            & git -C $work fetch --depth 1 origin $env:CONTROL_SHA
            if($LASTEXITCODE -ne 0){throw 'CONTROL_FETCH_FAILED'}
            & git -C $work checkout --detach FETCH_HEAD
            if($LASTEXITCODE -ne 0){throw 'CONTROL_CHECKOUT_FAILED'}
            if((& git -C $work rev-parse HEAD).Trim() -ne $env:CONTROL_SHA){throw 'CONTROL_HEAD_MISMATCH'}
            $attempt=Join-Path $work 'oracle_control\tmp\pr197-boot-attempt.ps1'
            $launcher=Join-Path $work 'oracle_control\tmp\pr197-launch-uac.ps1'
            if(-not(Test-Path -LiteralPath $attempt)){throw 'BOOT_ATTEMPT_MISSING'}
            if(-not(Test-Path -LiteralPath $launcher)){throw 'UAC_LAUNCHER_MISSING'}
            $attemptText=Get-Content -LiteralPath $attempt -Raw
            if($attemptText -notmatch [regex]::Escape("Resolve-Path (Join-Path `$PSScriptRoot '..\..')")){throw 'FIXED_REPO_PATH_NOT_PRESENT'}
            Remove-Item -LiteralPath $resultPath -Force -ErrorAction SilentlyContinue
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $launcher
            if($LASTEXITCODE -ne 0){throw 'UAC_LAUNCH_FAILED'}
            Write-Output 'UAC_PROMPT_LAUNCHED=TRUE'
            $deadline=(Get-Date).AddMinutes(3)
            while((Get-Date) -lt $deadline -and -not(Test-Path -LiteralPath $resultPath)){
              Start-Sleep -Seconds 2
            }
            if(-not(Test-Path -LiteralPath $resultPath)){throw 'ELEVATED_RESULT_TIMEOUT'}
            $outer=Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
            Write-Output ('ELEVATED='+[string]$outer.elevated+' USER='+[string]$outer.user+' COMPLETED='+[string]$outer.completedAt)
            if($outer.elevated -ne $true){throw 'ELEVATION_NOT_PROVEN'}
            if($outer.PSObject.Properties.Name -contains 'error'){throw ('ELEVATED_WRAPPER_ERROR '+[string]$outer.error)}
            $innerText=if($outer.output -is [System.Array]){[string]::Join([Environment]::NewLine,[string[]]$outer.output)}else{[string]$outer.output}
            if([string]::IsNullOrWhiteSpace($innerText)){throw 'BOOT_RESULT_EMPTY'}
            $inner=$innerText | ConvertFrom-Json
            Write-Output ('BOOT_RESULT='+($inner|ConvertTo-Json -Compress -Depth 12))
            if([string]$inner.Head -ne $env:ORACLE_SHA){throw ('BOOT_HEAD_MISMATCH '+[string]$inner.Head)}
            if($inner.BootSucceeded -ne $true){throw ('BOOT_INSTALL_FAILED '+[string]$inner.BootError)}
            $node=Get-ScheduledTask -TaskName 'Oracle Always-On Node' -ErrorAction Stop
            $watch=Get-ScheduledTask -TaskName 'Oracle Node Watchdog' -ErrorAction Stop
            $nodeTriggers=@($node.Triggers|ForEach-Object{$_.CimClass.CimClassName})
            $watchTriggers=@($watch.Triggers|ForEach-Object{$_.CimClass.CimClassName})
            if([string]$node.Principal.LogonType -ne 'S4U'){throw ('NODE_LOGON_NOT_S4U '+$node.Principal.LogonType)}
            if([string]$watch.Principal.LogonType -ne 'S4U'){throw ('WATCH_LOGON_NOT_S4U '+$watch.Principal.LogonType)}
            if(-not[bool]$node.Settings.Enabled){throw 'NODE_DISABLED'}
            if(-not[bool]$watch.Settings.Enabled){throw 'WATCH_DISABLED'}
            if($nodeTriggers -notcontains 'MSFT_TaskBootTrigger'){throw ('NODE_TRIGGER_NOT_BOOT '+($nodeTriggers -join ','))}
            if($watchTriggers -notcontains 'MSFT_TaskBootTrigger'){throw ('WATCH_TRIGGER_NOT_BOOT '+($watchTriggers -join ','))}
            $ready=Invoke-RestMethod -Uri 'http://127.0.0.1:5059/ready' -TimeoutSec 5
            if($ready.ok -ne $true -or $ready.connected -ne $true -or [string]$ready.nodeId -ne 'ATHENA' -or [string]::IsNullOrWhiteSpace([string]$ready.connectionId)){throw ('READY_INVALID '+($ready|ConvertTo-Json -Compress))}
            Write-Output ('BOOT_S4U_PROOF=PASS CONNECTION='+$ready.connectionId)
            Write-Output 'REBOOT_AUTHORITY=PREAUTHORIZED_BY_OWNER'
            shutdown.exe /r /t 20 /f /d p:4:1 /c "Oracle PR197 pre-login persistence proof"
            if($LASTEXITCODE -ne 0){throw ('REBOOT_SCHEDULE_FAILED '+$LASTEXITCODE)}
            Write-Output 'REBOOT_SCHEDULED=20_SECONDS'
          } finally {
            Remove-Item -LiteralPath $work -Recurse -Force -ErrorAction SilentlyContinue
          }

  prelogin-live-proof:
    needs: [boot-elevate-reboot]
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 8
    steps:
      - name: Prove ATHENA returns to Oracle Live after reboot
        shell: bash
        env:
          ORACLE_LIVE_URL: https://oracle.thetechguyds.com
          ORACLE_NODE_ID: ATHENA
          ORACLE_LIVE_TOKEN_FILE: /home/kratos/.oracle/live-token
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          gh repo clone jaydumisuni/Oracle- "$work/repo" -- --no-checkout
          git -C "$work/repo" fetch --depth 1 origin "$ORACLE_SHA"
          git -C "$work/repo" checkout --detach FETCH_HEAD
          test "$(git -C "$work/repo" rev-parse HEAD)" = "$ORACLE_SHA"
          cd "$work/repo"
          npm ci --ignore-scripts --no-audit --no-fund >/dev/null
          sleep 20
          ok=0
          for attempt in $(seq 1 24); do
            echo "PRELOGIN_PROBE_ATTEMPT=$attempt"
            if node scripts/probe-oracle-live.mjs; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          echo "PRELOGIN_ORACLE_LIVE_PROOF=PASS HEAD=$ORACLE_SHA"
