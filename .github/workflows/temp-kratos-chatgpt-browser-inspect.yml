name: TEMP KRATOS Redmi sky mi_ext direct map

# activation: v7
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-kratos-chatgpt-browser-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, kratos, linux, x64, physical, ptah]
    timeout-minutes: 10
    steps:
      - name: Inventory accessible mi_ext logical partition read-only
        shell: bash
        run: |
          set -euo pipefail
          ADB="$(command -v adb || true)"
          if [[ -z "$ADB" && -x /home/kratos/.local/share/mibu-platform-tools/current/platform-tools/adb ]]; then
            ADB=/home/kratos/.local/share/mibu-platform-tools/current/platform-tools/adb
          fi
          test -x "$ADB"
          "$ADB" start-server >/dev/null
          "$ADB" get-state

          echo '=== HOST ROUTES BEFORE ==='
          ip route show default || true

          echo '=== MI_EXT ACCESS / MOUNT ==='
          "$ADB" shell 'ls -ld /mi_ext /mnt/vendor/mi_ext 2>&1 || true; mount 2>/dev/null | grep " on /mi_ext " || true; getprop | grep "partition.mi_ext" | sort || true'

          echo '=== MI_EXT TOPOLOGY ==='
          "$ADB" shell 'if [ -d /mi_ext ]; then find /mi_ext -maxdepth 4 -type d 2>/dev/null | sort | head -n 340; else echo MI_EXT_INACCESSIBLE; fi'

          echo '=== MI_EXT APK INVENTORY ==='
          "$ADB" shell 'if [ -d /mi_ext ]; then find /mi_ext -maxdepth 8 -type f -name "*.apk" 2>/dev/null | sort | head -n 420; fi'

          echo '=== MI_EXT REGION / GMS / PRELOAD FILES ==='
          "$ADB" shell 'if [ -d /mi_ext ]; then find /mi_ext -maxdepth 8 -type f 2>/dev/null | grep -Ei "google|gms|vending|phonesky|setup|region|cust|china|/cn[._/-]|miui|xiaomi|preload|market|search|voice|opcust" | sort | head -n 480; fi'

          echo '=== MI_EXT SMALL CONFIG REFERENCES ==='
          "$ADB" shell 'if [ -d /mi_ext ]; then find /mi_ext -maxdepth 8 -type f -size -524288c 2>/dev/null | sort | while IFS= read -r p; do m=$(grep -a -i -E "com\.google\.android\.gms|com\.google\.android\.gsf|com\.android\.vending|cn_chinatelecom|ro\.miui\.(region|build\.region|cust_variant)|romRegion|currentSku|preload|google" "$p" 2>/dev/null | head -n 16); if [ -n "$m" ]; then echo "--- $p"; printf "%s\n" "$m"; fi; done; fi'

          echo '=== MI_EXT COUNTS ==='
          "$ADB" shell 'if [ -d /mi_ext ]; then printf "files="; find /mi_ext -type f 2>/dev/null | wc -l; printf "apks="; find /mi_ext -type f -name "*.apk" 2>/dev/null | wc -l; printf "xml="; find /mi_ext -type f -name "*.xml" 2>/dev/null | wc -l; fi'

          echo '=== POST-PROBE ==='
          "$ADB" get-state
          ip route show default || true
          echo 'TTG_REDMI_MI_EXT_DIRECT_MAP=PASS'
