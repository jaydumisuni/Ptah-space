name: TEMP KRATOS ChatGPT Browser Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-kratos-chatgpt-browser-inspect.yml'

jobs:
  inspect:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 5
    steps:
      - name: Inspect Brave main process and DevTools endpoints
        shell: bash
        run: |
          set -euo pipefail
          echo '=== BRAVE MAIN PROCESS COMMANDS ==='
          ps -eo pid=,ppid=,args= | grep '/opt/brave.com/brave/brave' | grep -v grep | head -n 80 || true
          echo '=== DEVTOOLS ACTIVE PORT FILES ==='
          find "$HOME/.config/BraveSoftware/Brave-Browser" -maxdepth 3 -type f -name DevToolsActivePort -print -exec sed -n '1,4p' {} \; 2>/dev/null || true
          echo '=== LISTENERS ==='
          ss -ltnp 2>/dev/null | grep -E ':(9222|9223|5056|8765|[3-9][0-9]{4})\b' | head -n 120 || true
