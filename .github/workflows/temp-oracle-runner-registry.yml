name: Temporary Oracle Runner Registry Probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-oracle-runner-registry.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 3
    steps:
      - name: Read Oracle repository self-hosted runners
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/jaydumisuni/Oracle-/actions/runners --jq '{total_count, runners: [.runners[] | {id,name,os,status,busy,version,labels:[.labels[].name]}]}'

      - name: Identify ATHENA LAN neighbor and management surfaces
        shell: bash
        run: |
          set +e
          echo '--- local network ---'
          ip -brief address || true
          ip route || true
          ip neigh show || true
          echo '--- candidate 192.168.37.229 ---'
          ping -c 2 -W 2 192.168.37.229 2>&1 || true
          python3 - <<'PY'
          import socket, json, time
          ip='192.168.37.229'
          ports=[22,80,135,139,443,445,3389,5985,5986,5056,5059,7070]
          item={'ip':ip,'reverse_dns':None,'ports':{}}
          try: item['reverse_dns']=socket.gethostbyaddr(ip)[0]
          except Exception as exc: item['reverse_dns_error']=str(exc)
          for port in ports:
              s=socket.socket(socket.AF_INET,socket.SOCK_STREAM)
              s.settimeout(1.5)
              started=time.time()
              try:
                  s.connect((ip,port))
                  item['ports'][str(port)]={'state':'open','ms':round((time.time()-started)*1000,1)}
              except ConnectionRefusedError:
                  item['ports'][str(port)]={'state':'refused','ms':round((time.time()-started)*1000,1)}
              except Exception as exc:
                  item['ports'][str(port)]={'state':type(exc).__name__,'ms':round((time.time()-started)*1000,1)}
              finally: s.close()
          print(json.dumps(item,indent=2,sort_keys=True))
          PY
          echo '--- optional discovery tools ---'
          command -v nmblookup && nmblookup -A 192.168.37.229 || true
          command -v smbclient && smbclient -L //192.168.37.229 -N -m SMB3 2>&1 | head -n 40 || true
          command -v avahi-resolve-address && avahi-resolve-address 192.168.37.229 || true
