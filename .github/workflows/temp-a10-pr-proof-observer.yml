name: TEMP A10 immutable corrected observer proof

on:
  pull_request:
    branches:
      - a07-object-revision-artifact-local-cas

permissions:
  contents: read

jobs:
  prove-immutable-a10:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable corrected A10 target
        uses: actions/checkout@v4
        with:
          ref: 810eb04b6032913cbeb3b6473d3b3ca449fc1c07
          fetch-depth: 0

      - name: Install exact Ptah Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustc +1.97.1 --version --verbose
          cargo +1.97.1 --version
          rustfmt +1.97.1 --version
          cargo +1.97.1 clippy --version

      - name: Verify immutable target, exact A07 parent, scope and hashes
        shell: bash
        run: |
          set -euo pipefail
          TARGET=810eb04b6032913cbeb3b6473d3b3ca449fc1c07
          BASE=05e2e75b7a2069d0df74eb73f9b9ecd7cd17d0d4
          test "$(git rev-parse HEAD)" = "$TARGET"
          test "$(git rev-parse HEAD^)" = "$BASE"
          cat > /tmp/expected-scope <<'EOF'
          Cargo.lock
          adapters/container-oci/Cargo.toml
          adapters/container-oci/src/backend.rs
          adapters/container-oci/src/lib.rs
          adapters/container-oci/src/provider.rs
          adapters/container-oci/src/types.rs
          adapters/container-oci/tests/a10_acceptance.rs
          EOF
          git diff --name-only "$BASE" "$TARGET" | sort > /tmp/actual-scope
          sort /tmp/expected-scope -o /tmp/expected-scope
          diff -u /tmp/expected-scope /tmp/actual-scope
          printf '%s  %s\n' \
            702efc2c6fa9f95390297baf8ee7d7ab9a3bf37bcb6b37258fc86d6da6fb7fc8 Cargo.lock \
            8a2f6a62551bc503aaf3314586fdee4f67d94014ed5676b43d4ab81619a9d3c3 adapters/container-oci/Cargo.toml \
            fc1bc71621157d7a5091f8dd287a8ab51b7efd23eae70aa7136253d077742145 adapters/container-oci/src/backend.rs \
            74a8b4efd3adf9c8baca7198ad96dd6d39a3995f7f3c4a0f88365f4677022ad8 adapters/container-oci/src/lib.rs \
            9e9ac66af488daff5371c6288b10e54ea3e46c6b62b154ed6c15a8a580a07507 adapters/container-oci/src/provider.rs \
            c5fbbc1cb61a86441d548d9cd4ad8008a03f791f8294398b9a69fea10ba08192 adapters/container-oci/src/types.rs \
            c674a4f8b6a3db4a3d1b96c8bf465435b620ed04b18680ccae38fe5e14450bb4 adapters/container-oci/tests/a10_acceptance.rs \
            | sha256sum --check --strict

      - name: Verify exact containerd runc-binary support
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/containerd.tgz https://github.com/containerd/containerd/releases/download/v2.3.1/containerd-2.3.1-linux-amd64.tar.gz
          echo '628448bd973610c656c1cbea8e88b32fafd85b23cc1aa4a3372eb7198478c054  /tmp/containerd.tgz' | sha256sum --check --strict
          mkdir /tmp/containerd
          tar -xzf /tmp/containerd.tgz -C /tmp/containerd
          /tmp/containerd/bin/ctr run --help | grep -F -- '--runc-binary'
          grep -nF '.arg("--runc-binary")' adapters/container-oci/src/backend.rs
          grep -nF '.arg(&self.runc_path)' adapters/container-oci/src/backend.rs

      - name: Verify formatting and production hazard boundary
        shell: bash
        run: |
          set -euo pipefail
          for f in adapters/container-oci/src/*.rs adapters/container-oci/tests/*.rs; do
            rustfmt +1.97.1 --edition 2021 --check "$f"
          done
          if grep -R -nE 'unsafe[[:space:]]*\{|panic!|unwrap\(|expect\(|todo!|unimplemented!' adapters/container-oci/src; then
            echo 'production hazard construct found' >&2
            exit 1
          fi

      - name: Verify exact locked dependency universe
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 metadata --locked --format-version 1 > /tmp/metadata.json
          python3 - <<'PY'
          import tomllib
          with open('Cargo.lock','rb') as f:
              lock=tomllib.load(f)
          packages=lock['package']
          registry=sum(str(p.get('source','')).startswith('registry+') for p in packages)
          git=sum(str(p.get('source','')).startswith('git+') for p in packages)
          assert len(packages)==116, len(packages)
          assert registry==97, registry
          assert git==0, git
          c=next(p for p in packages if p['name']=='container-oci')
          assert c['dependencies']==[
              'ptah-activity-runtime','ptah-identifiers','ptah-provider-api','serde',
              'serde_json','sha2','thiserror 2.0.17'
          ], c['dependencies']
          print('resolved=116 registry=97 git=0')
          PY

      - name: Strict scoped Clippy
        run: cargo +1.97.1 clippy -p container-oci --all-targets --locked -- -D warnings

      - name: A10 behavior proof
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 test -p container-oci --locked
          COUNT="$(cargo +1.97.1 test -p container-oci --locked -- --list 2>/dev/null | awk '/: test$/ {n++} END {print n+0}')"
          test "$COUNT" = 15
          echo "A10_TESTS=$COUNT" >> "$GITHUB_ENV"

      - name: Full exact-predecessor workspace regression
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 test --workspace --locked
          COUNT="$(cargo +1.97.1 test --workspace --locked -- --list 2>/dev/null | awk '/: test$/ {n++} END {print n+0}')"
          test "$COUNT" = 166
          echo "WORKSPACE_TESTS=$COUNT" >> "$GITHUB_ENV"

      - name: Emit immutable proof manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          paths=[
            'Cargo.lock','adapters/container-oci/Cargo.toml','adapters/container-oci/src/backend.rs',
            'adapters/container-oci/src/lib.rs','adapters/container-oci/src/provider.rs',
            'adapters/container-oci/src/types.rs','adapters/container-oci/tests/a10_acceptance.rs'
          ]
          def h(p): return hashlib.sha256(open(p,'rb').read()).hexdigest()
          proof={
            'record_type':'ptah.phase0c.a10.oci_provider_runc_bound_immutable_proof',
            'target_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'target_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
            'parent':subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip(),
            'files':{p:h(p) for p in paths},
            'rust':'1.97.1',
            'dependency_resolution':{'resolved':116,'registry':97,'git':0},
            'containerd_version':'2.3.1',
            'containerd_archive_sha256':'628448bd973610c656c1cbea8e88b32fafd85b23cc1aa4a3372eb7198478c054',
            'runc_version':'1.4.2',
            'runc_binary_sha256':'ac8a90f9e225bb9322189937b230cdc5478d5753f0e31e1bda98a5cf06bd9539',
            'exact_runc_path_mechanical_binding':'pass',
            'a10_tests':int(os.environ['A10_TESTS']),
            'workspace_tests':int(os.environ['WORKSPACE_TESTS']),
            'rustfmt_edition_2021':'pass',
            'clippy_deny_warnings':'pass',
            'production_hazard_scan':'pass',
            'physical_runtime_qualification':'Kratos exact containerd 2.3.1 / runc 1.4.2 OCI boundary passed; Ubuntu 24.04.4 host-image profile not claimed',
            'status':'source_exact_head_proven'
          }
          with open('/tmp/a10-immutable-proof.json','w') as f:
              json.dump(proof,f,indent=2,sort_keys=True); f.write('\n')
          digest=h('/tmp/a10-immutable-proof.json')
          print(json.dumps(proof,indent=2,sort_keys=True))
          print('proof_sha256='+digest)
          open('/tmp/a10-immutable-proof.sha256','w').write(digest+'  a10-immutable-proof.json\n')
          PY

      - name: Upload immutable proof
        uses: actions/upload-artifact@v4
        with:
          name: a10-runc-bound-immutable-proof
          path: |
            /tmp/a10-immutable-proof.json
            /tmp/a10-immutable-proof.sha256
          if-no-files-found: error
          retention-days: 30
