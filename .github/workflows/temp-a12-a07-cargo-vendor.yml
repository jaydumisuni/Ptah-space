name: TEMP A12 exact A07 Cargo vendor export

on:
  pull_request:
  push:
    branches:
      - temp/a12-a07-cargo-vendor-20260820

permissions:
  contents: read

jobs:
  vendor:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout transport-only branch
        uses: actions/checkout@v4
        with:
          ref: temp/a12-a07-cargo-vendor-20260820
          fetch-depth: 0

      - name: Verify transport-only delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "05e2e75b7a2069d0df74eb73f9b9ecd7cd17d0d4"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/temp-a12-a07-cargo-vendor.yml'
          sha256sum Cargo.lock | tee /tmp/a07-cargo-lock.sha256
          test "$(cut -d' ' -f1 /tmp/a07-cargo-lock.sha256)" = "cc53b5297013c4808723c1f660851030ce5b7c4aae1a4d3873e658ef88383c1c"

      - name: Install exact Ptah Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          cargo +1.97.1 --version | tee /tmp/cargo-version.txt

      - name: Vendor exactly the frozen A07 lock
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 vendor --locked /tmp/vendor > /tmp/vendor-config.txt
          tar -C /tmp -cJf /tmp/a07-cargo-vendor.tar.xz vendor
          sha256sum /tmp/a07-cargo-vendor.tar.xz | tee /tmp/a07-cargo-vendor.sha256
          python3 - <<'PY'
          import pathlib, tomllib
          lock = tomllib.loads(pathlib.Path('Cargo.lock').read_text())
          registry = [p for p in lock['package'] if str(p.get('source','')).startswith('registry+')]
          git = [p for p in lock['package'] if str(p.get('source','')).startswith('git+')]
          pathlib.Path('/tmp/dependency-counts.txt').write_text(
              f"registry_packages={len(registry)}\ngit_packages={len(git)}\n"
          )
          assert len(git) == 0
          PY
          cat /tmp/dependency-counts.txt

      - name: Upload exact vendor artifact
        uses: actions/upload-artifact@v4
        with:
          name: ptah-a07-cargo-vendor
          path: |
            /tmp/a07-cargo-vendor.tar.xz
            /tmp/a07-cargo-vendor.sha256
            /tmp/a07-cargo-lock.sha256
            /tmp/cargo-version.txt
            /tmp/vendor-config.txt
            /tmp/dependency-counts.txt
          if-no-files-found: error
          retention-days: 1
