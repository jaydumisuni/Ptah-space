name: Temporary ATHENA OAuth-to-D1 Authority Bridge Proof

on:
  push:
    branches:
      - proof/oracle-pr196-exact-head-20260825
    paths:
      - .github/workflows/temp-oracle-pr196-exact-head.yml

permissions:
  contents: read

jobs:
  oauth-d1-bridge:
    runs-on: [self-hosted, athena, windows, ptah]
    timeout-minutes: 8
    steps:
      - name: Refresh cached OAuth and prove D1 read authority without exposing token
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $raw = & npx --yes 'wrangler@4.122.0' auth token --json 2>$null
            if ($LASTEXITCODE -ne 0) { throw 'WRANGLER_AUTH_TOKEN_FAILED' }
            $auth = (@($raw) -join "`n") | ConvertFrom-Json
            if (-not $auth.token -or ([string]$auth.token).Length -lt 20) { throw 'WRANGLER_AUTH_TOKEN_EMPTY' }
            Write-Host ('WRANGLER_AUTH_TYPE=' + $auth.type)

            $env:CLOUDFLARE_API_TOKEN = [string]$auth.token
            $list = & npx --yes 'wrangler@4.122.0' d1 list --json 2>&1
            $listCode = $LASTEXITCODE
            Write-Host ('D1_LIST_EXIT=' + $listCode)
            if ($listCode -ne 0) {
              @($list) | ForEach-Object { [string]$_ } | Where-Object { $_ -notmatch '(?i)token|authorization|bearer' } | Select-Object -Last 30 | Write-Host
              throw 'WRANGLER_D1_AUTHORITY_FAILED'
            }

            $json = (@($list) -join "`n") | ConvertFrom-Json
            $db = @($json) | Where-Object { $_.name -eq 'oracle-accounts' -or $_.uuid -eq '28224b01-26b3-485e-84f5-1bc31b162752' } | Select-Object -First 1
            if (-not $db) { throw 'ORACLE_D1_DATABASE_NOT_VISIBLE' }
            Write-Host ('D1_DATABASE_VISIBLE=PASS name=' + $db.name + ' uuid=' + $db.uuid)
            Write-Host 'ATHENA_OAUTH_TO_D1_AUTHORITY=PASS'
          }
          finally {
            Remove-Item Env:CLOUDFLARE_API_TOKEN -ErrorAction SilentlyContinue
            $auth = $null
            $raw = $null
          }
