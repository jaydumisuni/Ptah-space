name: Temporary PR197 Source Correction

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-athena-ptah-runner-final.yml"

permissions:
  contents: read

jobs:
  correct-pr197:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 18
    steps:
      - name: Fetch audited correction payload and execute it
        shell: bash
        run: |
          set -euo pipefail
          payload="$(mktemp --suffix=.mjs)"
          trap 'rm -f "$payload"' EXIT
          gh api 'repos/jaydumisuni/Oracle-/contents/oracle_control/pr197-source-correction-20260824.mjs?ref=main' --jq .content | tr -d '\n' | base64 -d > "$payload"
          node "$payload"

