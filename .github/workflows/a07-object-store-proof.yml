name: A07 object store lock bootstrap

on:
  pull_request:
    paths:
      - "crates/ptah-object-store/**"
      - "Cargo.lock"
      - ".github/workflows/a07-object-store-proof.yml"

permissions:
  contents: write

env:
  PTAH_EXACT_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  sync-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact A07 branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact starting head
        run: test "$(git rev-parse HEAD)" = "$PTAH_EXACT_SHA"

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Regenerate and constrain Cargo lock
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/Cargo.lock.before
          cargo generate-lockfile
          python - <<'PY'
          import tomllib
          from pathlib import Path
          before=tomllib.loads(Path('/tmp/Cargo.lock.before').read_text())
          after=tomllib.loads(Path('Cargo.lock').read_text())
          def keyed(doc):
              return {(p['name'],p['version'],p.get('source')):p for p in doc['package']}
          b,a=keyed(before),keyed(after)
          assert set(a)==set(b), 'package universe changed'
          for key in sorted(a):
              if key[0] != 'ptah-object-store':
                  assert a[key] == b[key], f'unexpected lock drift: {key}'
          obj=[p for p in after['package'] if p['name']=='ptah-object-store']
          assert len(obj)==1
          expected={
              'ptah-activity-runtime','ptah-identifiers','ptah-ledger','ptah-receipts',
              'rusqlite','serde_json','sha2','thiserror 2.0.17'
          }
          assert set(obj[0].get('dependencies',[]))==expected, obj[0].get('dependencies')
          PY
          test "$(git diff --name-only)" = "Cargo.lock"
          git diff --check

      - name: Commit generated lock only
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "A07 sync Cargo.lock"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          echo "A07 lock bootstrap committed; this run is not runtime proof."
