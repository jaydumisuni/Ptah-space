name: D08 TDD

on:
  push:
    branches:
      - d08-application-platform-expansion
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/ptah-application-runtime/**
      - services/ptah-control/**
      - .github/workflows/d08-tdd.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  d08-task4-shell-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Preserve pre-Task4 lock
        run: cp Cargo.lock /tmp/Cargo.lock.before
      - name: Check RED assets formatting
        run: cargo fmt --all -- --check
      - name: Prove D01 cases 26-28 are RED for missing projection API
        shell: bash
        run: |
          set -uo pipefail
          set +e
          cargo test -p ptah-control --test d08_application_projection > /tmp/shell-red.log 2>&1
          status=$?
          set -e
          cat /tmp/shell-red.log
          test "$status" -ne 0
          grep -Eq 'ApplicationPlatformSnapshot|project_application_platform_views|applications' /tmp/shell-red.log
      - name: Prove Task4 lock delta is exact or already promoted
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          old = tomllib.loads(Path('/tmp/Cargo.lock.before').read_text())
          new = tomllib.loads(Path('Cargo.lock').read_text())
          key = lambda p: (p['name'], p['version'], p.get('source'))
          before = {key(p): p for p in old['package']}
          after = {key(p): p for p in new['package']}
          assert set(before) == set(after), (set(after)-set(before), set(before)-set(after))
          changed = sorted(k for k in before if before[k] != after[k])
          expected = ('ptah-control', '0.0.0-phase0c', None)
          assert changed in ([], [expected]), changed
          deps = set(after[expected].get('dependencies', []))
          assert 'ptah-application-runtime' in deps, deps
          if changed:
              old_deps = set(before[expected].get('dependencies', []))
              assert deps - old_deps == {'ptah-application-runtime'}, deps-old_deps
              assert not (old_deps-deps), old_deps-deps
          PY
      - name: Promote exact Task4 lockfile if generated
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name 'THE TECH GUY'
          git config user.email '65334711+jaydumisuni@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'chore(d08): promote exact task4 lock delta'
          git push origin HEAD:d08-application-platform-expansion
