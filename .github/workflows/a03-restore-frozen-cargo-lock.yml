name: A03 restore frozen Cargo universe

on:
  pull_request:
    paths:
      - ".github/workflows/a03-restore-frozen-cargo-lock.yml"

permissions:
  contents: write

jobs:
  restore:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact A03 branch with history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Restore previously proved frozen-universe lock
        run: |
          set -euo pipefail
          git show 9f02d0be2d660142f0037c8a405248688acf09cb:Cargo.lock > Cargo.lock
          python tools/check_phase0c_scaffold.py
          python tools/check_rust_dependency_lock.py

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Prove restored lock against hardened A03 source
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo fmt --all -- --check
          cargo clippy -p ptah-ledger --all-targets --locked -- -D warnings
          cargo test -p ptah-ledger --locked

      - name: Commit only the proved lock and retire helper
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm .github/workflows/a03-restore-frozen-cargo-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock .github/workflows/a03-restore-frozen-cargo-lock.yml
          git diff --cached --check
          git commit -m "A03: restore frozen external Cargo universe"
          git push origin "HEAD:${HEAD_REF}"
