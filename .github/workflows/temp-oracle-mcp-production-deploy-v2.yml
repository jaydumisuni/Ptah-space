name: TEMP ATHENA Xiaomi ROM mirror benchmark

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-oracle-mcp-production-deploy-v2.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, athena, windows, x64, physical, ptah]
    timeout-minutes: 8
    steps:
      - name: Benchmark official Xiaomi mirrors without modifying BITS job
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'sky_global_images_OS2.0.9.0.VMWMIXM_20250530.0000.00_15.0_global_3334591f85.tgz'
          $rel = "OS2.0.9.0.VMWMIXM/$name"
          $start = 142606336
          $end = $start + 4194304 - 1
          $bitsName = 'TTG Redmi sky Global OS2.0.9.0'

          Write-Output '=== CURRENT BITS ==='
          $job = Get-BitsTransfer -Name $bitsName -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($job) {
            $pct = [math]::Round(([double]$job.BytesTransferred / [double]$job.BytesTotal) * 100, 3)
            [ordered]@{state=[string]$job.JobState;bytesTransferred=[int64]$job.BytesTransferred;bytesTotal=[int64]$job.BytesTotal;percent=$pct} | ConvertTo-Json -Compress
          }

          Write-Output '=== TOOLS ==='
          foreach ($tool in @('curl.exe','aria2c.exe','wget.exe')) {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            [ordered]@{tool=$tool;path=if($cmd){$cmd.Source}else{$null}} | ConvertTo-Json -Compress
          }

          Write-Output '=== 4 MiB RANGE BENCHMARK ==='
          $urls = @(
            "https://bigota.d.miui.com/$rel",
            "https://cdnorg.d.miui.com/$rel",
            "https://hugeota.d.miui.com/$rel"
          )
          foreach ($url in $urls) {
            $tmp = Join-Path $env:TEMP ([guid]::NewGuid().ToString() + '.bin')
            try {
              $sw = [Diagnostics.Stopwatch]::StartNew()
              & curl.exe -L --fail --silent --show-error --connect-timeout 15 --max-time 75 --range "$start-$end" --output $tmp $url
              $code = $LASTEXITCODE
              $sw.Stop()
              $size = if(Test-Path $tmp){(Get-Item $tmp).Length}else{0}
              $speed = if($sw.Elapsed.TotalSeconds -gt 0){[math]::Round($size/$sw.Elapsed.TotalSeconds,0)}else{0}
              [ordered]@{url=$url;exitCode=$code;bytes=[int64]$size;seconds=[math]::Round($sw.Elapsed.TotalSeconds,3);bytesPerSecond=[int64]$speed} | ConvertTo-Json -Compress
            } finally {
              Remove-Item -LiteralPath $tmp -Force -ErrorAction SilentlyContinue
            }
          }
