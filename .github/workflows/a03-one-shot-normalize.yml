name: A03 one-shot normalization and hardening

on:
  pull_request:
    paths:
      - ".github/workflows/a03-one-shot-normalize.yml"

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out A03 branch with full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Restore frozen external dependency universe
        run: |
          set -euo pipefail
          git show origin/main:Cargo.lock > Cargo.lock
          cargo metadata --offline --format-version 1 > /tmp/a03-cargo-metadata.json
          python3 tools/check_a01_scaffold.py --repo-root . --output /tmp/a01-invariant.json

      - name: Harden fail-closed open and frozen metadata behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/ptah-ledger/src/lib.rs")
          text = path.read_text(encoding="utf-8")

          needle = "        connection.busy_timeout(BUSY_TIMEOUT)?;"
          assert text.count(needle) == 1
          text = text.replace(
              needle,
              "        validate_migration_history(&connection, discovered_version)?;\n\n" + needle,
              1,
          )
          duplicate = "\n        validate_migration_history(&connection, discovered_version)?;\n        apply_pending_migrations(&mut connection, discovered_version)?;"
          assert text.count(duplicate) == 1
          text = text.replace(
              duplicate,
              "\n        apply_pending_migrations(&mut connection, discovered_version)?;",
              1,
          )

          start = text.index("fn validate_or_seed_contract_registry(")
          end = text.index("fn validate_contract_registry(", start)
          replacement = '''fn validate_or_seed_contract_registry(connection: &mut Connection) -> Result<(), LedgerError> {
              let count: i64 = connection
                  .query_row("SELECT COUNT(*) FROM ptah_schema_registry", [], |row| row.get(0))?;
              if count == 0 {
                  let transaction = connection.transaction_with_behavior(TransactionBehavior::Immediate)?;
                  for binding in generated::SCHEMAS {
                      transaction.execute(
                          "INSERT INTO ptah_schema_registry \\
                           (schema_id, schema_version, catalog_id, sha256, repository_path, maturity) \\
                           VALUES (?1, ?2, ?3, ?4, ?5, ?6)",
                          params![
                              binding.schema_id,
                              binding.schema_version,
                              binding.catalog_id,
                              binding.sha256,
                              binding.repository_path,
                              binding.maturity,
                          ],
                      )?;
                  }
                  transaction.execute(
                      "INSERT INTO ptah_ledger_meta (key, value) VALUES (?1, ?2)",
                      params![META_CATALOG_DIGEST, generated::CATALOG_SET_SHA256],
                  )?;
                  transaction.execute(
                      "INSERT INTO ptah_ledger_meta (key, value) VALUES (?1, ?2)",
                      params![META_FREEZE_COMMIT, generated::PHASE_0B_FREEZE_COMMIT],
                  )?;
                  transaction.commit()?;
              }

              validate_contract_registry(connection)?;
              validate_meta(connection, META_CATALOG_DIGEST, generated::CATALOG_SET_SHA256)?;
              validate_meta(connection, META_FREEZE_COMMIT, generated::PHASE_0B_FREEZE_COMMIT)?;
              Ok(())
          }

          '''
          text = text[:start] + replacement + text[end:]

          start = text.index("fn validate_or_seed_meta(")
          end = text.index("fn revision_to_sql(", start)
          replacement = '''fn validate_meta(
              connection: &Connection,
              key: &'static str,
              expected: &'static str,
          ) -> Result<(), LedgerError> {
              let retained: Option<String> = connection
                  .query_row(
                      "SELECT value FROM ptah_ledger_meta WHERE key = ?1",
                      params![key],
                      |row| row.get(0),
                  )
                  .optional()?;
              match retained {
                  Some(value) if value == expected => Ok(()),
                  Some(value) => Err(LedgerError::ContractRegistryMismatch(format!(
                      "metadata {key} expected {expected} but found {value}"
                  ))),
                  None => Err(LedgerError::ContractRegistryMismatch(format!(
                      "required metadata {key} is missing"
                  ))),
              }
          }

          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Format and prove A03 crate before committing normalization
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo clippy -p ptah-ledger --all-features --locked -- -D warnings
          cargo test -p ptah-ledger --locked
          python3 tools/check_a01_scaffold.py --repo-root . --output /tmp/a01-after-a03.json

      - name: Remove temporary mutation workflows
        run: |
          rm -f .github/workflows/a03-lock-refresh.yml
          rm -f .github/workflows/a03-one-shot-normalize.yml

      - name: Commit normalized A03 candidate
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/ptah-ledger/src/lib.rs .github/workflows/a03-lock-refresh.yml .github/workflows/a03-one-shot-normalize.yml
          git diff --cached --check
          git commit -m "A03: harden ledger and restore frozen dependency universe"
          git push origin "HEAD:${HEAD_REF}"
