name: D07 Task 7 Suppression Correction

on:
  push:
    branches:
      - d07-security-evidence-reproduction
    paths:
      - .github/workflows/d07-task7-suppression-correction.yml

permissions:
  contents: write

jobs:
  task7-correction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: d07-security-evidence-reproduction
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Prove current suppression defect
        run: |
          grep -R -n -E '#\[(allow|expect)\(' crates/ptah-security-evidence
          test "$(grep -R -n -E '#\[(allow|expect)\(' crates/ptah-security-evidence | wc -l)" -eq 1
      - name: Refactor Evidence Card input boundary without suppression
        run: |
          cat > crates/ptah-security-evidence/src/card.rs <<'EOF'
          use std::collections::BTreeMap;

          use ptah_identifiers::EntityRef;

          use crate::D07Error;

          const RESTRICTED_PUBLIC_FIELD_TOKENS: &[&str] = &[
              "credential",
              "token",
              "cookie",
              "private_payload",
              "exploit_payload",
              "proprietary_source",
              "private_host",
              "topology",
              "customer_private",
          ];

          /// Caller-authored public-safe content used to derive one Evidence Card.
          #[derive(Debug, Clone, PartialEq, Eq)]
          pub struct EvidenceCardContent {
              /// Exact bounded Claim represented by the card.
              pub claim_ref: EntityRef,
              /// Public-safe sentence the caller has explicitly allowed.
              pub allowed_claim_sentence: String,
              /// Exact public-safe evidence references.
              pub evidence_refs: Vec<EntityRef>,
              /// Bounded result status.
              pub result_status: String,
              /// Bounded verification level.
              pub verification_level: String,
              /// Bounded reproduction level.
              pub reproduction_level: String,
              /// Bounded review status.
              pub review_status: String,
              /// Explicit limitations retained with the view.
              pub limitations: Vec<String>,
          }

          /// Derived, sanitized Evidence Card presentation with no acceptance or release authority.
          #[derive(Debug, Clone, PartialEq, Eq)]
          pub struct EvidenceCardView {
              /// Exact bounded Claim represented by the card.
              pub claim_ref: EntityRef,
              /// Public-safe sentence the caller has explicitly allowed.
              pub allowed_claim_sentence: String,
              /// Exact public-safe evidence references.
              pub evidence_refs: Vec<EntityRef>,
              /// Bounded result status.
              pub result_status: String,
              /// Bounded verification level.
              pub verification_level: String,
              /// Bounded reproduction level.
              pub reproduction_level: String,
              /// Bounded review status.
              pub review_status: String,
              /// Explicit limitations retained with the view.
              pub limitations: Vec<String>,
              /// Always false: an Evidence Card is never canonical authority.
              pub authoritative: bool,
              /// Always false: an Evidence Card cannot approve a release.
              pub release_approved: bool,
          }

          impl EvidenceCardView {
              /// Construct a sanitized derived Evidence Card.
              ///
              /// `public_fields` is inspected only as a sanitation boundary; raw restricted field
              /// families are rejected and are never retained in the returned card.
              ///
              /// # Errors
              /// Returns [`D07Error`] when the view is incomplete or a restricted public field is supplied.
              pub fn new(
                  content: EvidenceCardContent,
                  public_fields: &BTreeMap<String, String>,
              ) -> Result<Self, D07Error> {
                  if content.claim_ref.entity_kind.as_str() != "security.claim"
                      || content.allowed_claim_sentence.trim().is_empty()
                      || content.evidence_refs.is_empty()
                      || content.result_status.trim().is_empty()
                      || content.verification_level.trim().is_empty()
                      || content.reproduction_level.trim().is_empty()
                      || content.review_status.trim().is_empty()
                  {
                      return Err(D07Error::InvalidEvidenceCard);
                  }
                  if public_fields.keys().any(|key| {
                      let normalized = key.to_ascii_lowercase();
                      RESTRICTED_PUBLIC_FIELD_TOKENS
                          .iter()
                          .any(|token| normalized.contains(token))
                  }) {
                      return Err(D07Error::RestrictedEvidenceCardField);
                  }
                  Ok(Self {
                      claim_ref: content.claim_ref,
                      allowed_claim_sentence: content.allowed_claim_sentence,
                      evidence_refs: content.evidence_refs,
                      result_status: content.result_status,
                      verification_level: content.verification_level,
                      reproduction_level: content.reproduction_level,
                      review_status: content.review_status,
                      limitations: content.limitations,
                      authoritative: false,
                      release_approved: false,
                  })
              }
          }
          EOF
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('crates/ptah-security-evidence/src/lib.rs')
          text = lib.read_text()
          text = text.replace('pub use card::EvidenceCardView;', 'pub use card::{EvidenceCardContent, EvidenceCardView};')
          lib.write_text(text)

          test = Path('crates/ptah-security-evidence/tests/d07_acceptance.rs')
          text = test.read_text()
          text = text.replace(
              'BackendReplacementProjection, EvidenceCardView, SecurityAdapterObservation,',
              'BackendReplacementProjection, EvidenceCardContent, EvidenceCardView, SecurityAdapterObservation,',
          )
          old = '''    let card = EvidenceCardView::new(\n        er("security.claim"),\n        "The bounded claim is supported within the stated scope.".into(),\n        vec![er("security.evidence_bundle")],\n        "supported".into(),\n        "reviewed".into(),\n        "independently_reproduced".into(),\n        "accepted_with_limitations".into(),\n        vec!["scope is bounded".into()],\n        &safe_fields,\n    )'''
          new = '''    let card = EvidenceCardView::new(\n        EvidenceCardContent {\n            claim_ref: er("security.claim"),\n            allowed_claim_sentence: "The bounded claim is supported within the stated scope.".into(),\n            evidence_refs: vec![er("security.evidence_bundle")],\n            result_status: "supported".into(),\n            verification_level: "reviewed".into(),\n            reproduction_level: "independently_reproduced".into(),\n            review_status: "accepted_with_limitations".into(),\n            limitations: vec!["scope is bounded".into()],\n        },\n        &safe_fields,\n    )'''
          if old not in text:
              raise SystemExit('safe EvidenceCard call shape not found')
          text = text.replace(old, new, 1)
          old = '''            EvidenceCardView::new(\n                er("security.claim"),\n                "bounded claim".into(),\n                vec![er("security.evidence_bundle")],\n                "supported".into(),\n                "reviewed".into(),\n                "not_requested".into(),\n                "reviewed".into(),\n                Vec::new(),\n                &restricted,\n            ),'''
          new = '''            EvidenceCardView::new(\n                EvidenceCardContent {\n                    claim_ref: er("security.claim"),\n                    allowed_claim_sentence: "bounded claim".into(),\n                    evidence_refs: vec![er("security.evidence_bundle")],\n                    result_status: "supported".into(),\n                    verification_level: "reviewed".into(),\n                    reproduction_level: "not_requested".into(),\n                    review_status: "reviewed".into(),\n                    limitations: Vec::new(),\n                },\n                &restricted,\n            ),'''
          if old not in text:
              raise SystemExit('restricted EvidenceCard call shape not found')
          test.write_text(text.replace(old, new, 1))
          PY
      - name: Prove corrected Task 7 fully
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p ptah-security-evidence --test d07_acceptance --locked
          test "$(cargo test -p ptah-security-evidence --test d07_acceptance --locked -- --list 2>/dev/null | grep -c ': test$')" -eq 30
          cargo test -p ptah-security-evidence --test store_roundtrip --locked
          cargo test -p ptah-security-evidence --locked
          cargo clippy -p ptah-security-evidence --all-targets --locked -- -D warnings -W clippy::pedantic
          if grep -R -n -E '#\[(allow|expect)\(' crates/ptah-security-evidence; then
            echo 'D07 lint suppression detected' >&2
            exit 1
          fi
          python3 - <<'PY'
          import re
          from pathlib import Path
          store = Path('crates/ptah-security-evidence/src/store.rs').read_text()
          generated = Path('crates/ptah-contracts/src/generated.rs').read_text()
          pairs = re.findall(r'\(\s*"(urn:ptah:schema:security:[^"]+)"\s*,\s*"(security\.[^"]+)"\s*,?\s*\)', store)
          generated_security_schemas = set(re.findall(r'schema_id:\s*"(urn:ptah:schema:security:[^"]+)"', generated))
          if len(pairs) != 18 or len(set(pairs)) != 18:
              raise SystemExit('WP12 pair count mismatch')
          for schema, kind in pairs:
              if schema not in generated_security_schemas:
                  raise SystemExit(f'missing generated SchemaBinding for {schema}')
              slug = schema.removeprefix('urn:ptah:schema:security:').removesuffix(':0.1.0')
              if kind != 'security.' + slug.replace('-', '_'):
                  raise SystemExit(f'kind mapping mismatch for {schema}')
          print('WP12_AUDIT_OK=18')
          PY
          cargo test -p ptah-ledger -p ptah-activity-runtime -p ptah-workspace -p ptah-object-store -p ptah-recipe-registry -p ptah-package-plugin -p ptah-provenance --locked
      - name: Commit verified suppression correction
        run: |
          git config user.name "TENFOLD Foreman"
          git config user.email "jaydumi12@gmail.com"
          git add crates/ptah-security-evidence
          git commit -m "fix(d07): remove evidence card lint suppression"
          git push origin HEAD:d07-security-evidence-reproduction
