name: D07 Task 6 Reproduction Proof

on:
  push:
    branches:
      - d07-security-evidence-reproduction
    paths:
      - .github/workflows/d07-task6-proof.yml

permissions:
  contents: write

jobs:
  task6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: d07-security-evidence-reproduction
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Add cases 24 through 28 RED
        run: |
          cat >> crates/ptah-security-evidence/tests/d07_acceptance.rs <<'EOF'

          use ptah_security_evidence::{
              ReproductionComparisonDecision, ReproductionComparisonProjection,
              ReproductionIndependence, ReproductionOutcome, ReproductionProtocolProjection,
              ReproductionRequestProjection, ReproductionRunRequest,
          };

          #[test]
          fn reproduction_protocol_digest_changes_with_scope_environment_or_independence() {
              let base = ReproductionProtocolProjection {
                  protocol_key: "security.repro.v1".into(),
                  claim_scope: vec!["claim.dimension".into()],
                  required_inputs: vec![er("core.object_revision")],
                  environment_requirements: vec!["linux-amd64".into()],
                  independence_requirements: vec!["fresh-cache".into()],
                  success_criteria: vec!["same-observed-fact".into()],
                  failure_criteria: vec!["claim-not-observed".into()],
              };
              let mut scope = base.clone();
              scope.claim_scope.push("second-dimension".into());
              let mut environment = base.clone();
              environment.environment_requirements.push("isolated-network".into());
              let mut independence = base.clone();
              independence.independence_requirements.push("distinct-authority".into());
              let digest = base.digest().expect("base digest");
              assert_ne!(digest, scope.digest().expect("scope digest"));
              assert_ne!(digest, environment.digest().expect("environment digest"));
              assert_ne!(digest, independence.digest().expect("independence digest"));
          }

          #[test]
          fn reproduction_request_is_not_execution_and_exposes_no_activity_identity() {
              let request = ReproductionRequestProjection {
                  claim_refs: vec![er("security.claim")],
                  finding_refs: vec![er("security.finding")],
                  protocol_ref: er("security.reproduction_protocol"),
                  requested_environment_constraints: vec!["isolated".into()],
                  independence_requirements: vec!["fresh-cache".into()],
                  requested_by_ref: er("identity.principal"),
                  requested_at: "2026-09-03T07:00:00Z".into(),
              };
              request.validate().expect("bounded request");
              assert!(!request.is_execution());
              assert!(request.activity_ref().is_none());
          }

          #[test]
          fn same_cache_mutable_environment_or_hidden_shared_authority_cannot_claim_independence() {
              let invalid = ReproductionIndependence {
                  fresh_cache: false,
                  immutable_environment: true,
                  distinct_authority: true,
                  evidence_refs: vec![er("security.evidence_item")],
              };
              assert!(matches!(invalid.validate(), Err(D07Error::IndependenceNotProven)));
              let mutable = ReproductionIndependence { fresh_cache: true, immutable_environment: false, distinct_authority: true, evidence_refs: vec![er("security.evidence_item")] };
              assert!(matches!(mutable.validate(), Err(D07Error::IndependenceNotProven)));
              let shared = ReproductionIndependence { fresh_cache: true, immutable_environment: true, distinct_authority: false, evidence_refs: vec![er("security.evidence_item")] };
              assert!(matches!(shared.validate(), Err(D07Error::IndependenceNotProven)));
          }

          #[test]
          fn reproduction_retry_requires_a_fresh_a04_attempt() {
              let prior = er("core.attempt");
              let run = ReproductionRunRequest {
                  request_ref: er("security.reproduction_request"),
                  protocol_ref: er("security.reproduction_protocol"),
                  environment_refs: vec![er("core.object_revision")],
                  independence_evidence_refs: vec![er("security.evidence_item")],
                  prior_attempt_refs: vec![prior.clone()],
                  activity_request_ref: er("core.activity_request"),
                  workspace_ref: er("core.workspace"),
                  caller_ref: er("identity.principal"),
                  authority_ref: er("identity.principal"),
                  intent_ref: er("knowledge.intent"),
                  attempt_context: context(),
                  independence: ReproductionIndependence {
                      fresh_cache: true,
                      immutable_environment: true,
                      distinct_authority: true,
                      evidence_refs: vec![er("security.evidence_item")],
                  },
              };
              assert!(matches!(
                  run.validate_attempt(&prior),
                  Err(D07Error::FreshAttemptRequired)
              ));
              run.validate_attempt(&er("core.attempt"))
                  .expect("fresh reproduction Attempt");
          }

          #[test]
          fn negative_partial_failed_and_inconclusive_reproduction_history_is_retained() {
              let comparison = ReproductionComparisonProjection {
                  original_claim_refs: vec![er("security.claim")],
                  reproduction_run_ref: er("security.reproduction_run"),
                  outcome_history: vec![
                      ReproductionOutcome::NotReproduced,
                      ReproductionOutcome::PartiallyReproduced,
                      ReproductionOutcome::Failed,
                      ReproductionOutcome::Inconclusive,
                  ],
                  decision: ReproductionComparisonDecision::Inconclusive,
              };
              comparison.validate().expect("retained comparison");
              assert_eq!(comparison.outcome_history.len(), 4);
              assert_eq!(comparison.outcome_history[0], ReproductionOutcome::NotReproduced);
              assert_eq!(comparison.outcome_history[3], ReproductionOutcome::Inconclusive);
          }
          EOF
          cargo fmt --all
          if cargo test -p ptah-security-evidence --test d07_acceptance --locked; then
            echo 'Task 6 RED unexpectedly passed' >&2
            exit 1
          fi
      - name: Implement independent reproduction
        run: |
          cat > crates/ptah-security-evidence/src/reproduction.rs <<'EOF'
          use ptah_activity_runtime::AttemptContext;
          use ptah_identifiers::EntityRef;
          use serde::Serialize;
          use sha2::{Digest, Sha256};

          use crate::D07Error;

          /// Frozen caller-authored reproduction protocol projection.
          #[derive(Debug, Clone, PartialEq, Eq, Serialize)]
          pub struct ReproductionProtocolProjection {
              /// Stable caller protocol key; content digest remains the exact version identity.
              pub protocol_key: String,
              /// Exact Claim dimensions the protocol attempts to reproduce.
              pub claim_scope: Vec<String>,
              /// Exact immutable protocol inputs.
              pub required_inputs: Vec<EntityRef>,
              /// Exact environment requirements.
              pub environment_requirements: Vec<String>,
              /// Explicit independence requirements.
              pub independence_requirements: Vec<String>,
              /// Bounded success criteria.
              pub success_criteria: Vec<String>,
              /// Bounded failure criteria.
              pub failure_criteria: Vec<String>,
          }

          impl ReproductionProtocolProjection {
              /// Compute a deterministic digest over all protocol boundaries.
              ///
              /// # Errors
              /// Returns [`D07Error::Serialization`] if serialization fails.
              pub fn digest(&self) -> Result<String, D07Error> {
                  if self.protocol_key.trim().is_empty()
                      || self.claim_scope.is_empty()
                      || self.required_inputs.is_empty()
                      || self.environment_requirements.is_empty()
                      || self.independence_requirements.is_empty()
                      || self.success_criteria.is_empty()
                      || self.failure_criteria.is_empty()
                  {
                      return Err(D07Error::InvalidReproductionProtocol);
                  }
                  let bytes = serde_json::to_vec(self)
                      .map_err(|error| D07Error::Serialization(error.to_string()))?;
                  Ok(format!("{:x}", Sha256::digest(bytes)))
              }
          }

          /// Reproduction Request is intent only and deliberately exposes no A04 identities.
          #[derive(Debug, Clone, PartialEq, Eq)]
          pub struct ReproductionRequestProjection {
              /// Claims requested for reproduction.
              pub claim_refs: Vec<EntityRef>,
              /// Findings requested for reproduction.
              pub finding_refs: Vec<EntityRef>,
              /// Exact frozen Reproduction Protocol.
              pub protocol_ref: EntityRef,
              /// Requested environment constraints.
              pub requested_environment_constraints: Vec<String>,
              /// Required independence constraints.
              pub independence_requirements: Vec<String>,
              /// Caller requesting reproduction.
              pub requested_by_ref: EntityRef,
              /// Exact request time.
              pub requested_at: String,
          }

          impl ReproductionRequestProjection {
              /// Validate request-only boundaries.
              ///
              /// # Errors
              /// Returns [`D07Error::InvalidReproductionRequest`] when request inputs are incomplete.
              pub fn validate(&self) -> Result<(), D07Error> {
                  if (self.claim_refs.is_empty() && self.finding_refs.is_empty())
                      || self.protocol_ref.entity_kind.as_str() != "security.reproduction_protocol"
                      || self.requested_environment_constraints.is_empty()
                      || self.independence_requirements.is_empty()
                      || !crate::assessment::valid_utc(&self.requested_at)
                  {
                      return Err(D07Error::InvalidReproductionRequest);
                  }
                  Ok(())
              }

              /// A request never creates execution by itself.
              #[must_use]
              pub const fn is_execution(&self) -> bool {
                  false
              }

              /// A request contains no Activity identity.
              #[must_use]
              pub const fn activity_ref(&self) -> Option<&EntityRef> {
                  None
              }
          }

          /// Mechanical independence evidence for one reproduction run.
          #[derive(Debug, Clone, PartialEq, Eq)]
          pub struct ReproductionIndependence {
              /// Run did not reuse the original mutable/cache state.
              pub fresh_cache: bool,
              /// Environment was frozen/immutable for the run.
              pub immutable_environment: bool,
              /// Run authority is demonstrably distinct where independence requires it.
              pub distinct_authority: bool,
              /// Exact evidence supporting independence assertions.
              pub evidence_refs: Vec<EntityRef>,
          }

          impl ReproductionIndependence {
              /// Validate that independence is evidenced rather than asserted by name.
              ///
              /// # Errors
              /// Returns [`D07Error::IndependenceNotProven`] for reused/mutable/shared conditions.
              pub fn validate(&self) -> Result<(), D07Error> {
                  if !self.fresh_cache
                      || !self.immutable_environment
                      || !self.distinct_authority
                      || self.evidence_refs.is_empty()
                  {
                      return Err(D07Error::IndependenceNotProven);
                  }
                  Ok(())
              }
          }

          /// Exact reproduction execution request; execution remains A04-owned.
          #[derive(Debug, Clone)]
          pub struct ReproductionRunRequest {
              /// Exact canonical Reproduction Request.
              pub request_ref: EntityRef,
              /// Exact frozen Reproduction Protocol.
              pub protocol_ref: EntityRef,
              /// Exact environment evidence references.
              pub environment_refs: Vec<EntityRef>,
              /// Exact independence evidence references.
              pub independence_evidence_refs: Vec<EntityRef>,
              /// Prior A04 Attempts that cannot be reused.
              pub prior_attempt_refs: Vec<EntityRef>,
              /// Caller-owned A04 Activity Request.
              pub activity_request_ref: EntityRef,
              /// Workspace identity retained by A04.
              pub workspace_ref: EntityRef,
              /// Caller identity retained by A04.
              pub caller_ref: EntityRef,
              /// Explicit execution authority.
              pub authority_ref: EntityRef,
              /// Explicit intent identity.
              pub intent_ref: EntityRef,
              /// Exact A04 physical execution context.
              pub attempt_context: AttemptContext,
              /// Mechanical independence projection.
              pub independence: ReproductionIndependence,
          }

          impl ReproductionRunRequest {
              /// Validate a fresh Attempt and exact environment/independence boundaries.
              ///
              /// # Errors
              /// Returns [`D07Error`] for reused Attempt identity or unproven independence.
              pub fn validate_attempt(&self, attempt_ref: &EntityRef) -> Result<(), D07Error> {
                  if self.request_ref.entity_kind.as_str() != "security.reproduction_request"
                      || self.protocol_ref.entity_kind.as_str() != "security.reproduction_protocol"
                      || self.environment_refs.is_empty()
                      || self.independence_evidence_refs.is_empty()
                      || self.activity_request_ref.entity_kind.as_str() != "core.activity_request"
                  {
                      return Err(D07Error::InvalidReproductionRequest);
                  }
                  self.independence.validate()?;
                  if attempt_ref.entity_kind.as_str() != "core.attempt"
                      || self.prior_attempt_refs.contains(attempt_ref)
                  {
                      return Err(D07Error::FreshAttemptRequired);
                  }
                  Ok(())
              }
          }

          /// Frozen reproduction run outcome vocabulary.
          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub enum ReproductionOutcome {
              /// Claim was reproduced under the exact protocol.
              Reproduced,
              /// Claim was not reproduced under the exact protocol.
              NotReproduced,
              /// Only part of the Claim scope reproduced.
              PartiallyReproduced,
              /// Reproduction work failed mechanically.
              Failed,
              /// Evidence was insufficient for a determination.
              Inconclusive,
          }

          /// Separate comparison decision over the immutable Reproduction Run history.
          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub enum ReproductionComparisonDecision {
              /// Reproduction supports the original Claim.
              SupportsClaim,
              /// Reproduction supports only part of the original Claim.
              PartiallySupports,
              /// Reproduction contradicts the original Claim.
              ContradictsClaim,
              /// Comparison evidence is inconclusive.
              Inconclusive,
          }

          /// Comparison projection that retains all negative/partial/failed/inconclusive outcomes.
          #[derive(Debug, Clone, PartialEq, Eq)]
          pub struct ReproductionComparisonProjection {
              /// Exact original Claims being compared.
              pub original_claim_refs: Vec<EntityRef>,
              /// Exact Reproduction Run.
              pub reproduction_run_ref: EntityRef,
              /// Immutable retained run outcomes/history.
              pub outcome_history: Vec<ReproductionOutcome>,
              /// Separate comparison decision.
              pub decision: ReproductionComparisonDecision,
          }

          impl ReproductionComparisonProjection {
              /// Validate retained comparison boundaries without rewriting original Claims or outcomes.
              ///
              /// # Errors
              /// Returns [`D07Error::InvalidReproductionComparison`] when history is incomplete.
              pub fn validate(&self) -> Result<(), D07Error> {
                  if self.original_claim_refs.is_empty()
                      || self.reproduction_run_ref.entity_kind.as_str() != "security.reproduction_run"
                      || self.outcome_history.is_empty()
                  {
                      return Err(D07Error::InvalidReproductionComparison);
                  }
                  Ok(())
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/ptah-security-evidence/src/lib.rs')
          text = path.read_text()
          text = text.replace('mod review;\n', 'mod reproduction;\nmod review;\n', 1)
          text = text.replace(
              'pub use review::{\n',
              'pub use reproduction::{\n    ReproductionComparisonDecision, ReproductionComparisonProjection, ReproductionIndependence,\n    ReproductionOutcome, ReproductionProtocolProjection, ReproductionRequestProjection,\n    ReproductionRunRequest,\n};\npub use review::{\n',
              1,
          )
          path.write_text(text)

          path = Path('crates/ptah-security-evidence/src/error.rs')
          text = path.read_text()
          marker = '    /// Underlying A06 authority check failed.\n'
          variants = '''    /// Reproduction Protocol is structurally incomplete.\n    #[error("invalid security reproduction protocol")]\n    InvalidReproductionProtocol,\n    /// Reproduction Request/Run binding is structurally incomplete.\n    #[error("invalid security reproduction request")]\n    InvalidReproductionRequest,\n    /// Reproduction independence is asserted without the required mechanical evidence.\n    #[error("independent reproduction is not proven")]\n    IndependenceNotProven,\n    /// Reproduction Comparison lacks original claim/run/outcome history.\n    #[error("invalid security reproduction comparison")]\n    InvalidReproductionComparison,\n'''
          if 'InvalidReproductionProtocol' not in text:
              assert marker in text
              text = text.replace(marker, variants + marker, 1)
          path.write_text(text)
          PY
      - name: Prove cases 24 through 28 GREEN
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p ptah-security-evidence --test d07_acceptance --locked
          test "$(cargo test -p ptah-security-evidence --test d07_acceptance --locked -- --list 2>/dev/null | grep -c ': test$')" -eq 28
          cargo test -p ptah-security-evidence --locked
          cargo clippy -p ptah-security-evidence --all-targets --locked -- -D warnings -W clippy::pedantic
          ! grep -R -n -E '#\[(allow|expect)\(' crates/ptah-security-evidence
      - name: Commit proven Task 6
        run: |
          git config user.name "TENFOLD Foreman"
          git config user.email "jaydumi12@gmail.com"
          git add crates/ptah-security-evidence
          git commit -m "feat(d07): add independent security reproduction"
          git push origin HEAD:d07-security-evidence-reproduction
