# activate: mi_ext region feature map 2026-08-26T19:05Z
name: Temporary Redmi mi_ext regional feature map on KRATOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-oracle-relay-recovery-kratos.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 15
    steps:
      - name: Map active region feature policy read-only
        shell: bash
        run: |
          set -euo pipefail
          ADB=/home/kratos/.local/share/mibu-platform-tools/current/platform-tools/adb
          "$ADB" start-server >/dev/null 2>&1 || true
          test "$("$ADB" get-state 2>/dev/null | tail -n1)" = device

          echo '=== REGION / COTA PROPS ==='
          "$ADB" shell 'for k in ro.miui.region ro.miui.build.region ro.miui.customized.region ro.miui.cust_variant ro.product.locale ro.product.locale.region ro.product.mod_device ro.miui.gota persist.sys.cota.carrier persist.sys.cota.package persist.sys.cota.partition; do printf "%s=" "$k"; getprop "$k"; done'

          echo '=== CUST FEATURE TREE ==='
          "$ADB" shell 'find /mi_ext/product/etc/cust_features /mi_ext/product/opcust -maxdepth 4 -type f -name "cust_features.xml" -print 2>/dev/null | sort' | head -n 400

          echo '=== GENERIC + CN FEATURE FILES ==='
          for f in \
            /mi_ext/product/etc/cust_features/cust_features.xml \
            /mi_ext/product/etc/cust_features/cn/cust_features.xml \
            /mi_ext/product/opcust/xm/cust_features.xml \
            /mi_ext/product/opcust/xm/cn/cust_features.xml; do
            echo "--- $f ---"
            "$ADB" shell "cat $f 2>/dev/null" | head -n 1200 || true
          done

          echo '=== GOOGLE / REGION / STORE / SEARCH FEATURE HITS ==='
          "$ADB" shell 'grep -RniE "(google|gms|gsf|phonesky|play.?store|market|search|assistant|voice|region|carrier|global|china|cn)" /mi_ext/product/etc/cust_features /mi_ext/product/opcust 2>/dev/null | head -n 1600' || true

          echo '=== CURRENT PACKAGE POLICY RELEVANT TO GLOBALIZATION ==='
          "$ADB" shell 'pm list packages -f -u | grep -Ei "(google|gms|gsf|phonesky|market|search|assistant|voiceassist|browser|appstore)" | sort' | head -n 500 || true

          echo '=== POST-PROBE ==='
          echo "adb_state_after=$("$ADB" get-state 2>/dev/null | tail -n1)"
          ip route show default | head -n 10 || true
