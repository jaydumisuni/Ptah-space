name: TEMP KRATOS ChatGPT Browser Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-kratos-chatgpt-browser-inspect.yml'

jobs:
  inspect:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 5
    steps:
      - name: Inspect Brave-first Oracle and ChatGPT state
        shell: bash
        run: |
          set -euo pipefail
          echo '=== BRAVE BINARY / PROCESSES ==='
          command -v brave-browser || command -v brave-browser-stable || command -v brave || true
          pgrep -a -u "$USER" -f 'brave-browser|/brave ' || true

          echo '=== BRAVE PROFILE METADATA ==='
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path.home()/'.config/BraveSoftware/Brave-Browser'
          out={'rootExists':root.exists(),'profiles':[],'lastUsed':None}
          ls=root/'Local State'
          if ls.is_file():
              try:
                  data=json.loads(ls.read_text(errors='ignore'))
                  out['lastUsed']=((data.get('profile') or {}).get('last_used'))
              except Exception as e:
                  out['localStateError']=type(e).__name__
          if root.exists():
              for p in root.iterdir():
                  pref=p/'Preferences'
                  if not pref.is_file(): continue
                  item={'profile':p.name,'oracleExtensions':[]}
                  try:
                      data=json.loads(pref.read_text(errors='ignore'))
                      settings=((data.get('extensions') or {}).get('settings') or {})
                      for ext_id,cfg in settings.items():
                          path=str(cfg.get('path') or '')
                          if 'oracle' in path.lower() or ext_id in ['hoahdcllchhncnenbeplgfgmpjihakab','efkgbmhecofigogmpbeppjfdhabljkjp']:
                              item['oracleExtensions'].append({'id':ext_id,'path':path,'state':cfg.get('state'),'fromWebstore':cfg.get('from_webstore'),'location':cfg.get('location')})
                  except Exception as e:
                      item['prefError']=type(e).__name__
                  out['profiles'].append(item)
          print(json.dumps(out,separators=(',',':')))
          PY

          echo '=== CHATGPT PROFILE EVIDENCE (NO COOKIE VALUES) ==='
          python3 - <<'PY'
          import pathlib,sqlite3,shutil,tempfile,json
          root=pathlib.Path.home()/'.config/BraveSoftware/Brave-Browser'
          out=[]
          for p in root.iterdir() if root.exists() else []:
              if not (p/'Preferences').is_file(): continue
              item={'profile':p.name,'historyMatches':0,'cookieNames':[]}
              hist=p/'History'
              if hist.is_file():
                  try:
                      t=pathlib.Path(tempfile.mkstemp(prefix='brave-history-')[1]); shutil.copy2(hist,t)
                      db=sqlite3.connect(t)
                      item['historyMatches']=db.execute("select count(*) from urls where url like '%chatgpt.com%' or url like '%chat.openai.com%'").fetchone()[0]
                      item['recentChatgpt']=db.execute("select url,title,last_visit_time from urls where url like '%chatgpt.com%' or url like '%chat.openai.com%' order by last_visit_time desc limit 5").fetchall()
                      db.close(); t.unlink(missing_ok=True)
                  except Exception as e: item['historyError']=type(e).__name__
              ck=p/'Network'/'Cookies'
              if ck.is_file():
                  try:
                      t=pathlib.Path(tempfile.mkstemp(prefix='brave-cookies-')[1]); shutil.copy2(ck,t)
                      db=sqlite3.connect(t)
                      rows=db.execute("select distinct name from cookies where host_key like '%chatgpt.com' or host_key like '%openai.com' order by name limit 30").fetchall()
                      item['cookieNames']=[r[0] for r in rows]
                      db.close(); t.unlink(missing_ok=True)
                  except Exception as e: item['cookieError']=type(e).__name__
              out.append(item)
          print(json.dumps(out,separators=(',',':')))
          PY

          echo '=== LOCAL BROWSER SERVICES ==='
          for u in 'http://127.0.0.1:9222/' 'http://127.0.0.1:9222/json/version' 'http://127.0.0.1:9222/json/list' 'http://127.0.0.1:5056/health' 'http://127.0.0.1:8765/health'; do
            echo "URL=$u"
            curl -fsS --max-time 4 "$u" 2>/dev/null | head -c 5000 || echo 'UNREACHABLE'
            echo
          done
