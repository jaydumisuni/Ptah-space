# Phase 0C dependency policy. Ptah workspace crates remain private and unlicensed
# until the owner accepts the public licence and contribution boundary.
[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "warn"
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
# `publish = false` workspace members are Ptah-owned private Phase 0C sources.
# Ignoring their absent public licence is not a licence grant or acceptance.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Private unpublished workspace members use path-only dependency declarations.
# Permit that local path syntax without weakening wildcard/version policy for
# publishable or registry dependencies.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
