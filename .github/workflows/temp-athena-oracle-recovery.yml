name: TEMP Athena Oracle Recovery
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  recover-user-persistence:
    runs-on: [self-hosted, Windows, athena]
    timeout-minutes: 5
    steps:
      - shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $state=Join-Path $env:LOCALAPPDATA 'OracleNode'
          $wrapper=Join-Path $state 'start-oracle-node.cmd'
          if(-not (Test-Path -LiteralPath $wrapper -PathType Leaf)){throw 'ORACLE_WRAPPER_MISSING'}
          $name='Oracle User Recovery Node'
          $user=[Security.Principal.WindowsIdentity]::GetCurrent().Name
          $action=New-ScheduledTaskAction -Execute 'cmd.exe' -Argument ('/d /c "'+$wrapper+'"')
          $trigger=New-ScheduledTaskTrigger -AtLogOn -User $user
          $settings=New-ScheduledTaskSettingsSet -RestartCount 20 -RestartInterval (New-TimeSpan -Minutes 1) -ExecutionTimeLimit ([TimeSpan]::Zero) -StartWhenAvailable -MultipleInstances IgnoreNew
          $principal=New-ScheduledTaskPrincipal -UserId $user -LogonType Interactive -RunLevel Limited
          Register-ScheduledTask -TaskName $name -Action $action -Trigger $trigger -Settings $settings -Principal $principal -Force | Out-Null
          Enable-ScheduledTask -TaskName $name | Out-Null
          Start-ScheduledTask -TaskName $name
          Start-Sleep -Seconds 8
          $health=Invoke-RestMethod -Uri 'http://127.0.0.1:5059/health' -TimeoutSec 5
          $task=Get-ScheduledTask -TaskName $name
          [pscustomobject]@{task=$name;state=[string]$task.State;enabled=[bool]$task.Settings.Enabled;health=$health}|ConvertTo-Json -Depth 8 -Compress
