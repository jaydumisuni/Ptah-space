name: Phase 0C Scaffold Preflight

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PTAH_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  scaffold-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact Ptah scaffold head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.PTAH_EXACT_SHA }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Prepare report directory
        run: mkdir -p conformance/reports

      - name: Record pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc -Vv | tee conformance/reports/rust-toolchain.txt
          cargo -V | tee -a conformance/reports/rust-toolchain.txt

      - name: Check formatting
        if: always()
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee conformance/reports/rustfmt.txt

      - name: Run Clippy
        if: always()
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 \
            | tee conformance/reports/clippy.txt

      - name: Run workspace tests
        if: always()
        run: |
          set -o pipefail
          cargo test --workspace --all-features 2>&1 \
            | tee conformance/reports/cargo-test.txt

      - name: Run documentation tests
        if: always()
        run: |
          set -o pipefail
          cargo test --workspace --doc 2>&1 \
            | tee conformance/reports/cargo-doc-test.txt

      - name: Verify locked zero-dependency scaffold graph
        if: always()
        run: |
          cargo metadata --locked --format-version 1 > conformance/reports/cargo-metadata.json
          python - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path("conformance/reports/cargo-metadata.json").read_text())
          packages = metadata.get("packages", [])
          assert len(packages) == 1, f"expected one scaffold package, found {len(packages)}"
          package = packages[0]
          assert package["name"] == "ptah-phase0c-preflight"
          assert package.get("dependencies") == [], "runtime dependencies are not authorized"
          assert package.get("license") is None, "public licence has not been accepted"
          assert package.get("publish") == [], "scaffold package must remain non-publishable"
          PY

      - name: Enforce no-runtime source policy
        if: always()
        run: |
          grep -F 'pub const RUNTIME_IMPLEMENTATION_AUTHORIZED: bool = false;' \
            tools/phase0c-preflight/src/lib.rs
          test ! -e LICENSE
          if grep -R --line-number --include='Cargo.toml' -E '^[[:space:]]*license[[:space:]]*=' .; then
            echo "A public package licence was claimed before owner acceptance" >&2
            exit 1
          fi

      - name: Check out frozen Ptah roadmap checkpoint
        if: always()
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: jaydumisuni/ptah-roadmap-
          ref: dc2db457f1705d0cba80f17ab76e5e93f808aee0
          path: .ptah-roadmap
          persist-credentials: false

      - name: Install frozen conformance harness
        if: always()
        run: python -m pip install ./.ptah-roadmap/conformance/harness

      - name: Run frozen harness unit tests
        if: always()
        working-directory: .ptah-roadmap/conformance/harness
        run: |
          set -o pipefail
          python -m unittest -v test_ptah_conformance.py 2>&1 \
            | tee ../../../conformance/reports/harness-unit-tests.txt

      - name: Run frozen structural conformance locally
        if: always()
        run: >-
          ptah-conformance
          --root ./.ptah-roadmap
          --report ./conformance/reports/phase-0b-conformance.json

      - name: Run frozen semantic fixtures locally
        if: always()
        run: >-
          python ./.ptah-roadmap/conformance/harness/semantic_fixture_runner.py
          --root ./.ptah-roadmap
          --report ./conformance/reports/phase-0b-semantic.json

      - name: Write exact-head scaffold report
        if: always()
        env:
          PTAH_HEAD_SHA: ${{ env.PTAH_EXACT_SHA }}
          PTAH_RUN_ID: ${{ github.run_id }}
          PTAH_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          reports = Path("conformance/reports")
          reports.mkdir(parents=True, exist_ok=True)
          checked_out = subprocess.run(
              ["git", "rev-parse", "HEAD"], capture_output=True, text=True, check=False
          ).stdout.strip()
          expected = os.environ.get("PTAH_HEAD_SHA", "")
          payload = {
              "record_type": "ptah.phase0c.scaffold_preflight",
              "created_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "implementation_commit": expected,
              "checked_out_commit": checked_out,
              "exact_head_match": bool(expected and checked_out == expected),
              "workflow_run_id": os.environ.get("PTAH_RUN_ID", ""),
              "workflow_run_attempt": os.environ.get("PTAH_RUN_ATTEMPT", ""),
              "phase_0b_freeze_commit": "dc2db457f1705d0cba80f17ab76e5e93f808aee0",
              "wp14_freeze_commit": "fef387c4f074af7fcf86f2d99f7f9b7637e91f88",
              "runtime_implementation_authorized": False,
              "rustc": subprocess.run(
                  ["rustc", "--version"], capture_output=True, text=True, check=False
              ).stdout.strip(),
              "cargo": subprocess.run(
                  ["cargo", "--version"], capture_output=True, text=True, check=False
              ).stdout.strip(),
              "reports_present": sorted(
                  path.name for path in reports.iterdir() if path.is_file()
              ),
          }
          (reports / "phase-0c-scaffold-report.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          if not payload["exact_head_match"]:
              raise SystemExit(
                  f"checked-out commit {checked_out!r} does not match exact head {expected!r}"
              )
          PY

      - name: Upload immutable preflight reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-0c-scaffold-${{ env.PTAH_EXACT_SHA }}-${{ github.run_attempt }}
          path: conformance/reports/
          if-no-files-found: error
          retention-days: 30
