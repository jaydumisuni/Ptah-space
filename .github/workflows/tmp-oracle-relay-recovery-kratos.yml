# activate: updater gate deep-read 2026-08-26T19:03Z
name: Temporary Redmi updater region-gate deep read on KRATOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-oracle-relay-recovery-kratos.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 20
    steps:
      - name: Inspect updater APK, SKU parser, and cust gate read-only
        shell: bash
        run: |
          set -euo pipefail
          ADB=/home/kratos/.local/share/mibu-platform-tools/current/platform-tools/adb
          "$ADB" start-server >/dev/null 2>&1 || true
          test "$("$ADB" get-state 2>/dev/null | tail -n1)" = device

          echo '=== EXACT REGION STATE ==='
          "$ADB" shell 'for k in ro.boot.hwc ro.boot.vbmeta.device_state ro.miui.region ro.vendor.miui.region ro.miui.build.region ro.miui.cust_variant ro.vendor.miui.cust_variant ro.miui.business.version ro.product.device ro.product.mod_device ro.build.version.incremental; do printf "%s=" "$k"; getprop "$k"; done'

          echo '=== CUST PROP MATRIX ==='
          "$ADB" shell 'for f in /system_ext/cust/*/cust.prop; do echo "--- $f ---"; cat "$f" 2>/dev/null | head -n 200; done' 2>&1 | head -n 1800

          echo '=== MIUI CUST / UPDATER INIT ==='
          for f in /system_ext/etc/init/init.miui.cust.rc /system_ext/etc/init/miupdater.rc; do
            echo "--- $f ---"
            "$ADB" shell "cat $f 2>/dev/null" | head -n 500 || true
          done

          echo '=== OTA CERT / SKU PARSER FILES ==='
          "$ADB" shell 'ls -lZ /system/etc/security/otacerts.zip /system_ext/lib64/libskuparser_cpp.so /system_ext/lib64/libskuparser_ffi.so /product/pangu/system/etc/ota_skip_apps 2>&1' || true
          echo '--- ota_skip_apps ---'
          "$ADB" shell 'cat /product/pangu/system/etc/ota_skip_apps 2>/dev/null' | head -n 300 || true

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          echo '=== PULL UPDATER APK ==='
          updater=/product/app/Updater/Updater.apk
          "$ADB" shell "ls -lZ $updater" 2>&1
          "$ADB" pull "$updater" "$work/Updater.apk" >/dev/null
          file "$work/Updater.apk"
          sha256sum "$work/Updater.apk"

          echo '=== APK STRUCTURE ==='
          unzip -Z1 "$work/Updater.apk" | grep -E '^(AndroidManifest.xml|resources\.arsc|classes[0-9]*\.dex|lib/|assets/|res/raw/)' | head -n 500

          echo '=== REGION / SKU / PACKAGE VALIDATION STRINGS ==='
          for member in $(unzip -Z1 "$work/Updater.apk" | grep -E '^(classes[0-9]*\.dex|resources\.arsc)$'); do
            echo "### $member"
            unzip -p "$work/Updater.apk" "$member" 2>/dev/null \
              | strings -a \
              | grep -Ei '(CNXM|MIXM|EUXM|INXM|TWXM|RUXM|TRXM|IDXM|region|cust[_A-Za-z]*variant|currentSku|romRegion|mod[_A-Za-z]*device|device[_ -]?mismatch|version[_ -]?mismatch|rollback|anti.?rollback|verify|signature|signed|package[_ -]?invalid|update package|recovery|ota|pre-device|pre-build|post-build|post-timestamp|spl-downgrade|downgrade|build fingerprint|incremental|sku)' \
              | sort -u | head -n 1800
          done

          echo '=== SKU PARSER STRINGS ==='
          for lib in /system_ext/lib64/libskuparser_cpp.so /system_ext/lib64/libskuparser_ffi.so; do
            base="$(basename "$lib")"
            "$ADB" pull "$lib" "$work/$base" >/dev/null 2>&1 || continue
            echo "### $base"
            strings -a "$work/$base" | grep -Ei '(region|cust|variant|sku|prop|carrier|hwc|mod_device|product|cn|global|operator)' | sort -u | head -n 900
          done

          echo '=== POST-PROBE SAFETY ==='
          echo "adb_state_after=$("$ADB" get-state 2>/dev/null | tail -n1)"
          ip route show default | head -n 10 || true
