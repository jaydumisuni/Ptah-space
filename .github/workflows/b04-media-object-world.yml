name: B04 one-use test-structure correction

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/b04-media-object-world.yml"

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out writable B04 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: b04-media-object-world
          fetch-depth: 0
      - name: Move ambiguity fixture to module scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/ptah-archive-decomposition/tests/b04.rs')
          text = path.read_text(encoding='utf-8')
          local = '''\n    struct OtherAdapter;\n    impl MediaAdapter for OtherAdapter {\n        fn adapter_id(&self) -> &'static str {\n            "b04.fixture.other"\n        }\n        fn supports_media_type(&self, media_type: &str) -> bool {\n            media_type == "image/png"\n        }\n        fn isolation(&self) -> MediaIsolation {\n            MediaIsolation::passive()\n        }\n        fn inspect(\n            &self,\n            _source_bytes: &[u8],\n            _media_type: &str,\n            _request: &MediaRequest,\n            _limits: MediaLimits,\n        ) -> Result<AdapterMedia, String> {\n            unreachable!("ambiguity is rejected before inspection")\n        }\n    }\n'''
          if text.count(local) != 1:
              raise SystemExit('expected local OtherAdapter fixture exactly once')
          text = text.replace(local, '\n', 1)
          marker = '#[test]\nfn ambiguous_media_adapters_fail_closed_without_provider_selection() {'
          module_fixture = '''struct OtherAdapter;\n\nimpl MediaAdapter for OtherAdapter {\n    fn adapter_id(&self) -> &'static str {\n        "b04.fixture.other"\n    }\n\n    fn supports_media_type(&self, media_type: &str) -> bool {\n        media_type == "image/png"\n    }\n\n    fn isolation(&self) -> MediaIsolation {\n        MediaIsolation::passive()\n    }\n\n    fn inspect(\n        &self,\n        _source_bytes: &[u8],\n        _media_type: &str,\n        _request: &MediaRequest,\n        _limits: MediaLimits,\n    ) -> Result<AdapterMedia, String> {\n        unreachable!("ambiguity is rejected before inspection")\n    }\n}\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('expected ambiguity test marker exactly once')
          text = text.replace(marker, module_fixture + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          cargo fmt --all
          git diff --check
      - name: Commit test-structure correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ptah-archive-decomposition/tests/b04.rs
          git diff --cached --check
          git commit -m "B04 review: lift ambiguity fixture to module scope"
          git push origin HEAD:b04-media-object-world
