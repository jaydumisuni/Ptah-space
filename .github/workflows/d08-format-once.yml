name: D08 One-Shot Rustfmt

on:
  push:
    branches:
      - d08-application-platform-expansion
    paths:
      - .github/workflows/d08-format-once.yml

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d08-application-platform-expansion
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Apply exact Rustfmt delta
        run: cargo fmt --all
      - name: Commit formatter-only correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatter delta"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ptah-application-runtime
          git diff --cached --check
          git commit -m "style(d08): apply rustfmt"
          git push origin HEAD:d08-application-platform-expansion
