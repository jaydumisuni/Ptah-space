name: TEMP KRATOS Ptah Runner Control

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-kratos-ptah-runner-smoke.yml"

permissions:
  contents: read

jobs:
  control:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 3
    steps:
      - name: Inspect Oracle ATHENA bootstrap history and runner registry
        shell: bash
        run: |
          set -euo pipefail
          echo '--- ORACLE ATHENA WORKFLOW RUNS ---'
          gh run list -R jaydumisuni/Oracle- --workflow ptah-athena-runner-bootstrap-selfhosted.yml --limit 10 --json databaseId,status,conclusion,headSha,event,createdAt,displayTitle || true
          echo '--- PTAH RUNNERS ---'
          gh api repos/jaydumisuni/Ptah-space/actions/runners --jq '.runners[] | {name,status,busy,os,labels:[.labels[].name]}'
          echo '--- ORACLE RUNNERS ---'
          gh api repos/jaydumisuni/Oracle-/actions/runners --jq '.runners[] | {name,status,busy,os,labels:[.labels[].name]}'
