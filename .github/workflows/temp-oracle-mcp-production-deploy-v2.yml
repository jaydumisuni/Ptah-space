name: TEMP ATHENA Redmi ROM pause without Starlink

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-oracle-mcp-production-deploy-v2.yml"

permissions:
  contents: read

jobs:
  pause:
    runs-on: [self-hosted, athena, windows, x64, physical, ptah]
    timeout-minutes: 5
    steps:
      - name: Suspend existing BITS transfer and report storage
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bitsName = 'TTG Redmi sky Global OS2.0.9.0'
          $job = Get-BitsTransfer -Name $bitsName -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($job) {
            if ($job.JobState -eq 'Transferring' -or $job.JobState -eq 'Connecting' -or $job.JobState -eq 'Queued') {
              Suspend-BitsTransfer -BitsJob $job
              $job = Get-BitsTransfer -Name $bitsName -ErrorAction SilentlyContinue | Select-Object -First 1
            }
            $pct = if ([int64]$job.BytesTotal -gt 0) { [math]::Round(([double]$job.BytesTransferred / [double]$job.BytesTotal) * 100, 3) } else { 0 }
            [ordered]@{
              state=[string]$job.JobState
              bytesTransferred=[int64]$job.BytesTransferred
              bytesTotal=[int64]$job.BytesTotal
              percent=$pct
              destination=($job.FileList | Select-Object -First 1 -ExpandProperty LocalName)
            } | ConvertTo-Json -Compress
          } else {
            Write-Output '{"state":"NO_BITS_JOB"}'
          }

          $vol = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='E:'"
          if ($vol) {
            [ordered]@{drive='E:';label=$vol.VolumeName;driveType=[int]$vol.DriveType;fileSystem=$vol.FileSystem;freeBytes=[int64]$vol.FreeSpace;sizeBytes=[int64]$vol.Size} | ConvertTo-Json -Compress
          }
