name: B01 one-use review correction

on:
  pull_request:
    paths:
      - "tools/b01_review_patch.py"
      - ".github/workflows/b01-review-patch-pr.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out writable PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply reviewed patch and canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/b01_review_patch.py
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          cargo fmt --all
          rm tools/b01_review_patch.py
          rm .github/workflows/b01-review-patch-pr.yml
      - name: Commit corrected product candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "B01 review: resolve transfer and sync findings"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
