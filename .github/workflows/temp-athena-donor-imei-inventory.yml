name: ATHENA TechGuy IMEI evidence patch archive
on:
  push:
    branches: [diagnostics/donor-imei-recovery-20261016]
    paths: [.github/workflows/temp-athena-donor-imei-inventory.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: [self-hosted, athena, windows, x64, physical, ptah]
    timeout-minutes: 6
    steps:
      - name: Validate source patch and immutable readiness receipts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'ATHENA'){throw 'WRONG_HOST'}
          $base='D:\projects\TechGuy-IMEI\.workspace\donor-imei-20261016'
          $expected=@{
            'donor-ui-evidence-integration.patch'='1e5bb23a43a3179cd0fb69d46f50c357de5ffba2016ca8455b06c2e4ee2e5217'
            'integration-receipt.json'='a4cc4942df1b979e5a4a57fca7094fe0d9d048f1d6185f0821257d4160b34509'
            'androidutility-control-readiness.json'='9d8bec037593454b3fd766e872feb031ec14ae621947b6edf5d41a3d1aab293d'
          }
          foreach($name in @($expected.Keys)){
            $p=Join-Path $base $name
            if(-not (Test-Path -LiteralPath $p -PathType Leaf)){throw "MISSING_PROOF: $name"}
            $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath $p).Hash.ToLowerInvariant()
            if($hash -ne $expected[$name]){throw "HASH_MISMATCH: $name"}
            Write-Host "VERIFIED $name"
          }
          Set-Location 'D:\projects\TechGuy-IMEI'
          & '.\.venv\Scripts\python.exe' -m pytest -q tests
          if($LASTEXITCODE -ne 0){throw 'SOFTWARE_REGRESSION_FAILED'}
      - name: Preserve selected patch and receipts without touching project checkout
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: techguy-imei-donor-evidence-patch-20261016
          path: |
            D:/projects/TechGuy-IMEI/.workspace/donor-imei-20261016/donor-ui-evidence-integration.patch
            D:/projects/TechGuy-IMEI/.workspace/donor-imei-20261016/integration-receipt.json
            D:/projects/TechGuy-IMEI/.workspace/donor-imei-20261016/androidutility-control-readiness.json
          if-no-files-found: error
          retention-days: 7
