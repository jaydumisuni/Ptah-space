name: B07 strict Clippy correction helper

on:
  pull_request:
    paths:
      - "B07_SEARCH_V1.md"
      - "crates/ptah-archive-decomposition/Cargo.toml"
      - "crates/ptah-archive-decomposition/src/lib.rs"
      - "crates/ptah-archive-decomposition/src/b07.rs"
      - "crates/ptah-archive-decomposition/tests/b07.rs"
      - ".github/workflows/b07-search-v1.yml"

permissions:
  contents: write

env:
  PTAH_EXACT_SHA: ${{ github.event.pull_request.head.sha }}
  CARGO_TERM_COLOR: always

jobs:
  correct-b07-clippy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact B07 review head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PTAH_EXACT_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust review toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
          rustc -V | grep -q '^rustc 1.97.1 '

      - name: Apply exact strict Clippy corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/ptah-archive-decomposition/src/b07.rs')
          source = path.read_text(encoding='utf-8')

          old = 'canonical.sort_by(|left, right| document_key(left).cmp(&document_key(right)));'
          new = 'canonical.sort_by_key(document_key);'
          assert source.count(old) == 1
          source = source.replace(old, new, 1)

          old = 'field.value.as_bytes().len() > limits.max_field_bytes'
          new = 'field.value.len() > limits.max_field_bytes'
          assert source.count(old) == 1
          source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY

          cargo fmt --all
          cargo test -p ptah-archive-decomposition --test b07 --locked -- --nocapture
          cargo clippy -p ptah-archive-decomposition --lib --test b07 --locked -- -D warnings
          git diff --check
          test "$(git diff --name-only | paste -sd ' ' -)" = "crates/ptah-archive-decomposition/src/b07.rs"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ptah-archive-decomposition/src/b07.rs
          git commit -m "B07 review: satisfy strict Clippy"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
