name: F02 USB inventory and inert device-rule validation

on:
  pull_request:
    paths:
      - "tools/f02_usb_inventory_rules.py"
      - "tools/test_f02_usb_inventory_rules.py"
      - "conformance/os-foundation/f02-empty-draft.json"
      - ".github/workflows/f02-usb-rules-safe-proof.yml"
  push:
    branches:
      - "feat/f02-usb-safe-profile-20261019"
    paths:
      - "tools/f02_usb_inventory_rules.py"
      - "tools/test_f02_usb_inventory_rules.py"
      - "conformance/os-foundation/f02-empty-draft.json"
      - ".github/workflows/f02-usb-rules-safe-proof.yml"

permissions:
  contents: read

jobs:
  safe-inventory:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
      - name: Reject unsafe USB selectors and world-write permission
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest -q tools/test_f02_usb_inventory_rules.py
      - name: Ensure default profile emits only inert comments
        run: |
          python3 tools/f02_usb_inventory_rules.py             --rules conformance/os-foundation/f02-empty-draft.json > "$RUNNER_TEMP/f02-draft.txt"
          python3 - "$RUNNER_TEMP/f02-draft.txt" <<'PY'
          import pathlib,sys
          rows=pathlib.Path(sys.argv[1]).read_text().splitlines()
          assert rows and all(row.startswith("#") for row in rows)
          assert all("MODE=\"0666\"" not in row for row in rows)
          PY
