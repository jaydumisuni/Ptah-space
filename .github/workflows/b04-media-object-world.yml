name: B04 one-use pinned rustfmt correction

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/b04-media-object-world.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  format:
    if: github.event.pull_request.head.ref == 'b04-media-object-world' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out writable B04 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: b04-media-object-world
          fetch-depth: 0
      - name: Canonicalize B04 Rust with pinned rustfmt
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          cargo fmt --all
          git diff --check
      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ptah-archive-decomposition/src/b04.rs crates/ptah-archive-decomposition/src/lib.rs crates/ptah-archive-decomposition/tests/b04.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git commit -m "B04 review: canonicalize Rust formatting"
          git push origin HEAD:b04-media-object-world
