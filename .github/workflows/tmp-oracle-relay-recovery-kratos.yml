name: Temporary Redmi sky Global ROM locator on KRATOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-oracle-relay-recovery-kratos.yml'

permissions:
  contents: read

jobs:
  locate:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 8
    steps:
      - name: Locate Global fastboot archive across KRATOS desktops and mounts
        shell: bash
        run: |
          set -euo pipefail
          echo '=== IDENTITY ==='
          id
          printf 'HOME=%s\n' "$HOME"
          echo '=== USER HOMES ==='
          getent passwd | awk -F: '$6 ~ /^\/home\// {print $1 "\t" $6}' || true
          echo '=== DESKTOP DIRECTORIES ==='
          find /home /root -maxdepth 3 -type d \( -iname Desktop -o -iname desktop \) -print 2>/dev/null | sort -u || true
          echo '=== EXACT / SKY ARCHIVE CANDIDATES ==='
          find /home /root /mnt /media /run/media -maxdepth 7 -type f \
            \( -name 'sky_global_images_OS2.0.9.0.VMWMIXM_20250530.0000.00_15.0_global_3334591f85.tgz' -o -name 'sky_global_images_*.tgz' \) \
            -printf '%s\t%TY-%Tm-%TdT%TH:%TM:%TS\t%p\n' 2>/dev/null | sort -k3 | head -n 40 || true
          echo '=== LARGE TGZ ON DESKTOP-LIKE PATHS ==='
          find /home /root /mnt /media /run/media -maxdepth 7 -type f -name '*.tgz' -size +1G \
            -printf '%s\t%TY-%Tm-%TdT%TH:%TM:%TS\t%p\n' 2>/dev/null | grep -Ei '/desktop/|/Desktop/' | sort -k3 | head -n 40 || true
