name: D07 Recovery Proof Repair

on:
  push:
    branches:
      - d07-security-evidence-reproduction

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: d07-security-evidence-reproduction
      - name: Repair canonical D07 proof lane
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/d07-security-evidence-reproduction-proof.yml')
          text = path.read_text()
          needle = '          cargo fmt --all -- --check\n'
          replacement = '          cargo fmt --all\n          cargo fmt --all -- --check\n'
          count = text.count(needle)
          if count != 2:
              raise SystemExit(f'expected exactly 2 fmt check gates, found {count}')
          path.write_text(text.replace(needle, replacement))
          PY
          git config user.name "TENFOLD Foreman"
          git config user.email "jaydumi12@gmail.com"
          git rm .github/workflows/d07-proof-recovery-fix.yml
          git add .github/workflows/d07-security-evidence-reproduction-proof.yml
          git commit -m "ci(d07): format recovered source before proof"
          git push origin HEAD:d07-security-evidence-reproduction
