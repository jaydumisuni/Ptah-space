name: B03 one-use review correction

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/b03-documents-structured-text.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  correct:
    if: github.event.pull_request.head.ref == 'b03-documents-structured-text' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out writable B03 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: b03-documents-structured-text
          fetch-depth: 0
      - name: Apply exact Review findings and regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('crates/ptah-archive-decomposition/src/b03.rs')
          text = source.read_text(encoding='utf-8')
          old_anchor = '''        let (byte_start, byte_end_exclusive) = span
              .source_byte_range
              .map_or((None, None), |(start, end)| (Some(start), Some(end)));
'''
          new_anchor = '''        let (byte_start, byte_end_exclusive) = if truncated {
              (None, None)
          } else {
              span.source_byte_range
                  .map_or((None, None), |(start, end)| (Some(start), Some(end)))
          };
'''
          if text.count(old_anchor) != 1:
              raise SystemExit('expected exact B03 retained-text anchor block once')
          text = text.replace(old_anchor, new_anchor)

          old_remove = '''fn remove_html_element(value: &str, tag: &str) -> String {
              let lower = value.to_ascii_lowercase();
              let open = format!("<{tag}");
              let close = format!("</{tag}");
              let mut out = String::with_capacity(value.len());
              let mut cursor = 0usize;
              while let Some(relative_start) = lower[cursor..].find(&open) {
                  let start = cursor + relative_start;
                  out.push_str(&value[cursor..start]);
                  let Some(open_end_relative) = lower[start..].find('>') else {
                      cursor = value.len();
                      break;
                  };
                  let content_start = start + open_end_relative + 1;
                  let Some(close_relative) = lower[content_start..].find(&close) else {
                      cursor = value.len();
                      break;
                  };
                  let close_start = content_start + close_relative;
                  let Some(close_end_relative) = lower[close_start..].find('>') else {
                      cursor = value.len();
                      break;
                  };
                  cursor = close_start + close_end_relative + 1;
              }
              if cursor < value.len() {
                  out.push_str(&value[cursor..]);
              }
              out
          }
'''
          new_remove = '''fn remove_html_element(value: &str, tag: &str) -> String {
              let lower = value.to_ascii_lowercase();
              let mut out = String::with_capacity(value.len());
              let mut cursor = 0usize;
              while let Some(start) = find_html_tag_start(&lower, cursor, tag, false) {
                  out.push_str(&value[cursor..start]);
                  let Some(open_end_relative) = lower[start..].find('>') else {
                      cursor = value.len();
                      break;
                  };
                  let open_end = start + open_end_relative;
                  if tag_is_self_closing(&lower[start..=open_end]) {
                      cursor = open_end + 1;
                      continue;
                  }

                  let mut depth = 1usize;
                  let mut scan = open_end + 1;
                  let mut closed = false;
                  while depth > 0 {
                      let next_open = find_html_tag_start(&lower, scan, tag, false);
                      let next_close = find_html_tag_start(&lower, scan, tag, true);
                      match (next_open, next_close) {
                          (_, Some(close_start)) if next_open.is_none_or(|open_start| close_start < open_start) => {
                              let Some(close_end_relative) = lower[close_start..].find('>') else {
                                  scan = value.len();
                                  break;
                              };
                              depth -= 1;
                              scan = close_start + close_end_relative + 1;
                              if depth == 0 {
                                  closed = true;
                              }
                          }
                          (Some(open_start), _) => {
                              let Some(nested_end_relative) = lower[open_start..].find('>') else {
                                  scan = value.len();
                                  break;
                              };
                              let nested_end = open_start + nested_end_relative;
                              if !tag_is_self_closing(&lower[open_start..=nested_end]) {
                                  depth = depth.saturating_add(1);
                              }
                              scan = nested_end + 1;
                          }
                          (None, None) => {
                              scan = value.len();
                              break;
                          }
                      }
                  }
                  if !closed {
                      cursor = value.len();
                      break;
                  }
                  cursor = scan;
              }
              if cursor < value.len() {
                  out.push_str(&value[cursor..]);
              }
              out
          }

          fn find_html_tag_start(lower: &str, from: usize, tag: &str, closing: bool) -> Option<usize> {
              let needle = if closing {
                  format!("</{tag}")
              } else {
                  format!("<{tag}")
              };
              let mut cursor = from;
              while let Some(relative) = lower[cursor..].find(&needle) {
                  let start = cursor + relative;
                  let boundary = start + needle.len();
                  let accepted = lower.as_bytes().get(boundary).is_none_or(|byte| {
                      byte.is_ascii_whitespace() || matches!(*byte, b'>' | b'/')
                  });
                  if accepted {
                      return Some(start);
                  }
                  cursor = boundary;
              }
              None
          }

          fn tag_is_self_closing(tag_source: &str) -> bool {
              tag_source
                  .strip_suffix('>')
                  .is_some_and(|prefix| prefix.trim_end().ends_with('/'))
          }
'''
          if text.count(old_remove) != 1:
              raise SystemExit('expected exact B03 active-element remover once')
          source.write_text(text.replace(old_remove, new_remove), encoding='utf-8')

          tests = Path('crates/ptah-archive-decomposition/tests/b03_review.rs')
          test_text = tests.read_text(encoding='utf-8')
          marker = 'fn truncated_text_clears_exact_byte_anchor()'
          if marker not in test_text:
              test_text += r'''

          #[test]
          fn truncated_text_clears_exact_byte_anchor() {
              let report = inspect_document(
                  b"abcdefgh",
                  &agreed("text/plain"),
                  &context(),
                  DocumentLimits {
                      max_text_bytes: 4,
                      ..DocumentLimits::default()
                  },
                  &[&SafeTextAdapter],
              )
              .expect("bounded text");

              assert_eq!(report.text[0].text, "abcd");
              assert_eq!(report.text[0].anchor.byte_start, None);
              assert_eq!(report.text[0].anchor.byte_end_exclusive, None);
              assert!(
                  report
                      .coverage
                      .unknown_gaps
                      .iter()
                      .any(|gap| gap.contains("max_text_bytes"))
              );
          }

          #[test]
          fn nested_active_regions_are_removed_as_complete_outer_region() {
              let source = br#"<html><body><script>evil1<script>evil2</script>evil3</script><p>safe</p></body></html>"#;
              let report = inspect_document(
                  source,
                  &agreed("text/html"),
                  &context(),
                  DocumentLimits::default(),
                  &[&SafeHtmlAdapter],
              )
              .expect("nested active HTML");

              assert!(report.active_content_observed);
              let preview = String::from_utf8(report.preview.expect("preview").bytes).expect("UTF-8");
              assert!(preview.contains("safe"));
              assert!(!preview.contains("evil1"));
              assert!(!preview.contains("evil2"));
              assert!(!preview.contains("evil3"));
              let conversion = String::from_utf8(report.conversion.expect("conversion").bytes)
                  .expect("UTF-8 conversion");
              assert!(conversion.contains("safe"));
              assert!(!conversion.contains("evil1"));
              assert!(!conversion.contains("evil2"));
              assert!(!conversion.contains("evil3"));
          }
          '''
              tests.write_text(test_text, encoding='utf-8')
          PY
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          cargo fmt --all
          git diff --check
      - name: Commit reviewed B03 corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ptah-archive-decomposition/src/b03.rs crates/ptah-archive-decomposition/tests/b03_review.rs
          git diff --cached --check
          git commit -m "B03 review: harden truncated anchors and nested active regions"
          git push origin HEAD:b03-documents-structured-text
