name: C01 exact review correction

on:
  pull_request:
    paths:
      - "C01_DISK_IMAGE_PARTITION_FOUNDATIONS.md"
      - "crates/ptah-archive-decomposition/Cargo.toml"
      - "crates/ptah-archive-decomposition/src/lib.rs"
      - "crates/ptah-archive-decomposition/src/c01.rs"
      - "crates/ptah-archive-decomposition/tests/c01.rs"
      - ".github/workflows/c01-disk-image-partition-foundations.yml"

permissions:
  contents: write

env:
  PTAH_EXACT_SHA: ${{ github.event.pull_request.head.sha }}
  PTAH_C01_BASE_SHA: d6c0663a7a9c46c2d12dc9a4ce3bd404b5ffc710
  PTAH_REVIEW_TRANSFORM_SHA: 0ed14c28b61bb81ad746ef2ea3b1800d1d8fb09c
  CARGO_TERM_COLOR: always

jobs:
  correct-c01:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact C01 review head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PTAH_EXACT_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Lock B07 base and permanent six-file C01 surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$PTAH_C01_BASE_SHA" HEAD)" = "$PTAH_C01_BASE_SHA"
          python3 - <<'PY'
          import os
          import subprocess
          base = os.environ["PTAH_C01_BASE_SHA"]
          files = subprocess.check_output(["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines()
          allowed = {
              "C01_DISK_IMAGE_PARTITION_FOUNDATIONS.md",
              "crates/ptah-archive-decomposition/Cargo.toml",
              "crates/ptah-archive-decomposition/src/lib.rs",
              "crates/ptah-archive-decomposition/src/c01.rs",
              "crates/ptah-archive-decomposition/tests/c01.rs",
              ".github/workflows/c01-disk-image-partition-foundations.yml",
          }
          unexpected = sorted(set(files).difference(allowed))
          missing = sorted(allowed.difference(files))
          assert not unexpected, f"C01 scope drift: {unexpected}"
          assert not missing, f"C01 required surface missing: {missing}"
          PY

      - name: Install pinned Rust review toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
          rustc -V | grep -q '^rustc 1.97.1 '
          cargo -V | grep -q '^cargo 1.97.1 '

      - name: Recover reviewed transform and apply all Review corrections
        shell: bash
        run: |
          set -euo pipefail
          git show "$PTAH_REVIEW_TRANSFORM_SHA:.github/workflows/c01-disk-image-partition-foundations.yml" > /tmp/c01-reviewed-workflow.yml
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('/tmp/c01-reviewed-workflow.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n\n          cargo fmt --all\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/c01-reviewed-transform.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/c01-reviewed-transform.py
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('crates/ptah-archive-decomposition/src/c01.rs')
          source = source_path.read_text(encoding='utf-8')

          old = 'if chunk.chunk_bytes % 4 != 0 {'
          new = 'if !chunk.chunk_bytes.is_multiple_of(4) {'
          assert source.count(old) == 1, source.count(old)
          source = source.replace(old, new, 1)

          old = '''    if left.normalized_size != right.normalized_size {
              differences.push(format!(
                  "normalized_size:{}->{}",
                  left.normalized_size, right.normalized_size
              ));
          }
          if left.source_coverage != right.source_coverage {
          '''
          new = '''    if left.normalized_size != right.normalized_size {
              differences.push(format!(
                  "normalized_size:{}->{}",
                  left.normalized_size, right.normalized_size
              ));
          }
          if left.assessment != right.assessment {
              differences.push(format!(
                  "assessment:{:?}->{:?}",
                  left.assessment, right.assessment
              ));
          }
          if left.layout_coverage != right.layout_coverage {
              differences.push("layout_coverage_changed".to_owned());
          }
          if left.source_coverage != right.source_coverage {
          '''
          assert source.count(old) == 1, source.count(old)
          source_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          tests_path = Path('crates/ptah-archive-decomposition/tests/c01.rs')
          tests = tests_path.read_text(encoding='utf-8')

          sparse_anchor = '''    assert!(matches!(
              normalize_disk_image(&malformed, DiskImageLimits::default()),
              Err(C01Error::MalformedSparse(_))
          ));

              let source = vec![0x11_u8; SECTOR];
          '''
          sparse_replacement = '''    assert!(matches!(
              normalize_disk_image(&malformed, DiskImageLimits::default()),
              Err(C01Error::MalformedSparse(_))
          ));

              let mut oversized_fill = Vec::new();
              oversized_fill.extend_from_slice(&0xed26_ff3a_u32.to_le_bytes());
              oversized_fill.extend_from_slice(&1_u16.to_le_bytes());
              oversized_fill.extend_from_slice(&0_u16.to_le_bytes());
              oversized_fill.extend_from_slice(&28_u16.to_le_bytes());
              oversized_fill.extend_from_slice(&12_u16.to_le_bytes());
              oversized_fill.extend_from_slice(&512_u32.to_le_bytes());
              oversized_fill.extend_from_slice(&1_u32.to_le_bytes());
              oversized_fill.extend_from_slice(&1_u32.to_le_bytes());
              oversized_fill.extend_from_slice(&0_u32.to_le_bytes());
              oversized_fill.extend_from_slice(&0xcac2_u16.to_le_bytes());
              oversized_fill.extend_from_slice(&0_u16.to_le_bytes());
              oversized_fill.extend_from_slice(&u32::MAX.to_le_bytes());
              oversized_fill.extend_from_slice(&16_u32.to_le_bytes());
              oversized_fill.extend_from_slice(&0x1122_3344_u32.to_le_bytes());
              assert!(matches!(
                  normalize_disk_image(&oversized_fill, DiskImageLimits::default()),
                  Err(C01Error::MalformedSparse(_))
              ));

              let source = vec![0x11_u8; SECTOR];
          '''
          assert tests.count(sparse_anchor) == 1, tests.count(sparse_anchor)
          tests = tests.replace(sparse_anchor, sparse_replacement, 1)

          gpt_anchor = '''    assert!(report
              .warnings
              .iter()
              .any(|value| value.contains("invalid identity or usable-LBA extent")));
          }
          '''
          gpt_replacement = '''    assert!(report
              .warnings
              .iter()
              .any(|value| value.contains("invalid identity or usable-LBA extent")));

              let metadata_overlap = gpt_image(2, 3, false);
              let overlap_image = normalize_disk_image(&metadata_overlap, DiskImageLimits::default())
                  .expect("overlap normalize");
              let overlap_report = inspect_partition_map(
                  &overlap_image,
                  &context(reference("object.revision")),
                  DiskImageLimits::default(),
              )
              .expect("overlap inspect");
              assert_eq!(overlap_report.assessment, PartitionMapAssessment::Inconclusive);
              assert!(overlap_report.partitions.is_empty());
          }
          '''
          assert tests.count(gpt_anchor) == 1, tests.count(gpt_anchor)
          tests = tests.replace(gpt_anchor, gpt_replacement, 1)

          comparison_anchor = '''    assert!(comparison
              .differences
              .iter()
              .any(|difference| difference.contains("partition_slot_changed:1")));
          }
          '''
          comparison_replacement = '''    assert!(comparison
              .differences
              .iter()
              .any(|difference| difference.contains("partition_slot_changed:1")));

              let complete_source = gpt_image(40, 49, false);
              let partial_source = gpt_image(40, 49, true);
              let complete_image = normalize_disk_image(&complete_source, DiskImageLimits::default())
                  .expect("complete normalize");
              let partial_image = normalize_disk_image(&partial_source, DiskImageLimits::default())
                  .expect("partial normalize");
              let complete = inspect_partition_map(
                  &complete_image,
                  &context(reference("object.revision")),
                  DiskImageLimits::default(),
              )
              .expect("complete inspect");
              let partial = inspect_partition_map(
                  &partial_image,
                  &context(reference("object.revision")),
                  DiskImageLimits::default(),
              )
              .expect("partial inspect");
              assert_eq!(complete.partitions, partial.partitions);
              let uncertainty = compare_disk_images(&complete, &partial);
              assert!(!uncertainty.identical_layout);
              assert!(uncertainty
                  .differences
                  .iter()
                  .any(|difference| difference.starts_with("assessment:")));
              assert!(uncertainty
                  .differences
                  .iter()
                  .any(|difference| difference == "layout_coverage_changed"));
          }
          '''
          assert tests.count(comparison_anchor) == 1, tests.count(comparison_anchor)
          tests_path.write_text(
              tests.replace(comparison_anchor, comparison_replacement, 1),
              encoding='utf-8',
          )
          PY
          cargo fmt --all
          cargo test -p ptah-archive-decomposition --test c01 --locked -- --nocapture \
            2>&1 | tee /tmp/c01-review-tests.txt
          grep -Eq 'test result: ok\. 20 passed; 0 failed;' /tmp/c01-review-tests.txt
          cargo clippy -p ptah-archive-decomposition --lib --test c01 --locked -- -D warnings \
            2>&1 | tee /tmp/c01-review-clippy.txt
          git diff --check

      - name: Commit exact corrected C01 Rust surface
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add crates/ptah-archive-decomposition/src/lib.rs \
                  crates/ptah-archive-decomposition/src/c01.rs \
                  crates/ptah-archive-decomposition/tests/c01.rs
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines())
          allowed = {
              "crates/ptah-archive-decomposition/src/lib.rs",
              "crates/ptah-archive-decomposition/src/c01.rs",
              "crates/ptah-archive-decomposition/tests/c01.rs",
          }
          assert changed, "C01 correction produced no source movement"
          assert not changed.difference(allowed), changed
          assert "crates/ptah-archive-decomposition/src/c01.rs" in changed
          assert "crates/ptah-archive-decomposition/tests/c01.rs" in changed
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "C01 review: resolve partition truth findings"
          git push origin "HEAD:${HEAD_BRANCH}"
