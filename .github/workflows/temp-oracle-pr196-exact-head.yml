name: Temporary Oracle ATHENA Wrangler Authority Probe

on:
  push:
    branches:
      - proof/oracle-pr196-exact-head-20260825
    paths:
      - .github/workflows/temp-oracle-pr196-exact-head.yml

permissions:
  contents: read

jobs:
  athena-wrangler-authority:
    runs-on: [self-hosted, athena, windows, ptah]
    timeout-minutes: 5
    steps:
      - name: Prove existing ATHENA Wrangler OAuth authority without exposing credentials
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command node -ErrorAction SilentlyContinue)) { throw 'NODE_NOT_AVAILABLE' }
          if (-not (Get-Command npx -ErrorAction SilentlyContinue)) { throw 'NPX_NOT_AVAILABLE' }
          $legacy = Join-Path $env:USERPROFILE '.wrangler\config\default.toml'
          $modern = Join-Path $env:USERPROFILE '.wrangler'
          Write-Host ('WRANGLER_HOME_EXISTS=' + (Test-Path -LiteralPath $modern))
          Write-Host ('WRANGLER_LEGACY_CONFIG_EXISTS=' + (Test-Path -LiteralPath $legacy))

          $oldCI = $env:CI
          $oldActions = $env:GITHUB_ACTIONS
          try {
            Remove-Item Env:CI -ErrorAction SilentlyContinue
            Remove-Item Env:GITHUB_ACTIONS -ErrorAction SilentlyContinue
            $output = & npx --yes 'wrangler@4.122.0' whoami 2>&1
            $code = $LASTEXITCODE
          }
          finally {
            if ($null -ne $oldCI) { $env:CI = $oldCI }
            if ($null -ne $oldActions) { $env:GITHUB_ACTIONS = $oldActions }
          }
          if ($code -ne 0) {
            $safe = @($output) | ForEach-Object { [string]$_ } | Where-Object { $_ -notmatch '(?i)token|authorization|bearer' }
            $safe | Select-Object -Last 30 | Write-Host
            throw ('ATHENA_WRANGLER_AUTHORITY_UNAVAILABLE exit=' + $code)
          }
          $text = (@($output) -join "`n")
          if ($text -notmatch '(?i)account|email|logged') { Write-Host 'WRANGLER_WHOAMI_COMPLETED_WITHOUT_IDENTITY_TEXT' }
          Write-Host 'ATHENA_WRANGLER_AUTHORITY=PASS VERSION=4.122.0'
