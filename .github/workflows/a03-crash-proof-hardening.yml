name: A03 abrupt-crash proof hardening

on:
  pull_request:
    paths:
      - ".github/workflows/a03-crash-proof-hardening.yml"

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact A03 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Add abrupt-process crash regression and proof claim
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('crates/ptah-ledger/src/lib.rs')
          source = source_path.read_text()

          source = source.replace(
              '        process,\n        sync::atomic::{AtomicU64, Ordering},',
              '        process::{self, Command},\n        sync::atomic::{AtomicU64, Ordering},',
              1,
          )

          anchor = '''    #[test]
              fn dropped_write_transaction_cannot_manufacture_success() {
          '''
          if anchor not in source:
              anchor = '''    #[test]
    fn dropped_write_transaction_cannot_manufacture_success() {
'''
          if anchor not in source:
              raise SystemExit('rollback test anchor not found')

          crash_tests = r'''    #[test]
    fn crash_writer_helper() {
        let Ok(path) = std::env::var("PTAH_A03_CRASH_HELPER_DB") else {
            return;
        };
        let Ok(entity_id) = std::env::var("PTAH_A03_CRASH_HELPER_ENTITY") else {
            return;
        };
        let entity_id = EntityId::from_str(&entity_id).expect("crash-helper entity identity");
        let mut ledger = Ledger::open(path).expect("open crash-helper ledger");
        let write = ledger.begin_write().expect("begin crash-helper write");
        write
            .insert(&node_record(entity_id, 1, 0, "abrupt-crash"))
            .expect("stage crash-helper record");
        process::abort();
    }

    #[test]
    fn abrupt_process_death_rolls_back_uncommitted_transaction() {
        let db = TempDb::new();
        let entity_id = EntityId::new_v7();
        drop(Ledger::open(db.path()).expect("initialize crash-test ledger"));

        let status = Command::new(std::env::current_exe().expect("current test executable"))
            .arg("--exact")
            .arg("tests::crash_writer_helper")
            .arg("--nocapture")
            .env("PTAH_A03_CRASH_HELPER_DB", db.path())
            .env("PTAH_A03_CRASH_HELPER_ENTITY", entity_id.to_string())
            .status()
            .expect("launch abrupt-crash child");
        assert!(!status.success(), "crash-helper child must terminate abruptly");

        let ledger = Ledger::open(db.path()).expect("reopen after abrupt process death");
        assert!(
            ledger
                .latest_record(entity_id)
                .expect("query after abrupt process death")
                .is_none(),
            "an uncommitted row must not survive process death"
        );
        assert_eq!(ledger.schema_version().expect("schema version after crash"), 2);
        assert_eq!(ledger.journal_mode().expect("journal mode after crash"), "wal");
    }

'''
          source = source.replace(anchor, crash_tests + anchor, 1)
          source_path.write_text(source)

          workflow_path = Path('.github/workflows/a03-exact-head-ledger-proof.yml')
          workflow = workflow_path.read_text()
          workflow = workflow.replace(
              "          for forbidden in ['ptah_activity_runtime', 'tokio::process', 'std::process::Command']:\n              assert forbidden not in source, forbidden",
              "          production_source = source.split('#[cfg(test)]', 1)[0]\n          for forbidden in ['ptah_activity_runtime', 'tokio::process', 'std::process::Command']:\n              assert forbidden not in production_source, forbidden",
              1,
          )
          workflow = workflow.replace(
              "              'transaction_rollback_proved': True,\n              'directional_migration_replay_proved': True,",
              "              'transaction_rollback_proved': True,\n              'abrupt_process_crash_recovery_proved': True,\n              'directional_migration_replay_proved': True,",
              1,
          )
          workflow_path.write_text(workflow)
          PY

      - name: Format and prove abrupt-crash behavior
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy -p ptah-ledger --all-targets --locked -- -D warnings
          cargo test -p ptah-ledger --locked
          python tools/check_phase0c_scaffold.py
          python tools/check_rust_dependency_lock.py

      - name: Commit only proved crash-test bytes and retire helper
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm .github/workflows/a03-crash-proof-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ptah-ledger/src/lib.rs .github/workflows/a03-exact-head-ledger-proof.yml .github/workflows/a03-crash-proof-hardening.yml
          git diff --cached --check
          git commit -m "A03: prove rollback across abrupt process death"
          git push origin "HEAD:${HEAD_REF}"
