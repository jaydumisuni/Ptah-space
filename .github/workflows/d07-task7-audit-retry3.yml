name: D07 Task 7 Generated Binding Audit Retry

on:
  push:
    branches:
      - d07-security-evidence-reproduction
    paths:
      - .github/workflows/d07-task7-audit-retry3.yml

permissions:
  contents: write

jobs:
  task7-retry3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: d07-security-evidence-reproduction
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Recover Task 7 RED and implementation scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path('.github/workflows/d07-task7-proof.yml').read_text().splitlines()

          def extract(step_name, next_step):
              start = next(i for i, line in enumerate(text) if line.strip() == f'- name: {step_name}')
              end = next(i for i, line in enumerate(text[start + 1:], start + 1) if line.strip() == f'- name: {next_step}')
              run = next(i for i in range(start, end) if text[i].strip() == 'run: |')
              lines = text[run + 1:end]
              return '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          Path('/tmp/d07-task7-red.sh').write_text(
              extract('Add cases 29 and 30 RED', 'Implement sanitized card and adapter replacement boundary')
          )
          Path('/tmp/d07-task7-impl.sh').write_text(
              extract('Implement sanitized card and adapter replacement boundary', 'Prove exactly 30 acceptance cases and canonical store')
          )
          PY
          chmod +x /tmp/d07-task7-red.sh /tmp/d07-task7-impl.sh
      - name: Execute Task 7 RED
        run: /tmp/d07-task7-red.sh
      - name: Implement Task 7
        run: /tmp/d07-task7-impl.sh
      - name: Prove exactly 30 acceptance cases and canonical store
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p ptah-security-evidence --test d07_acceptance --locked
          test "$(cargo test -p ptah-security-evidence --test d07_acceptance --locked -- --list 2>/dev/null | grep -c ': test$')" -eq 30
          cargo test -p ptah-security-evidence --test store_roundtrip --locked
          cargo test -p ptah-security-evidence --locked
      - name: Audit exact 18 WP12 schema kind bindings
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          store = Path('crates/ptah-security-evidence/src/store.rs').read_text()
          generated = Path('crates/ptah-contracts/src/generated.rs').read_text()
          pairs = re.findall(r'\(\s*"(urn:ptah:schema:security:[^"]+)"\s*,\s*"(security\.[^"]+)"\s*,?\s*\)', store)
          generated_security_schemas = set(re.findall(r'schema_id:\s*"(urn:ptah:schema:security:[^"]+)"', generated))
          if len(pairs) != 18 or len(set(pairs)) != 18:
              raise SystemExit(f'expected exact 18 unique WP12 pairs, got {len(pairs)} / {len(set(pairs))}')
          for schema, kind in pairs:
              if schema not in generated_security_schemas:
                  raise SystemExit(f'missing generated SchemaBinding for {schema}')
              slug = schema.removeprefix('urn:ptah:schema:security:').removesuffix(':0.1.0')
              expected_kind = 'security.' + slug.replace('-', '_')
              if kind != expected_kind:
                  raise SystemExit(f'kind mismatch for {schema}: expected {expected_kind}, got {kind}')
          print(f'WP12_AUDIT_OK={len(pairs)} GENERATED_SECURITY_SCHEMAS={len(generated_security_schemas)}')
          PY
      - name: Strict lint and predecessor regressions
        run: |
          cargo clippy -p ptah-security-evidence --all-targets --locked -- -D warnings -W clippy::pedantic
          ! grep -R -n -E '#\[(allow|expect)\(' crates/ptah-security-evidence
          cargo test -p ptah-ledger -p ptah-activity-runtime -p ptah-workspace -p ptah-object-store -p ptah-recipe-registry -p ptah-package-plugin -p ptah-provenance --locked
      - name: Commit proven Task 7
        run: |
          git config user.name "TENFOLD Foreman"
          git config user.email "jaydumi12@gmail.com"
          git add crates/ptah-security-evidence
          git commit -m "feat(d07): close security evidence acceptance corpus"
          git push origin HEAD:d07-security-evidence-reproduction
