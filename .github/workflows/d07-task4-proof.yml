name: D07 Task 4 Review Disclosure Proof

on:
  push:
    branches:
      - d07-security-evidence-reproduction
    paths:
      - .github/workflows/d07-task4-proof.yml

permissions:
  contents: write

jobs:
  task4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: d07-security-evidence-reproduction
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Add cases 15 through 19 RED
        run: |
          cat >> crates/ptah-security-evidence/tests/d07_acceptance.rs <<'EOF'

          use ptah_security_evidence::{
              AcceptedRiskProjection, DisclosurePolicy, DisputeProjection, ReviewDecisionProjection,
              ReviewOutcome, ValidationRequest,
          };

          #[test]
          fn validation_run_requires_fresh_attempt_and_exact_environment_evidence() {
              let prior = er("core.attempt");
              let request = ValidationRequest {
                  finding_refs: vec![er("security.finding")],
                  claim_refs: vec![er("security.claim")],
                  environment_refs: vec![er("core.object_revision")],
                  prior_attempt_refs: vec![prior.clone()],
                  attempt_context: context(),
              };
              assert!(matches!(
                  request.validate_attempt(&prior),
                  Err(D07Error::FreshAttemptRequired)
              ));
              request
                  .validate_attempt(&er("core.attempt"))
                  .expect("fresh exact Attempt accepted");
              let mut missing_environment = request.clone();
              missing_environment.environment_refs.clear();
              assert!(matches!(
                  missing_environment.validate_attempt(&er("core.attempt")),
                  Err(D07Error::MissingEnvironmentEvidence)
              ));
          }

          #[test]
          fn review_decision_references_but_never_rewrites_observation_or_evidence_history() {
              let observation = ObservationProjection {
                  observation_ref: er("security.observation"),
                  subject_refs: vec![er("core.object_revision")],
                  evidence_refs: vec![er("security.evidence_item")],
                  scanner_aliases: vec!["scanner-1".into()],
                  observed_facts: vec!["immutable fact".into()],
              };
              let before = observation.clone();
              let review = ReviewDecisionProjection {
                  finding_refs: vec![er("security.finding")],
                  claim_refs: vec![er("security.claim")],
                  validation_run_refs: vec![er("security.validation_run")],
                  reviewer_ref: er("identity.principal"),
                  authority_scope: vec!["security.review".into()],
                  outcome: ReviewOutcome::AcceptedWithLimitations,
                  reasons: vec!["bounded review".into()],
              };
              review.validate().expect("review projection");
              assert_eq!(observation, before);
          }

          #[test]
          fn accepted_risk_expires_without_deleting_the_finding() {
              let finding = er("security.finding");
              let risk = AcceptedRiskProjection {
                  finding_refs: vec![finding.clone()],
                  authority_ref: er("identity.principal"),
                  expires_at: "2026-09-04T00:00:00Z".into(),
              };
              assert!(risk.is_active_at("2026-09-03T12:00:00Z").expect("active"));
              assert!(!risk.is_active_at("2026-09-04T00:00:00Z").expect("expired"));
              assert_eq!(risk.finding_refs, vec![finding]);
          }

          #[test]
          fn dispute_retains_all_competing_claims_and_evidence() {
              let first_claim = er("security.claim");
              let second_claim = er("security.claim");
              let first_evidence = er("security.evidence_bundle");
              let second_evidence = er("security.evidence_bundle");
              let dispute = DisputeProjection {
                  finding_refs: vec![er("security.finding")],
                  claim_refs: vec![first_claim.clone(), second_claim.clone()],
                  evidence_bundle_refs: vec![first_evidence.clone(), second_evidence.clone()],
              };
              dispute.validate().expect("complete dispute");
              assert_eq!(dispute.claim_refs, vec![first_claim, second_claim]);
              assert_eq!(
                  dispute.evidence_bundle_refs,
                  vec![first_evidence, second_evidence]
              );
          }

          #[test]
          fn public_disclosure_requires_explicit_redacted_content_and_privacy_authority() {
              let restricted = er("security.evidence_item");
              let policy = DisclosurePolicy {
                  audience: "public".into(),
                  redaction_policy_refs: vec![er("policy.redaction")],
                  privacy_policy_refs: vec![er("policy.privacy")],
                  authority_ref: er("identity.principal"),
              };
              assert!(matches!(
                  policy.authorize(&[restricted.clone()], &[]),
                  Err(D07Error::DisclosureDenied)
              ));
              policy
                  .authorize(&[restricted], &[er("core.object_revision")])
                  .expect("explicit redacted disclosed content");
          }
          EOF
          cargo fmt --all
          if cargo test -p ptah-security-evidence --test d07_acceptance --locked; then
            echo 'Task 4 RED unexpectedly passed' >&2
            exit 1
          fi
      - name: Implement review risk dispute disclosure
        run: |
          cat > crates/ptah-security-evidence/src/review.rs <<'EOF'
          use ptah_activity_runtime::AttemptContext;
          use ptah_identifiers::EntityRef;

          use crate::D07Error;

          /// Explicit request boundary for one fresh validation run.
          #[derive(Debug, Clone)]
          pub struct ValidationRequest {
              /// Findings under validation.
              pub finding_refs: Vec<EntityRef>,
              /// Claims under validation.
              pub claim_refs: Vec<EntityRef>,
              /// Exact environment evidence required for reproducible interpretation.
              pub environment_refs: Vec<EntityRef>,
              /// Prior Attempts that must never be reused.
              pub prior_attempt_refs: Vec<EntityRef>,
              /// Exact physical A04 context for the new run.
              pub attempt_context: AttemptContext,
          }

          impl ValidationRequest {
              /// Validate fresh Attempt identity and exact environment evidence.
              ///
              /// # Errors
              /// Returns [`D07Error`] when environment evidence is absent or an Attempt is reused.
              pub fn validate_attempt(&self, attempt_ref: &EntityRef) -> Result<(), D07Error> {
                  if self.environment_refs.is_empty() {
                      return Err(D07Error::MissingEnvironmentEvidence);
                  }
                  if attempt_ref.entity_kind.as_str() != "core.attempt"
                      || self.prior_attempt_refs.contains(attempt_ref)
                  {
                      return Err(D07Error::FreshAttemptRequired);
                  }
                  if self.finding_refs.is_empty() && self.claim_refs.is_empty() {
                      return Err(D07Error::InvalidReviewDecision);
                  }
                  Ok(())
              }
          }

          /// Explicit bounded reviewer outcome; it is never inferred from Evidence.
          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub enum ReviewOutcome {
              /// Reviewer accepts the bounded Claim/Finding.
              Accepted,
              /// Reviewer accepts only with retained limitations.
              AcceptedWithLimitations,
              /// Reviewer rejects the bounded Claim/Finding.
              Rejected,
              /// Evidence is insufficient for a determination.
              Inconclusive,
              /// Review remains explicitly disputed.
              Disputed,
          }

          /// Derived review decision projection containing references only.
          #[derive(Debug, Clone, PartialEq, Eq)]
          pub struct ReviewDecisionProjection {
              /// Exact Finding references reviewed.
              pub finding_refs: Vec<EntityRef>,
              /// Exact Claim references reviewed.
              pub claim_refs: Vec<EntityRef>,
              /// Exact Validation Run references considered.
              pub validation_run_refs: Vec<EntityRef>,
              /// Explicit reviewer identity.
              pub reviewer_ref: EntityRef,
              /// Bounded review authority scopes.
              pub authority_scope: Vec<String>,
              /// Explicit review outcome.
              pub outcome: ReviewOutcome,
              /// Retained reasons for the decision.
              pub reasons: Vec<String>,
          }

          impl ReviewDecisionProjection {
              /// Validate the bounded review projection without mutating any source records.
              ///
              /// # Errors
              /// Returns [`D07Error::InvalidReviewDecision`] when required review evidence is absent.
              pub fn validate(&self) -> Result<(), D07Error> {
                  if self.finding_refs.is_empty()
                      || self.validation_run_refs.is_empty()
                      || self.authority_scope.is_empty()
                      || self.reasons.is_empty()
                      || self.authority_scope.iter().any(|scope| scope.trim().is_empty())
                      || self.reasons.iter().any(|reason| reason.trim().is_empty())
                  {
                      return Err(D07Error::InvalidReviewDecision);
                  }
                  Ok(())
              }
          }

          /// Accepted Risk projection that never mutates the Finding it references.
          #[derive(Debug, Clone, PartialEq, Eq)]
          pub struct AcceptedRiskProjection {
              /// Exact Findings covered by the risk acceptance.
              pub finding_refs: Vec<EntityRef>,
              /// Explicit authority accepting the bounded risk.
              pub authority_ref: EntityRef,
              /// Exact expiry timestamp after which review is required again.
              pub expires_at: String,
          }

          impl AcceptedRiskProjection {
              /// Determine whether the accepted risk remains active at `now`.
              ///
              /// # Errors
              /// Returns [`D07Error::InvalidTimestamp`] for malformed UTC timestamps.
              pub fn is_active_at(&self, now: &str) -> Result<bool, D07Error> {
                  if self.finding_refs.is_empty()
                      || !crate::assessment::valid_utc(now)
                      || !crate::assessment::valid_utc(&self.expires_at)
                  {
                      return Err(D07Error::InvalidTimestamp);
                  }
                  Ok(now < self.expires_at.as_str())
              }
          }

          /// Dispute projection retaining all submitted Claims and Evidence Bundles.
          #[derive(Debug, Clone, PartialEq, Eq)]
          pub struct DisputeProjection {
              /// Findings under dispute.
              pub finding_refs: Vec<EntityRef>,
              /// All competing Claim references submitted to the dispute.
              pub claim_refs: Vec<EntityRef>,
              /// All submitted Evidence Bundle references.
              pub evidence_bundle_refs: Vec<EntityRef>,
          }

          impl DisputeProjection {
              /// Validate that a dispute contains all three bounded reference families.
              ///
              /// # Errors
              /// Returns [`D07Error::InvalidDispute`] when a position/evidence family is absent.
              pub fn validate(&self) -> Result<(), D07Error> {
                  if self.finding_refs.is_empty()
                      || self.claim_refs.len() < 2
                      || self.evidence_bundle_refs.len() < 2
                  {
                      return Err(D07Error::InvalidDispute);
                  }
                  Ok(())
              }
          }
          EOF

          cat > crates/ptah-security-evidence/src/disclosure.rs <<'EOF'
          use ptah_identifiers::EntityRef;

          use crate::D07Error;

          /// Explicit audience/redaction/privacy authority for one disclosure.
          #[derive(Debug, Clone, PartialEq, Eq)]
          pub struct DisclosurePolicy {
              /// Audience boundary such as `public` or `workspace`.
              pub audience: String,
              /// Exact redaction policies applied to disclosed content.
              pub redaction_policy_refs: Vec<EntityRef>,
              /// Exact privacy policies authorizing the disclosure boundary.
              pub privacy_policy_refs: Vec<EntityRef>,
              /// Explicit disclosure authority.
              pub authority_ref: EntityRef,
          }

          impl DisclosurePolicy {
              /// Authorize disclosure only when restricted evidence is represented by explicit redacted content.
              ///
              /// # Errors
              /// Returns [`D07Error::DisclosureDenied`] when public disclosure lacks redaction/privacy authority.
              pub fn authorize(
                  &self,
                  restricted_evidence_refs: &[EntityRef],
                  disclosed_content_refs: &[EntityRef],
              ) -> Result<(), D07Error> {
                  if self.audience.trim().is_empty()
                      || self.redaction_policy_refs.is_empty()
                      || self.privacy_policy_refs.is_empty()
                  {
                      return Err(D07Error::DisclosureDenied);
                  }
                  if self.audience == "public"
                      && !restricted_evidence_refs.is_empty()
                      && (disclosed_content_refs.is_empty()
                          || disclosed_content_refs
                              .iter()
                              .any(|content| restricted_evidence_refs.contains(content)))
                  {
                      return Err(D07Error::DisclosureDenied);
                  }
                  Ok(())
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/ptah-security-evidence/src/lib.rs')
          text = path.read_text()
          text = text.replace('mod error;\n', 'mod disclosure;\nmod error;\n', 1)
          text = text.replace('mod store;\n', 'mod review;\nmod store;\n', 1)
          text = text.replace(
              'pub use error::D07Error;\n',
              'pub use disclosure::DisclosurePolicy;\npub use error::D07Error;\n',
              1,
          )
          text = text.replace(
              'pub use store::SecurityEvidenceStore;\n',
              'pub use review::{\n    AcceptedRiskProjection, DisputeProjection, ReviewDecisionProjection, ReviewOutcome,\n    ValidationRequest,\n};\npub use store::SecurityEvidenceStore;\n',
              1,
          )
          path.write_text(text)

          path = Path('crates/ptah-security-evidence/src/error.rs')
          text = path.read_text()
          marker = '    /// Underlying A06 authority check failed.\n'
          variants = '''    /// Validation must allocate a fresh A04 Attempt.\n    #[error("security validation requires a fresh A04 Attempt")]\n    FreshAttemptRequired,\n    /// Validation requires exact environment evidence.\n    #[error("security validation requires environment evidence")]\n    MissingEnvironmentEvidence,\n    /// Review Decision is structurally incomplete.\n    #[error("invalid security review decision")]\n    InvalidReviewDecision,\n    /// Dispute omits a competing Claim or Evidence position.\n    #[error("invalid security dispute projection")]\n    InvalidDispute,\n    /// Disclosure lacks explicit audience/redaction/privacy authority.\n    #[error("security disclosure denied")]\n    DisclosureDenied,\n'''
          if 'FreshAttemptRequired' not in text:
              assert marker in text
              text = text.replace(marker, variants + marker, 1)
          path.write_text(text)

          path = Path('crates/ptah-security-evidence/src/assessment.rs')
          text = path.read_text()
          text = text.replace('fn valid_utc(value: &str)', 'pub(crate) fn valid_utc(value: &str)', 1)
          path.write_text(text)
          PY
      - name: Prove cases 15 through 19 GREEN
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p ptah-security-evidence --test d07_acceptance --locked
          test "$(cargo test -p ptah-security-evidence --test d07_acceptance --locked -- --list 2>/dev/null | grep -c ': test$')" -eq 19
          cargo test -p ptah-security-evidence --locked
          cargo clippy -p ptah-security-evidence --all-targets --locked -- -D warnings -W clippy::pedantic
          ! grep -R -n -E '#\[(allow|expect)\(' crates/ptah-security-evidence
      - name: Commit proven Task 4
        run: |
          git config user.name "TENFOLD Foreman"
          git config user.email "jaydumi12@gmail.com"
          git add crates/ptah-security-evidence
          git commit -m "feat(d07): add review risk dispute and disclosure"
          git push origin HEAD:d07-security-evidence-reproduction
