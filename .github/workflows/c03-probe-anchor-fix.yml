name: C03 probe anchor correction

on:
  push:
    branches:
      - c03-generic-android-image-ota-pack
    paths:
      - ".github/workflows/c03-probe-anchor-fix.yml"

permissions:
  contents: write

jobs:
  fix-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: c03-generic-android-image-ota-pack
          persist-credentials: true
      - name: Replace whitespace-sensitive test anchor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/c03-build-probe.yml')
          text = path.read_text(encoding='utf-8')
          start = text.index("          old = '''    assert_eq!(\n", text.index("tests_path = Path('crates/ptah-archive-decomposition/tests/c03.rs')"))
          end_marker = "          tests = tests.replace(old, new, 1)\n"
          end = text.index(end_marker, start) + len(end_marker)
          replacement = "".join([
              "          import re\n",
              "          pattern = (\n",
              "              r'\\s*assert_eq!\\(\\s*'\n",
              "              r'compare_android_artifacts\\(&original, &structural\\)\\.level,\\s*'\n",
              "              r'AndroidComparisonLevel::Structural\\s*'\n",
              "              r'\\);'\n",
              "          )\n",
              "          replacement = (\n",
              "              '\\n    let structural_comparison = compare_android_artifacts(&original, &structural);\\n'\n",
              "              '    assert_eq!(structural_comparison.level, AndroidComparisonLevel::Structural);\\n'\n",
              "              '    assert!(\\n'\n",
              "              '        structural_comparison\\n'\n",
              "              '            .differences\\n'\n",
              "              '            .iter()\\n'\n",
              "              '            .any(|difference| difference == \\\"component_bytes_changed\\\")\\n'\n",
              "              '    );'\n",
              "          )\n",
              "          tests, replaced = re.subn(pattern, replacement, tests, count=1)\n",
              "          assert replaced == 1, replaced\n",
          ])
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/c03-probe-anchor-fix.yml
          git add .github/workflows/c03-build-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "C03 build: make probe test rewrite whitespace agnostic"
          git push origin HEAD:c03-generic-android-image-ota-pack
