name: B03 one-use strict Clippy correction

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/b03-documents-structured-text.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  correct:
    if: github.event.pull_request.head.ref == 'b03-documents-structured-text' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out writable B03 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: b03-documents-structured-text
          fetch-depth: 0
      - name: Apply exact strict-Clippy findings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ptah-archive-decomposition/src/b03.rs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('fn adapter_id(&self) -> &str {\n        "b03.safe-text"', 'fn adapter_id(&self) -> &\'static str {\n        "b03.safe-text"'),
              ('fn adapter_id(&self) -> &str {\n        "b03.safe-html"', 'fn adapter_id(&self) -> &\'static str {\n        "b03.safe-html"'),
              ('if !std::str::from_utf8(bytes).is_ok() {', 'if std::str::from_utf8(bytes).is_err() {'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exact B03 Clippy target once: {old!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          cargo fmt --all
          git diff --check
      - name: Commit exact Clippy correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ptah-archive-decomposition/src/b03.rs
          git diff --cached --check
          git commit -m "B03 review: satisfy strict Clippy findings"
          git push origin HEAD:b03-documents-structured-text
