name: Temporary PR197 Boot Readback and Authorized Reboot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-pr197-final-pinned.yml"

permissions:
  contents: read

jobs:
  boot-readback:
    runs-on: [self-hosted, athena, ptah]
    timeout-minutes: 8
    steps:
      - name: Read elevated Boot proof and task state
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $resultPath=Join-Path $env:LOCALAPPDATA 'OracleRelay\pr197-boot-elevated-result.json'
          if(-not(Test-Path -LiteralPath $resultPath)){throw 'ELEVATED_RESULT_MISSING'}
          $raw=Get-Content -LiteralPath $resultPath -Raw
          Write-Output 'ELEVATED_RESULT_BEGIN'
          Write-Output $raw
          Write-Output 'ELEVATED_RESULT_END'
          $node=Get-ScheduledTask -TaskName 'Oracle Always-On Node' -ErrorAction Stop
          $watch=Get-ScheduledTask -TaskName 'Oracle Node Watchdog' -ErrorAction Stop
          $sessionNode=Get-ScheduledTask -TaskName 'Oracle Live Node (Session Fallback)' -ErrorAction SilentlyContinue
          $sessionWatch=Get-ScheduledTask -TaskName 'Oracle Node Watchdog (Session Fallback)' -ErrorAction SilentlyContinue
          $nodeTriggers=@($node.Triggers | ForEach-Object {$_.CimClass.CimClassName})
          $watchTriggers=@($watch.Triggers | ForEach-Object {$_.CimClass.CimClassName})
          $state=[pscustomobject]@{
            NodeName=$node.TaskName
            NodeState=[string]$node.State
            NodeEnabled=[bool]$node.Settings.Enabled
            NodeLogonType=[string]$node.Principal.LogonType
            NodeRunLevel=[string]$node.Principal.RunLevel
            NodeTriggers=$nodeTriggers
            WatchName=$watch.TaskName
            WatchState=[string]$watch.State
            WatchEnabled=[bool]$watch.Settings.Enabled
            WatchLogonType=[string]$watch.Principal.LogonType
            WatchRunLevel=[string]$watch.Principal.RunLevel
            WatchTriggers=$watchTriggers
            SessionNodePresent=($null -ne $sessionNode)
            SessionWatchPresent=($null -ne $sessionWatch)
          }
          Write-Output ('TASK_STATE='+($state|ConvertTo-Json -Compress -Depth 6))
          if($node.Principal.LogonType -ne 'S4U'){throw ('NODE_LOGON_NOT_S4U '+$node.Principal.LogonType)}
          if($watch.Principal.LogonType -ne 'S4U'){throw ('WATCH_LOGON_NOT_S4U '+$watch.Principal.LogonType)}
          if(-not($node.Settings.Enabled)){throw 'NODE_DISABLED'}
          if(-not($watch.Settings.Enabled)){throw 'WATCH_DISABLED'}
          if(($nodeTriggers -notcontains 'MSFT_TaskBootTrigger')){throw ('NODE_TRIGGER_NOT_BOOT '+($nodeTriggers -join ','))}
          if(($watchTriggers -notcontains 'MSFT_TaskBootTrigger')){throw ('WATCH_TRIGGER_NOT_BOOT '+($watchTriggers -join ','))}
          Write-Output 'BOOT_S4U_PROOF=PASS'

      - name: Reboot ATHENA after proven Boot/S4U
        shell: powershell
        run: |
          Write-Output 'REBOOT_AUTHORITY=PREAUTHORIZED_BY_OWNER'
          shutdown.exe /r /t 5 /f /d p:4:1 /c "Oracle PR197 pre-login persistence proof"
