name: B04 one-use pinned rustfmt correction

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/b04-media-object-world.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out writable B04 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: b04-media-object-world
          fetch-depth: 0
      - name: Apply B04 semantic Review corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('crates/ptah-archive-decomposition/src/b04.rs')
          text = source.read_text(encoding='utf-8')
          old = '''        if self.adapter_id.is_some() {\n            views.push(media_view_spec(\n                context,\n                &self.source_revision_ref,\n                "media.coverage",\n                "urn:ptah:schema:media:coverage-view:0.1.0",\n            ));\n        }\n'''
          new = '''        views.push(media_view_spec(\n            context,\n            &self.source_revision_ref,\n            "media.coverage",\n            "urn:ptah:schema:media:coverage-view:0.1.0",\n        ));\n'''
          if text.count(old) != 1:
              raise SystemExit('expected adapter-gated coverage view once')
          text = text.replace(old, new, 1)

          frame_check = '''        if !requested_frames.contains(&frame.timestamp_ms) {\n            return Err(B04Error::UnrequestedOutput("frame"));\n        }\n        if !returned_frames.insert(frame.timestamp_ms) {\n'''
          frame_new = '''        if !requested_frames.contains(&frame.timestamp_ms) {\n            return Err(B04Error::UnrequestedOutput("frame"));\n        }\n        if output\n            .duration\n            .is_some_and(|duration| duration.complete && frame.timestamp_ms > duration.milliseconds)\n        {\n            return Err(B04Error::RequestOutputMismatch);\n        }\n        if !returned_frames.insert(frame.timestamp_ms) {\n'''
          if text.count(frame_check) != 1:
              raise SystemExit('expected frame validation block once')
          text = text.replace(frame_check, frame_new, 1)
          source.write_text(text, encoding='utf-8')

          tests = Path('crates/ptah-archive-decomposition/tests/b04.rs')
          test_text = tests.read_text(encoding='utf-8')
          appendix = r'''

#[test]
fn partial_reports_always_emit_a_coverage_view_plan() {
    let disputed = TypeAssessment {
        declared_type: Some("image/png".to_owned()),
        detector_evidence: Vec::new(),
        agreement: TypeAgreement::Disputed(vec!["image/png".to_owned(), "image/jpeg".to_owned()]),
        declared_matches_agreed_type: None,
    };
    let report = inspect_media(
        b"ambiguous-media",
        &disputed,
        &context(),
        &MediaRequest::default(),
        MediaLimits::default(),
        &[],
    )
    .expect("disputed media remains a truthful partial report");
    assert!(report.adapter_id.is_none());
    assert!(!report.coverage.unknown_gaps.is_empty());
    assert!(
        report
            .view_specs(&context())
            .iter()
            .any(|spec| spec.view_kind == "media.coverage")
    );

    let no_adapter = inspect_media(
        b"known-media",
        &agreed("image/png"),
        &context(),
        &MediaRequest::default(),
        MediaLimits::default(),
        &[],
    )
    .expect("missing adapter remains a truthful partial report");
    assert!(no_adapter.adapter_id.is_none());
    assert!(
        no_adapter
            .view_specs(&context())
            .iter()
            .any(|spec| spec.view_kind == "media.coverage")
    );
}

#[test]
fn complete_duration_rejects_frames_beyond_media_extent() {
    let request = MediaRequest {
        frame_timestamps_ms: vec![3_001],
        ..MediaRequest::default()
    };
    let error = inspect_media(
        b"video",
        &agreed("video/mp4"),
        &context(),
        &request,
        MediaLimits::default(),
        &[&FullAdapter],
    )
    .expect_err("a frame beyond a complete duration is inconsistent provider output");
    assert!(matches!(error, B04Error::RequestOutputMismatch));
}
'''
          if 'fn partial_reports_always_emit_a_coverage_view_plan()' in test_text:
              raise SystemExit('B04 semantic review regressions already present')
          tests.write_text(test_text.rstrip() + appendix + '\n', encoding='utf-8')
          PY
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          cargo fmt --all
          git diff --check
      - name: Commit reviewed semantic correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ptah-archive-decomposition/src/b04.rs crates/ptah-archive-decomposition/tests/b04.rs
          git diff --cached --check
          git commit -m "B04 review: preserve partial coverage and frame-duration truth"
          git push origin HEAD:b04-media-object-world
