name: A02 promote proved candidate

on:
  pull_request:
    paths:
      - ".github/workflows/a02-promote-candidate.yml"

permissions:
  contents: write

env:
  EXPECTED_LOCK_SHA256: 73bfc13e9e73a465c8271a3a26a2a688b3abf2c3734a016307aba94c4a8c5c32
  EXPECTED_IDENTIFIERS_SHA256: ea505936ca52d9ca9da945854142b1d455e4a2b24b3176ae9bd54d3f418c2e17
  EXPECTED_NODE_AGENT_SHA256: a082411d9e8fe6fc91853523d90ef4d76221d021da8795e6c601f55bbdc8f2c2

jobs:
  promote:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'a02-node-identity-generation-host-truth'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact A02 branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Bind checkout to event head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Capture current external Cargo universe
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          text = Path('Cargo.lock').read_text()
          packages=[]
          for block in text.split('[[package]]')[1:]:
              block='\n'+block
              name=re.search(r'\nname = "([^"]+)"', block)
              version=re.search(r'\nversion = "([^"]+)"', block)
              source=re.search(r'\nsource = "([^"]+)"', block)
              checksum=re.search(r'\nchecksum = "([^"]+)"', block)
              if name and version and source:
                  packages.append({'name':name.group(1),'version':version.group(1),'source':source.group(1),'checksum':checksum.group(1) if checksum else None})
          packages=sorted(packages,key=lambda x:(x['name'],x['version'],x['source']))
          assert len(packages)==81, len(packages)
          assert not any(p['source'].startswith('git+') for p in packages)
          Path('/tmp/a02-external-before.json').write_text(json.dumps(packages,sort_keys=True))
          PY

      - name: Reproduce generated candidate bytes
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 >/tmp/a02-cargo-metadata.json
          cargo fmt --all

      - name: Prove dependency universe and exact generated hashes
        run: |
          python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          before=json.loads(Path('/tmp/a02-external-before.json').read_text())
          text=Path('Cargo.lock').read_text()
          packages=[]
          for block in text.split('[[package]]')[1:]:
              block='\n'+block
              name=re.search(r'\nname = "([^"]+)"', block)
              version=re.search(r'\nversion = "([^"]+)"', block)
              source=re.search(r'\nsource = "([^"]+)"', block)
              checksum=re.search(r'\nchecksum = "([^"]+)"', block)
              if name and version and source:
                  packages.append({'name':name.group(1),'version':version.group(1),'source':source.group(1),'checksum':checksum.group(1) if checksum else None})
          after=sorted(packages,key=lambda x:(x['name'],x['version'],x['source']))
          assert after==before
          assert not any(p['source'].startswith('git+') for p in after)
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          assert sha('Cargo.lock') == os.environ['EXPECTED_LOCK_SHA256']
          assert sha('crates/ptah-identifiers/src/lib.rs') == os.environ['EXPECTED_IDENTIFIERS_SHA256']
          assert sha('crates/ptah-node-agent/src/lib.rs') == os.environ['EXPECTED_NODE_AGENT_SHA256']
          PY

      - name: Re-prove candidate before promotion
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy -p ptah-identifiers -p ptah-node-agent --all-features --locked -- -D warnings
          cargo test -p ptah-identifiers -p ptah-node-agent --locked

      - name: Freeze only generated candidate bytes
        run: |
          set -euo pipefail
          changed="$(git status --porcelain --untracked-files=no)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 3
          printf '%s\n' "$changed" | grep -Fx ' M Cargo.lock'
          printf '%s\n' "$changed" | grep -Fx ' M crates/ptah-identifiers/src/lib.rs'
          printf '%s\n' "$changed" | grep -Fx ' M crates/ptah-node-agent/src/lib.rs'

      - name: Commit exact promoted bytes and retire temporary promoter
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates/ptah-identifiers/src/lib.rs crates/ptah-node-agent/src/lib.rs
          git rm .github/workflows/a02-promote-candidate.yml
          git commit -m "a02: freeze proved dependency lock and formatted sources" -m "Source candidate: $SOURCE_HEAD"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
