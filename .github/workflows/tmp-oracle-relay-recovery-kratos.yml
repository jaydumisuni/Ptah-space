name: Temporary Redmi sky CN selector mapping on KRATOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-oracle-relay-recovery-kratos.yml'

permissions:
  contents: read

jobs:
  map-selector:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 10
    steps:
      - name: Map CN customization selector read-only
        shell: bash
        run: |
          set -euo pipefail
          ADB="$(command -v adb || true)"
          if [[ -z "$ADB" && -x /home/kratos/.local/share/mibu-platform-tools/current/platform-tools/adb ]]; then
            ADB=/home/kratos/.local/share/mibu-platform-tools/current/platform-tools/adb
          fi
          test -x "$ADB"

          echo '=== HOST NETWORK (READ ONLY) ==='
          ip route show default || true

          echo '=== ADB ==='
          "$ADB" start-server >/dev/null
          "$ADB" get-state
          "$ADB" devices -l

          echo '=== REGIONAL PROPERTIES ==='
          "$ADB" shell 'for k in ro.product.device ro.product.model ro.build.version.incremental ro.build.version.release ro.miui.region ro.miui.cust_variant ro.miui.ui.version.name ro.boot.verifiedbootstate ro.boot.flash.locked ro.boot.vbmeta.device_state; do printf "%s=" "$k"; getprop "$k"; done'

          echo '=== CUST ROOT ==='
          "$ADB" shell 'ls -la /cust 2>/dev/null; echo ---; find /cust -maxdepth 2 -type f 2>/dev/null | sort | head -n 220'

          echo '=== SELECTOR FILES / VALUES ==='
          "$ADB" shell 'for p in /cust/cust_variant /cust/etc/business.prop /cust/etc/cust_apps_request_config /cust/etc/cust_apps_config /cust/etc/customized_applist /cust/etc/customized_channellist; do if [ -f "$p" ]; then echo "--- $p"; cat "$p" 2>/dev/null | head -n 220; fi; done'

          echo '=== SELECTOR REFERENCES UNDER /cust ==='
          "$ADB" shell 'find /cust -maxdepth 5 -type f -size -262144c 2>/dev/null | sort | while IFS= read -r p; do m=$(grep -a -i -E "cn_chinatelecom|VMWCNXM|currentSku|cust_variant|ro\.miui\.region|region=|google|gms|preload|customized" "$p" 2>/dev/null | head -n 20); if [ -n "$m" ]; then echo "--- $p"; printf "%s\n" "$m"; fi; done'

          echo '=== CUST DIRECTORY TOPOLOGY ==='
          "$ADB" shell 'find /cust -maxdepth 3 -type d 2>/dev/null | sort | head -n 260'

          echo '=== POST-PROBE ADB / HOST ROUTE ==='
          "$ADB" get-state
          ip route show default || true
