name: B01 canonical rustfmt fix

on:
  push:
    branches:
      - b01-transfer-storage-expansion

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: b01-transfer-storage-expansion
          fetch-depth: 0
      - name: Install pinned formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
      - name: Format and commit candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ptah-transfer/src/b01.rs crates/ptah-transfer/tests/b01.rs
          git diff --cached --check
          git commit -m "B01: apply canonical rustfmt"
          git push origin HEAD:b01-transfer-storage-expansion
