name: A02 lock candidate proof

on:
  pull_request:
    paths:
      - "crates/ptah-identifiers/**"
      - "crates/ptah-node-agent/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "dependencies/**"
      - ".github/workflows/a02-lock-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PTAH_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CARGO_TERM_COLOR: always

jobs:
  lock-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact A02 head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PTAH_EXACT_SHA }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Capture frozen external dependency universe
        run: |
          mkdir -p evidence/a02-lock/formatted/crates/ptah-identifiers/src
          mkdir -p evidence/a02-lock/formatted/crates/ptah-node-agent/src
          python - <<'PY'
          import json, re
          from pathlib import Path
          def external(path):
              text = Path(path).read_text()
              packages = []
              for block in text.split('[[package]]')[1:]:
                  block = '\n' + block
                  name = re.search(r'\nname = "([^"]+)"', block)
                  version = re.search(r'\nversion = "([^"]+)"', block)
                  source = re.search(r'\nsource = "([^"]+)"', block)
                  checksum = re.search(r'\nchecksum = "([^"]+)"', block)
                  if name and version and source:
                      packages.append({
                          'name': name.group(1),
                          'version': version.group(1),
                          'source': source.group(1),
                          'checksum': checksum.group(1) if checksum else None,
                      })
              return sorted(packages, key=lambda x: (x['name'],x['version'],x['source']))
          before = external('Cargo.lock')
          Path('evidence/a02-lock/external-before.json').write_text(json.dumps(before, indent=2, sort_keys=True)+'\n')
          print(json.dumps({'external_before': len(before), 'git_before': sum(p['source'].startswith('git+') for p in before)}, sort_keys=True))
          PY

      - name: Refresh workspace/path-package lock metadata only
        run: |
          cargo metadata --format-version 1 > evidence/a02-lock/cargo-metadata-unlocked.json
          cp Cargo.lock evidence/a02-lock/Cargo.lock.candidate

      - name: Prove external dependency universe and checksums are unchanged
        run: |
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          before = json.loads(Path('evidence/a02-lock/external-before.json').read_text())
          text = Path('Cargo.lock').read_text()
          packages = []
          for block in text.split('[[package]]')[1:]:
              block = '\n' + block
              name = re.search(r'\nname = "([^"]+)"', block)
              version = re.search(r'\nversion = "([^"]+)"', block)
              source = re.search(r'\nsource = "([^"]+)"', block)
              checksum = re.search(r'\nchecksum = "([^"]+)"', block)
              if name and version and source:
                  packages.append({
                      'name': name.group(1),
                      'version': version.group(1),
                      'source': source.group(1),
                      'checksum': checksum.group(1) if checksum else None,
                  })
          after = sorted(packages, key=lambda x: (x['name'],x['version'],x['source']))
          assert after == before, 'external Cargo dependency identity/checksum universe changed'
          assert len(after) == 81, f'unexpected external dependency count: {len(after)}'
          assert not any(p['source'].startswith('git+') for p in after), 'Git dependency introduced'
          report = {
              'record_type': 'ptah.a02.lock_candidate_proof',
              'external_dependency_count': len(after),
              'git_dependency_count': 0,
              'external_identity_and_checksums_unchanged': True,
              'candidate_lock_sha256': hashlib.sha256(Path('Cargo.lock').read_bytes()).hexdigest(),
              'historical_selection_record_preserved': True,
          }
          Path('evidence/a02-lock/report.json').write_text(json.dumps(report, indent=2, sort_keys=True)+'\n')
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Apply pinned rustfmt and retain exact formatted bytes
        run: |
          cargo fmt --all
          cp crates/ptah-identifiers/src/lib.rs evidence/a02-lock/formatted/crates/ptah-identifiers/src/lib.rs
          cp crates/ptah-node-agent/src/lib.rs evidence/a02-lock/formatted/crates/ptah-node-agent/src/lib.rs
          cargo fmt --all --check

      - name: Compile-test A02 crates against candidate lock
        run: |
          set -o pipefail
          cargo clippy -p ptah-identifiers -p ptah-node-agent --all-features --locked -- -D warnings 2>&1 \
            | tee evidence/a02-lock/clippy.txt
          cargo test -p ptah-identifiers -p ptah-node-agent --locked 2>&1 \
            | tee evidence/a02-lock/tests.txt

      - name: Bind candidate to exact source head
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          report = json.loads(Path('evidence/a02-lock/report.json').read_text())
          changed = subprocess.check_output(['git','status','--porcelain','--untracked-files=no'], text=True).splitlines()
          report.update({
              'source_head': os.environ['PTAH_EXACT_SHA'],
              'checked_out_head': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'source_files_changed_by_candidate_build': changed,
              'rustfmt_applied': True,
          })
          assert report['source_head'] == report['checked_out_head']
          expected = {
              ' M Cargo.lock',
              ' M crates/ptah-identifiers/src/lib.rs',
              ' M crates/ptah-node-agent/src/lib.rs',
          }
          assert set(changed) == expected, changed
          Path('evidence/a02-lock/report.json').write_text(json.dumps(report, indent=2, sort_keys=True)+'\n')
          PY

      - name: Upload A02 lock and formatted candidates
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: a02-lock-candidate-${{ env.PTAH_EXACT_SHA }}-${{ github.run_attempt }}
          path: evidence/a02-lock/
          if-no-files-found: error
          retention-days: 30
