name: TEMP Athena Oracle Recovery
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  inspect-helper:
    runs-on: [self-hosted, Windows, athena]
    timeout-minutes: 5
    steps:
      - shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          Write-Output ('IDENTITY='+[Security.Principal.WindowsIdentity]::GetCurrent().Name)
          $principal=New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          Write-Output ('IS_ADMIN='+$principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))
          $p=Join-Path $env:LOCALAPPDATA 'OracleNode\restart-oracle-node.ps1'
          Write-Output '--- HELPER ---'
          if(Test-Path $p){Get-Content $p -Raw}else{Write-Output 'MISSING'}
