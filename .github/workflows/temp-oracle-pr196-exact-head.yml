name: Temporary Oracle PR211 Exact-Head Proof

on:
  push:
    branches:
      - proof/oracle-pr196-exact-head-20260825
    paths:
      - .github/workflows/temp-oracle-pr196-exact-head.yml

permissions:
  contents: read

env:
  ORACLE_BASE_SHA: fdd4d58b327f1373ed6f19a17589f7c60c755966
  ORACLE_SHA: 3fd551ca5548d10a8ed70294b6fb375440468bd3
  EXTENSION_TEST_BLOB: 1ec3b29d214277eef8799f2700c4de2c152a8677
  DEPLOY_TEST_BLOB: e02418cb1385c221399986667f6e59fe4d4c0b36

jobs:
  exact-head-proof:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 25
    steps:
      - name: Review and prove exact PR211 head
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          gh repo clone jaydumisuni/Oracle- "$work/repo" -- --no-checkout
          git -C "$work/repo" fetch --depth 2 origin "$ORACLE_SHA" "$ORACLE_BASE_SHA"
          git -C "$work/repo" checkout --detach "$ORACLE_SHA"
          test "$(git -C "$work/repo" rev-parse HEAD)" = "$ORACLE_SHA"
          test "$(git -C "$work/repo" rev-parse 'HEAD:tests/extension-repo-update-installer.test.ts')" = "$EXTENSION_TEST_BLOB"
          test "$(git -C "$work/repo" rev-parse 'HEAD:tests/private-deploy-live.test.ts')" = "$DEPLOY_TEST_BLOB"
          git -C "$work/repo" diff --name-only "$ORACLE_BASE_SHA" "$ORACLE_SHA" > "$work/changed.txt"
          printf '%s\n' 'tests/extension-repo-update-installer.test.ts' 'tests/private-deploy-live.test.ts' > "$work/expected.txt"
          sort -o "$work/changed.txt" "$work/changed.txt"
          sort -o "$work/expected.txt" "$work/expected.txt"
          diff -u "$work/expected.txt" "$work/changed.txt"
          test "$(git -C "$work/repo" diff --numstat "$ORACLE_BASE_SHA" "$ORACLE_SHA" | awk '{a+=$1;d+=$2} END{print a":"d}')" = '2:2'
          cd "$work/repo"
          npm ci --ignore-scripts --no-audit --no-fund >/dev/null
          npm run check
          git diff --check "$ORACLE_BASE_SHA" "$ORACLE_SHA"
          echo "PR211_EXACT_HEAD_PROOF=PASS HEAD=$ORACLE_SHA BASE=$ORACLE_BASE_SHA FILES=2 DELTA=2:2"
