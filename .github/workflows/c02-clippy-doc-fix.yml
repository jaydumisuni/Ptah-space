name: C02 one-shot strict Clippy doc fix

on:
  push:
    branches:
      - c02-filesystem-providers
    paths:
      - ".github/workflows/c02-clippy-doc-fix.yml"

permissions:
  contents: write

jobs:
  correct-c02:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: c02-filesystem-providers
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact mechanical correction and verify
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ptah-archive-decomposition/src/c02.rs')
          source = path.read_text(encoding='utf-8')
          old = '    /// SquashFS.\n'
          new = '    /// `SquashFS`.\n'
          assert source.count(old) == 1, source.count(old)
          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY
          cargo fmt --all
          cargo test -p ptah-archive-decomposition --test c02 --locked -- --nocapture \
            2>&1 | tee /tmp/c02-tests.txt
          grep -Eq 'test result: ok\. 20 passed; 0 failed;' /tmp/c02-tests.txt
          cargo clippy -p ptah-archive-decomposition --lib --test c02 --locked -- -D warnings \
            2>&1 | tee /tmp/c02-clippy.txt
          git diff --check
      - name: Commit correction and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/c02-clippy-doc-fix.yml
          git add crates/ptah-archive-decomposition/src/c02.rs
          changed="$(git diff --cached --name-only | sort)"
          allowed="$(printf '%s\n' \
            .github/workflows/c02-clippy-doc-fix.yml \
            crates/ptah-archive-decomposition/src/c02.rs | sort)"
          test "$changed" = "$allowed"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "C02 review: satisfy strict Clippy documentation"
          git push origin HEAD:c02-filesystem-providers
