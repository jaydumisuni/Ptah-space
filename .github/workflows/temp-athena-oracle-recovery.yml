name: TEMP Athena Oracle Recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover-athena:
    runs-on: [self-hosted, Windows, athena]
    timeout-minutes: 10
    steps:
      - name: Recover existing Oracle user node
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $state=Join-Path $env:LOCALAPPDATA 'OracleNode'
          $wrapper=Join-Path $state 'start-oracle-node.cmd'
          if(-not (Test-Path -LiteralPath $wrapper -PathType Leaf)){ throw ('ORACLE_WRAPPER_MISSING='+$wrapper) }
          Write-Output '--- WRAPPER ---'
          Get-Content -LiteralPath $wrapper | ForEach-Object { if($_ -match '(?i)TOKEN'){ $_ -replace '=.*','=[REDACTED]' } else { $_ } }
          Get-CimInstance Win32_Process | Where-Object {$_.Name -eq 'node.exe' -and $_.CommandLine -like '*OracleNode*oracle-live-node.mjs*'} | ForEach-Object {
            try { Stop-Process -Id $_.ProcessId -Force -ErrorAction Stop } catch {}
          }
          $env:RUNNER_TRACKING_ID=''
          $out=Join-Path $state 'manual-recovery.stdout.log'
          $err=Join-Path $state 'manual-recovery.stderr.log'
          Remove-Item $out,$err -Force -ErrorAction SilentlyContinue
          $p=Start-Process -FilePath $wrapper -WorkingDirectory $state -RedirectStandardOutput $out -RedirectStandardError $err -WindowStyle Hidden -PassThru
          Write-Output ('START_PID='+$p.Id)
          Start-Sleep -Seconds 8
          if(Test-Path $err){$stderr=(Get-Content $err -Raw); if($stderr){Write-Output ('STDERR='+$stderr)}}
          $health=Invoke-RestMethod -Uri 'http://127.0.0.1:5059/health' -TimeoutSec 5
          $ready=Invoke-RestMethod -Uri 'http://127.0.0.1:5059/ready' -TimeoutSec 5
          Write-Output ('HEALTH='+($health|ConvertTo-Json -Depth 8 -Compress))
          Write-Output ('READY='+($ready|ConvertTo-Json -Depth 8 -Compress))
          Get-CimInstance Win32_Process | Where-Object {$_.Name -eq 'node.exe' -and $_.CommandLine -like '*OracleNode*oracle-live-node.mjs*'} | Select-Object ProcessId,CreationDate,CommandLine | ConvertTo-Json -Compress
