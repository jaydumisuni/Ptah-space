name: TEMP KRATOS Redmi sky CN active-region mapping

# activation: v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-kratos-chatgpt-browser-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, kratos, linux, x64, physical, ptah]
    timeout-minutes: 10
    steps:
      - name: Map active regional consumers read-only
        shell: bash
        run: |
          set -euo pipefail
          ADB="$(command -v adb || true)"
          if [[ -z "$ADB" && -x /home/kratos/.local/share/mibu-platform-tools/current/platform-tools/adb ]]; then
            ADB=/home/kratos/.local/share/mibu-platform-tools/current/platform-tools/adb
          fi
          test -x "$ADB"
          "$ADB" start-server >/dev/null
          "$ADB" get-state

          echo '=== HOST ROUTES BEFORE ==='
          ip route show default || true

          echo '=== LOCALE / REGION ==='
          "$ADB" shell 'for k in persist.sys.locale ro.product.locale ro.product.locale.language ro.product.locale.region ro.miui.region ro.miui.cust_variant ro.product.mod_device ro.build.product; do printf "%s=" "$k"; getprop "$k"; done; printf "system_locales="; settings get system system_locales 2>/dev/null; printf "user_setup_complete="; settings get secure user_setup_complete 2>/dev/null'

          echo '=== SEARCH / ASSISTANT DEFAULTS ==='
          "$ADB" shell 'printf "assistant="; settings get secure assistant 2>/dev/null; printf "voice_interaction_service="; settings get secure voice_interaction_service 2>/dev/null; printf "search_global_search_activity="; settings get secure search_global_search_activity 2>/dev/null; echo "-- GLOBAL_SEARCH"; cmd package query-activities -a android.search.action.GLOBAL_SEARCH --brief 2>/dev/null | head -n 40; echo "-- WEB_SEARCH"; cmd package query-activities -a android.intent.action.WEB_SEARCH --brief 2>/dev/null | head -n 40; echo "-- ASSIST"; cmd package query-activities -a android.intent.action.ASSIST --brief 2>/dev/null | head -n 40'

          echo '=== RELEVANT PACKAGE PATHS ==='
          "$ADB" shell 'for p in com.android.quicksearchbox com.xiaomi.market com.miui.voiceassist com.miui.miservice com.google.android.gms com.google.android.gsf com.android.vending com.google.android.configupdater com.google.android.ext.shared; do echo "-- $p"; pm path "$p" 2>/dev/null || true; pm list packages -s "$p" 2>/dev/null || true; done'

          echo '=== ACTIVE OVERLAYS FILTERED ==='
          "$ADB" shell 'cmd overlay list --user 0 2>/dev/null | grep -Ei "miui|xiaomi|region|cn|china|google|gms|search|market|locale|telecom" | head -n 220 || true'

          echo '=== REGION-RELEVANT CONFIG FILENAMES OUTSIDE /cust ==='
          "$ADB" shell 'for root in /product/etc /system_ext/etc /vendor/etc /odm/etc; do [ -d "$root" ] || continue; echo "-- $root"; find "$root" -maxdepth 3 -type f 2>/dev/null | grep -Ei "google|gms|region|cust|china|/cn[._/-]|miui|xiaomi|preload|overlay|search|market" | sort | head -n 180; done'

          echo '=== GOOGLE / GMS TEXT REFERENCES IN SMALL CONFIGS ==='
          "$ADB" shell 'for root in /product/etc/permissions /product/etc/sysconfig /system_ext/etc/permissions /system_ext/etc/sysconfig; do [ -d "$root" ] || continue; find "$root" -maxdepth 2 -type f -size -262144c 2>/dev/null | sort | while IFS= read -r p; do m=$(grep -a -i -E "com\.google|google\.android|gms|phonesky|vending" "$p" 2>/dev/null | head -n 8); if [ -n "$m" ]; then echo "--- $p"; printf "%s\n" "$m"; fi; done; done'

          echo '=== CN SKU SIGNED PRELOAD MANIFEST SUMMARY ==='
          "$ADB" shell 'p=/cust/cust/cn_chinatelecom/sign_customized_applist; if [ -f "$p" ]; then printf "line_count="; wc -l < "$p"; printf "byte_count="; wc -c < "$p"; cut -d" " -f1 "$p" | head -n 80; fi'

          echo '=== POST-PROBE ==='
          "$ADB" get-state
          ip route show default || true
          echo 'TTG_REDMI_CN_ACTIVE_REGION_MAP=PASS'
