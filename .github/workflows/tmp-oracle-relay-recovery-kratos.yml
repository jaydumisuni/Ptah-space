# activate: extract verified Global regional images 2026-08-27
name: Temporary extract verified Redmi Global regional images on KRATOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-oracle-relay-recovery-kratos.yml'

permissions:
  contents: read

jobs:
  extract:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 45
    steps:
      - name: Extract only regional partitions and metadata from verified archive
        shell: bash
        run: |
          set -euo pipefail
          expected_name='sky_global_images_OS2.0.9.0.VMWMIXM_20250530.0000.00_15.0_global_3334591f85.tgz'
          root='sky_global_images_OS2.0.9.0.VMWMIXM_15.0'
          work='/home/kratos/Desktop/redmi-global-analysis/OS2.0.9.0.VMWMIXM'

          dev="$(lsblk -rno PATH,LABEL,FSTYPE | awk '$2=="Untitled" && tolower($3)=="exfat" {print $1; exit}')"
          [[ -n "$dev" ]] || { echo 'USB_VOLUME_NOT_FOUND'; exit 2; }
          mountpoint="$(lsblk -rno MOUNTPOINTS "$dev" | awk 'NF {print; exit}')"
          if [[ -z "$mountpoint" ]]; then
            out="$(udisksctl mount -b "$dev" -o ro 2>&1)" || { echo "$out"; exit 3; }
            echo "$out"
            mountpoint="$(lsblk -rno MOUNTPOINTS "$dev" | awk 'NF {print; exit}')"
          fi
          rom="$(find "$mountpoint" -maxdepth 4 -type f -name "$expected_name" -print -quit)"
          [[ -f "$rom" ]] || { echo 'VERIFIED_ROM_NOT_FOUND'; exit 4; }
          [[ "$(md5sum "$rom" | awk '{print $1}')" == '3334591f858477053b68f4c0e47debf0' ]] || { echo 'ROM_MD5_CHANGED'; exit 5; }

          mkdir -p "$work"
          echo '=== EXTRACT SELECTED MEMBERS ==='
          tar -xzf "$rom" -C "$work" --strip-components=2 \
            "$root/images/cust.img" \
            "$root/images/opcust.img" \
            "$root/images/opconfig.img" \
            "$root/images/super.img" \
            "$root/images/vbmeta.img" \
            "$root/images/vbmeta_system.img" \
            "$root/images/anti_version.txt"
          tar -xzf "$rom" -C "$work" --strip-components=1 \
            "$root/misc.txt" \
            "$root/flash_all.sh" \
            "$root/flash_all_lock.sh" \
            "$root/flash_all_except_storage.sh"

          echo '=== EXTRACTED INVENTORY ==='
          find "$work" -maxdepth 2 -type f -printf '%s\t%p\n' | sort -nr

          echo '=== FILE TYPES ==='
          while IFS= read -r -d '' f; do
            printf '%s\t' "$f"
            file -b "$f"
          done < <(find "$work" -maxdepth 2 -type f -print0 | sort -z)

          echo '=== MAGIC HEADERS ==='
          for f in "$work"/*.img; do
            echo "--- $(basename "$f") ---"
            od -An -tx1 -N64 "$f" | tr -s ' '
          done

          echo '=== AVAILABLE IMAGE TOOLS ==='
          for t in simg2img img2simg lpunpack lpdump debugfs fsck.erofs dump.erofs mount 7z avbtool; do
            printf '%s=' "$t"
            command -v "$t" || true
          done

          echo '=== FLASH/REGION HITS ==='
          grep -RniE '(anti|region|product|cust|super|vbmeta|lock|erase|wiping|fastboot)' "$work"/*.sh "$work"/*.txt 2>/dev/null | head -n 500 || true

          echo "analysis_root=$work"
