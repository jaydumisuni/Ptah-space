# activate: inspect mounted Global cust evidence 2026-08-30
name: Temporary inspect Redmi Global cust evidence on KRATOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-oracle-relay-recovery-kratos.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 20
    steps:
      - name: Mount verified Global cust read-only and collect regional evidence
        shell: bash
        run: |
          set -euo pipefail
          work='/home/kratos/Desktop/redmi-global-analysis/OS2.0.9.0.VMWMIXM'
          raw="$work/cust.raw.img"
          [[ -f "$raw" ]] || { echo 'CUST_RAW_MISSING'; exit 2; }
          [[ "$(blkid -p -s TYPE -o value "$raw" 2>/dev/null || true)" == 'erofs' ]] || { echo 'CUST_RAW_NOT_EROFS'; exit 3; }

          loop=''
          cleanup() {
            set +e
            if [[ -n "${loop:-}" && -b "$loop" ]]; then
              udisksctl unmount -b "$loop" >/dev/null 2>&1 || true
              udisksctl loop-delete -b "$loop" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          setup="$(udisksctl loop-setup -r -f "$raw")"
          echo "$setup"
          loop="$(losetup -j "$raw" 2>/dev/null | sed -n '1s/:.*//p')"
          [[ -b "$loop" ]] || { echo "LOOP_NOT_RESOLVED:$loop"; exit 4; }
          [[ "$(cat "/sys/class/block/$(basename "$loop")/ro")" == '1' ]] || { echo 'LOOP_NOT_READ_ONLY'; exit 5; }
          echo "loop=$loop"

          mount_out="$(udisksctl mount -b "$loop" -o ro)"
          echo "$mount_out"
          mnt="$(lsblk -rno MOUNTPOINTS "$loop" | awk 'NF {print; exit}')"
          [[ -d "$mnt" ]] || { echo 'MOUNTPOINT_NOT_RESOLVED'; exit 6; }
          echo "mountpoint=$mnt"
          findmnt -T "$mnt"

          echo '=== CORE SELECTOR FILES ==='
          for rel in cust_variant etc/business.prop etc/cust_apps_request_config etc/cust_apps_config app_legacy_install_list etc/same_app_diff_package_list; do
            f="$mnt/$rel"
            if [[ -f "$f" ]]; then
              echo "--- /$rel ---"
              sed -n '1,1200p' "$f"
            else
              echo "--- /$rel : MISSING ---"
            fi
          done

          echo '=== CUST REGIONS ==='
          find "$mnt/cust" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | sort | tr '\n' ' '
          echo
          printf 'region_dir_count='
          find "$mnt/cust" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l

          echo '=== GLOBAL CUSTOMIZED APP FILES ==='
          find "$mnt/app/customized" -maxdepth 4 -type f -printf '%P\n' 2>/dev/null | sort | head -n 2000 || true
          printf 'customized_file_count='
          find "$mnt/app/customized" -type f 2>/dev/null | wc -l

          echo '=== APK PACKAGE-LIKE INVENTORY ==='
          find "$mnt" -maxdepth 6 -type f -iname '*.apk' -printf '%P\n' 2>/dev/null | sort | head -n 2500 || true
          printf 'apk_count='
          find "$mnt" -type f -iname '*.apk' 2>/dev/null | wc -l

          echo '=== GOOGLE / CN / GLOBAL POLICY HITS ==='
          grep -RniE '(google|gms|gsf|phonesky|play.?store|global|region|romRegion|currentSku|cust_variant|mixm|cn_chinatelecom|baidu|douyin|alipay|weibo|tencent|facebook|netflix|booking|agoda)' \
            "$mnt/etc" "$mnt/cust" 2>/dev/null | head -n 2500 || true

          echo '=== FILE COUNTS ==='
          python3 - "$mnt" <<'PY'
          from collections import Counter
          from pathlib import Path
          import sys
          root=Path(sys.argv[1]); top=Counter(); second=Counter(); total=0
          for p in root.rglob('*'):
              try:
                  if not p.is_file():
                      continue
                  rel=p.relative_to(root); total += 1
                  top[rel.parts[0] if rel.parts else '.'] += 1
                  second['/'.join(rel.parts[:2])] += 1
              except OSError:
                  pass
          print('total_files='+str(total))
          print('top='+repr(dict(sorted(top.items()))))
          print('selected_second='+repr({k:v for k,v in sorted(second.items()) if k.startswith(('app/','cust/','etc/'))}))
          PY

          echo 'GLOBAL_CUST_EVIDENCE=PASS'
