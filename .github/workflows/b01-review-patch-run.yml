name: B01 deterministic review patch

on:
  push:
    branches:
      - b01-transfer-storage-expansion

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: b01-transfer-storage-expansion
          fetch-depth: 0
      - name: Apply reviewed patch and canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/b01_review_patch.py
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          cargo fmt --all
          rm tools/b01_review_patch.py
          rm .github/workflows/b01-review-patch-run.yml
      - name: Commit corrected six-file candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "B01 review: bind resumable state to exact bytes"
          git push origin HEAD:b01-transfer-storage-expansion
