name: TEMP Donor App Recover extracted tree inspection ATHENA
on:
  push:
    branches: [diagnostics/donor-apprecover-athena-20261015]
    paths: ['.github/workflows/temp-donor-apprecover-athena.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, athena, windows, x64, physical, ptah]
    timeout-minutes: 6
    steps:
      - name: Inspect completed Qt recovery artifact inventory
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'ATHENA'){throw 'WRONG_HOST'}
          $root='D:\projects\Donor Fetcher\.workspace\athena-harvest\run-20261014-040129\app-recover-qt-full-20261014'
          if(-not (Test-Path $root)){throw 'APP_RECOVER_FINISHED_ROOT_MISSING'}
          Write-Output '=== TOP-LEVEL OUTPUT ==='
          Get-ChildItem -LiteralPath $root | Select-Object Name,Length,LastWriteTime | Format-Table -AutoSize
          Write-Output '=== DERIVED REPORT FILES, NO ORIGINAL BINARIES ==='
          Get-ChildItem -LiteralPath $root -Recurse -File -ErrorAction Stop |
            Where-Object {$_.Extension -in @('.json','.md','.txt','.csv','.ui','.qrc','.qml','.py') -and $_.Length -lt 4000000} |
            Select-Object -First 150 @{N='Relative';E={$_.FullName.Substring($root.Length+1)}},Length | Format-Table -Wrap -AutoSize
          Write-Output '=== REPORT SAMPLES ==='
          foreach($name in @('00_detection\detection_report.json','00_detection\detection.txt','05_dependencies\imports.txt','06_rebuild_prep\rebuild_notes.txt','07_builder_recovery\what_can_be_recovered.txt','07_builder_recovery\builder_recovery_plan.md','08_recovery_methods\recovery_methods.json','02_strings\strings_summary.txt')){
            $p=Join-Path $root $name
            if(Test-Path $p){Write-Output ('FILE='+ $name);Get-Content -LiteralPath $p -TotalCount 22 | ForEach-Object {$_ -replace 'https?://\S+','[URL_REMOVED]' -replace '(?i)(password|api.?key|token|secret)[=:]\S+','$1=[REDACTED]'}}
          }
