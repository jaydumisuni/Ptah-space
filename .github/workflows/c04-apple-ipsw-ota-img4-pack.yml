name: C04 Apple IPSW OTA IMG4 pack exact-head proof

on:
  pull_request:
    paths:
      - "C04_APPLE_IPSW_OTA_IMG4_PACK.md"
      - "crates/ptah-archive-decomposition/Cargo.toml"
      - "crates/ptah-archive-decomposition/src/lib.rs"
      - "crates/ptah-archive-decomposition/src/c04.rs"
      - "crates/ptah-archive-decomposition/tests/c04.rs"
      - ".github/workflows/c04-apple-ipsw-ota-img4-pack.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PTAH_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PTAH_PR_BASE: ${{ github.event.pull_request.base.sha }}
  PTAH_C04_BASE_SHA: 1ea4ab37ec36bb27ff949b525b9f9c082c937293
  CARGO_TERM_COLOR: always

jobs:
  c04-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact C04 candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PTAH_EXACT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Lock accepted C03 base and six-file C04 scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PTAH_EXACT_SHA"
          test -z "$(git status --porcelain)"
          if [ -n "${PTAH_PR_BASE:-}" ]; then
            test "$PTAH_PR_BASE" = "$PTAH_C04_BASE_SHA"
          fi
          test "$(git merge-base "$PTAH_C04_BASE_SHA" "$PTAH_EXACT_SHA")" = "$PTAH_C04_BASE_SHA"
          python3 - <<'PY'
          import os
          import subprocess

          base = os.environ["PTAH_C04_BASE_SHA"]
          head = os.environ["PTAH_EXACT_SHA"]
          files = subprocess.check_output(
              ["git", "diff", "--name-only", base, head], text=True
          ).splitlines()
          allowed = {
              "C04_APPLE_IPSW_OTA_IMG4_PACK.md",
              "crates/ptah-archive-decomposition/Cargo.toml",
              "crates/ptah-archive-decomposition/src/lib.rs",
              "crates/ptah-archive-decomposition/src/c04.rs",
              "crates/ptah-archive-decomposition/tests/c04.rs",
              ".github/workflows/c04-apple-ipsw-ota-img4-pack.yml",
          }
          unexpected = sorted(set(files).difference(allowed))
          missing = sorted(allowed.difference(files))
          assert not unexpected, f"C04 scope drift: {unexpected}"
          assert not missing, f"C04 required surface missing: {missing}"
          PY
          git diff --check "$PTAH_C04_BASE_SHA" "$PTAH_EXACT_SHA"

      - name: Install pinned Rust 1.97.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/c04
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
          rustc -Vv | tee /tmp/c04/rustc-version.txt
          cargo -V | tee /tmp/c04/cargo-version.txt
          rustc -V | grep -q '^rustc 1.97.1 '
          cargo -V | grep -q '^cargo 1.97.1 '
          printf '%s\n' "$PTAH_EXACT_SHA" > /tmp/c04/exact-head.txt
          cat /etc/os-release > /tmp/c04/host-os-release.txt

      - name: Prove formatting and 20-case C04 acceptance
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p ptah-archive-decomposition --test c04 --locked -- --nocapture \
            2>&1 | tee /tmp/c04/c04-tests.txt
          grep -Eq 'test result: ok\. 20 passed; 0 failed;' /tmp/c04/c04-tests.txt

      - name: Prove C04 surface with strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p ptah-archive-decomposition --lib --test c04 --locked -- -D warnings \
            2>&1 | tee /tmp/c04/c04-clippy.txt

      - name: Re-prove inherited C03 Android firmware semantics
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ptah-archive-decomposition --test c03 --locked -- --nocapture \
            2>&1 | tee /tmp/c04/c03-tests.txt
          grep -Eq 'test result: ok\. 20 passed; 0 failed;' /tmp/c04/c03-tests.txt

      - name: Re-prove inherited C02 filesystem semantics
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ptah-archive-decomposition --test c02 --locked -- --nocapture \
            2>&1 | tee /tmp/c04/c02-tests.txt
          grep -Eq 'test result: ok\. 20 passed; 0 failed;' /tmp/c04/c02-tests.txt

      - name: Re-prove inherited C01 disk foundations
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ptah-archive-decomposition --test c01 --locked -- --nocapture \
            2>&1 | tee /tmp/c04/c01-tests.txt
          grep -Eq 'test result: ok\. 20 passed; 0 failed;' /tmp/c04/c01-tests.txt

      - name: Re-prove inherited B02 decomposition semantics
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ptah-archive-decomposition --test b02 --locked -- --nocapture \
            2>&1 | tee /tmp/c04/b02-tests.txt

      - name: Re-prove inherited B05 executable and package semantics
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ptah-archive-decomposition --test b05 --locked -- --nocapture \
            2>&1 | tee /tmp/c04/b05-tests.txt
          grep -Eq 'test result: ok\. 15 passed; 0 failed;' /tmp/c04/b05-tests.txt

      - name: Re-prove inherited B07 Object World search semantics
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ptah-archive-decomposition --test b07 --locked -- --nocapture \
            2>&1 | tee /tmp/c04/b07-tests.txt
          grep -Eq 'test result: ok\. 14 passed; 0 failed;' /tmp/c04/b07-tests.txt
          cargo test -p ptah-archive-decomposition --lib b07::tests --locked -- --nocapture \
            2>&1 | tee /tmp/c04/b07-boundary-tests.txt
          grep -Eq 'test result: ok\. 2 passed; 0 failed;' /tmp/c04/b07-boundary-tests.txt

      - name: Re-prove full locked workspace at exact C04 head
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --locked -- --nocapture \
            2>&1 | tee /tmp/c04/workspace-tests.txt

      - name: Write exact-head C04 proof manifest
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cp C04_APPLE_IPSW_OTA_IMG4_PACK.md /tmp/c04/acceptance-contract.md
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('/tmp/c04')
          required = [
              'exact-head.txt',
              'host-os-release.txt',
              'rustc-version.txt',
              'cargo-version.txt',
              'c04-tests.txt',
              'c04-clippy.txt',
              'c03-tests.txt',
              'c02-tests.txt',
              'c01-tests.txt',
              'b02-tests.txt',
              'b05-tests.txt',
              'b07-tests.txt',
              'b07-boundary-tests.txt',
              'workspace-tests.txt',
              'acceptance-contract.md',
          ]
          files = {}
          for name in required:
              path = root / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'missing C04 proof report: {name}')
              files[name] = {
                  'size_bytes': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          head = (root / 'exact-head.txt').read_text(encoding='utf-8').strip()
          if head != os.environ['PTAH_EXACT_SHA']:
              raise SystemExit('C04 proof head mismatch')
          manifest = {
              'schema_version': '0.1.0',
              'record_type': 'ptah.c04.apple_ipsw_ota_img4_exact_head_proof',
              'status': 'pass',
              'implementation_commit': head,
              'accepted_base_commit': os.environ['PTAH_C04_BASE_SHA'],
              'workflow_run_id': int(os.environ['RUN_ID']),
              'workflow_run_attempt': int(os.environ['RUN_ATTEMPT']),
              'c04_acceptance_test_count': 20,
              'archive_role_required_for_zip': True,
              'archive_provider_output_validated_as_untrusted': True,
              'manifest_linkage_exact_and_source_bound': True,
              'incomplete_manifest_claim_reduces_truth': True,
              'strict_der_minimal_definite_lengths_proven': True,
              'img4_exact_child_extraction_proven': True,
              'im4m_signing_material_does_not_establish_trust': True,
              'comparison_levels_proven': True,
              'rebuild_levels_do_not_claim_restore_or_boot': True,
              'source_bytes_immutable': True,
              'registration_relationship_view_plans_proven': True,
              'inherited_c03_reproven': True,
              'inherited_c02_reproven': True,
              'inherited_c01_reproven': True,
              'inherited_b02_reproven': True,
              'inherited_b05_reproven': True,
              'inherited_b07_reproven': True,
              'files': files,
          }
          rendered = json.dumps(manifest, indent=2, sort_keys=True) + '\n'
          (root / 'proof-manifest.json').write_text(rendered, encoding='utf-8')
          digest = hashlib.sha256(rendered.encode()).hexdigest()
          (root / 'proof-manifest.sha256').write_text(
              f'{digest}  proof-manifest.json\n', encoding='utf-8'
          )
          print(rendered, end='')
          PY
          cd /tmp/c04
          sha256sum -c proof-manifest.sha256

      - name: Confirm exact clean C04 candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PTAH_EXACT_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Retain C04 proof bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: c04-apple-ipsw-ota-img4-${{ env.PTAH_EXACT_SHA }}
          path: /tmp/c04/
          if-no-files-found: error
          retention-days: 90
