name: E01 TDD

on:
  push:
    branches:
      - e01-secure-multi-node-identity-connection
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/ptah-node-link/**
      - services/ptah-node/**
      - services/ptah-control/**
      - .github/workflows/e01-tdd.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  node-link-targeted:
    runs-on: ubuntu-latest
    steps:
      - name: Check out E01 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Pin Rust 1.97.1
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          rustup default 1.97.1
      - name: Run E01 node-link tests
        shell: bash
        run: cargo test -p ptah-node-link --test protocol --test framing --test enrollment_session --test tls_transport
      - name: Run E01 service tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ptah-control --test e01_node_link
          cargo test -p ptah-node --test e01_node_client
      - name: Run E01 strict Clippy
        shell: bash
        run: cargo clippy -p ptah-node-link --all-targets -- -D warnings
      - name: Retain resolved Cargo.lock candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e01-lock-${{ github.sha }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7
      - name: Commit resolved Cargo.lock when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build(e01): lock secure-link dependencies"
          git push origin HEAD:e01-secure-multi-node-identity-connection
