name: Temporary ATHENA Cloudflare D1 Authority Probe

on:
  push:
    branches:
      - proof/oracle-pr196-exact-head-20260825
    paths:
      - .github/workflows/temp-oracle-pr196-exact-head.yml

permissions:
  contents: read

jobs:
  d1-authority:
    runs-on: [self-hosted, athena, windows, ptah]
    timeout-minutes: 8
    steps:
      - name: Prove Wrangler account and D1 read authority without exposing credentials
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $oldCI = $env:CI
          $oldActions = $env:GITHUB_ACTIONS
          try {
            Remove-Item Env:CI -ErrorAction SilentlyContinue
            Remove-Item Env:GITHUB_ACTIONS -ErrorAction SilentlyContinue

            $who = & npx --yes 'wrangler@4.122.0' whoami 2>&1
            $whoCode = $LASTEXITCODE
            Write-Host ('WHOAMI_EXIT=' + $whoCode)
            if ($whoCode -ne 0) { throw 'WRANGLER_WHOAMI_FAILED' }

            $list = & npx --yes 'wrangler@4.122.0' d1 list --json 2>&1
            $listCode = $LASTEXITCODE
            Write-Host ('D1_LIST_EXIT=' + $listCode)
            if ($listCode -ne 0) {
              @($list) | ForEach-Object { [string]$_ } | Where-Object { $_ -notmatch '(?i)token|authorization|bearer' } | Select-Object -Last 30 | Write-Host
              throw 'WRANGLER_D1_AUTHORITY_FAILED'
            }

            $json = (@($list) -join "`n") | ConvertFrom-Json
            $db = @($json) | Where-Object { $_.name -eq 'oracle-accounts' -or $_.uuid -eq '28224b01-26b3-485e-84f5-1bc31b162752' } | Select-Object -First 1
            if (-not $db) { throw 'ORACLE_D1_DATABASE_NOT_VISIBLE' }
            Write-Host ('D1_DATABASE_VISIBLE=PASS name=' + $db.name + ' uuid=' + $db.uuid)
            Write-Host 'ATHENA_CLOUDFLARE_D1_AUTHORITY=PASS'
          }
          finally {
            if ($null -ne $oldCI) { $env:CI = $oldCI }
            if ($null -ne $oldActions) { $env:GITHUB_ACTIONS = $oldActions }
          }
