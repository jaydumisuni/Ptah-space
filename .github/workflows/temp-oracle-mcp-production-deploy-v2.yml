name: TEMP ATHENA Redmi Global ROM completion verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-oracle-mcp-production-deploy-v2.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, athena, windows, x64, physical, ptah]
    timeout-minutes: 20
    steps:
      - name: Finalize BITS and verify external-drive ROM
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $fileName = 'sky_global_images_OS2.0.9.0.VMWMIXM_20250530.0000.00_15.0_global_3334591f85.tgz'
          $expectedSize = [int64]7949886711
          $expectedMd5 = '3334591f858477053b68f4c0e47debf0'
          $dest = "E:\redmi r12\$fileName"
          $bitsName = 'TTG Redmi sky Global OS2.0.9.0 External'

          Write-Output '=== EXTERNAL DRIVE ==='
          $partition = Get-Partition -DriveLetter E -ErrorAction Stop
          $disk = $partition | Get-Disk -ErrorAction Stop
          $volume = Get-Volume -DriveLetter E -ErrorAction Stop
          [ordered]@{drive='E:';label=[string]$volume.FileSystemLabel;busType=[string]$disk.BusType;freeBytes=[int64]$volume.SizeRemaining} | ConvertTo-Json -Compress
          if ([string]$disk.BusType -ne 'USB') { throw 'E: is not the expected USB drive' }

          Write-Output '=== BITS STATE ==='
          $job = Get-BitsTransfer -Name $bitsName -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($job) {
            $pct = if ([int64]$job.BytesTotal -gt 0) { [math]::Round(([double]$job.BytesTransferred / [double]$job.BytesTotal) * 100, 4) } else { 0 }
            [ordered]@{state=[string]$job.JobState;bytesTransferred=[int64]$job.BytesTransferred;bytesTotal=[int64]$job.BytesTotal;percent=$pct;destination=($job.FileList | Select-Object -First 1 -ExpandProperty LocalName)} | ConvertTo-Json -Compress

            if ($job.JobState -eq 'Transferred') {
              Write-Output '=== COMPLETE BITS ==='
              Complete-BitsTransfer -BitsJob $job
              Write-Output 'complete_bits_transfer=PASS'
            } elseif ($job.JobState -in @('Transferring','Connecting','Queued','Suspended','TransientError')) {
              Write-Output 'download_complete=false'
              exit 0
            } elseif ($job.JobState -eq 'Error') {
              throw "BITS error: $($job.ErrorDescription)"
            }
          } else {
            Write-Output '{"state":"NO_BITS_JOB"}'
          }

          Write-Output '=== FILE PROOF ==='
          if (-not (Test-Path -LiteralPath $dest)) { throw "Final file not found: $dest" }
          $item = Get-Item -LiteralPath $dest
          $md5 = (Get-FileHash -LiteralPath $dest -Algorithm MD5).Hash.ToLowerInvariant()
          $sha256 = (Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{path=$dest;size=[int64]$item.Length;expectedSize=$expectedSize;md5=$md5;expectedMd5=$expectedMd5;sha256=$sha256;sizeMatch=([int64]$item.Length -eq $expectedSize);md5Match=($md5 -eq $expectedMd5)} | ConvertTo-Json -Compress
          if ([int64]$item.Length -ne $expectedSize) { throw 'Final ROM size mismatch' }
          if ($md5 -ne $expectedMd5) { throw 'Final ROM MD5 mismatch' }

          Write-Output '=== ARCHIVE INTEGRITY ==='
          $tar = Get-Command tar.exe -ErrorAction SilentlyContinue
          if ($tar) {
            & $tar.Source -tzf $dest *> $null
            if ($LASTEXITCODE -ne 0) { throw "tar gzip integrity/listing failed with exit $LASTEXITCODE" }
            Write-Output 'tar_gzip_integrity=PASS'
          } else {
            Write-Output 'tar_gzip_integrity=NOT_RUN_NO_TAR'
          }

          Write-Output 'ROM_VERIFIED=true'
