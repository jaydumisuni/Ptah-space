name: Temporary Redmi sky Global ROM opaque-file preflight on KRATOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-oracle-relay-recovery-kratos.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 30
    steps:
      - name: Verify opaque transferred ROM payload read-only
        shell: bash
        run: |
          set -euo pipefail
          payload='/home/kratos/Desktop/redmi r12/BIT85A4.tmp'
          expected_md5='3334591f858477053b68f4c0e47debf0'

          test -f "$payload"
          echo '=== PAYLOAD ==='
          printf 'path=%s\n' "$payload"
          stat --printf='size_bytes=%s\nmtime=%y\n' "$payload"
          file -b "$payload"
          printf 'magic_hex='
          od -An -tx1 -N32 "$payload" | tr -d ' \n'
          echo

          echo '=== HASHES ==='
          actual_md5="$(md5sum "$payload" | awk '{print $1}')"
          actual_sha256="$(sha256sum "$payload" | awk '{print $1}')"
          printf 'md5=%s\n' "$actual_md5"
          printf 'expected_md5=%s\n' "$expected_md5"
          printf 'md5_matches_expected=%s\n' "$([[ "${actual_md5,,}" == "${expected_md5,,}" ]] && echo true || echo false)"
          printf 'sha256=%s\n' "$actual_sha256"

          echo '=== FORMAT PROBES ==='
          gzip -t "$payload" && echo 'gzip_test=PASS' || echo 'gzip_test=FAIL'

          echo '=== TAR MEMBER TABLE (HEAD) ==='
          if tar -tzf "$payload" >/dev/null 2>&1; then
            set +o pipefail
            tar -tzf "$payload" | head -n 360
            rc=${PIPESTATUS[0]}
            set -o pipefail
            [[ $rc -eq 0 || $rc -eq 141 ]]
            echo 'tar_gzip_listing=PASS'
          else
            echo 'tar_gzip_listing=FAIL'
          fi

          if [[ "${actual_md5,,}" != "${expected_md5,,}" ]]; then
            echo 'ROM_MD5_MISMATCH'
            exit 3
          fi
