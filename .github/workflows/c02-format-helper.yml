name: C02 one-shot pinned formatter

on:
  push:
    branches:
      - c02-filesystem-providers
    paths:
      - ".github/workflows/c02-format-helper.yml"

permissions:
  contents: write

jobs:
  format-c02:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: c02-filesystem-providers
          fetch-depth: 0
          persist-credentials: true
      - name: Apply pinned rustfmt and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          cargo fmt --all
          git rm .github/workflows/c02-format-helper.yml
          git add crates/ptah-archive-decomposition/src/lib.rs \
                  crates/ptah-archive-decomposition/src/c02.rs \
                  crates/ptah-archive-decomposition/tests/c02.rs
          changed="$(git diff --cached --name-only | sort)"
          allowed="$(printf '%s\n' \
            .github/workflows/c02-format-helper.yml \
            crates/ptah-archive-decomposition/src/c02.rs \
            crates/ptah-archive-decomposition/src/lib.rs \
            crates/ptah-archive-decomposition/tests/c02.rs | sort)"
          test -n "$changed"
          test -z "$(comm -23 <(printf '%s\n' "$changed") <(printf '%s\n' "$allowed"))"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "C02 build: apply pinned rustfmt"
          git push origin HEAD:c02-filesystem-providers
