name: Temporary Redmi sky local payload extent diagnosis on KRATOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-oracle-relay-recovery-kratos.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 8
    steps:
      - name: Inspect local allocation and tail without network transfer
        shell: bash
        run: |
          set -euo pipefail
          payload='/home/kratos/Desktop/redmi r12/BIT85A4.tmp'
          test -f "$payload"

          echo '=== SIZE / ALLOCATION ==='
          stat --printf='size_bytes=%s\nblocks_512=%b\nallocated_from_stat=%b*512\n' "$payload"
          printf 'du_apparent='; du -B1 --apparent-size "$payload" | awk '{print $1}'
          printf 'du_allocated='; du -B1 "$payload" | awk '{print $1}'
          printf 'sparse_ratio='; python3 - <<'PY'
          import os
          p='/home/kratos/Desktop/redmi r12/BIT85A4.tmp'
          s=os.stat(p)
          allocated=s.st_blocks*512
          print(f'{allocated/s.st_size:.9f}')
          PY

          echo '=== EXTENTS ==='
          if command -v filefrag >/dev/null 2>&1; then
            filefrag -v "$payload" 2>&1 | tail -n 80 || true
          else
            echo 'filefrag=unavailable'
          fi

          echo '=== HEAD / MIDDLE / TAIL LOCAL SAMPLES ==='
          python3 - <<'PY'
          import hashlib, os
          p='/home/kratos/Desktop/redmi r12/BIT85A4.tmp'
          size=os.path.getsize(p)
          sample=1024*1024
          points=[0, size//4, size//2, (size*3)//4, max(0,size-sample)]
          with open(p,'rb',buffering=0) as f:
              for off in points:
                  f.seek(off)
                  b=f.read(sample)
                  zeros=b.count(0)
                  print(f'offset={off} len={len(b)} sha256={hashlib.sha256(b).hexdigest()} zero_fraction={zeros/max(1,len(b)):.6f}')
              f.seek(max(0,size-64))
              tail=f.read(64)
              print('tail64_hex='+tail.hex())
          PY

          echo '=== GZIP FOOTER INTERPRETATION ==='
          python3 - <<'PY'
          import os, struct
          p='/home/kratos/Desktop/redmi r12/BIT85A4.tmp'
          with open(p,'rb') as f:
              f.seek(-8, os.SEEK_END)
              b=f.read(8)
          if len(b)==8:
              crc,isize=struct.unpack('<II',b)
              print(f'footer_crc32=0x{crc:08x}')
              print(f'footer_isize_mod_2_32={isize}')
          PY
