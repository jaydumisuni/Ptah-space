name: Temporary installed Oracle recovery
on:
  push:
    branches: [recovery/oracle-074-desktop-20261126]
    paths: ['.github/workflows/temp-oracle-074-desktop-recovery.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, athena, Windows, X64, physical, ptah]
    timeout-minutes: 3
    steps:
      - name: Inspect bounded file recovery
        shell: powershell
        run: |
          $r='C:\Program Files (x86)\THETECHGUY Digital Solutions'
          $d=Join-Path $r 'Oracle-074-Recovery'
          $log=Join-Path $d 'file-recovery.log'
          if(Test-Path $log){Get-Content -LiteralPath $log -Tail 10}
          $b=Join-Path $d 'rollback-074-files'
          $journal=Join-Path $b 'attempted-paths.txt'
          if(Test-Path $journal){'Attempted paths: '+@(Get-Content $journal).Count;Get-Content $journal -Tail 4}
          $t=Get-ScheduledTask -TaskName 'Oracle Pending Signed Update 074 File Recovery' -ErrorAction SilentlyContinue
          $e=Join-Path $r 'Oracle\Oracle.exe'
          [pscustomobject]@{version=(Get-Item $e -ErrorAction SilentlyContinue).VersionInfo.FileVersion;taskState=$t.State;appProcesses=@(Get-Process Oracle -ErrorAction SilentlyContinue|Select-Object Id,FileVersion);backup=(Test-Path $b);adb=[bool](Get-Process -Id 24160 -ErrorAction SilentlyContinue);python=[bool](Get-Process -Id 27716 -ErrorAction SilentlyContinue)}|ConvertTo-Json -Depth 4
