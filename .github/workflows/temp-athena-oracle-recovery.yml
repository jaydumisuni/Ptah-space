name: TEMP ATHENA Oracle recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-athena-oracle-recovery.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, athena, windows, x64, physical, ptah]
    timeout-minutes: 8
    steps:
      - name: Inspect ATHENA recovery authority
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $project=''
          $account=''
          $owner=$false
          try { $project=(gcloud config get-value project 2>$null).Trim() } catch {}
          try { $account=(gcloud config get-value account 2>$null).Trim() } catch {}
          if($account){
            try {
              $policy=(gcloud projects get-iam-policy hunter-thetechguy --format=json 2>$null | ConvertFrom-Json)
              $owner=[bool](@($policy.bindings | Where-Object { $_.role -eq 'roles/owner' -and $_.members -contains ('user:'+$account) }).Count)
            } catch {}
          }
          $oracle=Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'oracle-live-node\.mjs|oracle-guardian|oracle-node-watchdog' } | Select-Object ProcessId,ParentProcessId,Name,CommandLine
          $tasks=Get-ScheduledTask -ErrorAction SilentlyContinue | Where-Object { $_.TaskName -match 'Oracle' } | Select-Object TaskName,State,TaskPath
          $cdp=$false
          try { $null=Invoke-RestMethod -Uri 'http://127.0.0.1:9243/json/version' -TimeoutSec 5; $cdp=$true } catch {}
          [ordered]@{
            host=$env:COMPUTERNAME
            user=[Environment]::UserName
            project=$project
            googleAccountConfigured=[bool]$account
            googleProjectOwner=$owner
            braveCdp9243=$cdp
            oracleProcesses=@($oracle)
            oracleTasks=@($tasks)
          } | ConvertTo-Json -Depth 8
