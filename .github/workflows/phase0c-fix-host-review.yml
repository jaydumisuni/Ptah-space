name: Phase 0C apply host review fixes

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-review-fixes:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'phase-0c-host-dependency-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out exact review branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: phase-0c-host-dependency-evidence
          fetch-depth: 0

      - name: Apply reviewed host fixes and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_function(text: str, start_name: str, next_name: str, replacement: str) -> str:
              start = text.index(f"def {start_name}(")
              end = text.index(f"def {next_name}(", start)
              return text[:start] + replacement.rstrip() + "\n\n\n" + text[end:]

          collector_path = Path("host/scripts/collect_capabilities.py")
          collector = collector_path.read_text(encoding="utf-8")

          offline = '''def check_offline_schema_resolution() -> dict[str, Any]:
              try:
                  lock = read_json(ROOT / "contracts/upstream-lock.json")
              except (OSError, RuntimeError, ValueError) as exc:
                  return observation("fail", {"error": str(exc)})
              ok = lock.get("network_resolution_allowed") is False
              return observation(
                  "pass" if ok else "fail",
                  {
                      "lock_status": lock.get("status"),
                      "network_resolution_allowed": lock.get("network_resolution_allowed"),
                  },
              )
          '''.replace("          ", "")
          collector = replace_function(
              collector,
              "check_offline_schema_resolution",
              "check_apparmor",
              offline,
          )

          matcher = '''def pinned_host_match(image_lock: dict[str, Any], release: dict[str, str]) -> dict[str, Any]:
              expected_distribution = str(image_lock.get("distribution", ""))
              expected_release = str(image_lock.get("release", ""))
              expected_architecture = str(image_lock.get("architecture", ""))
              kernel_record = image_lock.get("kernel", {})
              if not isinstance(kernel_record, dict):
                  kernel_record = {}
              expected_kernel = str(kernel_record.get("expected_uname_family", ""))

              observed_id = release.get("ID", "")
              observed_name = release.get("NAME", "")
              observed_version_id = release.get("VERSION_ID", "")
              observed_version = release.get("VERSION", "")
              observed_pretty = release.get("PRETTY_NAME", "")
              observed_architecture = platform.machine()
              observed_kernel = platform.release()

              expected_distribution_lower = expected_distribution.lower()
              distribution_match = (
                  ("ubuntu" in expected_distribution_lower and observed_id.lower() == "ubuntu")
                  or expected_distribution_lower == observed_name.lower()
              )
              expected_point_release = expected_release.split()[0]
              release_match = any(
                  expected_point_release in source
                  for source in (observed_version, observed_pretty)
              )
              base_release_match = observed_version_id == ".".join(
                  expected_point_release.split(".")[:2]
              )
              architecture_aliases = {
                  "amd64": "amd64",
                  "x86_64": "amd64",
                  "aarch64": "arm64",
                  "arm64": "arm64",
              }
              architecture_match = architecture_aliases.get(
                  expected_architecture.lower(), expected_architecture.lower()
              ) == architecture_aliases.get(
                  observed_architecture.lower(), observed_architecture.lower()
              )
              kernel_match = bool(expected_kernel) and observed_kernel.startswith(
                  expected_kernel
              )
              return {
                  "distribution": {
                      "expected": expected_distribution,
                      "observed_id": observed_id,
                      "observed_name": observed_name,
                      "match": distribution_match,
                  },
                  "release": {
                      "expected": expected_release,
                      "observed_version_id": observed_version_id,
                      "observed_version": observed_version,
                      "observed_pretty_name": observed_pretty,
                      "base_release_match": base_release_match,
                      "point_release_match": release_match,
                      "match": base_release_match and release_match,
                  },
                  "architecture": {
                      "expected": expected_architecture,
                      "observed": observed_architecture,
                      "match": architecture_match,
                  },
                  "kernel": {
                      "expected_family": expected_kernel,
                      "observed": observed_kernel,
                      "match": kernel_match,
                  },
                  "all_match": (
                      distribution_match
                      and base_release_match
                      and release_match
                      and architecture_match
                      and kernel_match
                  ),
              }
          '''.replace("          ", "")
          collector = replace_function(collector, "pinned_host_match", "collect", matcher)
          collector_path.write_text(collector, encoding="utf-8")

          test_path = Path("host/tests/test_collect_capabilities.py")
          tests = test_path.read_text(encoding="utf-8")
          realistic = '''{
                  "ID": "ubuntu",
                  "NAME": "Ubuntu",
                  "VERSION_ID": "24.04",
                  "VERSION": "24.04.4 LTS (Noble Numbat)",
                  "PRETTY_NAME": "Ubuntu 24.04.4 LTS",
              }'''
          tests = tests.replace(
              '{"NAME": "Ubuntu Server", "VERSION_ID": "24.04.4"}', realistic, 1
          )
          tests = tests.replace(
              '{"NAME": "Ubuntu", "VERSION_ID": "24.04.4"}', realistic, 2
          )
          if "test_malformed_contract_lock_becomes_failed_observation" not in tests:
              insertion = tests.index(
                  '    @mock.patch.object(collector.platform, "release", return_value="6.11.0-azure")',
                  tests.index("def test_different_kernel_is_not_pinned_proof"),
              )
              regression = '''    def test_malformed_contract_lock_becomes_failed_observation(self) -> None:
              with mock.patch.object(
                  collector,
                  "read_json",
                  side_effect=RuntimeError("malformed lock"),
              ):
                  result = collector.check_offline_schema_resolution()
              self.assertEqual(result["status"], "fail")
              self.assertIn("malformed lock", result["evidence"]["error"])

          '''.replace("          ", "")
              tests = tests[:insertion] + regression + tests[insertion:]
          test_path.write_text(tests, encoding="utf-8")

          Path(".github/workflows/phase0c-fix-host-review.yml").unlink()
          PY

      - name: Validate review fixes
        run: |
          python -m unittest -v \
            host/tests/test_collect_capabilities.py \
            host/tests/test_finalize_capability_report.py
          python tools/check_phase0c_scaffold.py

      - name: Commit exact reviewed fixes
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git add \
            host/scripts/collect_capabilities.py \
            host/tests/test_collect_capabilities.py \
            .github/workflows/phase0c-fix-host-review.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Phase 0C: fix host collector review findings"
          git push origin "HEAD:${HEAD_BRANCH}"
