name: D08 Task4 Clippy Diagnostic

on:
  push:
    branches:
      - d08-application-platform-expansion
    paths:
      - .github/workflows/d08-task4-clippy-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Apply existing Task4 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path

          text = Path('.github/workflows/d08-tdd.yml').read_text()
          match = re.search(r'^\s*D08_PATCH_B64:\s*([A-Za-z0-9+/=]+)\s*$', text, re.MULTILINE)
          if match is None:
              raise SystemExit('D08_PATCH_B64 not found')
          Path('/tmp/d08_task4_patch.py').write_bytes(base64.b64decode(match.group(1)))
          PY
          python3 /tmp/d08_task4_patch.py
      - name: Apply structural Task4 lint corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          snapshot = Path('crates/ptah-application-runtime/src/snapshot.rs')
          text = snapshot.read_text()
          replacements = [
              ('        session: ApplicationSessionProjection,\n', '        session: Box<ApplicationSessionProjection>,\n'),
              ('        display: Option<DisplaySessionProjection>,\n', '        display: Option<Box<DisplaySessionProjection>>,\n'),
              ('        application_revision_ref: EntityRef,\n', '        application_revision_ref: Box<EntityRef>,\n'),
              ('        requirement: RemoteNodeRequirement,\n', '        requirement: Box<RemoteNodeRequirement>,\n'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected snapshot field: {old.strip()}')
              text = text.replace(old, new)
          snapshot.write_text(text)

          test = Path('services/ptah-control/tests/d08_application_projection.rs')
          text = test.read_text()
          for old, new in [
              ('session: session("running", "full"),', 'session: Box::new(session("running", "full")),'),
              ('session: session("degraded", "headless_only"),', 'session: Box::new(session("degraded", "headless_only")),'),
              ('session: session("preparing", "unavailable"),', 'session: Box::new(session("preparing", "unavailable")),'),
              ('application_revision_ref: serde_json::from_value(entity("application.revision", 19))\n            .expect("application revision ref"),', 'application_revision_ref: Box::new(\n            serde_json::from_value(entity("application.revision", 19))\n                .expect("application revision ref"),\n        ),'),
              ('requirement: remote_requirement(),', 'requirement: Box::new(remote_requirement()),'),
          ]:
              if old not in text:
                  raise SystemExit(f'missing expected constructor: {old}')
              text = text.replace(old, new)
          test.write_text(text)

          control = Path('services/ptah-control/src/lib.rs')
          lines = control.read_text().splitlines()
          output = []
          context = None

          def documented() -> bool:
              for prior in reversed(output):
                  stripped = prior.strip()
                  if not stripped:
                      continue
                  if stripped.startswith('#['):
                      continue
                  return stripped.startswith('///')
              return False

          def words_from_variant(name: str) -> str:
              return re.sub(r'(?<!^)(?=[A-Z])', ' ', name).lower()

          for line in lines:
              if context is None:
                  if re.match(r'^pub\s+struct\s+.+\{\s*$', line):
                      context = 'struct'
                  elif re.match(r'^pub\s+enum\s+.+\{\s*$', line):
                      context = 'enum'
              elif line == '}':
                  context = None

              if context == 'struct':
                  match = re.match(r'^(\s+)pub\s+([A-Za-z_][A-Za-z0-9_]*)\s*:', line)
                  if match and not documented():
                      label = match.group(2).replace('_', ' ')
                      output.append(f'{match.group(1)}/// Human-visible {label} carried by this projection.')
              elif context == 'enum':
                  match = re.match(r'^(\s{4})([A-Z][A-Za-z0-9_]*)(?:\s*\(|\s*\{|\s*,)', line)
                  if match and not documented():
                      label = words_from_variant(match.group(2))
                      output.append(f'{match.group(1)}/// Represents {label}.')

              output.append(line)

          control.write_text('\n'.join(output) + '\n')
          PY
          cargo fmt --all
          git diff --check
      - name: Capture strict Clippy diagnostic
        shell: bash
        run: |
          set -uo pipefail
          set +e
          cargo clippy -p ptah-application-runtime -p ptah-control --all-targets --locked -- -D warnings -W clippy::pedantic 2>&1 | tee /tmp/d08-task4-clippy.txt
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            cp /tmp/d08-task4-clippy.txt d08-task4-clippy-diagnostic.txt
            git config user.name 'THE TECH GUY'
            git config user.email '65334711+jaydumisuni@users.noreply.github.com'
            git add -f d08-task4-clippy-diagnostic.txt
            git commit -m 'diag(d08): capture strict task4 clippy failure'
            git push origin HEAD:d08-application-platform-expansion
          fi
          exit "$status"
