name: C01 disk image partition foundations exact-head proof

on:
  pull_request:
    paths:
      - "C01_DISK_IMAGE_PARTITION_FOUNDATIONS.md"
      - "crates/ptah-archive-decomposition/Cargo.toml"
      - "crates/ptah-archive-decomposition/src/lib.rs"
      - "crates/ptah-archive-decomposition/src/c01.rs"
      - "crates/ptah-archive-decomposition/tests/c01.rs"
      - ".github/workflows/c01-disk-image-partition-foundations.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PTAH_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PTAH_PR_BASE: ${{ github.event.pull_request.base.sha }}
  PTAH_C01_BASE_SHA: d6c0663a7a9c46c2d12dc9a4ce3bd404b5ffc710
  CARGO_TERM_COLOR: always

jobs:
  c01-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact C01 candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PTAH_EXACT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Lock accepted B07 base and six-file C01 scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PTAH_EXACT_SHA"
          test -z "$(git status --porcelain)"
          if [ -n "${PTAH_PR_BASE:-}" ]; then
            test "$PTAH_PR_BASE" = "$PTAH_C01_BASE_SHA"
          fi
          test "$(git merge-base "$PTAH_C01_BASE_SHA" "$PTAH_EXACT_SHA")" = "$PTAH_C01_BASE_SHA"
          python3 - <<'PY'
          import os
          import subprocess

          base = os.environ["PTAH_C01_BASE_SHA"]
          head = os.environ["PTAH_EXACT_SHA"]
          files = subprocess.check_output(
              ["git", "diff", "--name-only", base, head], text=True
          ).splitlines()
          allowed = {
              "C01_DISK_IMAGE_PARTITION_FOUNDATIONS.md",
              "crates/ptah-archive-decomposition/Cargo.toml",
              "crates/ptah-archive-decomposition/src/lib.rs",
              "crates/ptah-archive-decomposition/src/c01.rs",
              "crates/ptah-archive-decomposition/tests/c01.rs",
              ".github/workflows/c01-disk-image-partition-foundations.yml",
          }
          unexpected = sorted(set(files).difference(allowed))
          missing = sorted(allowed.difference(files))
          assert not unexpected, f"C01 scope drift: {unexpected}"
          assert not missing, f"C01 required surface missing: {missing}"
          PY
          git diff --check "$PTAH_C01_BASE_SHA" "$PTAH_EXACT_SHA"

      - name: Install pinned Rust 1.97.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/c01
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
          rustc -Vv | tee /tmp/c01/rustc-version.txt
          cargo -V | tee /tmp/c01/cargo-version.txt
          rustc -V | grep -q '^rustc 1.97.1 '
          cargo -V | grep -q '^cargo 1.97.1 '
          printf '%s\n' "$PTAH_EXACT_SHA" > /tmp/c01/exact-head.txt
          cat /etc/os-release > /tmp/c01/host-os-release.txt

      - name: Prove formatting and 20-case C01 acceptance
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p ptah-archive-decomposition --test c01 --locked -- --nocapture \
            2>&1 | tee /tmp/c01/c01-tests.txt
          grep -Eq 'test result: ok\. 20 passed; 0 failed;' /tmp/c01/c01-tests.txt

      - name: Prove C01 surface with strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p ptah-archive-decomposition --lib --test c01 --locked -- -D warnings \
            2>&1 | tee /tmp/c01/c01-clippy.txt

      - name: Re-prove inherited B02 decomposition semantics
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ptah-archive-decomposition --test b02 --locked -- --nocapture \
            2>&1 | tee /tmp/c01/b02-tests.txt

      - name: Re-prove inherited B05 executable and package semantics
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ptah-archive-decomposition --test b05 --locked -- --nocapture \
            2>&1 | tee /tmp/c01/b05-tests.txt
          grep -Eq 'test result: ok\. 15 passed; 0 failed;' /tmp/c01/b05-tests.txt

      - name: Re-prove inherited B07 Object World search semantics
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ptah-archive-decomposition --test b07 --locked -- --nocapture \
            2>&1 | tee /tmp/c01/b07-tests.txt
          grep -Eq 'test result: ok\. 14 passed; 0 failed;' /tmp/c01/b07-tests.txt
          cargo test -p ptah-archive-decomposition --lib b07::tests --locked -- --nocapture \
            2>&1 | tee /tmp/c01/b07-boundary-tests.txt
          grep -Eq 'test result: ok\. 2 passed; 0 failed;' /tmp/c01/b07-boundary-tests.txt

      - name: Re-prove full locked workspace at exact C01 head
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --locked -- --nocapture \
            2>&1 | tee /tmp/c01/workspace-tests.txt

      - name: Write exact-head C01 proof manifest
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cp C01_DISK_IMAGE_PARTITION_FOUNDATIONS.md /tmp/c01/acceptance-contract.md
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('/tmp/c01')
          required = [
              'exact-head.txt',
              'host-os-release.txt',
              'rustc-version.txt',
              'cargo-version.txt',
              'c01-tests.txt',
              'c01-clippy.txt',
              'b02-tests.txt',
              'b05-tests.txt',
              'b07-tests.txt',
              'b07-boundary-tests.txt',
              'workspace-tests.txt',
              'acceptance-contract.md',
          ]
          files = {}
          for name in required:
              path = root / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'missing C01 proof report: {name}')
              files[name] = {
                  'size_bytes': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              }

          head = (root / 'exact-head.txt').read_text(encoding='utf-8').strip()
          if head != os.environ['PTAH_EXACT_SHA']:
              raise SystemExit('C01 proof head mismatch')

          manifest = {
              'schema_version': '0.1.0',
              'record_type': 'ptah.c01.disk_image_partition_foundations_exact_head_proof',
              'status': 'pass',
              'implementation_commit': head,
              'accepted_base_commit': os.environ['PTAH_C01_BASE_SHA'],
              'workflow_run_id': int(os.environ['RUN_ID']),
              'workflow_run_attempt': int(os.environ['RUN_ATTEMPT']),
              'c01_acceptance_test_count': 20,
              'source_image_immutable': True,
              'exact_block_range_coverage_proven': True,
              'corrupt_maps_remain_partial_or_inconclusive': True,
              'sparse_preallocation_bounds_proven': True,
              'gpt_usable_lba_enforced': True,
              'report_integrity_seal_proven': True,
              'registration_source_revision_recheck_proven': True,
              'comparison_uncertainty_proven': True,
              'layout_unallocated_vs_unknown_proven': True,
              'read_only_materialization_proven': True,
              'a07_object_relationship_view_plans_proven': True,
              'inherited_b02_reproven': True,
              'inherited_b05_reproven': True,
              'inherited_b07_reproven': True,
              'filesystem_semantics_not_claimed': True,
              'files': files,
          }
          rendered = json.dumps(manifest, indent=2, sort_keys=True) + '\n'
          (root / 'proof-manifest.json').write_text(rendered, encoding='utf-8')
          digest = hashlib.sha256(rendered.encode()).hexdigest()
          (root / 'proof-manifest.sha256').write_text(
              f'{digest}  proof-manifest.json\n', encoding='utf-8'
          )
          print(rendered, end='')
          PY
          cd /tmp/c01
          sha256sum -c proof-manifest.sha256

      - name: Confirm exact clean C01 candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PTAH_EXACT_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Retain C01 proof bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: c01-disk-image-partition-foundations-${{ env.PTAH_EXACT_SHA }}
          path: /tmp/c01/
          if-no-files-found: error
          retention-days: 90
