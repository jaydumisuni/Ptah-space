name: Temporary ATHENA Oracle Wrapper Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-oracle-runner-registry.yml"

permissions:
  contents: read

jobs:
  diagnose-athena-wrapper:
    runs-on: [self-hosted, athena, ptah]
    timeout-minutes: 5
    steps:
      - name: Execute exact installed Oracle wrapper
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:LOCALAPPDATA 'OracleNode'
          $wrapper=Join-Path $root 'start-oracle-node.cmd'
          if(-not(Test-Path $wrapper)){throw 'ORACLE_WRAPPER_MISSING'}

          foreach($name in @('Oracle Always-On Node','Oracle Node Watchdog','Oracle Live Node (Session Fallback)','Oracle Node Watchdog (Session Fallback)')){
            $t=Get-ScheduledTask -TaskName $name -ErrorAction SilentlyContinue
            if($t){Disable-ScheduledTask -InputObject $t -ErrorAction SilentlyContinue|Out-Null; if([string]$t.State -in @('Running','Queued')){Stop-ScheduledTask -InputObject $t -ErrorAction SilentlyContinue|Out-Null}}
          }
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -match 'oracle-live-node\.mjs|oracle-node-watchdog-windows\.mjs' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 1

          Write-Output '--- wrapper ---'
          Get-Content -Raw $wrapper
          Write-Output '--- session task definition ---'
          $t=Get-ScheduledTask -TaskName 'Oracle Live Node (Session Fallback)' -ErrorAction SilentlyContinue
          if($t){
            [ordered]@{State=[string]$t.State;Actions=$t.Actions;Principal=$t.Principal;Triggers=$t.Triggers} | ConvertTo-Json -Depth 8
          }

          $job=Start-Job -ScriptBlock { param($w) & $w } -ArgumentList $wrapper
          try{
            Start-Sleep -Seconds 6
            Write-Output ('JOB_STATE='+$job.State)
            Write-Output '--- 5059 TCP ---'
            Get-NetTCPConnection -LocalPort 5059 -ErrorAction SilentlyContinue | Select-Object LocalAddress,LocalPort,State,OwningProcess | Format-Table -AutoSize
            foreach($u in @('http://127.0.0.1:5059/health','http://127.0.0.1:5059/ready')){
              try{$r=Invoke-WebRequest -UseBasicParsing -Uri $u -TimeoutSec 3; Write-Output ($u+' STATUS='+$r.StatusCode+' BODY='+$r.Content)}catch{Write-Output ($u+' ERROR '+$_.Exception.Message)}
            }
            Write-Output '--- wrapper output ---'
            Receive-Job -Job $job -Keep -ErrorAction Continue
            Write-Output '--- matching process ---'
            Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -match 'oracle-live-node\.mjs' } | Select-Object ProcessId,Name,CommandLine | Format-List
          } finally {
            Stop-Job -Job $job -ErrorAction SilentlyContinue
            Remove-Job -Job $job -Force -ErrorAction SilentlyContinue
            Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -match 'oracle-live-node\.mjs' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }
