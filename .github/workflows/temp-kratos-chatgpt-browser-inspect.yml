name: TEMP KRATOS ChatGPT Browser Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-kratos-chatgpt-browser-inspect.yml'

jobs:
  inspect:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 5
    steps:
      - name: Inspect existing browser and Oracle bridge
        shell: bash
        run: |
          set -euo pipefail
          echo '=== HOST ==='
          hostname
          whoami
          echo '=== BROWSER PROCESSES ==='
          ps -eo pid=,args= | grep -Ei 'google-chrome|chromium' | grep -v grep || true
          echo '=== DISPLAY ENV FROM BROWSER ==='
          pid="$(pgrep -n -f 'google-chrome|chromium' || true)"
          if [ -n "$pid" ] && [ -r "/proc/$pid/environ" ]; then
            tr '\0' '\n' < "/proc/$pid/environ" | grep -E '^(DISPLAY|XAUTHORITY|WAYLAND_DISPLAY|DBUS_SESSION_BUS_ADDRESS)=' || true
          fi
          echo '=== ORACLE BRIDGE ==='
          curl -fsS --max-time 5 http://127.0.0.1:8765/health || true
          echo
          echo '=== NATIVE HOST MANIFESTS ==='
          find "$HOME/.config/google-chrome" "$HOME/.config/chromium" /etc/opt/chrome /etc/chromium 2>/dev/null -type f -name 'com.thetechguy.oracle.json' -print -exec sed -n '1,120p' {} \; || true
          echo '=== CHROME PROFILES / EXTENSIONS ==='
          python3 - <<'PY'
          import json, pathlib
          home=pathlib.Path.home()
          for root in [home/'.config/google-chrome', home/'.config/chromium']:
              if not root.exists():
                  continue
              print('ROOT', root)
              for p in root.iterdir():
                  pref=p/'Preferences'
                  if not pref.is_file():
                      continue
                  print('PROFILE', p.name)
                  try:
                      data=json.loads(pref.read_text(errors='ignore'))
                  except Exception as e:
                      print('PREF_ERROR', type(e).__name__)
                      continue
                  settings=((data.get('extensions') or {}).get('settings') or {})
                  for ext_id, cfg in settings.items():
                      path=str(cfg.get('path') or '')
                      state=cfg.get('state')
                      if 'oracle' in path.lower() or path or state:
                          print('EXT', ext_id, 'state=', state, 'path=', path, 'from_webstore=', cfg.get('from_webstore'))
          PY
