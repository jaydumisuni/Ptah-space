name: D08 Promote Proven Lock Once

on:
  push:
    branches:
      - d08-application-platform-expansion
    paths:
      - .github/workflows/d08-promote-lock-once.yml

permissions:
  actions: read
  contents: write

jobs:
  promote-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d08-application-platform-expansion
      - name: Download proven Task 1 lock artifact
        uses: actions/download-artifact@v4
        with:
          name: d08-generated-lock-808315e5e1dbc2bd0f76ed44a052c52613e19f61
          path: ${{ runner.temp }}/d08-lock
          github-token: ${{ github.token }}
          repository: jaydumisuni/Ptah-space
          run-id: 33812117043
      - name: Promote exact artifact Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/d08-lock/Cargo.lock"
          cp "$RUNNER_TEMP/d08-lock/Cargo.lock" Cargo.lock
          git diff --check -- Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "LOCK_ALREADY_CURRENT"
            exit 0
          fi
          git commit -m "chore(d08): promote proven Cargo lock"
          git push origin HEAD:d08-application-platform-expansion
