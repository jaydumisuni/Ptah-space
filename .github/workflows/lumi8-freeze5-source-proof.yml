name: Lumi issue 8 Freeze 5 source proof

on:
  push:
    branches:
      - proof/lumi8-athena-runner-20260904
    paths:
      - .github/workflows/lumi8-freeze5-source-proof.yml

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: [self-hosted, athena, windows, x64, physical, ptah]
    timeout-minutes: 50
    steps:
      - name: Prepare exact Builder Freeze 5 worktree
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $source='D:\projects\Lumi-Builder-Final-face8'
          $target='D:\projects\Lumi-Builder-Freeze5-20260904'
          $builder='cf7331a59851cec7ea07152bfae6f6f508ba3788'
          if(-not(Test-Path -LiteralPath (Join-Path $source '.git'))){throw 'BUILDER_SOURCE_CHECKOUT_MISSING'}
          git -C $source -c "safe.directory=$source" fetch origin $builder
          if($LASTEXITCODE -ne 0){throw 'BUILDER_FREEZE_FETCH_FAILED'}
          if(Test-Path -LiteralPath $target){
            $head=(git -C $target -c "safe.directory=$target" rev-parse HEAD 2>$null)
            if($LASTEXITCODE -ne 0 -or $head.Trim() -ne $builder){throw ('EXISTING_TARGET_NOT_FREEZE5 '+$head)}
            $status=@(git -C $target -c "safe.directory=$target" status --porcelain --untracked-files=no)
            if($LASTEXITCODE -ne 0 -or $status.Count -ne 0){throw ('EXISTING_TARGET_DIRTY '+($status -join ';'))}
          } else {
            git -C $source -c "safe.directory=$source" worktree add --detach $target $builder
            if($LASTEXITCODE -ne 0){throw 'BUILDER_FREEZE_WORKTREE_FAILED'}
          }
          $actual=(git -C $target -c "safe.directory=$target" rev-parse HEAD).Trim()
          if($actual -ne $builder){throw ('WRONG_BUILDER_FREEZE '+$actual)}
          $sourceEnv=Join-Path $source 'env'
          $targetEnv=Join-Path $target 'env'
          if(-not(Test-Path -LiteralPath (Join-Path $sourceEnv 'python\.venv\Scripts\python.exe'))){throw 'BUILDER_ENV_SOURCE_MISSING'}
          if(-not(Test-Path -LiteralPath (Join-Path $targetEnv 'python\.venv\Scripts\python.exe'))){
            New-Item -ItemType Directory -Force -Path $targetEnv | Out-Null
            robocopy $sourceEnv $targetEnv /E /COPY:DAT /R:1 /W:1 /NFL /NDL /NJH /NJS /NP
            if($LASTEXITCODE -ge 8){throw ('BUILDER_ENV_COPY_FAILED '+$LASTEXITCODE)}
          }
          Write-Output ('BUILDER_FREEZE5=' + $actual)
          Write-Output ('BUILDER_ROOT=' + $target)

      - name: Run exact Lumi source UI proof
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $target='D:\projects\Lumi-Builder-Freeze5-20260904'
          Push-Location $target
          try {
            & cmd.exe /d /c '.\Run-Lumi-Source-UI-Proof.bat'
            $rc=$LASTEXITCODE
          } finally { Pop-Location }
          if($rc -ne 0){throw ('LUMI_SOURCE_UI_PROOF_FAILED '+$rc)}
          $summary=Join-Path $target 'test-output\lumi-issue8-source-ui\lumi-issue8-source-ui-summary.json'
          if(-not(Test-Path -LiteralPath $summary)){throw 'SOURCE_SUMMARY_MISSING'}
          $s=Get-Content -Raw -LiteralPath $summary|ConvertFrom-Json
          if($s.lumi_commit -ne 'face8f787550853f12ed23986beb3b951b27697f'){throw ('WRONG_LUMI_SOURCE '+$s.lumi_commit)}
          if(-not $s.playwright_main_passed -or -not $s.visual_sweep_passed){throw 'SOURCE_UI_PROOF_NOT_GREEN'}
          $s|ConvertTo-Json -Depth 20|Write-Output

      - name: Stage source-proof artifact
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='D:\projects\Lumi-Builder-Freeze5-20260904\test-output\lumi-issue8-source-ui'
          $dst=Join-Path $env:RUNNER_TEMP 'lumi8-source-proof-artifact'
          Remove-Item -LiteralPath $dst -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dst|Out-Null
          Copy-Item -LiteralPath (Join-Path $src 'lumi-issue8-source-ui-summary.json') -Destination $dst -Force
          Copy-Item -LiteralPath (Join-Path $src 'artifacts') -Destination $dst -Recurse -Force
          Get-ChildItem -LiteralPath $dst -Recurse -File | ForEach-Object { Write-Output ($_.FullName + '|' + $_.Length) }

      - name: Upload exact source screenshots and summary
        uses: actions/upload-artifact@v4
        with:
          name: lumi8-freeze5-source-proof
          path: ${{ runner.temp }}\lumi8-source-proof-artifact
          if-no-files-found: error
          retention-days: 7
