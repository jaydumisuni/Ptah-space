name: PS4 persistent console proof

on:
  push:
    branches:
      - "feature/ps4-simulated-console-20261003"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/ptah-console-sim/**"
      - ".github/workflows/ps4-persistent-console-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ps4-console:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1

      - name: Strict crate proof
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p ptah-console-sim --locked -- --nocapture
          cargo clippy -p ptah-console-sim --all-targets --locked -- -D warnings

      - name: Prove one console across full firmware matrix
        shell: bash
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/ps4-console.json"
          versions=(11.00 11.50 12.00 12.02 12.50 12.52 13.00 13.02 13.04 13.50 13.52)
          for fw in "${versions[@]}"; do
            cargo run -q -p ptah-console-sim --bin ptah-ps4-sim -- \
              --state "$state" --firmware "$fw" > "$RUNNER_TEMP/boot-$fw.json"
          done

          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          versions=["11.00","11.50","12.00","12.02","12.50","12.52",
                    "13.00","13.02","13.04","13.50","13.52"]
          expected_engines=[
              "lapse","lapse","lapse","lapse",
              "poops","poops","poops",
              "raw13g-663","raw13g-663","raw13g-663","raw13g-663",
          ]
          boots=[json.loads((root/f"boot-{fw}.json").read_text()) for fw in versions]
          ids=[boot["device_ref"]["entity_id"] for boot in boots]
          assert len(set(ids)) == 1, ids
          assert [boot["firmware"] for boot in boots] == versions
          assert [boot["profile_revision_ref"]["record_revision"] for boot in boots] == list(range(1,12))
          assert [boot["boot_generation"] for boot in boots] == list(range(1,12))
          assert [boot["profile"]["engine"] for boot in boots] == expected_engines
          print("ONE_CONSOLE_IDENTITY=PASS")
          print("FIRMWARE_COUNT=11")
          print("PROFILE_REVISIONS=1..11")
          print("BOOT_GENERATIONS=1..11")
          print("ENGINE_TRANSITIONS=lapse->poops->raw13g-663")
          PY

      - name: Prove blocked firmware cannot mutate console
        shell: bash
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/ps4-console.json"
          cp "$state" "$RUNNER_TEMP/before-blocked.json"
          if cargo run -q -p ptah-console-sim --bin ptah-ps4-sim -- \
              --state "$state" --firmware 14.00; then
            echo "14.00 unexpectedly booted" >&2
            exit 1
          fi
          cmp "$RUNNER_TEMP/before-blocked.json" "$state"
          echo "BLOCKED_FIRMWARE_MUTATION=0"
