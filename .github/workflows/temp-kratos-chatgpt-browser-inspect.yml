name: TEMP KRATOS Oracle extension ChatGPT inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-kratos-chatgpt-browser-inspect.yml'

jobs:
  inspect:
    runs-on: [self-hosted, kratos, linux, x64, physical, ptah]
    timeout-minutes: 5
    steps:
      - name: Inspect existing ChatGPT session through Oracle extension bridge
        shell: bash
        run: |
          set -euo pipefail
          bridge='http://127.0.0.1:8765'
          token_file="$HOME/.local/state/OracleBrowserBridge/agent-token.txt"
          test -s "$token_file"
          token="$(cat "$token_file")"
          test "${#token}" -ge 20

          echo '=== EXTENSION BRIDGE HEALTH ==='
          health="$(curl -fsS --max-time 5 "$bridge/health")"
          printf '%s\n' "$health"
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True; assert d.get("browserConnected") is True, d' <<<"$health"

          command() {
            local body="$1"
            curl -fsS --max-time 30 -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data "$body" "$bridge/command"
          }

          echo '=== TABS ==='
          tabs="$(command '{"command":{"type":"getTabs"},"approved":false,"timeoutMs":20000}')"
          printf '%s\n' "$tabs" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({"ok":d.get("ok"),"tabs":[{"id":x.get("id"),"title":x.get("title"),"url":x.get("url"),"active":x.get("active")} for x in d.get("tabs",[])]},indent=2))'

          chat_tab="$(printf '%s\n' "$tabs" | python3 -c 'import json,sys; d=json.load(sys.stdin); ts=d.get("tabs",[]); ms=[x for x in ts if "chatgpt.com" in str(x.get("url","")).lower() or "chat.openai.com" in str(x.get("url","")).lower()]; print(ms[0].get("id","") if ms else "")')"
          test -n "$chat_tab"
          echo "CHATGPT_TAB_ID=$chat_tab"

          echo '=== CHATGPT SEMANTIC OBSERVATION ==='
          body="$(python3 - "$chat_tab" <<'PY'
import json,sys
print(json.dumps({"command":{"type":"observe","tabId":int(sys.argv[1]),"options":{"accessibility":False,"domSnapshot":False,"screenshot":False}},"approved":False,"timeoutMs":30000}))
PY
)"
          obs="$(command "$body")"
          printf '%s\n' "$obs" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True,d; o=d.get("observation") or {}; p=o.get("page") or {}; out={"ok":True,"tab":o.get("tab"),"authority":o.get("authority"),"visibility":o.get("visibility"),"page":{"url":p.get("url"),"title":p.get("title"),"text":str(p.get("text") or "")[:12000],"headings":p.get("headings",[])[:80],"elements":p.get("elements",[])[:200]}}; print(json.dumps(out,indent=2))'
          echo 'ORACLE_EXTENSION_CHATGPT_INSPECT=PASS'
