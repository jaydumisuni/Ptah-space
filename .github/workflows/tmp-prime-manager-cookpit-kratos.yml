name: tmp-prime-manager-cookpit-kratos

on:
  push:
    branches:
      - tmp/prime-manager-cookpit-kratos-20260913

jobs:
  diagnose-base07:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 15
    steps:
      - name: Checkout Prime Manager review payload
        uses: actions/checkout@v4
        with:
          ref: tmp/prime-manager-review-payload-20260913
          path: payload
      - name: Verify malformed base_07 prefix
        shell: bash
        run: |
          set -euo pipefail
          D="$GITHUB_WORKSPACE/payload/tmp/prime-manager-review"
          cd "$D"
          echo '=== base_07 full ==='
          wc -c base_07
          sha256sum base_07
          echo '=== base_07 first 12000 ==='
          head -c 12000 base_07 > /tmp/base_07.prefix
          wc -c /tmp/base_07.prefix
          sha256sum /tmp/base_07.prefix
          echo 'expected aea95ff13b3fc82ff08c12f94d3a30901a4305ad7fe7031785c33946794380c5'
          echo '=== reconstructed with corrected prefix ==='
          cat base_00 base_01 base_02 base_03 base_04 base_05 base_06 /tmp/base_07.prefix base_08 > /tmp/roadmap.corrected
          wc -c /tmp/roadmap.corrected
          sha256sum /tmp/roadmap.corrected
          echo 'expected 65d754df5f9d5bbca74f3385945d01486845fa255cc44f9c2cf32ca29c521dc3'
