name: TEMP KRATOS Redmi sky partition-region topology map

# activation: v5
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-kratos-chatgpt-browser-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, kratos, linux, x64, physical, ptah]
    timeout-minutes: 10
    steps:
      - name: Map partition fingerprints and regional concentration read-only
        shell: bash
        run: |
          set -euo pipefail
          ADB="$(command -v adb || true)"
          if [[ -z "$ADB" && -x /home/kratos/.local/share/mibu-platform-tools/current/platform-tools/adb ]]; then
            ADB=/home/kratos/.local/share/mibu-platform-tools/current/platform-tools/adb
          fi
          test -x "$ADB"
          "$ADB" start-server >/dev/null
          "$ADB" get-state

          echo '=== HOST ROUTES BEFORE ==='
          ip route show default || true

          echo '=== PARTITION BUILD FINGERPRINTS ==='
          "$ADB" shell 'for k in ro.build.fingerprint ro.system.build.fingerprint ro.product.build.fingerprint ro.system_ext.build.fingerprint ro.vendor.build.fingerprint ro.odm.build.fingerprint ro.bootimage.build.fingerprint; do printf "%s=" "$k"; getprop "$k"; done'

          echo '=== PARTITION BUILD INCREMENTALS ==='
          "$ADB" shell 'for p in system product system_ext vendor odm bootimage; do for s in version.incremental version.release security_patch date.utc; do k="ro.${p}.build.${s}"; printf "%s=" "$k"; getprop "$k"; done; done'

          echo '=== PRODUCT IDENTITY BY PARTITION ==='
          "$ADB" shell 'for p in system product system_ext vendor odm; do for s in brand name device manufacturer model; do k="ro.product.${p}.${s}"; printf "%s=" "$k"; getprop "$k"; done; done'

          echo '=== REGION / MIUI PROPERTIES BY SOURCE ==='
          "$ADB" shell 'getprop | grep -E "^\[ro\.(product\.|vendor\.|system\.|system_ext\.|odm\.)?miui\.|^\[ro\.miui\." | sort | head -n 320 || true'

          echo '=== KEY MOUNTS ==='
          "$ADB" shell 'mount 2>/dev/null | grep -E " on /(system|product|system_ext|vendor|odm|cust|opconfig)( |/)" | head -n 120 || true; echo --; cat /proc/mounts 2>/dev/null | grep -E " /(system|product|system_ext|vendor|odm|cust|opconfig)( |/)" | head -n 120 || true'

          echo '=== BLOCK DEVICE NAMES ==='
          "$ADB" shell 'ls -l /dev/block/by-name 2>/dev/null | grep -E " (super|cust|opcust|product|system|system_ext|vendor|odm)(_[ab])?$" | head -n 120 || true'

          echo '=== DYNAMIC PARTITION SUMMARY ==='
          "$ADB" shell 'if command -v lpdump >/dev/null 2>&1; then lpdump 2>/dev/null | grep -E "^(Metadata version|Metadata size|Metadata max size|Metadata slot count|Partition name:|Group name:|Group maximum size:|Block device table:)" | head -n 260; else echo lpdump_unavailable; fi'

          echo '=== POST-PROBE ==='
          "$ADB" get-state
          ip route show default || true
          echo 'TTG_REDMI_PARTITION_REGION_TOPOLOGY=PASS'
