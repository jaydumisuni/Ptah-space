name: D07 Task 5 Corrected Retry

on:
  push:
    branches:
      - d07-security-evidence-reproduction
    paths:
      - .github/workflows/d07-task5-retry.yml

permissions:
  contents: write

jobs:
  task5-retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: d07-security-evidence-reproduction
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Recover corrected RED and implementation scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path('.github/workflows/d07-task5-proof.yml').read_text().splitlines()

          def extract(step_name, next_step):
              start = next(i for i, line in enumerate(text) if line.strip() == f'- name: {step_name}')
              end = next(i for i, line in enumerate(text[start + 1:], start + 1) if line.strip() == f'- name: {next_step}')
              run = next(i for i in range(start, end) if text[i].strip() == 'run: |')
              lines = text[run + 1:end]
              return '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          red = extract('Add cases 20 through 23 RED', 'Implement remediation and post-fix verification')
          red = red.replace(
              'assert_ne!(patch.path_alias.as_deref(), Some(&patch_object.entity_id.to_string()));',
              'assert_eq!(patch.path_alias.as_deref(), Some("/workspace/src/lib.rs"));',
          )
          Path('/tmp/d07-task5-red.sh').write_text(red)
          Path('/tmp/d07-task5-impl.sh').write_text(
              extract('Implement remediation and post-fix verification', 'Prove cases 20 through 23 GREEN')
          )
          PY
          chmod +x /tmp/d07-task5-red.sh /tmp/d07-task5-impl.sh
      - name: Execute corrected RED
        run: /tmp/d07-task5-red.sh
      - name: Implement Task 5
        run: /tmp/d07-task5-impl.sh
      - name: Prove cases 20 through 23 GREEN
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p ptah-security-evidence --test d07_acceptance --locked
          test "$(cargo test -p ptah-security-evidence --test d07_acceptance --locked -- --list 2>/dev/null | grep -c ': test$')" -eq 23
          cargo test -p ptah-security-evidence --locked
          cargo clippy -p ptah-security-evidence --all-targets --locked -- -D warnings -W clippy::pedantic
          ! grep -R -n -E '#\[(allow|expect)\(' crates/ptah-security-evidence
          ! grep -R -n 'prove_operation_succeeded' crates/ptah-security-evidence/src/remediation.rs
      - name: Commit proven Task 5
        run: |
          git config user.name "TENFOLD Foreman"
          git config user.email "jaydumi12@gmail.com"
          git add crates/ptah-security-evidence
          git commit -m "feat(d07): add remediation verification evidence"
          git push origin HEAD:d07-security-evidence-reproduction
