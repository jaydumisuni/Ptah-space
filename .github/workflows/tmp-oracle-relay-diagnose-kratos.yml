name: Temporary diagnose Oracle relay on KRATOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-oracle-relay-diagnose-kratos.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Read recovery child state
        shell: bash
        run: |
          set -euo pipefail
          root="${XDG_STATE_HOME:-$HOME/.local/state}/OracleRelay"
          python3 - <<'PY'
          import json,os,pathlib,subprocess,socket,datetime
          root=pathlib.Path(os.environ.get('XDG_STATE_HOME',str(pathlib.Path.home()/'.local/state')))/'OracleRelay'
          def read(p):
              try:return json.loads(p.read_text())
              except Exception as e:return {'missing':not p.exists(),'error':str(e)}
          def run(args):
              r=subprocess.run(args,text=True,capture_output=True)
              return {'rc':r.returncode,'stdout':r.stdout[-10000:],'stderr':r.stderr[-10000:]}
          out={
            'schemaVersion':'oracle.recovery.kratos.diagnose.v1',
            'host':socket.gethostname(),
            'service':run(['systemctl','--user','show','oracle-recovery-relay.service','-p','ActiveState','-p','SubState','-p','Result','-p','MainPID','--no-pager']),
            'supervisor':read(root/'recovery-supervisor-status.json'),
            'relay':read(root/'repo'/'.oracle'/'relay-status.json'),
            'runtimeGit':run(['git','-C',str(root/'repo'),'status','--porcelain=v1','--untracked-files=all']),
            'journal':run(['journalctl','--user','-u','oracle-recovery-relay.service','-n','60','--no-pager']),
            'completedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          pathlib.Path('oracle-relay-diagnose.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - name: Publish diagnosis
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add oracle-relay-diagnose.json
          git commit -m 'recovery: publish KRATOS Oracle relay diagnosis'
          for i in 1 2 3 4 5; do git push origin HEAD:main && exit 0; git fetch origin main; git rebase origin/main; done
          exit 1
