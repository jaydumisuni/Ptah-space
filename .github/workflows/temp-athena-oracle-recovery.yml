name: TEMP Athena Oracle Recovery
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  inspect-tasks:
    runs-on: [self-hosted, Windows, athena]
    timeout-minutes: 5
    steps:
      - shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          foreach($name in @('Oracle Always-On Node','Oracle Node Watchdog','Oracle Live Node (Session Fallback)','Oracle Node Watchdog (Session Fallback)','Oracle Node Restart Helper','Oracle Recovery Relay')){
            Write-Output ('--- '+$name+' ---')
            $t=Get-ScheduledTask -TaskName $name -ErrorAction SilentlyContinue
            if(-not $t){Write-Output 'MISSING';continue}
            $i=Get-ScheduledTaskInfo -TaskName $name -ErrorAction SilentlyContinue
            [pscustomobject]@{
              TaskName=$name
              State=[string]$t.State
              Enabled=[bool]$t.Settings.Enabled
              RunLevel=[string]$t.Principal.RunLevel
              LogonType=[string]$t.Principal.LogonType
              UserId=[string]$t.Principal.UserId
              LastTaskResult=if($i){[int64]$i.LastTaskResult}else{$null}
              Action=@($t.Actions|ForEach-Object{[pscustomobject]@{Execute=$_.Execute;Arguments=$_.Arguments;WorkingDirectory=$_.WorkingDirectory}})
            }|ConvertTo-Json -Depth 5 -Compress
          }
