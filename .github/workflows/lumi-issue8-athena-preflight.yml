name: Lumi Issue 8 ATHENA Preflight

on:
  push:
    branches:
      - proof/lumi-issue8-athena-preflight

permissions:
  contents: read

jobs:
  athena-preflight:
    runs-on: [self-hosted, Windows, X64, athena, physical, ptah]
    timeout-minutes: 10
    steps:
      - name: Prove runner identity and active desktop
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]$identity
          $admin = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $proc = Get-Process -Id $PID
          $explorers = @(Get-Process explorer -ErrorAction SilentlyContinue)
          $computerUser = (Get-CimInstance Win32_ComputerSystem).UserName
          $groups = (whoami /groups | Out-String)
          $high = $groups -match 'High Mandatory Level|S-1-16-12288'

          Write-Host "COMPUTER=$env:COMPUTERNAME"
          Write-Host "USERNAME=$env:USERNAME"
          Write-Host "IDENTITY=$($identity.Name)"
          Write-Host "ADMIN=$admin"
          Write-Host "HIGH_INTEGRITY=$high"
          Write-Host "PROCESS_SESSION=$($proc.SessionId)"
          Write-Host "SESSIONNAME=$env:SESSIONNAME"
          Write-Host "CONSOLE_USER=$computerUser"
          foreach ($e in $explorers) {
            Write-Host "EXPLORER_SESSION=$($e.SessionId) PID=$($e.Id)"
          }
          $sameDesktop = @($explorers | Where-Object { $_.SessionId -eq $proc.SessionId }).Count -gt 0
          Write-Host "SAME_AS_EXPLORER=$sameDesktop"

          if (-not $admin) { Write-Error 'ATHENA-PTAH runner is not Administrator.' }
          if (-not $high) { Write-Error 'ATHENA-PTAH runner is not high-integrity.' }
          if (-not $sameDesktop) { Write-Error 'ATHENA-PTAH runner is not attached to the active Explorer desktop.' }

      - name: Recover exact Lumi and Builder paths read-only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'D:\projects')) { throw 'D:\projects is not present.' }

          Write-Host '--- matching top-level project directories ---'
          $dirs = @(Get-ChildItem 'D:\projects' -Directory -ErrorAction Stop | Where-Object { $_.Name -match 'Lumi|Builder|THETECHGUY' })
          $dirs | Sort-Object FullName | ForEach-Object { Write-Host $_.FullName }

          Write-Host '--- git candidates ---'
          foreach ($d in $dirs) {
            if (Test-Path (Join-Path $d.FullName '.git')) {
              $safe = $d.FullName.Replace('\','/')
              $head = (& git -c "safe.directory=$safe" -C $d.FullName rev-parse HEAD 2>$null)
              $remote = (& git -c "safe.directory=$safe" -C $d.FullName remote get-url origin 2>$null)
              Write-Host "GIT_DIR=$($d.FullName)"
              Write-Host "GIT_HEAD=$head"
              Write-Host "GIT_REMOTE=$remote"
            }
          }

          Write-Host '--- bounded package candidates ---'
          $roots = @($dirs | Where-Object { $_.Name -match 'Lumi|Builder' } | Select-Object -ExpandProperty FullName)
          foreach ($root in $roots) {
            Get-ChildItem $root -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -in @('Lumi DM Setup.exe','Lumi DM.zip','installer-report.json','installer-config.json','Lumi DM.exe') } |
              Sort-Object FullName |
              ForEach-Object {
                $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
                Write-Host "ARTIFACT=$($_.FullName) SHA256=$hash SIZE=$($_.Length)"
              }
          }
