name: TEMP KRATOS Redmi sky mi_ext/pangu provenance map

# activation: v6
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-kratos-chatgpt-browser-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, kratos, linux, x64, physical, ptah]
    timeout-minutes: 10
    steps:
      - name: Map mi_ext and pangu overlay provenance read-only
        shell: bash
        run: |
          set -euo pipefail
          ADB="$(command -v adb || true)"
          if [[ -z "$ADB" && -x /home/kratos/.local/share/mibu-platform-tools/current/platform-tools/adb ]]; then
            ADB=/home/kratos/.local/share/mibu-platform-tools/current/platform-tools/adb
          fi
          test -x "$ADB"
          "$ADB" start-server >/dev/null
          "$ADB" get-state

          echo '=== HOST ROUTES BEFORE ==='
          ip route show default || true

          echo '=== MI_EXT / PANGU MOUNTS ==='
          "$ADB" shell 'mount 2>/dev/null | grep -E "mi_ext|pangu" | head -n 180 || true; echo --; cat /proc/mounts 2>/dev/null | grep -E "mi_ext|pangu" | head -n 180 || true'

          echo '=== BLOCK / PROP IDENTITY ==='
          "$ADB" shell 'ls -l /dev/block/by-name 2>/dev/null | grep -Ei "mi_ext|pangu|cust|opcust|super" | head -n 160 || true; getprop | grep -Ei "mi_ext|pangu" | sort | head -n 160 || true'

          echo '=== MI_EXT TOP LEVEL ==='
          "$ADB" shell 'if [ -d /mnt/vendor/mi_ext ]; then find /mnt/vendor/mi_ext -maxdepth 3 -type d 2>/dev/null | sort | head -n 280; else echo MI_EXT_NOT_MOUNTED; fi'

          echo '=== MI_EXT REGION/GOOGLE/CN FILES ==='
          "$ADB" shell 'if [ -d /mnt/vendor/mi_ext ]; then find /mnt/vendor/mi_ext -maxdepth 5 -type f 2>/dev/null | grep -Ei "google|gms|vending|phonesky|setup|region|cust|china|/cn[._/-]|miui|xiaomi|preload|market|search|voice" | sort | head -n 360; fi'

          echo '=== MI_EXT APK INVENTORY ==='
          "$ADB" shell 'if [ -d /mnt/vendor/mi_ext ]; then find /mnt/vendor/mi_ext -maxdepth 6 -type f -name "*.apk" 2>/dev/null | sort | head -n 320; fi'

          echo '=== MI_EXT CONFIG TEXT REFERENCES ==='
          "$ADB" shell 'if [ -d /mnt/vendor/mi_ext ]; then find /mnt/vendor/mi_ext -maxdepth 6 -type f -size -524288c 2>/dev/null | sort | while IFS= read -r p; do m=$(grep -a -i -E "com\.google\.android\.gms|com\.google\.android\.gsf|com\.android\.vending|cn_chinatelecom|ro\.miui\.region|romRegion|currentSku|preload" "$p" 2>/dev/null | head -n 12); if [ -n "$m" ]; then echo "--- $p"; printf "%s\n" "$m"; fi; done; fi'

          echo '=== PANGU TOP LEVEL / APK INVENTORY ==='
          "$ADB" shell 'if [ -d /product/pangu ]; then find /product/pangu -maxdepth 4 -type d 2>/dev/null | sort | head -n 220; echo --APKS--; find /product/pangu -maxdepth 7 -type f -name "*.apk" 2>/dev/null | sort | head -n 260; else echo PANGU_NOT_PRESENT; fi'

          echo '=== SOURCE COUNTS ==='
          "$ADB" shell 'for root in /mnt/vendor/mi_ext /product/pangu /cust; do if [ -d "$root" ]; then printf "%s files=" "$root"; find "$root" -type f 2>/dev/null | wc -l; printf "%s apks=" "$root"; find "$root" -type f -name "*.apk" 2>/dev/null | wc -l; fi; done'

          echo '=== POST-PROBE ==='
          "$ADB" get-state
          ip route show default || true
          echo 'TTG_REDMI_MI_EXT_PANGU_PROVENANCE=PASS'
