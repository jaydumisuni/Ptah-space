name: Temporary installed Oracle recovery
on:
  push:
    branches: [recovery/oracle-074-desktop-20261126]
    paths: ['.github/workflows/temp-oracle-074-desktop-recovery.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, athena, Windows, X64, physical, ptah]
    timeout-minutes: 2
    steps:
      - name: Read pending update recovery evidence
        shell: powershell
        run: |
          $r='C:\Program Files (x86)\THETECHGUY Digital Solutions'
          $log=Join-Path $r 'Oracle-074-Recovery\result.log'
          if(Test-Path $log){Get-Content -LiteralPath $log -Tail 12}
          $task=Get-ScheduledTask -TaskName 'Oracle Pending Signed Update 074 Recovery' -ErrorAction SilentlyContinue
          $s=Join-Path $env:APPDATA 'oracle\update-state.json'
          $j=if(Test-Path $s){Get-Content -LiteralPath $s -Raw|ConvertFrom-Json}
          $health=$false
          try{$health=[bool](Invoke-RestMethod 'http://127.0.0.1:5069/health' -TimeoutSec 3).connected}catch{}
          [pscustomobject]@{version=(Get-Item (Join-Path $r 'Oracle\Oracle.exe') -ErrorAction SilentlyContinue).VersionInfo.FileVersion;taskState=$task.State;rollback=(Test-Path (Join-Path $r 'Oracle.rollback'));pending=(Test-Path (Join-Path $r 'Oracle.pending-0.7.4'));updateState=$j.status;connected=$health;oracleProcesses=@(Get-Process Oracle -ErrorAction SilentlyContinue|Select-Object Id,FileVersion,SessionId)}|ConvertTo-Json -Depth 4
