# activate: locate local Android partition tools 2026-08-30
name: Temporary locate Android partition tools on KRATOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-oracle-relay-recovery-kratos.yml'

permissions:
  contents: read

jobs:
  locate:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 12
    steps:
      - name: Locate existing dynamic-partition utilities without installing anything
        shell: bash
        run: |
          set -euo pipefail
          echo '=== EXACT BINARY NAMES ==='
          find /home/kratos /opt /usr/local /tmp -xdev -type f \( -name lpunpack -o -name lpdump -o -name simg2img -o -name img2simg -o -name 'lpunpack*' \) -print 2>/dev/null | sort -u | head -n 300 || true
          echo '=== SCRIPT / MODULE REFERENCES ==='
          grep -RIlE '(LP_METADATA_HEADER_MAGIC|liblp|lpunpack|dynamic partitions|super partition)' \
            /home/kratos/TTG-Device-X-Ray /home/kratos/ttg-device-xray /home/kratos/projects /home/kratos/oracle-roadmap-work \
            2>/dev/null | head -n 300 || true
          echo '=== PYTHON MODULES ==='
          python3 - <<'PY'
          import pkgutil
          names=sorted(m.name for m in pkgutil.iter_modules())
          for n in names:
              low=n.lower()
              if any(k in low for k in ('android','sparse','super','lp')):
                  print(n)
          PY
          echo 'LOCAL_PARTITION_TOOL_SEARCH=PASS'
