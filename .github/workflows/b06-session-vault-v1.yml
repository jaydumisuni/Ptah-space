name: B06 construction formatter

on:
  pull_request:
    paths:
      - "B06_SESSION_VAULT_V1.md"
      - "crates/ptah-checkpoint/Cargo.toml"
      - "crates/ptah-checkpoint/src/b06_lib.rs"
      - "crates/ptah-checkpoint/src/b06.rs"
      - "crates/ptah-checkpoint/tests/b06.rs"
      - ".github/workflows/b06-session-vault-v1.yml"

permissions:
  contents: write

env:
  PTAH_EXACT_SHA: ${{ github.event.pull_request.head.sha }}
  CARGO_TERM_COLOR: always

jobs:
  format-b06:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact B06 construction head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PTAH_EXACT_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          rustc -V | grep -q '^rustc 1.97.1 '

      - name: Apply canonical formatting once
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet -- crates/ptah-checkpoint/src/b06.rs crates/ptah-checkpoint/tests/b06.rs; then
            echo "B06 sources already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ptah-checkpoint/src/b06.rs crates/ptah-checkpoint/tests/b06.rs
          git commit -m "B06 review: apply canonical rustfmt"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
