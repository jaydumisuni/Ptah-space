name: D07 Task 3 Evidence Separation Proof

on:
  push:
    branches:
      - d07-security-evidence-reproduction
    paths:
      - .github/workflows/d07-task3-proof.yml

permissions:
  contents: write

jobs:
  task3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: d07-security-evidence-reproduction
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Add cases 9 through 14 RED
        run: |
          cat >> crates/ptah-security-evidence/tests/d07_acceptance.rs <<'EOF'

          use ptah_security_evidence::{
              ClaimProjection, CorrelationRelation, EvidenceBundleProjection, EvidenceCoverage,
              EvidenceItemBinding, FindingDraft, ObservationCorrelation, ObservationProjection,
          };

          #[test]
          fn observation_is_not_a_finding_identity() {
              let observation = ObservationProjection {
                  observation_ref: er("security.observation"),
                  subject_refs: vec![er("core.object_revision")],
                  evidence_refs: vec![er("security.evidence_item")],
                  scanner_aliases: vec!["scanner-rule-7".into()],
                  observed_facts: vec!["bounded fact".into()],
              };
              assert!(observation.finding_identity().is_none());
          }

          #[test]
          fn scanner_candidate_requires_explicit_bounded_review_before_confirmation() {
              let observation_ref = er("security.observation");
              let draft = FindingDraft {
                  subject_refs: vec![er("core.object_revision")],
                  observation_refs: vec![observation_ref.clone()],
                  correlations: vec![ObservationCorrelation {
                      observation_ref,
                      relation: CorrelationRelation::Supports,
                  }],
                  severity: "high".into(),
                  confidence: 0.9,
                  exploitability: "conditional".into(),
              };
              assert!(matches!(
                  draft.validate_confirmation(None),
                  Err(D07Error::ReviewRequired)
              ));
              draft
                  .validate_confirmation(Some(&er("security.review_decision")))
                  .expect("bounded review permits confirmation");
          }

          #[test]
          fn contradictory_observations_both_remain_visible() {
              let supports = er("security.observation");
              let contradicts = er("security.observation");
              let draft = FindingDraft {
                  subject_refs: vec![er("core.object_revision")],
                  observation_refs: vec![supports.clone(), contradicts.clone()],
                  correlations: vec![
                      ObservationCorrelation {
                          observation_ref: supports.clone(),
                          relation: CorrelationRelation::Supports,
                      },
                      ObservationCorrelation {
                          observation_ref: contradicts.clone(),
                          relation: CorrelationRelation::Contradicts,
                      },
                  ],
                  severity: "medium".into(),
                  confidence: 0.5,
                  exploitability: "unknown".into(),
              };
              draft
                  .validate_confirmation(Some(&er("security.review_decision")))
                  .expect("contradiction is retained, not erased");
              let retained = draft.correlated_observation_refs();
              assert!(retained.contains(&supports));
              assert!(retained.contains(&contradicts));
              assert_eq!(retained.len(), 2);
          }

          #[test]
          fn bounded_claim_requires_claimant_authority_scope_and_evidence() {
              assert!(matches!(
                  ClaimProjection::new(
                      "bounded security claim".into(),
                      None,
                      Vec::new(),
                      vec![er("core.object_revision")],
                      vec![er("security.evidence_bundle")],
                  ),
                  Err(D07Error::InvalidClaim)
              ));
              let claim = ClaimProjection::new(
                  "bounded security claim".into(),
                  Some(er("identity.principal")),
                  vec!["security.review".into()],
                  vec![er("core.object_revision")],
                  vec![er("security.evidence_bundle")],
              )
              .expect("valid bounded claim");
              assert_eq!(claim.statement, "bounded security claim");
              assert_eq!(claim.evidence_bundle_refs.len(), 1);
          }

          #[test]
          fn evidence_item_binds_exact_content_digest_collector_activity_and_attempt() {
              let binding = EvidenceItemBinding::new(
                  er("core.object_revision"),
                  "aa".repeat(32),
                  er("identity.agent"),
                  er("core.activity"),
                  er("core.attempt"),
              )
              .expect("exact evidence binding");
              assert_eq!(binding.sha256, "aa".repeat(32));
              assert!(matches!(
                  EvidenceItemBinding::new(
                      er("core.object_revision"),
                      "not-a-digest".into(),
                      er("identity.agent"),
                      er("core.activity"),
                      er("core.attempt"),
                  ),
                  Err(D07Error::InvalidEvidenceBinding)
              ));
          }

          #[test]
          fn evidence_bundle_cannot_overclaim_partial_or_unknown_coverage() {
              let coverage = CoverageProjection {
                  expected_scope: BTreeSet::from(["a".into(), "b".into()]),
                  resolved_scope: BTreeSet::from(["a".into(), "b".into()]),
                  scanned_scope: BTreeSet::from(["a".into()]),
                  skipped_scope: BTreeSet::from(["b".into()]),
                  unsupported_scope: BTreeSet::new(),
                  error_scope: BTreeMap::new(),
                  limitations: vec!["b skipped".into()],
                  complete: false,
              };
              let bundle = EvidenceBundleProjection {
                  evidence_item_refs: vec![er("security.evidence_item")],
                  coverage: EvidenceCoverage::CompleteForClaimScope,
                  limitations: Vec::new(),
              };
              assert!(matches!(
                  bundle.validate_against(&coverage),
                  Err(D07Error::EvidenceCoverageOverclaim)
              ));
          }
          EOF
          cargo fmt --all
          if cargo test -p ptah-security-evidence --test d07_acceptance --locked; then
            echo 'Task 3 RED unexpectedly passed' >&2
            exit 1
          fi
      - name: Implement evidence separation
        run: |
          cat > crates/ptah-security-evidence/src/evidence.rs <<'EOF'
          use ptah_identifiers::EntityRef;

          use crate::{CoverageProjection, D07Error};

          /// Explicit relationship between one immutable Observation and a Finding interpretation.
          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub enum CorrelationRelation {
              /// Observation supports the interpretation.
              Supports,
              /// Observation contradicts the interpretation.
              Contradicts,
              /// Observation may duplicate another source observation.
              PossibleDuplicate,
              /// Same location but a different rule or interpretation.
              SameLocationDifferentRule,
              /// Same package but a different advisory.
              SamePackageDifferentAdvisory,
              /// Static/source and runtime evidence may be related.
              SourceAndRuntimeRelated,
              /// Observations cannot be compared mechanically.
              NotComparable,
              /// A newer Observation supersedes an older Observation without deleting it.
              SupersedesObservation,
          }

          /// One exact Observation relation retained without requiring `EntityRef: Ord`.
          #[derive(Debug, Clone, PartialEq, Eq)]
          pub struct ObservationCorrelation {
              /// Exact immutable Observation reference.
              pub observation_ref: EntityRef,
              /// Caller/reviewer-authored relation.
              pub relation: CorrelationRelation,
          }

          /// Provider-neutral projection of one immutable security Observation.
          #[derive(Debug, Clone, PartialEq, Eq)]
          pub struct ObservationProjection {
              /// Canonical `security.observation` reference.
              pub observation_ref: EntityRef,
              /// Exact subjects observed.
              pub subject_refs: Vec<EntityRef>,
              /// Exact evidence retained for the Observation.
              pub evidence_refs: Vec<EntityRef>,
              /// Scanner/provider-local aliases retained only as evidence.
              pub scanner_aliases: Vec<String>,
              /// Bounded observed facts.
              pub observed_facts: Vec<String>,
          }

          impl ObservationProjection {
              /// Observation identity never doubles as Finding identity.
              #[must_use]
              pub const fn finding_identity(&self) -> Option<&EntityRef> {
                  None
              }
          }

          /// Reviewed Finding candidate that retains all source Observations and relations.
          #[derive(Debug, Clone, PartialEq)]
          pub struct FindingDraft {
              /// Exact Finding subjects.
              pub subject_refs: Vec<EntityRef>,
              /// Immutable source Observations.
              pub observation_refs: Vec<EntityRef>,
              /// Explicit correlation relations; contradictory relations remain retained.
              pub correlations: Vec<ObservationCorrelation>,
              /// Severity dimension, separate from confidence/acceptance.
              pub severity: String,
              /// Mechanical confidence in the interpretation.
              pub confidence: f64,
              /// Exploitability dimension, separate from severity.
              pub exploitability: String,
          }

          impl FindingDraft {
              /// Validate that a candidate has explicit bounded review before canonical confirmation.
              ///
              /// # Errors
              /// Returns [`D07Error`] for absent review, malformed confidence, or incomplete correlation evidence.
              pub fn validate_confirmation(
                  &self,
                  review_ref: Option<&EntityRef>,
              ) -> Result<(), D07Error> {
                  let Some(review_ref) = review_ref else {
                      return Err(D07Error::ReviewRequired);
                  };
                  if review_ref.entity_kind.as_str() != "security.review_decision" {
                      return Err(D07Error::ReviewRequired);
                  }
                  if self.subject_refs.is_empty()
                      || self.observation_refs.is_empty()
                      || self.severity.trim().is_empty()
                      || self.exploitability.trim().is_empty()
                      || !self.confidence.is_finite()
                      || !(0.0..=1.0).contains(&self.confidence)
                  {
                      return Err(D07Error::InvalidFindingDraft);
                  }
                  if self.observation_refs.iter().any(|observation| {
                      !self
                          .correlations
                          .iter()
                          .any(|binding| binding.observation_ref == *observation)
                  }) {
                      return Err(D07Error::InvalidFindingDraft);
                  }
                  Ok(())
              }

              /// Return every correlated Observation reference without deleting contradictions.
              #[must_use]
              pub fn correlated_observation_refs(&self) -> Vec<EntityRef> {
                  self.correlations
                      .iter()
                      .map(|binding| binding.observation_ref.clone())
                      .collect()
              }
          }

          /// Bounded Claim projection; Claim remains separate from its Evidence Bundles.
          #[derive(Debug, Clone, PartialEq, Eq)]
          pub struct ClaimProjection {
              /// Exact bounded claim sentence.
              pub statement: String,
              /// Explicit claimant identity.
              pub claimant_ref: EntityRef,
              /// Authority scopes under which the claimant may state the Claim.
              pub authority_scope: Vec<String>,
              /// Exact subjects to which the Claim applies.
              pub subject_refs: Vec<EntityRef>,
              /// Exact Evidence Bundles supporting or qualifying the Claim.
              pub evidence_bundle_refs: Vec<EntityRef>,
          }

          impl ClaimProjection {
              /// Construct a bounded Claim only with explicit claimant, authority scope, subjects and evidence.
              ///
              /// # Errors
              /// Returns [`D07Error::InvalidClaim`] when any required boundary is absent.
              pub fn new(
                  statement: String,
                  claimant_ref: Option<EntityRef>,
                  authority_scope: Vec<String>,
                  subject_refs: Vec<EntityRef>,
                  evidence_bundle_refs: Vec<EntityRef>,
              ) -> Result<Self, D07Error> {
                  let claimant_ref = claimant_ref.ok_or(D07Error::InvalidClaim)?;
                  if statement.trim().is_empty()
                      || authority_scope.is_empty()
                      || authority_scope.iter().any(|scope| scope.trim().is_empty())
                      || subject_refs.is_empty()
                      || evidence_bundle_refs.is_empty()
                  {
                      return Err(D07Error::InvalidClaim);
                  }
                  Ok(Self {
                      statement,
                      claimant_ref,
                      authority_scope,
                      subject_refs,
                      evidence_bundle_refs,
                  })
              }
          }

          /// Exact content/collector/A04 binding for one Evidence Item.
          #[derive(Debug, Clone, PartialEq, Eq)]
          pub struct EvidenceItemBinding {
              /// Exact Content/Object/Artifact reference.
              pub content_ref: EntityRef,
              /// Canonical lowercase SHA-256 of retained evidence bytes.
              pub sha256: String,
              /// Exact collector identity.
              pub collector_ref: EntityRef,
              /// Exact A04 Activity that collected the evidence.
              pub activity_ref: EntityRef,
              /// Exact A04 Attempt that collected the evidence.
              pub attempt_ref: EntityRef,
          }

          impl EvidenceItemBinding {
              /// Construct one exact Evidence Item binding.
              ///
              /// # Errors
              /// Returns [`D07Error::InvalidEvidenceBinding`] for mutable/invalid content or A04 bindings.
              pub fn new(
                  content_ref: EntityRef,
                  sha256: String,
                  collector_ref: EntityRef,
                  activity_ref: EntityRef,
                  attempt_ref: EntityRef,
              ) -> Result<Self, D07Error> {
                  let content_kind = content_ref.entity_kind.as_str();
                  if !matches!(content_kind, "core.content" | "core.object_revision" | "core.artifact")
                      || activity_ref.entity_kind.as_str() != "core.activity"
                      || attempt_ref.entity_kind.as_str() != "core.attempt"
                      || crate::assessment::require_sha256(&sha256).is_err()
                  {
                      return Err(D07Error::InvalidEvidenceBinding);
                  }
                  Ok(Self {
                      content_ref,
                      sha256,
                      collector_ref,
                      activity_ref,
                      attempt_ref,
                  })
              }
          }

          /// Evidence Bundle coverage classification from the frozen WP12 vocabulary.
          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub enum EvidenceCoverage {
              /// Complete only for the exact bounded Claim scope.
              CompleteForClaimScope,
              /// Explicit partial coverage.
              Partial,
              /// Coverage is unknown.
              Unknown,
          }

          /// Mechanical Evidence Bundle projection used to block coverage overclaiming.
          #[derive(Debug, Clone, PartialEq, Eq)]
          pub struct EvidenceBundleProjection {
              /// Exact Evidence Item references retained by the bundle.
              pub evidence_item_refs: Vec<EntityRef>,
              /// Bundle coverage claim.
              pub coverage: EvidenceCoverage,
              /// Explicit limitations.
              pub limitations: Vec<String>,
          }

          impl EvidenceBundleProjection {
              /// Check a bundle coverage claim against the actual assessment coverage projection.
              ///
              /// # Errors
              /// Returns [`D07Error`] when evidence is absent or complete coverage is overclaimed.
              pub fn validate_against(&self, coverage: &CoverageProjection) -> Result<(), D07Error> {
                  if self.evidence_item_refs.is_empty() {
                      return Err(D07Error::InvalidEvidenceBinding);
                  }
                  if self.coverage == EvidenceCoverage::CompleteForClaimScope {
                      coverage.validate()?;
                      if !coverage.complete {
                          return Err(D07Error::EvidenceCoverageOverclaim);
                      }
                  }
                  Ok(())
              }
          }
          EOF
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/ptah-security-evidence/src/lib.rs')
          text = path.read_text()
          text = text.replace('mod error;\n', 'mod error;\nmod evidence;\n', 1)
          text = text.replace(
              'pub use error::D07Error;\n',
              'pub use error::D07Error;\npub use evidence::{\n    ClaimProjection, CorrelationRelation, EvidenceBundleProjection, EvidenceCoverage,\n    EvidenceItemBinding, FindingDraft, ObservationCorrelation, ObservationProjection,\n};\n',
              1,
          )
          path.write_text(text)

          path = Path('crates/ptah-security-evidence/src/error.rs')
          text = path.read_text()
          marker = '    /// Underlying A06 authority check failed.\n'
          variants = '''    /// Finding confirmation requires explicit bounded review authority.\n    #[error("finding confirmation requires explicit bounded review")]\n    ReviewRequired,\n    /// Finding candidate is structurally incomplete or mechanically invalid.\n    #[error("invalid security finding draft")]\n    InvalidFindingDraft,\n    /// Claim lacks claimant, authority scope, subjects or evidence.\n    #[error("invalid bounded security claim")]\n    InvalidClaim,\n    /// Evidence Item lacks an exact content/digest/collector/A04 binding.\n    #[error("invalid security evidence binding")]\n    InvalidEvidenceBinding,\n    /// Evidence Bundle claims complete coverage beyond the retained assessment evidence.\n    #[error("security evidence bundle overclaims coverage")]\n    EvidenceCoverageOverclaim,\n'''
          if 'ReviewRequired' not in text:
              assert marker in text
              text = text.replace(marker, variants + marker, 1)
          path.write_text(text)

          path = Path('crates/ptah-security-evidence/src/assessment.rs')
          text = path.read_text()
          text = text.replace('fn require_sha256(value: &str)', 'pub(crate) fn require_sha256(value: &str)', 1)
          path.write_text(text)
          PY
      - name: Prove cases 9 through 14 GREEN
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p ptah-security-evidence --test d07_acceptance --locked
          test "$(cargo test -p ptah-security-evidence --test d07_acceptance --locked -- --list 2>/dev/null | grep -c ': test$')" -eq 14
          cargo test -p ptah-security-evidence --locked
          cargo clippy -p ptah-security-evidence --all-targets --locked -- -D warnings -W clippy::pedantic
          ! grep -R -n -E '#\[(allow|expect)\(' crates/ptah-security-evidence
      - name: Commit proven Task 3
        run: |
          git config user.name "TENFOLD Foreman"
          git config user.email "jaydumi12@gmail.com"
          git add crates/ptah-security-evidence
          git commit -m "feat(d07): separate findings claims and evidence"
          git push origin HEAD:d07-security-evidence-reproduction
