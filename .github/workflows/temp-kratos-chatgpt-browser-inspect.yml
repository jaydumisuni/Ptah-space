name: TEMP KRATOS X-Ray PR31 physical proof

# activation: v8
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-kratos-chatgpt-browser-inspect.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: [self-hosted, kratos, linux, x64, physical, ptah]
    timeout-minutes: 12
    steps:
      - name: Prove Xiaomi-aware X-Ray branch against live Redmi read-only
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/kratos/.local/share/mibu-platform-tools/current/platform-tools:$PATH"
          work=/tmp/ttg-xray-pr31-live-proof
          rm -rf "$work"

          echo '=== SAFETY PRECHECK ==='
          adb start-server >/dev/null
          adb get-state
          ip route show default || true

          echo '=== CHECKOUT ==='
          git clone --quiet --depth 1 --branch feature/xiaomi-cust-selector-evidence \
            https://github.com/jaydumisuni/TTG-Device-X-Ray.git "$work"
          git -C "$work" rev-parse HEAD

          echo '=== LIVE XIAOMI REGIONAL PROBE ==='
          PYTHONPATH="$work/src" python3 - <<'PY'
          import json
          from collections import Counter

          from ttg_device_xray.command import CommandRunner
          from ttg_device_xray.platform_tools import PlatformToolsRunner
          from ttg_device_xray.transports.xiaomi_regional_manifest import XiaomiRegionalManifestProbe

          runner = CommandRunner()
          platform_tools = PlatformToolsRunner(runner)
          observations = XiaomiRegionalManifestProbe(platform_tools).probe()
          connected = [item for item in observations if item.connected]
          if len(connected) != 1:
              raise SystemExit(f'EXPECTED_ONE_CONNECTED_OBSERVATION:{len(connected)}')
          observation = connected[0]
          caps = observation.capabilities
          selector = caps.get('xiaomi_customization_selector', {})
          mi_ext = caps.get('xiaomi_mi_ext', {})
          files = caps.get('customization_file_manifest', [])
          partitions = Counter(item.get('partition', '') for item in files if isinstance(item, dict))
          manifest = caps.get('firmware_regional_manifest', {})
          summary = {
              'schema': caps.get('regional_manifest_schema'),
              'region': observation.identifiers.get('region'),
              'cust_variant': selector.get('cust_variant'),
              'selector_consistent': selector.get('consistency', {}).get('consistent'),
              'preload_packages': len(selector.get('preload_policy', {}).get('packages', [])),
              'mi_ext_present': mi_ext.get('present'),
              'mi_ext_verified': mi_ext.get('partition.mi_ext.verified'),
              'mi_ext_hash_alg': mi_ext.get('partition.mi_ext.verified.hash_alg'),
              'mi_ext_root_digest': mi_ext.get('partition.mi_ext.verified.root_digest'),
              'customization_file_count': len(files),
              'files_by_partition': dict(sorted(partitions.items())),
              'mi_ext_manifest_files': sum(1 for item in files if item.get('partition') == 'mi_ext'),
              'manifest_has_selector': 'xiaomi_customization_selector' in manifest,
              'manifest_has_mi_ext': 'xiaomi_mi_ext' in manifest,
              'manifest_sha256': caps.get('firmware_regional_manifest_sha256'),
              'warnings': observation.warnings,
          }
          print(json.dumps(summary, indent=2, sort_keys=True))

          assert summary['schema'] == 'ttg.xray.android-regional-manifest.v3'
          assert summary['region'] == 'CN'
          assert summary['cust_variant'] == 'cn_chinatelecom'
          assert summary['selector_consistent'] is True
          assert summary['preload_packages'] == 12
          assert summary['mi_ext_present'] is True
          assert summary['mi_ext_verified'] == '2'
          assert summary['mi_ext_hash_alg'] == 'sha256'
          assert len(str(summary['mi_ext_root_digest'])) == 64
          assert summary['mi_ext_manifest_files'] > 0
          assert summary['manifest_has_selector'] is True
          assert summary['manifest_has_mi_ext'] is True
          assert len(str(summary['manifest_sha256'])) == 64
          PY

          echo '=== SAFETY POSTCHECK ==='
          adb get-state
          ip route show default || true
          echo 'TTG_XRAY_PR31_PHYSICAL_PROOF=PASS'
