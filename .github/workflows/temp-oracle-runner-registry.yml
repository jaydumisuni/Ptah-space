name: Temporary ATHENA Oracle Live Foreground Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-oracle-runner-registry.yml"

permissions:
  contents: read

jobs:
  diagnose-athena-live:
    runs-on: [self-hosted, athena, ptah]
    timeout-minutes: 6
    steps:
      - name: Diagnose exact installed runtime in foreground
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:LOCALAPPDATA 'OracleNode'
          $runtime=Join-Path $root 'runtime'
          $nodeScript=Join-Path $runtime 'scripts\oracle-live-node.mjs'
          $token=Join-Path $root 'live-token'
          $identity=Join-Path $root 'node-id'
          $status=Join-Path $root 'oracle-live-node-status.json'
          $stdout=Join-Path $env:TEMP 'oracle-live-foreground.stdout.log'
          $stderr=Join-Path $env:TEMP 'oracle-live-foreground.stderr.log'
          foreach($f in @($stdout,$stderr)){Remove-Item $f -Force -ErrorAction SilentlyContinue}

          foreach($name in @('Oracle Always-On Node','Oracle Node Watchdog','Oracle Live Node (Session Fallback)','Oracle Node Watchdog (Session Fallback)')){
            $t=Get-ScheduledTask -TaskName $name -ErrorAction SilentlyContinue
            if($t){Disable-ScheduledTask -InputObject $t -ErrorAction SilentlyContinue|Out-Null; if([string]$t.State -in @('Running','Queued')){Stop-ScheduledTask -InputObject $t -ErrorAction SilentlyContinue|Out-Null}}
          }
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -match 'oracle-live-node\.mjs|oracle-node-watchdog-windows\.mjs' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 1

          if(-not(Test-Path $nodeScript)){throw 'INSTALLED_NODE_SCRIPT_MISSING'}
          if(-not(Test-Path $token)){throw 'LIVE_TOKEN_MISSING'}
          if(-not(Test-Path $identity)){throw 'NODE_ID_MISSING'}
          $ws=Get-Content -Raw (Join-Path $runtime 'node_modules\ws\package.json') | ConvertFrom-Json
          Write-Output ('WS_VERSION='+$ws.version)

          $env:ORACLE_LIVE_URL='https://oracle.thetechguyds.com'
          $env:ORACLE_LIVE_TOKEN_FILE=$token
          $env:ORACLE_NODE_ID_FILE=$identity
          $env:ORACLE_LIVE_NODE_STATUS_FILE=$status
          $env:ORACLE_WORKSTATION_ROOTS=((Resolve-Path $env:USERPROFILE).Path)
          $env:ORACLE_NODE_HEALTH_HOST='127.0.0.1'
          $env:ORACLE_NODE_HEALTH_PORT='5059'

          $node=(Get-Command node.exe -ErrorAction Stop).Source
          $p=Start-Process -FilePath $node -ArgumentList @($nodeScript) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru -WindowStyle Hidden
          try{
            Start-Sleep -Seconds 5
            $p.Refresh()
            $exitText=''
            if($p.HasExited){$exitText=' EXITCODE='+$p.ExitCode}
            Write-Output ('PID='+$p.Id+' EXITED='+$p.HasExited+$exitText)
            Write-Output '--- 5059 TCP ---'
            Get-NetTCPConnection -LocalPort 5059 -ErrorAction SilentlyContinue | Select-Object LocalAddress,LocalPort,State,OwningProcess | Format-Table -AutoSize
            Write-Output '--- health via Invoke-WebRequest ---'
            foreach($u in @('http://127.0.0.1:5059/health','http://127.0.0.1:5059/ready')){
              try{$r=Invoke-WebRequest -UseBasicParsing -Uri $u -TimeoutSec 3; Write-Output ($u+' STATUS='+$r.StatusCode+' BODY='+$r.Content)}catch{Write-Output ($u+' ERROR '+$_.Exception.Message)}
            }
            Write-Output '--- stdout ---'
            if(Test-Path $stdout){Get-Content -Raw $stdout}
            Write-Output '--- stderr ---'
            if(Test-Path $stderr){Get-Content -Raw $stderr}
            Write-Output '--- status file ---'
            if(Test-Path $status){Get-Content -Raw $status}
          } finally {
            if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          }
