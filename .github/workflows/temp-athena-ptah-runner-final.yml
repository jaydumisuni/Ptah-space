name: Temporary PR197 Source Correction

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-athena-ptah-runner-final.yml"

permissions:
  contents: read

jobs:
  correct-pr197:
    runs-on: [self-hosted, kratos, ptah]
    timeout-minutes: 18
    steps:
      - name: Patch and prove PR197 source
        shell: bash
        run: |
          set -euo pipefail
          branch='fix/windows-live-persistence-closeout-20260822'
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          gh repo clone jaydumisuni/Oracle- "$work/repo" -- --branch "$branch" --single-branch --depth 1
          cd "$work/repo"
          python3 - <<'PY'
          from pathlib import Path

          installer = Path('scripts/install-oracle-node-windows.ps1')
          text = installer.read_text(encoding='utf-8').replace('\r\n','\n')

          # Complete all installer/report runtime lists.
          if '  "oracle-browser-rpc-local.mjs",\n' not in text:
              needle = '  "oracle-browser-rpc.mjs",\n'
              replacement = needle + '  "oracle-browser-rpc-local.mjs",\n  "oracle-extension-browser-rpc.mjs",\n'
              count = text.count(needle)
              if count != 2:
                  raise SystemExit(f'UNEXPECTED_BROWSER_RUNTIME_LIST_COUNT={count}')
              text = text.replace(needle, replacement)

          resolve_line = '$WsRuntime = Resolve-WsRuntimeSource -ProjectRoot $SourceRoot'
          known_marker = '$KnownTaskNames = @('
          if text.index(resolve_line) > text.index(known_marker):
              text = text.replace(resolve_line + '\n', '', 1)
              anchor = '$WorkstationRoots = $ResolvedRoots -join [System.IO.Path]::PathSeparator\n'
              preflight = '''
          $RuntimeSourceNames = @(
            "oracle-live-node.mjs",
            "oracle-workstation-rpc.mjs",
            "oracle-browser-rpc.mjs",
            "oracle-browser-rpc-local.mjs",
            "oracle-extension-browser-rpc.mjs",
            "oracle-device-discovery.mjs",
            "oracle-node-capabilities.mjs",
            "oracle-node-watchdog.mjs",
            "oracle-node-watchdog-windows.mjs",
            "restart-oracle-node-task-windows.ps1"
          )
          foreach ($RuntimeSourceName in $RuntimeSourceNames) {
            $ValidatedSourceFile = Join-Path $SourceRoot "scripts\\$RuntimeSourceName"
            if (-not (Test-Path -LiteralPath $ValidatedSourceFile -PathType Leaf)) {
              throw "Oracle Windows runtime source is missing: $ValidatedSourceFile"
            }
          }
          $WsRuntime = Resolve-WsRuntimeSource -ProjectRoot $SourceRoot
          '''
              preflight = '\n'.join(line[10:] if line.startswith('          ') else line for line in preflight.splitlines()) + '\n'
              if text.count(anchor) != 1:
                  raise SystemExit('WORKSTATION_ROOTS_ANCHOR_INVALID')
              text = text.replace(anchor, anchor + preflight, 1)

          if text.index(resolve_line) > text.index(known_marker):
              raise SystemExit('WS_STAGING_AFTER_PERSISTENCE_FENCE')
          if text.index('$ValidatedSourceFile = Join-Path $SourceRoot') > text.index(known_marker):
              raise SystemExit('SOURCE_PREFLIGHT_AFTER_PERSISTENCE_FENCE')
          if text.count('  "oracle-browser-rpc-local.mjs",\n') < 3:
              raise SystemExit('RUNTIME_CLOSURE_NOT_PRESENT_IN_PREFLIGHT_COPY_AND_REPORT')
          installer.write_text(text, encoding='utf-8')

          test = Path('tests/windows-live-recovery-persistence.test.ts')
          source = test.read_text(encoding='utf-8').replace('\r\n','\n')
          source = source.replace(
              '''    const runtimeSources = source.indexOf('$SourceFile = Join-Path $SourceRoot "scripts\\\\$_"');\n    const resolve = source.indexOf("$WsRuntime = Resolve-WsRuntimeSource -ProjectRoot $SourceRoot");\n    const wsCopy = source.indexOf("Copy-Item -LiteralPath $WsRuntime.Path", resolve);''',
              '''    const preflightSource = source.indexOf('$ValidatedSourceFile = Join-Path $SourceRoot "scripts\\\\$RuntimeSourceName"');\n    const resolve = source.indexOf("$WsRuntime = Resolve-WsRuntimeSource -ProjectRoot $SourceRoot");\n    const knownTasks = source.indexOf("$KnownTaskNames = @(", resolve);\n    const runtimeSources = source.indexOf('$SourceFile = Join-Path $SourceRoot "scripts\\\\$_"', knownTasks);\n    const wsCopy = source.indexOf("Copy-Item -LiteralPath $WsRuntime.Path", runtimeSources);''',
              1,
          )
          source = source.replace(
              '''    expect(runtimeSources).toBeGreaterThan(-1);\n    expect(resolve).toBeGreaterThan(runtimeSources);\n    expect(wsCopy).toBeGreaterThan(resolve);''',
              '''    expect(preflightSource).toBeGreaterThan(-1);\n    expect(resolve).toBeGreaterThan(preflightSource);\n    expect(knownTasks).toBeGreaterThan(resolve);\n    expect(runtimeSources).toBeGreaterThan(knownTasks);\n    expect(wsCopy).toBeGreaterThan(runtimeSources);''',
              1,
          )

          title = 'packages the complete local ESM import closure required by the Windows Live node'
          if title not in source:
              marker = '  it("reports persistence and startup truth without exposing the Oracle Live token", async () => {'
              if marker not in source:
                  raise SystemExit('TEST_INSERTION_MARKER_NOT_FOUND')
              block = r'''  it("packages the complete local ESM import closure required by the Windows Live node", async () => {
            const source = await installer();
            const installed = new Set(
              [...source.matchAll(/"([A-Za-z0-9._-]+\.mjs)"/gu)].map((match) => match[1]),
            );
            const pending = ["oracle-live-node.mjs"];
            const seen = new Set<string>();
            const importPattern = /(?:from\s+|import\s*\()\s*["']\.\/([^"']+\.mjs)["']/gu;
            while (pending.length) {
              const moduleName = pending.pop()!;
              if (seen.has(moduleName)) continue;
              seen.add(moduleName);
              const moduleSource = await readFile(new URL(`../scripts/${moduleName}`, import.meta.url), "utf8");
              for (const match of moduleSource.matchAll(importPattern)) {
                const dependency = match[1];
                if (!seen.has(dependency)) pending.push(dependency);
              }
            }
            expect([...seen]).toContain("oracle-browser-rpc-local.mjs");
            expect([...seen]).toContain("oracle-extension-browser-rpc.mjs");
            for (const moduleName of seen) {
              expect(installed.has(moduleName), `Windows runtime is missing ${moduleName}`).toBe(true);
            }
          });

'''
              source = source.replace(marker, block + marker, 1)

          if 'const preflightSource = source.indexOf' not in source:
              raise SystemExit('P1_ORDER_REGRESSION_NOT_UPDATED')
          test.write_text(source, encoding='utf-8')
          PY

          git rm -f .github/workflows/temp-pr197-runtime-closure-fix.yml 2>/dev/null || true
          git diff --check
          npm ci --ignore-scripts --no-audit --no-fund
          npm test -- tests/windows-live-recovery-persistence.test.ts tests/windows-node-watchdog.test.ts tests/always-on-node.test.ts
          gh auth setup-git
          git config user.name 'oracle-pr197-repair'
          git config user.email 'oracle-pr197-repair@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'PR197 correction already present.'
            exit 0
          fi
          git commit -m 'fix: stage complete Windows Live runtime before persistence cutover'
          git push origin "HEAD:$branch"

