name: E02 Format Sync

on:
  push:
    branches: [e02-placement-reservation-lease-fence]
    paths:
      - .github/workflows/e02-format-sync.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out E02 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e02-placement-reservation-lease-fence
          fetch-depth: 0
      - name: Pin Rust 1.97.1 rustfmt
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          rustc -V | grep -q '^rustc 1.97.1 '
      - name: Format and commit Rust-only delta
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo 'Rust formatting already current'
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -Ev '\.rs$'; then
            echo 'rustfmt changed a non-Rust file'
            exit 1
          fi
          git config user.name 'THE TECH GUY'
          git config user.email '65334711+jaydumisuni@users.noreply.github.com'
          git add -- '*.rs'
          test -z "$(git status --porcelain | grep -v '^M  .*\.rs$')"
          git commit -m 'style(e02): apply pinned rustfmt'
          git push origin HEAD:e02-placement-reservation-lease-fence
