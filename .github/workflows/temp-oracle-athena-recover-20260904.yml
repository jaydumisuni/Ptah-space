name: TEMP Oracle ATHENA installed-task recovery

on:
  push:
    branches: [ops/oracle-athena-recover-20260904]
    paths:
      - ".github/workflows/temp-oracle-athena-recover-20260904.yml"

permissions:
  contents: read

jobs:
  recover:
    runs-on: [self-hosted, athena, windows, x64, physical, ptah]
    timeout-minutes: 8
    steps:
      - name: Recover installed Oracle tasks and prove local readiness
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '0f2a3b0e1884c749286b61348b482f7ebb263c19'
          $bundleRoot = Join-Path ([Environment]::GetFolderPath([Environment+SpecialFolder]::CommonApplicationData)) 'THETECHGUY-Oracle-ElevatedInteractiveProbe'
          $manifestPath = Join-Path $bundleRoot 'bundle-manifest.json'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) { throw 'ORACLE_ELEVATED_BUNDLE_MISSING' }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          [ordered]@{
            schemaVersion = [string]$manifest.schemaVersion
            sourceCommit = [string]$manifest.sourceCommit
            installerBlob = [string]$manifest.installerSourceGitBlob
            operations = @($manifest.operations | ForEach-Object { [string]$_.id })
          } | ConvertTo-Json -Compress | Write-Output
          if ([string]$manifest.sourceCommit -ne $expected) {
            throw ('ORACLE_ELEVATED_BUNDLE_HEAD_MISMATCH:' + [string]$manifest.sourceCommit)
          }
          $source = Join-Path $env:RUNNER_TEMP ('oracle-pointer-' + $env:GITHUB_RUN_ID)
          git -c core.autocrlf=false clone --quiet --no-checkout https://github.com/jaydumisuni/Oracle-.git $source
          if ($LASTEXITCODE -ne 0) { throw 'ORACLE_CLONE_FAILED' }
          git -C $source -c core.autocrlf=false checkout --quiet --detach $expected
          if ($LASTEXITCODE -ne 0 -or (git -C $source rev-parse HEAD).Trim() -ne $expected) { throw 'ORACLE_HEAD_MISMATCH' }
          & (Join-Path $source 'scripts\Submit-OracleElevatedInteractiveJob.ps1') -Operation oracle_desktop_pointer_install -TimeoutSeconds 300
          if ($LASTEXITCODE -ne 0) { throw ('ORACLE_POINTER_INSTALL_FAILED:' + $LASTEXITCODE) }
          $names = @('Oracle Desktop Input', 'Oracle Always-On Node', 'Oracle Node Watchdog')
          Write-Output ('HOST=' + $env:COMPUTERNAME)
          Write-Output ('USER=' + [Security.Principal.WindowsIdentity]::GetCurrent().Name)
          Write-Output ('SESSION=' + [Diagnostics.Process]::GetCurrentProcess().SessionId)
          foreach ($name in $names) {
            $task = Get-ScheduledTask -TaskName $name -ErrorAction Stop
            $info = Get-ScheduledTaskInfo -TaskName $name -ErrorAction Stop
            [ordered]@{
              task = $name
              state = [string]$task.State
              enabled = [string]$task.Settings.Enabled
              lastResult = [int64]$info.LastTaskResult
              lastRun = $info.LastRunTime.ToUniversalTime().ToString('o')
            } | ConvertTo-Json -Compress | Write-Output
          }
          $deadline = (Get-Date).AddSeconds(90)
          do {
            try {
              $health = Invoke-RestMethod -Method Get -Uri 'http://127.0.0.1:5059/ready' -TimeoutSec 4
              if ($health.ready -and $health.connected) { break }
            } catch {}
            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $deadline)
          if (-not $health -or -not $health.ready -or -not $health.connected) {
            throw 'ORACLE_ATHENA_READY_TIMEOUT'
          }
          $health | ConvertTo-Json -Depth 8 -Compress | Write-Output
          foreach ($name in $names) {
            $task = Get-ScheduledTask -TaskName $name -ErrorAction Stop
            $info = Get-ScheduledTaskInfo -TaskName $name -ErrorAction Stop
            [ordered]@{
              task = $name
              state = [string]$task.State
              lastResult = [int64]$info.LastTaskResult
            } | ConvertTo-Json -Compress | Write-Output
          }
          Write-Output 'ORACLE_ATHENA_RECOVERY=PASS'
