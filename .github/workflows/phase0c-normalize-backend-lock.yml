name: Phase 0C normalize backend lock

on:
  push:
    branches:
      - phase-0c-host-dependency-evidence

permissions:
  contents: write

jobs:
  normalize-backend-lock:
    if: ${{ !contains(github.event.head_commit.message, '[normalized-backend-lock]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out evidence branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: phase-0c-host-dependency-evidence
          fetch-depth: 0

      - name: Normalize completed signer state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("dependencies/backend-artifact-lock.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          verification = payload.setdefault("verification", {})
          verification["signing_key_lock_path"] = "dependencies/signing-key-lock.json"
          payload["blockers"] = [
              item
              for item in payload.get("blockers", [])
              if not str(item).startswith("Cryptographically verify OpenPGP signers")
          ]
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit normalized lock
        run: |
          git add dependencies/backend-artifact-lock.json
          if git diff --cached --quiet; then
            echo "Backend lock already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Phase 0C: record completed backend signer lock [normalized-backend-lock]"
          git push origin HEAD:phase-0c-host-dependency-evidence
