name: C08 Device identity and transport exact-head proof

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "C08_DEVICE_IDENTITY_TRANSPORT.md"
      - "crates/ptah-device-runtime/**"
      - ".github/workflows/c08-device-identity-transport.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PTAH_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PTAH_PR_BASE: ${{ github.event.pull_request.base.sha }}
  PTAH_C08_BASE_SHA: ae7a9c9c939db03df55f97ebb3edffd68216197b
  CARGO_TERM_COLOR: always

jobs:
  c08-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact C08 candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PTAH_EXACT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Lock C08 base and protected scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PTAH_EXACT_SHA"
          test -z "$(git status --porcelain)"
          test "$(git merge-base "$PTAH_C08_BASE_SHA" "$PTAH_EXACT_SHA")" = "$PTAH_C08_BASE_SHA"

          protected=(
            "Cargo.toml"
            "Cargo.lock"
            "C08_DEVICE_IDENTITY_TRANSPORT.md"
            "crates/ptah-device-runtime/Cargo.toml"
            "crates/ptah-device-runtime/src/lib.rs"
            "crates/ptah-device-runtime/tests/c08.rs"
            ".github/workflows/c08-device-identity-transport.yml"
          )

          if [ -n "${PTAH_PR_BASE:-}" ]; then
            test "$(git merge-base "$PTAH_C08_BASE_SHA" "$PTAH_PR_BASE")" = "$PTAH_C08_BASE_SHA"
            base_drift="$(git diff --name-only "$PTAH_C08_BASE_SHA" "$PTAH_PR_BASE")"
            for path in "${protected[@]}"; do
              if printf '%s\n' "$base_drift" | grep -Fxq "$path"; then
                echo "C08 PR base drift overlaps protected C08 surface: $path" >&2
                exit 1
              fi
            done
          fi

          python3 - <<'PY'
          import os
          import subprocess

          base = os.environ['PTAH_C08_BASE_SHA']
          head = os.environ['PTAH_EXACT_SHA']
          observed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', base, head], text=True
          ).splitlines())
          expected = {
              'Cargo.toml',
              'Cargo.lock',
              'C08_DEVICE_IDENTITY_TRANSPORT.md',
              'crates/ptah-device-runtime/Cargo.toml',
              'crates/ptah-device-runtime/src/lib.rs',
              'crates/ptah-device-runtime/tests/c08.rs',
              '.github/workflows/c08-device-identity-transport.yml',
          }
          assert observed == expected, (
              f'C08 scope mismatch: missing={sorted(expected-observed)} '
              f'unexpected={sorted(observed-expected)}'
          )
          PY
          git diff --check "$PTAH_C08_BASE_SHA" "$PTAH_EXACT_SHA"

      - name: Install pinned Rust 1.97.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/c08
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
          rustc -Vv | tee /tmp/c08/rustc-version.txt
          cargo -V | tee /tmp/c08/cargo-version.txt
          rustc -V | grep -q '^rustc 1.97.1 '
          cargo -V | grep -q '^cargo 1.97.1 '
          printf '%s\n' "$PTAH_EXACT_SHA" > /tmp/c08/exact-head.txt
          cat /etc/os-release > /tmp/c08/host-os-release.txt

      - name: Prove formatting and 20-case C08 acceptance
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p ptah-device-runtime --test c08 --locked -- --nocapture \
            2>&1 | tee /tmp/c08/c08-tests.txt
          grep -Eq 'test result: ok\. 20 passed; 0 failed;' /tmp/c08/c08-tests.txt

      - name: Prove C08 with strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p ptah-device-runtime --lib --test c08 --locked -- -D warnings \
            2>&1 | tee /tmp/c08/c08-clippy.txt

      - name: Prove C08 authority and identity boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/c08/c08-static-authority.txt
          import re
          from pathlib import Path

          source = Path('crates/ptah-device-runtime/src/lib.rs').read_text(encoding='utf-8')
          tests = Path('crates/ptah-device-runtime/tests/c08.rs').read_text(encoding='utf-8')
          assert len(re.findall(r'^#\[test\]$', tests, re.M)) == 20
          assert 'AmbiguousIdentity' in source
          assert 'AmbiguousAlias' in source
          assert 'StaleProviderGeneration' in source
          assert 'StaleConnectionEpoch' in source
          assert 'StaleFence' in source
          assert 'AheadFence' in source
          assert 'MutationOutsideC08' in source
          assert 'OperationAuthority::ReadOnly' in source
          assert 'physical_authority_ref' in source
          assert 'backend_aliases' in source

          public_functions = re.findall(r'\bpub\s+fn\s+([A-Za-z0-9_]+)', source)
          forbidden = re.compile(
              r'(?:^|_)(?:write|erase|flash|repartition|unlock|relock|'
              r'protected_nv|payload_execute|execute_payload|raw_command)(?:_|$)'
          )
          offenders = sorted(name for name in public_functions if forbidden.search(name))
          assert not offenders, f'C08 mutation executor surfaced: {offenders}'
          print('C08_ACCEPTANCE_TEST_COUNT=20')
          print('C08_PHYSICAL_MUTATION_EXECUTOR_SURFACE=0')
          print('C08_ALIAS_IS_NOT_IDENTITY=PASS')
          print('C08_STALE_GENERATION_EPOCH_FENCE=PASS')
          print('C08_READ_WRITE_AUTHORITY_SEPARATION=PASS')
          PY

      - name: Re-prove C06 firmware package semantics
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ptah-archive-decomposition --test c06 --locked -- --nocapture \
            2>&1 | tee /tmp/c08/c06-tests.txt
          grep -Eq 'test result: ok\. 20 passed; 0 failed;' /tmp/c08/c06-tests.txt

      - name: Re-prove inherited C05 through C01
        shell: bash
        run: |
          set -euo pipefail
          for target in c05 c04 c03 c02 c01; do
            cargo test -p ptah-archive-decomposition --test "$target" --locked -- --nocapture \
              2>&1 | tee "/tmp/c08/${target}-tests.txt"
            grep -Eq 'test result: ok\. 20 passed; 0 failed;' "/tmp/c08/${target}-tests.txt"
          done

      - name: Re-prove inherited B02 B05 B07
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ptah-archive-decomposition --test b02 --locked -- --nocapture \
            2>&1 | tee /tmp/c08/b02-tests.txt
          cargo test -p ptah-archive-decomposition --test b05 --locked -- --nocapture \
            2>&1 | tee /tmp/c08/b05-tests.txt
          grep -Eq 'test result: ok\. 15 passed; 0 failed;' /tmp/c08/b05-tests.txt
          cargo test -p ptah-archive-decomposition --test b07 --locked -- --nocapture \
            2>&1 | tee /tmp/c08/b07-tests.txt
          grep -Eq 'test result: ok\. 14 passed; 0 failed;' /tmp/c08/b07-tests.txt
          cargo test -p ptah-archive-decomposition --lib b07::tests --locked -- --nocapture \
            2>&1 | tee /tmp/c08/b07-boundary-tests.txt
          grep -Eq 'test result: ok\. 2 passed; 0 failed;' /tmp/c08/b07-boundary-tests.txt

      - name: Re-prove A13 checkpoint recovery
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ptah-checkpoint --test a13 --locked -- --nocapture \
            2>&1 | tee /tmp/c08/a13-tests.txt

      - name: Re-prove full locked workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --locked -- --nocapture \
            2>&1 | tee /tmp/c08/workspace-tests.txt

      - name: Write exact-head C08 proof manifest
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cp C08_DEVICE_IDENTITY_TRANSPORT.md /tmp/c08/acceptance-contract.md
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('/tmp/c08')
          required = [
              'exact-head.txt', 'host-os-release.txt', 'rustc-version.txt', 'cargo-version.txt',
              'c08-tests.txt', 'c08-clippy.txt', 'c08-static-authority.txt',
              'c06-tests.txt', 'c05-tests.txt', 'c04-tests.txt', 'c03-tests.txt',
              'c02-tests.txt', 'c01-tests.txt', 'b02-tests.txt', 'b05-tests.txt',
              'b07-tests.txt', 'b07-boundary-tests.txt', 'a13-tests.txt',
              'workspace-tests.txt', 'acceptance-contract.md',
          ]
          files = {}
          for name in required:
              path = root / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'missing C08 proof report: {name}')
              files[name] = {
                  'size_bytes': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          head = (root / 'exact-head.txt').read_text(encoding='utf-8').strip()
          if head != os.environ['PTAH_EXACT_SHA']:
              raise SystemExit('C08 proof head mismatch')
          manifest = {
              'schema_version': '0.1.0',
              'record_type': 'ptah.c08.device_identity_transport_exact_head_proof',
              'status': 'pass',
              'implementation_commit': head,
              'accepted_construction_base': os.environ['PTAH_C08_BASE_SHA'],
              'workflow_run_id': int(os.environ['RUN_ID']),
              'workflow_run_attempt': int(os.environ['RUN_ATTEMPT']),
              'c08_acceptance_test_count': 20,
              'backend_aliases_not_canonical_identity': True,
              'identity_ambiguity_fails_closed': True,
              'provider_generation_fencing_proven': True,
              'device_connection_epoch_fencing_proven': True,
              'unstable_usb_recovery_proven': True,
              'lease_and_fence_proven': True,
              'protocol_attempt_evidence_proven': True,
              'physical_mutation_authority_absent': True,
              'c06_reproven': True,
              'a13_reproven': True,
              'full_workspace_reproven': True,
              'files': files,
          }
          rendered = json.dumps(manifest, indent=2, sort_keys=True) + '\n'
          (root / 'proof-manifest.json').write_text(rendered, encoding='utf-8')
          digest = hashlib.sha256(rendered.encode()).hexdigest()
          (root / 'proof-manifest.sha256').write_text(
              f'{digest}  proof-manifest.json\n', encoding='utf-8'
          )
          print(rendered, end='')
          PY
          cd /tmp/c08
          sha256sum -c proof-manifest.sha256

      - name: Confirm exact clean C08 candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PTAH_EXACT_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Retain C08 proof bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: c08-device-identity-transport-${{ env.PTAH_EXACT_SHA }}
          path: /tmp/c08/
          if-no-files-found: error
          retention-days: 90
