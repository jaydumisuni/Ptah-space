name: Phase 0C commit generated bindings

on:
  push:
    branches:
      - phase-0c-generated-contract-bindings

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  commit-generated-tree:
    if: ${{ !contains(github.event.head_commit.message, '[generated-bindings]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out binding branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: phase-0c-generated-contract-bindings
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Check out frozen roadmap checkpoint
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: jaydumisuni/ptah-roadmap-
          ref: dc2db457f1705d0cba80f17ab76e5e93f808aee0
          path: .ptah-roadmap
          persist-credentials: false

      - name: Generate exact committed tree
        run: >-
          python tools/contract_binding_generator_aliases.py
          --roadmap-root .ptah-roadmap
          --output-root .

      - name: Commit generated files
        run: |
          git add \
            contracts/generated/catalog-index.json \
            contracts/generated/manifest.json \
            crates/ptah-contracts/src/generated.rs
          if git diff --cached --quiet; then
            echo "Generated tree already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Phase 0C: commit deterministic frozen contract bindings [generated-bindings]"
          git push origin HEAD:phase-0c-generated-contract-bindings
