name: D08 Task2 Fixture Correction Once

on:
  push:
    branches:
      - d08-application-platform-expansion
    paths:
      - .github/workflows/d08-fix-task2-fixture-once.yml

permissions:
  contents: write

jobs:
  correct-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d08-application-platform-expansion
      - name: Align AttemptContext fixture with A05 identity semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ptah-application-runtime/tests/d08_acceptance.rs')
          text = path.read_text()
          old_provider = '        provider_ref: compatibility.provider_instance_ref.clone(),\n'
          old_instance = '        producer_instance_ref: entity("runtime.producer_instance"),\n'
          if text.count(old_provider) != 1 or text.count(old_instance) != 1:
              raise SystemExit('expected AttemptContext fixture shape not found exactly once')
          text = text.replace(old_provider, '        provider_ref: entity("runtime.provider"),\n')
          text = text.replace(old_instance, '        producer_instance_ref: compatibility.provider_instance_ref.clone(),\n')
          path.write_text(text)
          PY
          cargo fmt --all -- --check
          git diff --check
      - name: Commit test-fixture correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ptah-application-runtime/tests/d08_acceptance.rs
          git commit -m "test(d08): align attempt fixture with A05 provider identity"
          git push origin HEAD:d08-application-platform-expansion
