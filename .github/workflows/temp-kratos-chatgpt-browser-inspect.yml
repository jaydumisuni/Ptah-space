name: TEMP KRATOS Redmi sky CN cust/GMS chain mapping

# activation: v3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-kratos-chatgpt-browser-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, kratos, linux, x64, physical, ptah]
    timeout-minutes: 10
    steps:
      - name: Trace cust boot chain and built-in GMS hooks read-only
        shell: bash
        run: |
          set -euo pipefail
          ADB="$(command -v adb || true)"
          if [[ -z "$ADB" && -x /home/kratos/.local/share/mibu-platform-tools/current/platform-tools/adb ]]; then
            ADB=/home/kratos/.local/share/mibu-platform-tools/current/platform-tools/adb
          fi
          test -x "$ADB"
          "$ADB" start-server >/dev/null
          "$ADB" get-state

          echo '=== HOST ROUTES BEFORE ==='
          ip route show default || true

          echo '=== CUST / OPCUST BOOT SCRIPTS ==='
          "$ADB" shell 'for p in /system_ext/etc/init/init.miui.cust.rc /product/etc/init/init.miui.opconfig.rc /vendor/etc/opcust_exist.sh; do if [ -f "$p" ]; then echo "--- $p"; cat "$p" 2>/dev/null | head -n 260; fi; done'

          echo '=== CUST / REGION PROPERTIES ALL ==='
          "$ADB" shell 'getprop | grep -Ei "cust|region|operator|carrier|opconfig|gms|google|locale|mod_device" | head -n 260 || true'

          echo '=== GMS CN PRIVILEGED PERMISSION DECLARATIONS ==='
          "$ADB" shell 'p=/system_ext/etc/permissions/privapp-permissions-gms-cn-system-ext.xml; if [ -f "$p" ]; then cat "$p" 2>/dev/null | head -n 320; fi'

          echo '=== ALL INSTALLED / KNOWN GOOGLE-NAMESPACE PACKAGES ==='
          "$ADB" shell 'pm list packages -f 2>/dev/null | grep -E "package:.*(com\.google\.|com\.android\.vending)" | sort | head -n 260 || true'

          echo '=== GOOGLE-RELATED SYSTEM PACKAGE PATHS FROM PACKAGE MANAGER ==='
          "$ADB" shell 'pm list packages -s -f 2>/dev/null | grep -Ei "google|gms|vending|phonesky" | sort | head -n 260 || true'

          echo '=== GMS OVERLAYS WITH STATUS ==='
          "$ADB" shell 'cmd overlay list --user 0 2>/dev/null | grep -Ei "gms|google" | head -n 220 || true'

          echo '=== REGION/CUST INIT REFERENCES ACROSS SMALL RC/SH FILES ==='
          "$ADB" shell 'for root in /system_ext/etc/init /product/etc/init /vendor/etc; do [ -d "$root" ] || continue; find "$root" -maxdepth 2 -type f \( -name "*.rc" -o -name "*.sh" \) -size -262144c 2>/dev/null | sort | while IFS= read -r p; do m=$(grep -a -i -E "cust_variant|miui\.region|/cust|opcust|operator|ro\.product\.locale|gms|google" "$p" 2>/dev/null | head -n 18); if [ -n "$m" ]; then echo "--- $p"; printf "%s\n" "$m"; fi; done; done'

          echo '=== POST-PROBE ==='
          "$ADB" get-state
          ip route show default || true
          echo 'TTG_REDMI_CN_CUST_GMS_CHAIN=PASS'
